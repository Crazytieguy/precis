name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clone fixtures
        run: cargo run --bin clone_fixtures

      - name: Run tests (nextest)
        run: cargo test --all

      - name: Fail on committed .new sidecars
        # `.new` sidecars are inspection artifacts written when a regen is
        # pending. They must never land on main — running cargo t with
        # `UPDATE_BASELINES=1` accepts and commits the baseline instead.
        run: |
          if find tests/divergence tests/validation tests/snapshots -type f \( -name '*.md.new' -o -name '*.toml.new' -o -name '*.snap.new' \) | grep .; then
            echo "::error::Found .new sidecars in the tree. Regenerate with 'UPDATE_BASELINES=1 cargo t' and commit the updated baseline, or delete the stray .new file."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

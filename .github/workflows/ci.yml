name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml caps local builds at 2 jobs; a runner builds alone.
  CARGO_BUILD_JOBS: default

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo lint
      # `cargo lint` builds the tests, whose dev-dependency turns `eval` on;
      # this checks the lib and binary that `cargo install` builds.
      - run: cargo clippy --lib --bins -- -D warnings
      # The `ci` profile leaves out the tests that read the gitignored
      # `tests/fixtures`; see .config/nextest.toml.
      - run: cargo t --profile ci

[package]
name = "precis"
version = "0.2.0"
edition = "2024"
authors = ["Yoav Tzfati <yoav.tzfati@gmail.com>"]
description = "A CLI tool that extracts a token-efficient summary of a path"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Crazytieguy/precis"
homepage = "https://github.com/Crazytieguy/precis"
keywords = ["codebase", "summarizer", "tree-sitter", "cli", "tokens"]
categories = ["command-line-utilities", "development-tools"]
default-run = "precis"

[[bin]]
name = "validate-ns"
path = "src/bin/validate_ns.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
tiktoken-rs = "0.11.0"
toml = "0.8"
tree-sitter = "0.26.8"
tree-sitter-c = "0.24.1"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.4"

[dev-dependencies]
insta = "1.47.2"
paste = "1"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

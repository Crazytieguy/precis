[package]
name = "precis"
version = "0.2.0"
edition = "2024"
authors = ["Yoav Tzfati <yoav.tzfati@gmail.com>"]
description = "A CLI tool that extracts a token-efficient summary of a path"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Crazytieguy/precis"
homepage = "https://github.com/Crazytieguy/precis"
keywords = ["codebase", "summarizer", "tree-sitter", "cli", "tokens"]
categories = ["command-line-utilities", "development-tools"]
default-run = "precis"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

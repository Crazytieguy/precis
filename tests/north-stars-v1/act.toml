fixture = "act"
revision_pin = "123167dc"
summary = """
`act` is a Go CLI (github.com/nektos/act) that runs GitHub Actions workflows
locally, mostly by driving Docker containers. Shape: a Cobra CLI (cmd/)
parses flags into an `Input`/`Config`; `pkg/model` parses `.github/workflows/*.yml`
and `action.yml` into `Workflow`/`Job`/`Step`/`Action`; `pkg/model.Planner`
turns that into a `Plan` of `Stage`s of parallel `Run`s; `pkg/runner` is the
execution engine (`RunContext` holds job state, `pkg/runner/step*.go` has one
implementation per step kind); `pkg/container` wraps the Docker API (plus a
host-exec fallback and a `WITHOUT_DOCKER` build-tag stub); `pkg/exprparser`
implements the `${{ }}` GitHub Actions expression language; `pkg/artifacts`
and `pkg/artifactcache` are local HTTP servers standing in for the real
actions/upload-artifact and actions/cache backends. CLAUDE.md already gives
an agent this architecture narrative and the common dev commands, so this
ranking buys the complement within a tight token budget: the CLI flag
surface, exact struct/interface shapes with line coordinates, concrete
workflow/action.yml/`.actrc` samples, and enough of the CI/lint config to
ground CLAUDE.md's prose. Given the fixture's size (~18K LOC across 8
packages) far exceeds what a single NS can afford verbatim, this ranking
front-loads package-existence breadth (every package directory listed before
any single package's internals are shown in depth) and then prioritizes the
CLI entrypoint and the model/runner core data shapes over exhaustive per-file
function rosters — a follow-up `grep`/read against a listed file is assumed
to be an acceptable single hop. Expected query distribution: "how do I
run/configure act on my workflow", "why did step X behave this way", "add a
new CLI flag / step kind", "how does the docker vs host-exec vs
WITHOUT_DOCKER path differ", and general code tours of a specific package.
"""


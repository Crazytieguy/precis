fixture = "bubbletea"
revision_pin = "c60f0c53"
summary = """
Bubble Tea (charm.land/bubbletea/v2) is a Go TUI framework implementing The
Elm Architecture: a user-supplied Model with Init/Update/View methods is
driven by a Program that owns the terminal, an event loop (tea.go), and a
cell-based ANSI renderer (cursed_renderer.go). Most of the package surface is
message (Msg) and command (Cmd) types for keyboard, mouse, clipboard, color,
focus, paste, and terminal-capability I/O, plus ProgramOption functions and
declarative tea.View fields (the v2 headline change from v1's imperative
options/commands, documented in UPGRADE_GUIDE_V2.md). The query distribution
this NS serves: (a) library users learning the Model/Update/View contract and
the Cmd/Msg vocabulary, (b) contributors debugging the event loop, renderer,
or terminal/platform glue, (c) v1-to-v2 migration questions, (d) "show me how
to do X" questions answered by examples/ and tutorials/, and (e) build/test/
lint entry points. tea.go is the spine of the package (Model/Program/View/
event loop all live there) and is weighted accordingly despite its size —
the 10K budget cap forces most of its 1439 lines to go unrendered, so this NS
prioritizes the contract-defining and hardest-to-rediscover-by-grep pieces
(Model interface, eventLoop's internal message switch, Run()'s setup arc)
over exhaustive coverage.
"""


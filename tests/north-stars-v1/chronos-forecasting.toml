fixture = "chronos-forecasting"
revision_pin = "f951d9ae"
summary = """
chronos-forecasting (Amazon Science) is a Python package distributing three generations of pretrained
time-series forecasting models behind one shared BaseChronosPipeline contract: the original Chronos
(LM-style quantization + sampling, src/chronos/chronos.py), Chronos-Bolt (patch-based direct multi-step
quantile regression, src/chronos/chronos_bolt.py), and Chronos-2 (the current flagship - multivariate,
covariate-aware, LoRA-fine-tunable - under src/chronos/chronos2/: config.py, layers.py, model.py,
pipeline.py, dataset.py, trainer.py). The ranking serves the full spread of plausible sessions against
this repo: figuring out which of the three pipelines a query concerns and its exact
predict/predict_quantiles/predict_df/fit contract (semantic, zero-follow-up-friendly), locating one
class or function inside a ~5600-line src tree plus ~2000 lines of tests and ~1500 lines of
training/eval scripts (structural, one-hop-away pointers with exact line coordinates), and operational
tasks - running/adding tests against the four dummy model fixtures under test/, pretraining or
fine-tuning (scripts/training/train.py + per-size YAML configs), benchmarking (scripts/evaluation/,
the opt-in CI eval workflow), and packaging/CI (pyproject.toml, ci.yml's mypy+pytest matrix, PyPI
release workflow). Breadth is prioritized throughout: every source file's function/class roster is
surfaced early as a cheap truncated "locations" batch before that file's implementation is expanded,
and filesystem listings are complete at every directory depth the NS touches (including the four
dummy-model fixture dirs and the 29 published benchmark-result CSVs) so partial disclosure never
implies an item doesn't exist. Hedging note: every roster/listing batch (tier 2's per-file rosters,
9.1/9.6's fs listings, 10.1/10.2's script rosters, 11.1) is either complete or, where deliberately
partial (9.3's cross-module test sample, 9.4's predict()-parametrization excerpt), says so in its own
justification. The one enumerable batch cut mid-list without a complete alternative (11.5's Available
Models table) carries a rendered ellipsis span rather than a silent truncation. Elsewhere, function/
docstring-body spans are short hand-picked excerpts chosen for one specific fact, not full-body
renders; most such spans end at a natural prose boundary (end of docstring section, end of a short
class/dataclass) rather than mid-sentence, but a few are deliberately narrow quotes of a longer body.
"""


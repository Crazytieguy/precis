fixture = "clack"
revision_pin = "adb6af9f"
summary = """
Clack (bombshell-dev/clack) is a pnpm-workspace monorepo publishing two
npm packages: `@clack/core` (packages/core), the headless/unstyled
`Prompt` base class + primitive subclasses driving a readline-based
interactive CLI prompt engine, and `@clack/prompts` (packages/prompts),
an opinionated, ANSI-styled wrapper exposing one factory function per
prompt type (text, password, confirm, select, multiselect, autocomplete,
path, date, ...) plus terminal-UI utilities (spinner, progress, log,
stream, note, box, taskLog, group, tasks). The query distribution
spans: using/composing the public `@clack/prompts` API in a CLI;
extending or debugging the low-level `@clack/core` primitives (event
system, keypress handling, diff-based re-render); adding a new prompt
type; fixing rendering/ANSI edge cases; running the monorepo's
build/test/lint tooling; and understanding the release process
(changesets, CI, pkg.pr.new previews). Given the size of this monorepo
relative to typical budgets, this NS leans hard on exhaustive fs
listings + single-line signature rosters for breadth (so every file
and every export is a known, named, one-hop-away location), reserving
full-body inclusion for the handful of files/excerpts with the highest
density of non-obvious behavior (the date-segment editor, shared
cross-file types, the base Prompt class's readline/keypress control
flow). The event-subscription plumbing and the diff-based render loop
are represented through their call sites plus the standalone diffLines
utility rather than full-body inclusion — cheaper coverage given this
monorepo's size relative to typical budgets. Several batches below end
with a rendered `…` marker rather than a full-body extension where the
remaining lines are lower-value per token; the marker signals more
content exists at that file/position without spending budget on it.
"""


fixture = "click"
revision_pin = "c943271a"
summary = """
Click (Pallets' "Command Line Interface Creation Kit") is a mature, widely-used
Python library for building composable CLI applications via decorators
(`@click.command`, `@click.group`, `@click.option`, `@click.argument`). The
repo is: a ~11.5k-line `src/click/` package (core object model in `core.py`,
declarative decorators in `decorators.py`, a typed parameter-type system in
`types.py`, an internal/deprecated `parser.py`, error hierarchy in
`exceptions.py`, help-text layout in `formatting.py`, terminal UI helpers in
`termui.py`/`_termui_impl.py`, stream/encoding compat in `_compat.py`/
`_winconsole.py`/`_textwrap.py`/`_utils.py`, a `CliRunner` test harness in
`testing.py`, and shell completion in `shell_completion.py`); a large
Diataxis-structured Sphinx/MyST doc site (`docs/`); ~11.4k lines of pytest
tests (`tests/`, plus `tests/typing/` type-checking fixtures); ten standalone
example apps (`examples/`); and standard OSS project plumbing (`pyproject.toml`
with `uv`/`tox`/`ruff`/`mypy`/`pyright` config, GitHub Actions workflows,
pre-commit, a devcontainer).

Session query distribution this NS is built to serve: (1) "how do I do X with
Click" usage questions (options/arguments/flags/prompts/completion/testing),
(2) "why does Click behave this way" semantic questions (callback ordering,
UNSET vs None, chain groups, default_map, help-text markers), (3) debugging a
specific behavior in `core.py`'s Context/Command/Group/Parameter pipeline, (4)
extending Click (custom ParamType, custom Group, shell completion), (5)
operational questions (how the test suite actually runs — testpaths/addopts/
stress-marker deselection — and CI workflow existence), and (6) orientation
questions ("what does this repo contain",
"where are the tests for X"). Given the hard 10,000-token cap, the ranking
spends almost all of its budget on cheap breadth (full directory rosters,
per-class/per-file method-location listings, tight signature slices) and
reserves full method/doc-section bodies for the handful of mechanisms most
likely to need a "why"/"how" answer rather than a "where" pointer — most such
bodies are one grep away from the location pointers this NS does include.
"""


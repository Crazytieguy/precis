fixture = "crawlee-python"
revision_pin = "b3b8c59b"
summary = """
Crawlee for Python (apify/crawlee-python): an async web-scraping/browser-automation
library. Core execution model is BasicCrawler (request lifecycle, autoscaled
concurrency, retries, sessions, router dispatch) subclassed by AbstractHttpCrawler
(HttpCrawler/BeautifulSoupCrawler/ParselCrawler), PlaywrightCrawler (+
AdaptivePlaywrightCrawler), and StagehandCrawler. Storages (Dataset/KeyValueStore/
RequestQueue) sit on a pluggable StorageClient backend (FileSystem default, Memory,
Sql, Redis). Config is env-var driven (CRAWLEE_* / APIFY_*) via a global
ServiceLocator singleton. Docs/ is an extensive Docusaurus guide+example corpus;
tests/ mirrors src/ 1:1 for unit tests plus e2e template tests. The query
distribution spans explaining architecture, adding crawler features, debugging
retries/sessions/proxies, writing tests, and configuring storage/deployment - so
this NS buys breadth (every subpackage's public surface, every guide's headings,
every test/module location) before depth on any one crawler backend.
"""


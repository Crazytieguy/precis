fixture = "dockly"
revision_pin = "a817de79"
summary = """
dockly: a single-binary Node.js CLI (`bin: dockly` -> index.js) that renders an
immersive terminal dashboard (blessed + blessed-contrib) for managing Docker
containers, services, and images against a local or remote Docker daemon via
dockerode. Architecture is a small plugin system: `src/screen.js` owns a
12x12 blessed grid and a `mode` (containers/services/images); `src/assetsLoader.js`
globs `hooks/*.hook.js` and `widgets/**/*.widget.js` at startup and wires them
into two Maps (hooks poll docker and emit events; widgets render and consume
those events). `src/grid.config.js` is the per-mode widget->grid-cell layout.
Widgets subclass one of five templates in `src/widgetsTemplates/` (list, info,
logs, help, base.hook) via the `src/baseWidget.js` mixin. There is no test
suite: `npm test` runs `standard` lint only. Likely query distribution: CLI
flag / keybinding lookups, "how is X docker field displayed" formatting
questions, docker API call sites, widget/grid layout tweaks, Docker packaging
(Dockerfile, dockerRunScript.sh, CI publish workflows), and debugging the
polling/event wiring between hooks and widgets.
"""


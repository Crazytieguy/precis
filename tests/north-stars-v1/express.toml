fixture = "express"
revision_pin = "f873ac23"
summary = """
Express 5.2.1: a thin, unopinionated Node.js HTTP framework. lib/ is only 6
files (~2760 lines total): express.js (factory + exports), application.js
(app settings/dispatch facade), request.js/response.js (req/res prototype
augmentation), view.js (template-file lookup), utils.js (small helpers).
Routing itself (Router/Route, path matching, param handling) is NOT
implemented here — delegated wholesale to the external `router` npm package
(lib/express.js re-exports Router.Route/Router; application.js's `app.router`
getter just instantiates `new Router(...)`). Body parsing (json/raw/text/
urlencoded) comes from `body-parser`, static serving from `serve-static`,
both re-exported in lib/express.js. test/ (~88 Mocha files) mirrors the
public API 1:1 by filename (req.*.js, res.*.js, app.*.js, express.*.js) — the
filename roster IS the location index for "which test covers X". 25 runnable
examples/ demonstrate composition patterns (MVC, sessions, view engines,
vhosts, auth). Expect queries across the full spectrum: "how does res.send
pick Content-Type", "why is trust proxy configured this way", "add a
response helper", "why does app.get(name) return a setting not define a
route", "how do mounted sub-apps inherit settings/prototypes", "run/lint the
suite", "which example shows X", "debug a failing req.*/res.* test". Given
the token budget is tight relative to lib/'s ~2760 lines, the ranking spends
on full bodies only for the handful of functions most likely to be read
in-full (default settings, middleware mounting, res.send/json/cookie/
redirect, trust-proxy getters, view lookup) and leaves the rest as
signature-only location pointers — one grep away, not a full re-read.
"""


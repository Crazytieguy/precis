fixture = "flask"
revision_pin = "9fcd34c9"
summary = """
Flask: a WSGI micro web framework (Pallets project) wrapping Werkzeug (routing/
WSGI) and Jinja (templates). Source lives under src/flask/: a sansio/ package
(app.py, scaffold.py, blueprints.py) holds IO-free base classes shared with
alternative implementations (e.g. Quart); concrete flask.Flask/flask.Blueprint
add the real WSGI dispatch, Jinja env, and session/JSON wiring. Central
mechanism: a single contextvar (_cv_app in globals.py) holds an AppContext
(ctx.py) that request/session/g/current_app proxy onto. Tests (7.7k LoC) exercise
every module 1:1; docs/ is a full Sphinx manual; examples/ has a tutorial app,
a celery integration, and a plain-JS example. Query distribution: framework
internals questions (how does routing/context/blueprint-registration/session-
signing work), extension-point questions (which hook or method to
override), CLI/testing/config usage, and "where is X documented/tested".
"""


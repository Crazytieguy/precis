descriptor = "ctx.py: AppContext.push"
justification = "How a request (or CLI command) becomes the active context: sets the contextvar, sends appcontext_pushed, and opens the session before routing. Explains why session/g/request become available inside a `with` block or per-request."
content = { kind = "lines", spans = [
  { path = "src/flask/ctx.py", start = 416, end = 444, render = { kind = "full" } },
] }

[[batches]]
id = "3.3"
descriptor = "ctx.py: AppContext.pop (teardown order)"
justification = "Reverse of push: validates the context is the active one, decrements the push-count for re-entrancy, and -- once the count reaches 0 -- runs do_teardown_request/close/do_teardown_appcontext (via _CollectErrors so no callback's exception hides another's) before resetting the contextvar. Central to 'why did my teardown_request not run' / nested-push questions."
content = { kind = "lines", spans = [
  { path = "src/flask/ctx.py", start = 446, end = 504, render = { kind = "full" } },
] }


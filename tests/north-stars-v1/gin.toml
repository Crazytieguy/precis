fixture = "gin"
revision_pin = "5f4f9643"
summary = """
gin-gonic/gin: a high-performance Go HTTP web framework (radix-tree router
forked from httprouter) built around three surfaces — package `gin` (root):
Engine/RouterGroup route registration, the per-request `Context` (huge
method surface: query/form/binding, rendering, cookies, content
negotiation, streaming), and built-in middleware (Logger, Recovery,
BasicAuth); package `binding` (multi-format request decoding + validator
tag mapping); package `render` (multi-format response writers, one type
per file); package `codec/json` (swappable JSON backend selected by build
tag: stdlib/go-json/jsoniter/sonic); tiny `internal/bytesconv` and
`internal/fs` helpers; and `ginS`, a deprecated-style package-level
singleton-engine wrapper. Nearly every non-test .go file has a colocated
`_test.go`. `docs/doc.md` is a 2666-line user guide (the README defers
new-feature docs there per CONTRIBUTING.md); it is not host-injected, so
its headings/sections are fair game and are the cheapest way to hedge
against the guide's own breadth. Expected query distribution: adding
routes/middleware, debugging binding/validation, adding a render/binding
format, ClientIP/trusted-proxy behavior, JSON-backend build tags, testing
patterns, and CI/lint/release config.
"""


fixture = "handlebars"
revision_pin = "3105ca73"
summary = """
handlebars.js: the reference JS implementation of the Handlebars templating
language (a Mustache superset). Repo shape: `lib/handlebars/` holds the
runtime (base.js/runtime.js/utils.js), the built-in helpers
(helpers.js + helpers/*.js), decorators, and the compiler pipeline
(compiler/{ast,compiler,javascript-compiler,code-gen}.js) that turns a
parsed template AST into a JS function; `lib/index.js` /
`lib/handlebars.js` / `lib/handlebars.runtime.js` assemble the public
`Handlebars` object (full vs. runtime-only builds), mirrored by
`types/index.d.ts` for consumers. `bin/handlebars.js` + `lib/precompiler.js`
implement the `handlebars` CLI for precompilation. `spec/` is an
~6.6k-line Vitest suite (one file per template feature) run via
`vitest.config.js`'s multi-project setup; `tasks/` holds release tooling;
`tests/` holds benchmarks + bundler-integration smoke tests;
`components/` holds legacy package-manager shims (bower/component/
composer/nuspec/gem). Docs of record: README (usage + Mustache-compat),
FAQ, CONTRIBUTING (build/lint/release), docs/*.md (AST + compiler-hook +
decorator APIs), release-notes.md (68-version changelog). The query
distribution this NS serves spans: understanding/extending template
semantics (helpers, partials, decorators, whitespace control, strict/
proto-access security), debugging compiled output (opcodes -> JS
codegen), working the CLI/precompiler, and build/test/release operations.
Given the size of this repo, most of the compiler/JS-codegen internals
and the changelog are represented as cheap location rosters rather than
full bodies — the roster + one grep/read hop is the intended path there.
"""


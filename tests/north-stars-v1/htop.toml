fixture = "htop"
revision_pin = "b7f9df97"
summary = "htop: a cross-platform ncurses process viewer in C99, built with autotools, using an OOP-in-C vtable pattern (Object -> Row -> Process; Object -> Panel/Meter/Table) over per-OS platform directories. The repo ships an auto-injected AGENTS.md that already covers build commands, code style, the class hierarchy, the platform-directory pattern, and the main loop - so this ranking buys its complement: complete file breadth (rosters of every directory), exact vtable/struct shapes with line coordinates, the runtime CLI flag surface, the htoprc config format via a real sample, column-id and meter-name registries, the platform contract signatures, and CI/test/release operations. Query distribution served: UI behavior (keys, screens, meters, columns), adding meters/columns/platform fields, config handling, cross-platform porting, build features, and test/CI workflows."


fixture = "httpie"
revision_pin = "5b604c37"
summary = """
httpie/cli ('HTTPie') is a Python CLI (`http`/`https`, plus a separate `httpie`
management command) that builds and sends HTTP requests with a human-friendly
key=value/header:value/query==value syntax, then pretty-prints the exchange
with pygments-based colorizing. Core pipeline: `httpie/cli/` parses argv into
an argparse.Namespace (definition.py declares ~60 flags via a home-grown
ParserSpec/Group/Argument abstraction in cli/options.py, argparser.py wires
request-items/auth/ssl/output-option post-processing); `httpie/client.py`
turns that Namespace into a `requests` session/request; `httpie/output/`
streams and formats the response (formatters/ + lexers/ + ui/ for
rich-console help/progress); `httpie/sessions.py` + `httpie/config.py`
persist headers/cookies/auth and default flags to
`~/.config/httpie/{config.json,sessions/}`; `httpie/plugins/` is the
auth/converter/formatter/transport extension mechanism; a separate `httpie`
manager command (`httpie/manager/`) handles plugin install/upgrade and
session-file upgrades. The query distribution this NS optimizes for spans
CLI usage/flag semantics (docs/README.md is the canonical user manual,
complementing definition.py's inline help), request/response pipeline
debugging, output formatting, sessions/config persistence, plugin
authoring, and the surrounding build/test/release tooling. Given the
fixture's size (~9800 LoC in httpie/ alone, plus a 2600-line manual and a
6600-line test suite), this NS favors thorough location rosters (every
directory, every CLI flag, every manual heading) over deep multi-hundred-
line dumps of any single file, so a one/two-hop follow-up read almost
always lands precisely.
"""


fixture = "hyperfine"
revision_pin = "f12f3d9f"
summary = """
hyperfine is a Rust CLI benchmarking tool (single binary crate, `src/main.rs` entry point).
It parses a command line (`src/cli.rs`/clap) into `Options` (`src/options.rs`) and `Commands`
(`src/command.rs`, with `{param}` substitution and cross-product expansion for -P/-L), then a
`Scheduler` (`src/benchmark/scheduler.rs`) runs each `Benchmark` (`src/benchmark/mod.rs`): setup,
warmup, timed runs via an `Executor` (raw process / shell / debug-mode mock, `src/benchmark/executor.rs`
+ `src/timer/*` platform timers), producing a `BenchmarkResult` with mean/stddev/min/max, outlier
warnings (`src/outlier_detection.rs`), a relative-speed summary (`src/benchmark/relative_speed.rs`),
and pluggable exports (JSON/CSV/Markdown/AsciiDoc/org-mode, `src/export/*`). The query distribution
this NS serves: "how do I use flag X", "what does the benchmark loop actually do at each phase
(setup/warmup/prepare/timing/conclude/cleanup)", "how are run counts and relative speed computed",
"how do I add/modify an export format or a CLI flag", "what does exported/console output look like",
and platform-specific (Unix/Windows) timer/process-execution debugging.
"""


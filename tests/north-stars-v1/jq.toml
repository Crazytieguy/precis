fixture = "jq"
revision_pin = "f58787c4"
summary = """
jq is a C-implemented, portable command-line JSON processor and small
functional query language, built as a shared/static library (`libjq`,
`src/jv.*` value model + `src/execute.c` bytecode VM + `src/compile.c`
compiler + `src/parser.y`/`src/lexer.l` grammar) plus a thin `src/main.c`
CLI wrapper. jq programs compile to a custom threaded bytecode
(`src/opcode_list.h`) run by a stack machine with native backtracking
(FORK/BACKTRACK) for jq's implicit multi-output/generator semantics.
Built via autotools; ships a vendored `decNumber` (arbitrary-precision
decimal literals) and pulls oniguruma (regex engine) as a git submodule.
The standard library is split between C builtins (`src/builtin.c`'s
CFUNC table) and jq-coded builtins (`src/builtin.jq`, compiled in via
`src/builtin.inc`). The compiler (`src/compile.c`/`compile.h`) lowers
parsed programs to a `block` IR (a linked list of `struct inst`) built
by ~60 `gen_*` constructors before `block_compile` emits the bytecode
`execute.c` runs. The language reference lives in
`docs/content/manual/dev/manual.yml`, from which the manpage, website,
and `tests/man.test` are generated. Tests run through jq's own
`--run-tests` self-test runner driven by `tests/jq.test` and sibling
`*test` shell wrappers via `make check`. Given this fixture's size, this
NS trades some depth for breadth: it favors complete, cheap "does X
exist and where" rosters (opcode list, manual.yml function index,
directory listings) over exhaustively reading every source file, and
uses honestly-partial, ellipsis-marked samplers (CFUNC table, usage()
flag reference, lexer.l keyword table, the compile.h IR-constructor
API) where a complete roster would cost disproportionately more than
its marginal value — so follow-up reads land precisely rather than
requiring wide search. Query distribution served: "how does jq's
language/semantics work" (manual.yml, builtin.jq), "where is X
implemented in C" (location rosters + CFUNC table), "how do I
build/configure this" (configure.ac, Dockerfile), and "how does the
VM/compiler work" (opcode_list.h, execute.c, bytecode.h, compile.c/h).
"""


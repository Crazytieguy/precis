fixture = "krep"
revision_pin = "ae96fbd2"
summary = """
krep is a single-binary C CLI: a grep-alternative optimized for throughput
(SIMD, memory-mapped I/O, a worker thread pool, algorithm auto-selection
across Boyer-Moore-Horspool/KMP/Aho-Corasick/regex). Two source files carry
almost all logic: krep.c (~5.3k lines: CLI parsing in main(), the search
algorithms, the thread pool, mmap'd file search, recursive directory walk
with .gitignore support, and match printing) and aho_corasick.c (trie build
+ multi-pattern search). krep.h is the shared struct/API vocabulary; tests/
is a from-scratch C test harness (no external framework) with per-topic
files (test_krep.c, test_regex.c, test_multiple_patterns.c,
test_directory.c) plus compat wrappers bridging older call signatures to
the current search_params_t-based ones. The query distribution likely
spans: adding/behavior-checking a CLI flag, understanding algorithm
dispatch/selection, debugging threading or mmap chunking, extending
gitignore/recursive-search skip logic, and locating/extending unit tests.
"""


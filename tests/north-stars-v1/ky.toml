id = "6.4"
descriptor = "core/Ky.ts \u2014 #calculateRetryDelay: precedence chain"
justification = "The actual precedence order a retry decision follows: retry-limit exceeded throws first, a forced retry (`ForceRetryError`) skips the method check, the HTTP method must be in `retry.methods`, `shouldRetry` gets first crack (true forces / false vetoes / anything else defers), then a timeout gate, then the HTTPError status-code check \u2014 the `Retry-After`/`RateLimit-Reset` header parsing and the final `#calculateDelay()` fallback that close out the method are marked by the ellipsis below rather than rendered here."
predecessor = "6.1"


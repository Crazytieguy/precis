descriptor = "core/Ky.ts \u2014 create(): afterResponse hook loop"
justification = "The most leak-sensitive loop in the codebase: each `afterResponse` hook gets a cloned response, a `RetryMarker` return throws `ForceRetryError` after cancelling both bodies, and whichever response/clone isn't chosen forward is explicitly `.cancel()`-ed to avoid the Deno/Bun resource leaks the hook docs warn about."


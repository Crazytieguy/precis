fixture = "ky"
revision_pin = "eb5c3eba"
summary = "ky is a small (~2.5k LoC) dependency-free TypeScript HTTP client wrapping the Fetch API: a single Ky class (source/core/Ky.ts) drives the request/hook/retry lifecycle, source/types/*.ts is the option/hook/retry contract (heavily JSDoc'd, largely mirrored in readme.md's API section), source/errors and source/utils hold small focused helpers, and test/ (11k+ lines, ava) covers behavior file-by-file matching the source areas. This NS optimizes for: understanding/modifying retry or hook behavior (ky's flagship features), tracing a specific option from its type through Ky.ts's enforcement, and adding a test or source file inside the existing xo/tsc/ava toolchain. Because readme.md's long API section (lines ~85-1049) is near-verbatim duplicated by JSDoc already ranked against source/types and source/core, body-content budget goes to the source copy (colocated with signatures, and cheaper per fact) with only a heading map back to readme.md for that section. Given the ~10k-token budget against ~2.5k source lines + 1.3k readme lines + 11k test lines, most files get a cheap name/signature roster plus a small number of hand-picked high-value excerpts rather than full-file inclusion \u2014 the roster is what keeps 'does X exist' one grep away even where the body was cut for budget; a handful of files small enough to be cheap in full (index.ts, the error classes, timeout.ts, delay.ts) are included whole instead."


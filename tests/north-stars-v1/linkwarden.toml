fixture = "linkwarden"
revision_pin = "22723575"
summary = """
Linkwarden: a self-hosted, open-source collaborative bookmark manager
("Bookmarks, Evolved"). Yarn workspaces monorepo: `apps/web` (Next.js
15 pages-router app: UI + `/api/v1` and `/api/v2` REST endpoints, auth
via next-auth with 58 optional SSO providers, Stripe billing),
`apps/worker` (a hand-rolled long-running Node process, no queue
system — six `while(true)` polling loops for link preservation,
RSS polling, AI auto-tagging, trial-end email, and a home-grown
`AppMigration` runner), `apps/mobile` (Expo/React Native + expo-router
client). Shared `packages/`: `prisma` (Postgres schema + ~90
migrations), `lib` (SSRF-safe fetch guard, Meilisearch client,
nodemailer transporter, zod schemas, subscription-capacity checks),
`filesystem` (local-disk vs S3 dual-backend file storage), `router`
(React Query hooks shared by web+mobile), `types`.

Core domain: Users create Collections, add Links (auto-preserved by
the worker as Screenshot/PDF/Monolith/Readability/Wayback-Machine
snapshot), organize with Tags, optionally share Collections publicly
or with member permissions (canCreate/canUpdate/canDelete), and can
run local/hosted AI models to auto-tag links. Query distribution this
NS optimizes for: "how does link preservation/archiving work",
"where's the code for feature X" (SSO provider, migration importer,
archive format, dashboard section), SSRF/security review of the
worker's arbitrary-URL fetching, schema/migration questions, adding
an API endpoint or React Query hook, mobile-app parity questions,
Docker/env-var self-hosting config, and CI/test entry points. README
is marketing copy with no build/architecture detail, so this NS
spends its budget on operational surface (env vars, compose, package
scripts) and concrete code shapes instead of re-deriving what the
README already covers.
"""


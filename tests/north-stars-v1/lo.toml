fixture = "lo"
revision_pin = "ea94cc5c"
summary = """
`samber/lo` is a Lodash-style Go generics utility library: ~300 immutable
helpers over slices/maps/strings/math/tuples/channels/errors/retry in the
root `lo` package, plus four sibling variants (`it` lazy iter.Seq versions,
`mutable` in-place versions, `parallel` goroutine versions, experimental
`exp/simd` SIMD-accelerated numeric/intersect kernels gated on Go 1.26).
Every exported helper is a small, independently-testable pure function with
a one/two-line doc comment and a Go Playground link; there is no framework,
no shared mutable state, and (outside `exp/`) zero third-party runtime
dependencies. The query distribution is dominated by: "does a helper for X
already exist / what's its exact signature", "show me how helper Y is
implemented", "which package (core/it/mutable/parallel) should I use for Z",
"how do I build/test/lint this", and "how is the docs site's per-helper
metadata kept in sync with source". A large docusaurus site under `docs/`
mirrors the README with one generated markdown file per helper.
"""


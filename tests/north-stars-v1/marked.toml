fixture = "marked"
revision_pin = "a7affc3b"
summary = """
marked is a fast, low-level, dependency-light CommonMark/GFM markdown-to-HTML \
compiler written in TypeScript (src/*.ts, compiled by tsc + esbuild into lib/), \
shipped as a library (`marked` npm package, ESM+UMD), a CLI (bin/marked.js), and \
a Vercel demo endpoint (api/dingus.js). The pipeline is Lexer (block+inline \
tokenizing via regex rules in rules.ts) -> Parser -> Renderer, all overridable \
through marked.use({renderer, tokenizer, hooks, walkTokens, extensions}). The \
query distribution this NS serves: (a) "how do I configure/extend marked" \
(options, tokenizer/renderer/hooks/extensions API), (b) "where does markdown \
construct X get parsed/rendered" (tokenizer/renderer method + regex locations), \
(c) "how do I build/test/run the CLI", (d) general orientation/debugging across \
the lexer -> parser -> renderer pipeline and its ~700-file CommonMark/GFM/ReDoS \
spec-test corpus under test/specs/.
"""


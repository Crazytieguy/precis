[[batches]]
id = "5.1"
descriptor = "Lexer.ts: block + inline tokenizer dispatch order"
justification = "The single most valuable fact about src/Lexer.ts, at near-zero cost: the exact try-in-this-order sequence blockTokens()/inlineTokens() use, shown via each branch's own inline comment (newline/code/fences/heading/hr/blockquote/list/html/def/table (gfm)/lheading/top-level paragraph/text, then extensions/escape/tag/link/reflink, nolink/em & strong/code/br/del (gfm)/autolink/url (gfm)/text) — this precedence, not documented in prose anywhere, is what answers most \"why did my markdown parse as X instead of Y\" questions. The comment labels sometimes differ from the tokenizer method name they precede (e.g. `this.tokenizer.space()` is commented `// newline`, `this.tokenizer.paragraph()` is commented `// top-level paragraph`)."


fixture = "mcphost"
revision_pin = "191dcea1"
summary = """
mcphost is a Go CLI ("mark3labs/mcphost") that hosts LLM<->MCP (Model Context
Protocol) conversations: it loads a config of MCP servers (local/stdio, remote/
streamable-HTTP, or in-process builtin), wires an LLM provider (Anthropic,
OpenAI, Google Gemini, Ollama, plus undocumented Azure/Vertex-Anthropic paths),
and runs an interactive or non-interactive agentic tool-calling loop with a
Bubble Tea TUI. Secondary surfaces: a YAML-frontmatter "script" mode for
reproducible automations, a hooks system (shell commands fired on tool-use/
prompt/stop lifecycle events) for policy/logging, OAuth+API-key auth for
Anthropic, session save/load, and a Go SDK (`sdk/`) that reuses the CLI's own
init path for in-process embedding. This NS ranks for the full span of dev
tasks: understanding the architecture, adding/debugging a provider or builtin
tool, tracing the config/script/hook formats, and orienting in tests. Several
source/doc divergences are surfaced deliberately (stale README claims, likely-
dead duplicate code, catalog-vs-implementation gaps) since these are exactly
where an agent's uninformed guess would be wrong.
"""


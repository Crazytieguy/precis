fixture = "mdbook"
revision_pin = "b8c90970"
summary = """
mdBook: a Rust CLI (`mdbook`, workspace of 9 crates under crates/: 7
published libraries plus the unpublished xtask + mdbook-compare dev
binaries) that renders a
directory of Markdown chapters (governed by src/SUMMARY.md and
book.toml) into a static HTML book (default renderer) or other backends
via a preprocessor/renderer plugin protocol. The repo also dogfoods
itself: guide/ is mdBook's own user manual, built with mdBook. Query
distribution: CLI usage (build/serve/watch/test/clean/init), book.toml
config schema, SUMMARY.md format, writing/debugging a preprocessor or
renderer plugin, HTML/Handlebars rendering pipeline (Markdown -> tree
-> serialize), search-index generation, front-end theme assets
(css/js/handlebars templates), and testsuite/CI mechanics.
"""


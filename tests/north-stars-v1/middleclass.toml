fixture = "middleclass"
revision_pin = "359f0e27"
summary = """
middleclass is a single-file (middleclass.lua, 193 lines) OOP library for Lua: \
class(), :subclass(), :include() mixins, and unified method/metamethod \
propagation to subclasses via a __newindex hook. The rest of the repo is a \
193-line implementation, an 8-file busted spec suite (spec/, ~1040 lines) that \
doubles as executable behavior documentation, root docs (README/CHANGELOG/ \
UPDATING), luarocks packaging (rockspecs/, 6 versions), a Travis CI config, and \
a tiny performance benchmark (performance/). Sessions on this fixture span the \
full range: understanding/using the class() API, debugging inheritance or \
mixin/metamethod propagation, tracing a behavior change across versions \
(CHANGELOG/UPDATING), running specs or benchmarks, or touching packaging. The \
ranking front-loads the public API surface and its concrete usage, then the \
full implementation (small enough to include almost entirely), then the spec \
suite as behavior ground-truth, then packaging/CI/history. No batch renders an \
ellipsis: every span that stops short of a file's end does so at a natural \
boundary (a function/table/describe-block close, or a top-level CHANGELOG/ \
UPDATING version heading), and every such omission is a complete, named \
sibling unit (an already-illustrated parallel test block, a duplicated \
description field, an older version section) called out by line range in the \
batch's own justification rather than truncated mid-body.
"""


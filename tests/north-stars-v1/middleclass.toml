[[batches]]
id = "2.10"
descriptor = "Method propagation internals (_createIndexWrapper/_propagateInstanceMethod/_declareInstanceMethod)"
justification = "middleclass.lua:31-76 is the least obvious part of the design: assigning `function AClass:foo() end` triggers the class's __newindex (_declareInstanceMethod), which records the method in __declaredMethods then recursively pushes it to every subclass's __instanceDict that hasn't overridden the name (_propagateInstanceMethod), with __index reassignment specially wrapped (_createIndexWrapper) so a class-supplied table or function __index still falls back through the instance dict. This is the mechanism behind 'why did overriding a method on the superclass after subclassing propagate' questions, and (per CHANGELOG.md's 4.0.0 'unified method and metamethod lookup') is also what makes operator metamethods (batch 3.13) inheritable."
predecessor = "2.1"
[batches.content]

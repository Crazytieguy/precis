fixture = "migrate"
revision_pin = "2bd822b3"
summary = """
golang-migrate/migrate: a Go library + CLI that applies versioned up/down
migrations from a pluggable `source.Driver` to a pluggable `database.Driver`.
The repo is a hub-and-spoke plugin architecture: two small interface
packages (`database`, `source`) at the center, ~20 database-driver and ~12
source-driver leaf packages at the edges (each following the exact same
Open/Register/WithInstance recipe), a thin CLI (`internal/cli` +
`cmd/migrate`) on top, and a `migrate` root package gluing source reads to
database writes with locking/dirty-state/prefetch semantics. Query
distribution: driver authors implementing a new database/source driver
(need the interface + a worked example + build-tag wiring); CLI users
debugging flag/URL/migration-file-naming issues; core-lib debuggers tracing
why a migration didn't apply, why the DB is "dirty", or how locking works;
occasional build/CI/lint questions. Ranking favors: the two Driver
interfaces + one worked exemplar (postgres), the root migrate/migration
types and their most-traveled methods, exact CLI flag/command surface, and
compact operational docs (Makefile, lint config) over deep bodies of any
single driver — token budget for this fixture is scarce relative to its
size, so depth is deliberately concentrated on the parts every task type
(driver authoring, CLI use, core debugging) shares, with directory listings
carrying breadth instead of per-driver prose.
"""


fixture = "mitt"
revision_pin = "6b416705"
summary = """
mitt: a tiny (~200b gzipped) functional pubsub/event-emitter for
JavaScript/TypeScript, published as the npm package `mitt`. The entire
runtime is one file, `src/index.ts` (123 lines): a handful of exported
type aliases, an `Emitter<Events>` interface, and a `mitt()` factory
closing over a `Map` of type -> handler-list, with `on`/`off`/`emit`
plus a `'*'` wildcard type. There is no build-from-source step needed
to read or reason about it; `dist/` is git-ignored and produced by
`microbundle` from this single file. Tests are two files: behavioral
specs in `test/index_test.ts` (mocha/chai/sinon, 204 lines) and a
type-level contract check in `test/test-types-compilation.ts` (78
lines, using `@ts-expect-error` to assert what should and shouldn't
typecheck against a sample `Events` map).

The plausible query distribution: "how does mitt guarantee type safety
across event names/payloads" (interface + type-compilation tests),
"does `on`/`off`/`emit` normalize case, dedupe handlers, support
symbols" (behavioral tests), "how do I build/test/lint this", "what's
the published package shape" (package.json exports/files/scripts),
and general "explain this file to me" reading of the ~123-line source.
Given how small and single-purpose this repo is, the ranking front-
loads the entire source (cheap, under 2k tokens for everything), then
package.json's identity and build/test/lint entry points (the fastest
answer to "how do I run this" ahead of reading any test body), then
spends the next chunk of budget on the two test files' semantics,
then rounds out with the rest of the npm package surface, lint/build/
CI config, and the README's install/usage prose (skipping the
README's generated API section and the badge markup, which either
duplicate the source JSDoc already surfaced in tier 2 or add no
semantic value beyond what package.json/LICENSE already state). Every
file here is either included in full or, for src/index.ts's export
roster (2.1), rendered as complete truncated location lines - every
span ends at a natural syntactic or section boundary (end of a type/
interface/function/test-block, or end of file), so this draft has no
rendered ellipsis spans.
"""


fixture = "octotree"
revision_pin = "470747c7"
summary = """
Octotree is a browser extension (Chrome/Firefox/Opera/Safari/Edge) that injects a
resizable file-tree sidebar into GitHub repo/PR pages. It's plain pre-module JS:
every src/*.js file declares globals (`window.X = ...`) and gulpfile.js's buildJs()
concatenates them in a load-bearing order into one script. Runtime shape: main.js
wires a jQuery-driven sidebar DOM (from template.html) to a GitHub adapter
(src/adapters/{adapter,pjax,github}.js, class chain Adapter -> PjaxAdapter -> GitHub)
that queries the GitHub API for the repo tree, a TreeView (jstree wrapper), an
OptionsView bound to ExtStore (core.storage.js, chrome.storage/localStorage), and
help/error popups. core.constants.js is the STORE/EVENT/DEFAULTS vocabulary shared
by every module. This NS serves architecture/explanation queries (how the sidebar
loads a repo, how options persist, how branch detection works), feature work (new
adapter, new option), and debugging (GitHub API error codes, huge-repo lazy-load).
No test suite exists in this repo despite `mocha`/`gulp-mocha` devDependencies in
package.json - a real dead-dependency gap, not an omission by this NS. libs/* are
vendored third-party libraries (jQuery, jQuery UI, jstree, keymaster, file-icons,
pjax) included only as filesystem listings, never as rendered bodies. Method/
function *rosters* below show every member's first line only (locations); a small
number of flagship bodies are rendered in full for the highest-value logic, and
everything else is one grep/read away from its exact roster line number.
"""


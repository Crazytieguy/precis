fixture = "p-queue"
revision_pin = "fc4b7369"
summary = """
p-queue: a small, dependency-light TypeScript library (single default-export class `PQueue`, an
EventEmitter3 subclass) implementing an async task queue with concurrency limiting, interval-based
rate limiting (fixed-window and a `strict` sliding-window mode), task priority, per-task timeout,
AbortSignal-based cancellation, and a pluggable `queueClass` (default `PriorityQueue`, a sorted-array
implementation with binary insertion and lazy compaction). Published as ESM-only to npm; built with
tsc, linted/tested with xo + node:test + tsd. The repo is source (5 files under source/), a large
node:test suite (7 files under test/, 190 cases) plus a type-level test (test-d/), a benchmark
script (bench.ts), and a long API-reference README. The query distribution this NS serves: "what
public methods/options exist and what do they default to", "how does rate limiting / strict mode /
priority ordering actually work internally", "is behavior X already tested, and where", "how do I
build/test/bench this", and "how do I use AbortSignal / timeout / custom QueueClass / debug a stuck
queue" — the last cluster served by the TaskOptions/QueueAddOptions/queue.ts type definitions (more
precise than the README prose that restates them) plus test/debug.ts's runningTasks/isSaturated
coverage, not by README FAQ body text, which this draft doesn't render given the budget spent
making test/advanced.ts and test/strict.ts's coverage — previously entirely unrepresented — complete.
Every span in this draft ends at a natural boundary (a field, method, type, or object closes at
that exact line) or is a single-line location pointer (test-name/benchmark-name rosters); none is
cut off mid-body, so no span here uses an ellipsis render.
"""


fixture = "rough-viz"
revision_pin = "17c7ea86"
summary = """
roughViz.js (npm package rough-viz@2.0.5): a vanilla-JS charting library that
renders hand-drawn/"sketchy" SVG charts using D3 (v5-era submodules) for
scales/data and roughjs for the wobbly rendering. Nine chart classes (Bar,
BarH, Donut, Line, Network, Force, Pie, Scatter, StackedBar) all extend a
small `Chart` base class and are ~85-95% copy-pasted boilerplate around that
shared skeleton (resizeHandler/remove/redraw/initChartValues/resolveData/
addAxes/makeAxesRough/setTitle/addInteraction/initRoughObjects/
drawFromObject/drawFromFile), with the real per-chart logic concentrated in a
handful of distinctive methods. Two of the nine (Network, Force) are real,
exported, demo'd-on-the-website chart types that README.md's chart-type table
and API section never document. The query distribution this NS serves:
"what chart types exist and what are their options", "why does X look/behave
this way" (tracing a specific rendering/interaction detail to its exact
line), "add a new chart type" (needs the shared-pattern insight so the agent
copies the right skeleton instead of reinventing it), "fix/extend chart Y"
(needs Y's distinctive span, not the boilerplate), "how do I build/test/run
this", and "is there real test coverage" (most chart tests are inert
placeholder stubs; only roughCeiling has a real unit test). Also flags two
concrete latent bugs (Scatter's dead addScaleLine referencing an undefined
helper; Network's drawFromObject referencing an unset this.extent) and one
dead, syntactically-invalid util (saveToPng.js) discoverable by a debugging
or code-review session.
"""


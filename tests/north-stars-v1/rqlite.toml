[[batches]]
id = "11.1"
descriptor = "auth/credential_store.go — permission-name constants (assignment lines)"
justification = "The exact, complete set of permission strings rqlite's auth file understands (all, join, join-read-only, remove, execute, query, status, ready, backup, load, snapshot, leader-ops, ui) plus the AllUsers sentinel — CLAUDE.md never names these, and they're exactly what an auth-config JSON file's `perms` list must contain. Explanatory comments above each constant are a one-hop read at the same location."

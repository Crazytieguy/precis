fixture = "rqlite"
revision_pin = "c74c936d"
summary = """
rqlite is a real-world distributed relational database (Go, ~large repo) built on SQLite with Raft
consensus (hashicorp/raft). This NS serves the full distribution of dev-session queries: explain
architecture, add a feature, debug a subsystem, write/extend tests, configure/deploy a node, or
navigate the wire protocol. The repo ships CLAUDE.md, which the host harness already injects into
context and already covers: build/test commands, the core-package summary, HTTP endpoints and
consistency levels, clustering basics, and performance notes. This NS deliberately ranks the
complement: (1) exhaustive, two-level filesystem breadth over every package/subpackage so the agent
never assumes a missing file/dir doesn't exist; (2) DESIGN.md teasers for the five packages that have
one (cdc, cluster, db, snapshot, store) — these carry load-bearing rationale CLAUDE.md never
mentions; (3) exact, line-addressed location rosters for the surfaces most likely to need a precise
pointer: the rqlited flag set (flags.toml), the HTTP routing table, QueryParams accessors, the
central Store's public API surface, cluster wire dispatch, and auth permission names; (4) concrete
operational artifacts (Dockerfile, docker-entrypoint.sh, CI job roster) that CLAUDE.md's `go
build`/`go test` summary doesn't cover. Full DESIGN.md bodies, full method bodies, and full test
files are left as one-hop reads once their existence and location are visible.
"""


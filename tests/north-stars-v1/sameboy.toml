fixture = "sameboy"
revision_pin = "208ba4af"
summary = """
SameBoy: a portable-C Game Boy/Game Boy Color emulator core (Core/, ~22k
LoC) driven by GB_gameboy_t (Core/gb.h), with a public GB_* API consumed
by five frontends: Cocoa (macOS, Objective-C), SDL (Linux/Windows, C),
iOS (Objective-C), libretro (core wrapper, C), and a headless Tester
(automation, image-hash regression). Query distribution: emulation-
accuracy debugging (CPU/PPU/APU timing quirks), save-state/BESS format
work, MBC/cartridge-header handling, the text debugger's expression
language and command set, frontend-specific UI/input work, and build/CI
questions (Make targets, per-OS toolchain requirements).
"""


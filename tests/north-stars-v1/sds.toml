fixture = "sds"
revision_pin = "5347739b"
summary = """
SDS (Simple Dynamic Strings) is a tiny, mature, single-purpose C library: a
binary-safe, length-prefixed string type (`sds` = `char *`) extracted from
Redis and vendored as 3 files (sds.c/sds.h/sdsalloc.h) plus an embedded
unit-test harness (testhelp.h, guarded by SDS_TEST_MAIN in sds.c). There is
no build system beyond a one-target Makefile; README.md is an unusually
thorough hand-written tutorial that walks nearly every public function with
a runnable example and also carries design rationale (single-allocation
layout, OOM convention, refcounting advice, Valgrind behavior) that isn't
restated in source comments. Plausible sessions: extending the API with a
new sdscat*-style function, debugging the sdsMakeRoomFor/type-upgrade growth
math or an off-by-one in sdsrange/sdstrim, auditing binary-safety or OOM
handling, swapping the allocator via sdsalloc.h, or just explaining how the
header-prefix trick works. Given the fixture's tiny absolute size but the
10k-token budget cap, the ranking spends most of its budget on the complete
data model, the complete public API surface, and the complete
function-location catalog (all cheap, all load-bearing), then picks a
deliberately small set of the highest-complexity/highest-debug-value
function bodies (growth engine, range/trim edge cases, the custom format
language) rather than shallow-covering every one of the ~45 functions --
several repetitive per-header-type switch bodies are elided past their
first 1-2 cases once the pattern has been shown once in full -- each such
elision, plus the large embedded test body in 8.1 and one skipped README
bullet list in 3.5/3.6, is marked with a rendered ellipsis span rather than
left as a silent line-number gap.
"""


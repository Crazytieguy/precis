fixture = "sps"
revision_pin = "5a10e7f4"
summary = """
sps is a from-scratch, async Rust reimplementation of Homebrew's package-manager \
semantics: a 4-crate workspace (sps-common: shared models/config/error/dependency \
graph; sps-core: build-from-source, bottle install/uninstall/upgrade, cask install \
with 23 artifact-type handlers; sps-net: Homebrew API + OCI/GHCR bottle fetch; sps: \
clap CLI + broadcast-event pipeline runner) that installs 'Formulae' (CLI tools) and \
'Casks' (macOS .app/.pkg bundles) into an /opt/sps-style prefix. The README says the \
author considers the project's own architecture a mistake and plans to scrap it for a \
rewrite ('sps2') — so debugging/explaining-current-behavior and small targeted fixes \
are far more likely session goals than large net-new features. The ranking below \
serves: (1) orientation queries ('what does this do', 'how do I build/test it'), (2) \
'where does X live' pointers across the ~100-file, ~22k-line source tree (dependency \
resolution, bottle relocation, cask artifact installers, build-backend detection), and \
(3) 'how does X actually work' deep dives on the handful of genuinely tricky \
algorithms (dependency resolver strategy propagation, Mach-O/symlink relocation, TAR \
path-traversal guarding, cask upgrade's app-bundle replacement strategy, homebrew-style \
custom JSON Formula deserialization).
"""


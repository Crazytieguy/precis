fixture = "sqlite-vec"
revision_pin = "563a3e60"
summary = """
sqlite-vec is a single-file (sqlite-vec.c, ~9.9k lines), pure-C SQLite
extension implementing vector search: SQL scalar functions (vec_f32/int8/bit
constructors, vec_distance_*, vec_add/sub/slice/normalize, vec_quantize_*),
table functions (vec_each, vec_npy_each, vec_static_blobs/_entries), and the
central vec0 virtual table (chunked shadow-table storage, brute-force KNN with
optional partition-key sharding, metadata-column WHERE filters, and auxiliary
columns). reference.yaml is the structured source of truth for the public SQL
API (site/api-reference.md is generated from it). The project ships bindings
for Python/Node/Ruby/Go/Rust, ~16 per-language example dirs (mostly the same
KNN demo ported), a vitepress docs site, a large pytest + syrupy-snapshot test
suite plus C/Rust unit-test scratch files, and a cross-platform CI/release
build matrix. Session queries span the full spectrum: "how do I declare a
partition key", "why is my KNN query slow", "add a new vec_ scalar function",
"what does idxStr encode", "how do I build/test this", "port the demo to
language X". The ranking front-loads the semantic API map (reference.yaml)
and the vec0 column-type feature docs (breadth for the common "how do I use
X" case), then the C source's structural skeleton (region map, struct/enum
shapes, entrypoint registration table) so any deeper dig is 1-2 hops, then
progressively more implementation-specific internals, tests, build/CI,
bindings, examples, and the rest of the docs site.
"""


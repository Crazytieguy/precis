fixture = "statsmodels"
revision_pin = "3c102982"
summary = """
statsmodels is a large (2000+ file) real-world Python statistics/econometrics
library: dozens of independent model families (OLS/GLS/WLS, GLM, GEE, discrete
choice, mixed linear, robust, time series/state-space, survival, multivariate,
nonparametric, imputation, GAM) all built on a shared base/model.py Model ->
LikelihoodModel -> Results -> LikelihoodModelResults inheritance spine and a
wrap.ResultsWrapper pattern. Public surface is curated through two parallel
mechanisms: statsmodels/api.py (+ per-subpackage api.py files aliased into it)
for `import statsmodels.api as sm`, and statsmodels/formula/api.py for the
lower-case R-style-formula constructors (`smf.ols(...)`). Ranking here
optimizes for: (1) fast dispatch from a model name (OLS, SARIMAX, GEE, ...) to
its defining file+line via api.py/roster batches, since almost any task starts
by locating one of ~150 public classes/functions scattered across ~30
subpackages; (2) the repo-wide test convention (test_*.py colocated with a
results/ dir of R/Stata-generated reference values) since correctness work
leans on it; (3) build/lint/CI mechanics (meson+cython+pytest, ruff, Azure
matrix) for environment/config questions. Catastrophic-omission risk is
unusually high here because of the sheer subpackage count, so directory
listings and api.py/class-roster batches are prioritized over deep
single-file dives.
"""


fixture = "svgo"
revision_pin = "581fe687"
summary = """
svgo is a Node.js library + CLI (`svgo`) that optimizes SVG files by running an
ordered pipeline of 53 small AST-transform plugins (preset-default, or a
custom list) over a parsed XML tree (`XastRoot`), then re-stringifying it.
Core engine: lib/svgo.js (optimize loop, plugin resolution) -> lib/parser.js
(SAX-based XML->XAST) -> lib/svgo/plugins.js (visitor dispatch) -> plugins/*.js
(one file per optimization, each exporting name/description/fn) ->
lib/stringifier.js (XAST->string). lib/xast.js + lib/style.js layer CSS
selector matching and cascade computation on top of the AST for plugins that
need it (cleanupIds, removeAttributesBySelector, inlineStyles, ...). Plugins
are configured via svgo.config.mjs (README) or CLI flags (bin/svgo.js ->
lib/svgo/coa.js). Query distribution this NS optimizes for: "what does plugin
X do" / "where do I configure Y" (config + plugin roster), "how does the
pipeline actually run" (engine tier), "how do I add a test for a plugin"
(test/plugins/_index.test.js convention), "why did v4 break my config"
(migration guide), plus routine build/lint/test/CI entry points.
"""


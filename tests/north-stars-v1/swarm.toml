fixture = "swarm"
revision_pin = "0c82d7d8"
summary = """
`swarm` is OpenAI's small, now-deprecated educational multi-agent
orchestration library (the README explicitly points users to the
successor `openai-agents-python`). The installable package is ~500 LoC
in `swarm/` (Agent/Response/Result Pydantic models, a `Swarm` client
with `run`/`run_and_stream`, a function->JSON-schema converter, a REPL
demo loop) plus a small `tests/` suite. The bulk of the repo is
`examples/`: six READMEd showcase examples of increasing complexity
(basic snippets, triage, weather, airline multi-agent, support bot,
personal shopper), plus three example dirs NOT in the README's own
list: `customer_service` and `customer_service_lite` (log-only
leftovers, no source) and `customer_service_streaming` — a much
larger, independently-structured second framework (its own
Swarm/Assistant/Task/Run/Engine classes, JSON-configured tools &
assistants, a local vs. OpenAI-Assistants engine split, an argparse
CLI, a Docker+Qdrant retrieval backend). Given the 10k-token cap
against a repo this size, ranking favors breadth (fs listings,
README maps, function-location rosters) over exhaustive full-body
excerpts almost everywhere except the small universally-relevant core
library and the cheapest, most illustrative example scripts; deeper
dives are one grep/read away from the file+line pointers this NS
supplies. Plausible sessions span the full distribution: "what's an
Agent/handoff/Result", "add a tool to agent X", "why does
personal_shopper crash on import" (it calls a `swarm.agents` helper
that doesn't exist anywhere in this repo — visible directly in its
own import line), "how do I run/test example Y", "what does the
customer_service_streaming CLI support". Bulky near-duplicate data
(cached help-center JSON, session-log transcripts) is pushed to the
tail as existence-only listings.
"""


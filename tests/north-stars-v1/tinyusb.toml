fixture = "tinyusb"
revision_pin = "7f146c9f"
summary = """
TinyUSB is a C99, no-malloc, thread-safe USB Host/Device/TypeC(PD) protocol
stack for 50+ embedded MCU families (src/ is the portable core; hw/bsp+hw/mcu
are board/chip glue; examples/ are the primary "how do I use this" reference;
test/ is Ceedling unit tests + libFuzzer harnesses + a HIL rig). AGENTS.md and
its CLAUDE.md symlink already give the coding agent the full build/flash/test/
release runbook, so this North Star deliberately buys the complement: (a)
exhaustive breadth over the huge fan-out (13 device/host classes, ~30 portable
driver backends, ~79 BSP board families, ~40 examples, 4 test surfaces) so an
agent never mistakes "not shown" for "does not exist", and (b) exact,
line-addressed shapes for the handful of files that matter regardless of task:
the tusb.h class-enable switchboard, the usbd/usbh application APIs and their
dcd/hcd driver contracts, tusb_option.h's CFG_TUD_*/CFG_TUH_* config surface,
one fully-worked example (cdc_msc) end to end, and the architecture doc that
explains ISR-deferral + class-driver dispatch (topics AGENTS.md never covers).
Expected query distribution: "how do I enable/configure class X", "where is
the dcd/hcd entry point for board Y", "why does tud_task() not see my data",
"add a new example/class/port", "what does this callback do", "how is this
tested", spanning explanation, debugging, feature-add, and porting tasks.
"""


fixture = "toasty"
revision_pin = "0fb6be95"
summary = """
Toasty is a Rust ORM (async, incubating status) that targets both SQL
(SQLite/PostgreSQL/MySQL) and NoSQL (DynamoDB) databases without hiding
per-database capabilities. It is a Cargo workspace of ~13 crates: toasty-core
(zero-dependency schema/statement-AST/driver-interface foundation),
toasty-codegen (the `#[derive(Model)]` proc-macro expansion), toasty-macros
(macro entry crate), toasty (the query engine + user-facing API), toasty-sql
(AST-to-SQL serialization with per-database `Flavor`s),
toasty-driver-{sqlite,postgresql,mysql,dynamodb} (per-database Driver impls),
toasty-driver-integration-suite(-macros) (cross-driver test matrix),
toasty-cli (migration CLI library), and std-util. The query engine compiles
a `Statement` AST through Simplify -> Lower (HIR) -> Plan (MIR) -> Execution
Planning (Actions) -> Execute (interpreter over a variable store). The
plausible query distribution spans: (a) "how do I do X with the query
builder" (stmt/ builders, examples/), (b) "where does change-type-Y go"
(docs/CHANGE_GUIDE.md flows across the 5-layer crate stack), (c) adding a
primitive type or query feature (cascades through toasty-core ->
toasty-codegen -> toasty engine -> toasty-sql -> every driver's value.rs),
(d) per-database capability/behavior differences (driver/capability.rs
consts), (e) migration/config workflows (toasty-cli, Toasty.toml,
examples/todo-with-cli), (f) build/test/CI, (g) debugging via the Error type
hierarchy. CLAUDE.md (auto-injected) already gives navigation prose pointing
at docs/CHANGE_GUIDE.md and per-crate CONTEXT.md files, so this NS favors
real directory listings, exact enum/struct shapes with line coordinates, and
a cross-database capability table over re-summarizing that navigation prose.
Several per-crate CONTEXT.md files reference an `engine/planner/` module, and
docs/design/pagination.md references an `engine/exec/var_store.rs`, neither of
which exist in the current tree (actual dirs are `engine/plan/`,
`engine/mir/`, `engine/exec/`, whose real file is `var.rs`) — the fs listings
in this NS are the ground truth where those docs have drifted. Given this fixture's
size (~500 files), this NS trades some narrative doc/example depth for
wide, cheap fs-listing breadth plus tight, line-precise excerpts of the
highest-fan-out types (Expr, Value, Capability), since those two together
minimize both zero-follow-up misses and follow-up hop count per token.
"""


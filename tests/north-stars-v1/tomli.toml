fixture = "tomli"
revision_pin = "920e20b1"
summary = """
tomli is a small, mature, pure-Python TOML parser (the library that became
CPython's stdlib `tomllib`). The entire runtime surface is five files under
src/tomli/ (four Python modules plus a `py.typed` marker; ~920 lines of
Python total, dominated by the 782-line recursive-descent parser in
_parser.py); everything else in the repo is packaging (dual build
backends: flit_core normally, setuptools+mypyc for binary wheels), a
data-driven test suite (tests/data/ holds ~80 hand-written fixtures plus a
vendored ~900-file BurntSushi toml-test corpus), and small auxiliary scripts
(benchmark/fuzzer/profiler). Plausible sessions: debugging a specific TOML
construct's parse/error behavior, extending spec support, investigating a
failing data-driven test, adjusting packaging/CI, or asking "how do I use
this" / "how does tomli map to tomllib". Given a tight token budget relative
to the parser's centrality, the ranking spends most of its depth budget on
_parser.py's own semantics (entry point, error formatting, value dispatch,
namespace-mutability tracking, dotted-key handling) reached via a full
function/class roster, and keeps everything else (tests, docs, packaging,
scripts) at breadth-only or small-excerpt granularity.
"""


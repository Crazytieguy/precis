fixture = "ts-pattern"
revision_pin = "2ece6ba5"
summary = """
ts-pattern (v5.9.0, MIT, gvergnaud) is a small, dependency-free TypeScript library implementing
exhaustive structural pattern matching with deep type inference. Runtime is a thin builder
(`match(value).with(pattern, handler)....exhaustive()`) whose entire matching algorithm is one
recursive function (`internals/helpers.ts::matchPattern`); nearly all of the library's real
complexity lives in compile-time-only conditional types under `src/types/` that invert a
pattern's type into the value type it matches, extract `P.select()`-ed values, and distribute
union types across `.with()` clauses for exhaustiveness checking. `src/patterns.ts` (1276 lines)
is the public `P`/`Pattern` namespace: every wildcard, combinator, structural matcher, and
chainable predicate is defined there with a runtime closure plus a hand-written JSDoc example.
README.md is unusually complete: it documents essentially the full public surface with runnable
examples, so it is the highest-value single file for "how do I do X" queries, while
`src/types/*.ts` is the answer for "why isn't my type inferred/narrowed/exhaustive" debugging
queries. Tests are jest (`ts-jest`) with one file per feature under `tests/`, mostly
`Expect<Equal<...>>` type-level assertions rather than runtime assertions. No CI workflow is
checked in; `docs/` holds a feature roadmap and two major-version migration guides. This NS
prioritizes: the runtime algorithm (match.ts/matchPattern) and public API shape (patterns.ts
roster, index.ts) at full fidelity, README's onboarding narrative and its single trickiest
feature (P.select) at full fidelity, and precise file+line pointers (rosters, single
declarations) for the rest of patterns.ts's combinators/predicates and all of src/types/ so a
follow-up read lands in one hop even where full bodies weren't affordable within budget. No
batch below uses an explicit `Ellipsis` render, and that's deliberate rather than an oversight:
every file this NS renders only part of (rosters, entry-declaration-only batches, partial
function bodies) has at least one rendered anchor line in that file, so the renderer's own
gap-marker synthesis (a `…` row for any elided non-blank run before/between/after a file's
rendered anchors) already signals every mid-file, mid-declaration, and trailing elision below
without this NS spending a span on it. An explicit `Ellipsis` span is reserved for the one case
gap-marker synthesis can't cover — anchoring a specific line so a later batch can override it via
the predecessor chain — which no batch here needs.
"""


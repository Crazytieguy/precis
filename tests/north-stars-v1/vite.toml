fixture = "vite"
revision_pin = "b3132dac"
summary = """
Vite: a pnpm-workspace monorepo containing the `vite` core package
(dev-server + Rolldown-based build tool, packages/vite/src/node),
`@vitejs/plugin-legacy` (packages/plugin-legacy), `create-vite`
(packages/create-vite, a project scaffolding CLI with 16 framework
templates), an extensive `playground/` tree of ~75 minimal apps that
double as Vitest+Playwright e2e fixtures (one per feature area), and
a VitePress docs site under `docs/`. precis is invoked when an agent
starts work on *this* repo (i.e. contributing to Vite itself, not a
project that merely depends on it). The query distribution is
dominated by: (a) "where does feature/option/hook X live" pointers
into packages/vite/src/node (config resolution, the plugin pipeline,
the dev server request path, HMR, the optimizer, SSR/module-runner);
(b) "how do I build/test/debug this" operational questions answered
by CONTRIBUTING.md + package.json scripts + CI; (c) narrower work on
plugin-legacy or create-vite; (d) locating/extending a playground
fixture for a bug repro or new integration test. Ranking prioritizes
the vite core package's public API surface, config schema, and
plugin/server architecture first (that's where almost all real
engineering happens), then operational tooling, then the two
satellite packages, then the playground/docs breadth needed to avoid
catastrophic omission over ~75 fixture dirs and ~25 guide pages. The
10K cap means most of the ~40,000-line src/node tree (excluding its
`__tests__` dirs) is necessarily represented by structural pointers
(directory listings, field/hook
name rosters) rather than full bodies past the first couple of
tiers; that's a deliberate value/cost trade, not an oversight.
"""


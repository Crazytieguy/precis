fixture = "xh"
revision_pin = "b928cf08"
summary = """
xh is a single-binary Rust CLI HTTP client (an HTTPie reimplementation) built on reqwest's
blocking client. src/main.rs orchestrates: parse CLI (src/cli.rs, clap derive) -> assemble a
request body/headers from HTTPie-style REQUEST_ITEM syntax (src/request_items.rs) -> attach
auth/session/cookies (src/auth.rs, src/session.rs, src/netrc.rs) -> execute through a small
generic middleware chain (src/middleware.rs) that layers redirect-following (src/redirect.rs)
and digest-auth retry -> print/format/color the exchange (src/printer.rs, src/formatting/) or
stream it to disk (src/download.rs). Supporting modules: src/decoder.rs (gzip/deflate/br/zstd
with empty-body error suppression), src/content_disposition.rs (RFC 5987 filename parsing),
src/nested_json.rs (the `key[0][x]=v` JSON-path mini-language), src/to_curl.rs (--curl
translation), src/message_signature.rs (feature-gated RFC 9421 signing), src/generation.rs
(derives man page + shell completions from the same clap metadata at runtime via --generate).
build.rs precompiles syntect syntaxes/themes into OUT_DIR. Tests: tests/cli.rs is a ~250-test
integration suite run against a hand-rolled hyper test server (tests/server/mod.rs); tests/cases/
holds topically-split suites (auth_message_signature, compress_request_body, download, logging,
unix_socket, xml). Query distribution: adding/changing a CLI flag or REQUEST_ITEM syntax rule,
debugging auth/redirect/session/download/decompression edge cases, understanding the session
JSON format, --curl translation gaps, build/test/release workflow, and "how is X tested".
"""


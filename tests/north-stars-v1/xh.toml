justification = "What happens on a 301/Moved/303/SeeOther redirect: header scrubbing (cross-domain-only for auth/cookie headers, unconditional for signature/content headers) and the method/body drop to GET (HEAD is preserved, everything else becomes GET) — the rule behind a 'why did my POST become a GET after redirect' question. The match continues past this arm (307/308 preserve method+body unlike 301-303; elided here) — flagged rather than silently cut off."

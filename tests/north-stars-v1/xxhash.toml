fixture = "xxhash"
revision_pin = "ab37246c"
summary = """
cespare/xxhash/v2: a small, mature Go module implementing 64-bit xxHash
(XXH64). One conceptual package (root, `package xxhash`) with a
streaming `Digest` (hash.Hash64) plus one-shot `Sum64`/`Sum64String`.
The defining architectural fact is build-tag fan-out: the same few
exported symbols (`Sum64`, `writeBlocks`, `Sum64String`,
`(*Digest).WriteString`) have 2-4 alternate definitions selected by
`//go:build` constraints (amd64/arm64 asm vs. portable Go vs.
appengine-safe vs. unsafe-fast). Three colocated helper modules
(`xxhsum` CLI, `dynamic` plugin-load test, `xxhashbench` cross-library
benchmark) round it out. Query distribution: explain-the-algorithm,
debug a hash mismatch or build-tag selection bug, add a
platform/build-tag variant, run/extend tests or benchmarks, and
ordinary "how do I build/use this" onboarding — this ranking optimizes
for that mix, front-loading the build-tag map and full public API
surface before spending budget on assembly instruction bodies or the
self-described-stale xxhashbench comparison module. Several lower-tier
batches deliberately elide content that is a near-exact duplicate of
content shown fully elsewhere (e.g. the portable-Go Sum64 fallback's
tail mirrors Digest.Sum64's finalize; the dynamic-plugin test's
TestSum/TestDigest bodies mirror TestAll's known-answer check, though
its constants are shown in full anyway since they're cheap context;
TestResetWithSeed mirrors TestReset) — marked with an Ellipsis span, or
left as a named roster entry, rather than silently dropped.
"""


fixture = "act"
revision_pin = "123167dc"
summary = """
`act` (nektos/act) is a Go CLI that runs GitHub Actions workflows locally: it
reads `.github/workflows/*.yml`, builds a `Plan` of stages and jobs, and runs
each job in a Docker container (or on the host) while emulating the GitHub
runner's env vars, contexts, expression language, artifact upload/download
and actions cache.

The repository is one binary (`main.go` -> `cmd/`) over twelve `pkg/`
libraries. Its substance sits in three places: `cmd/root.go` (an 806-line
Cobra command with ~65 flags and the whole run pipeline), `pkg/model/` (the
YAML workflow/action object model plus the planner) and `pkg/runner/` (the
execution engine: `RunContext`, the four step implementations, expression
evaluation, composite actions and reusable workflows). `pkg/container/`
hides Docker and the host execution environment behind one interface;
`pkg/common/` holds the `Executor` combinator every phase composes with; the
rest implement the expression interpreter, JSON-schema validation, the
artifact and artifact-cache HTTP servers, workspace collection, pattern
filtering, `gh` token lookup and PATH resolution.

Ranking intent. A repo-root `CLAUDE.md` is auto-loaded by the harness and
already narrates the execution flow and the package roles in prose, so this
ranking spends its budget on what prose cannot give: exact locations,
complete symbol rosters (so the agent never infers a missing sibling),
struct and interface field lists, the flag surface, and the small dispatch
sites — the step factory, expression contexts and functions, the cache
routes, the build-tag split — that answer "where is X decided?" in one hop.
The repository is ~39k lines and the budget is not, so the ranking
systematically prefers breadth (listings, rosters, declarations) over long
function bodies; every batch that shows part of a class either shows all of
it or hands the rest to a named successor. Tier 1 is identity and the
filesystem map, tier 2 the CLI surface a user types, tier 3 the
workflow/action data model, tier 4 the execution engine, tier 5 the
container abstraction, tier 6 the supporting packages, tier 7 build and CI
metadata.
"""


fixture = "act"
revision_pin = "123167dc"
summary = """
`act` is a Go CLI (`nektos/act`) that runs GitHub Actions workflows
locally by parsing `.github/workflows/*.yml`, building an execution
plan, and using the Docker API (or a host-environment shim) to run
containers for each job. The CLI in `cmd/` parses flags into an
`Input`, lets the user `--list`/`--graph`/`--validate` or actually
run; the run path constructs a `runner.Config`, calls
`runner.New(...).NewPlanExecutor(plan)`, and serves an artifact and
cache server alongside the job containers.

The internals are spread over `pkg/`: `model/` parses workflow YAML
into `Workflow`/`Job`/`Step` and computes a `Plan` of `Stage`s of
parallel `Run`s; `runner/` is the execution engine — `runner.go`
walks the plan, `run_context.go` holds per-job state (env, matrix,
container, expression evaluator), `job_executor.go` chains pre/main/
post step executors, and `step_factory.go` dispatches per step kind
to `step_run.go`, `step_docker.go`, `step_action_local.go`,
`step_action_remote.go`. The whole codebase composes via the
`common.Executor` type — a `func(ctx) error` with `Then`/`Finally`/
`OnError`/`If` combinators and `NewPipelineExecutor`/
`NewParallelExecutor` constructors in `pkg/common/executor.go`.

The query distribution this NS serves: explaining what act is and
how it runs a workflow; locating where a CLI flag is parsed and
threaded into runtime; finding where a specific `step.uses` shape
(local action / remote action / docker-url / reusable workflow) is
dispatched; finding `${{ }}` expression-language behaviour;
locating where step types, action types, matrix expansion, services,
or the action cache live; debugging the docker / host-env split.
"""


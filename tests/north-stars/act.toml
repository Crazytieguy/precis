fixture = "act"
revision_pin = "123167dc"
summary = """
`act` is a Go CLI that runs GitHub Actions workflows locally. It parses
`.github/workflows/*.yml` into a plan of stages (serial) of jobs
(parallel), then drives Docker containers (or host environments) through
each step, implementing the GitHub Actions runtime — including `${{ }}`
expression evaluation, secrets/vars/inputs handling, an artifact server,
and an artifact-cache server — entirely on the developer's machine.

The codebase is organized as:

- `main.go` + `cmd/` — Cobra CLI, flag parsing into an `Input` struct,
  and the `Execute`/`newRunCommand` entry point that wires everything.
- `pkg/model/` — YAML schema for `Workflow`/`Job`/`Action`, plus the
  `WorkflowPlanner` that turns workflow files into a `Plan`.
- `pkg/runner/` — execution engine: `Runner`, `RunContext` (per-job
  state), the `step` interface and its concrete impls (action local/
  remote, docker, composite, run-script, reusable workflow).
- `pkg/container/` — Docker API wrapper + host-environment fallback;
  `Container`/`ExecutionsEnvironment` interfaces.
- `pkg/common/` — the load-bearing `Executor` combinator type (.Then,
  .Finally, .OnError, NewParallelExecutor, NewPipelineExecutor) used
  as the composable unit of work everywhere.
- `pkg/exprparser/` — interpreter for the `${{ }}` expression language.
- `pkg/artifacts/` + `pkg/artifactcache/` — embedded HTTP servers that
  emulate Actions' artifact-upload and cache APIs.
- Smaller pkgs: `pkg/schema/` (JSON-schema validation of action/workflow
  YAML), `pkg/lookpath/` (cross-platform PATH search), `pkg/gh/` (token
  lookup), `pkg/workflowpattern/` (path-filter globs), `pkg/filecollector/`
  (file-tree copy with gitignore).

Plausible agent queries span: "where is flag X defined / what does it
default to?" (cmd/root.go is one 806-line file holding ~70 flags), "how
does act decide what to run?" (Input → WorkflowPlanner.PlanEvent →
Plan{Stages} → Runner.NewPlanExecutor), "how is `${{ }}` evaluated?"
(pkg/runner/expression.go + pkg/exprparser), "how are containers run?"
(pkg/container/docker_run.go + the Container/ExecutionsEnvironment
interfaces), plus debugging, adding step types, intercepting the
artifact server, schema-validation surface, the offline-mode action
cache, etc.

Ranking priorities: lead with broad orientation (README lede, main.go,
root fs), then the most load-bearing abstractions (`Executor` and the
cmd `Input` struct), then breadth across `pkg/` listings before going
deep into any one package. `cmd/root.go` is huge and dominates the CLI
surface — its flag list is sliced so a small budget gets a useful chunk
and a large budget sees the whole catalogue.
"""


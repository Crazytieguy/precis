fixture = "aiogram"
revision_pin = "f6b2cd53"
summary = """
aiogram is a modern, fully asynchronous Python framework for the Telegram
Bot API. The `aiogram` package wraps the entire Bot API surface — methods,
types, enums — as Pydantic models, generated from `.butcher` source by an
external codegen tool. On top of the API client (`Bot`, `BaseSession`,
`AiohttpSession`) sits a dispatcher layer (`Router`, `Dispatcher`,
`TelegramEventObserver`) that routes incoming `Update`s to user-defined
handlers via filters, middlewares, and an FSM (`FSMContext`,
`StatesGroup`, `Scene`). Webhook and long-polling are both first-class.

Likely agent tasks span: writing a new bot (use the dispatcher / Router /
filters API and call `dp.start_polling(bot)` or webhook glue); adding
handlers / FSM states / scenes; calling Bot API methods or instantiating
types from `aiogram.types` / `aiogram.methods`; understanding the
middleware chain (errors, user-context, FSM); plus contribution-style
work (the codegen pipeline under `.butcher`, towncrier changelog). Ranking
front-loads the user-facing dispatcher / Bot surface and a runnable echo
example, then the full Bot API class catalog, then the auto-generated
method / type / enum directories that dominate the file count.
"""


fixture = "aiogram"
revision_pin = "f6b2cd53"
summary = """
aiogram 3.28.2 — a fully asynchronous Python framework for the Telegram Bot API
(API 10.0), built on asyncio + aiohttp + pydantic. Most of the `aiogram/` package
is machine-generated from the `.butcher/` specs (341 modules under
`aiogram/types/`, 178 under `aiogram/methods/`, 35 enums); the hand-written
substance is the dispatch layer (`aiogram/dispatcher/` — Router, Dispatcher,
event observers, middlewares, flags), the client layer (`aiogram/client/` — the
6276-line `Bot` facade and the session/transport stack), the filters, the FSM
stack (states, storages, scenes), class-based handlers, `aiogram/utils/` helpers
and the aiohttp webhook server.

The ranking front-loads identity and the module map, then the dispatch pipeline
an event travels through, then the handler-authoring surface (filters + FSM),
then the Bot / session / exception layer, then the shape of the generated API
layers and the codegen inputs that produce them, then the webhook and keyboard
runtime helpers, and finally the test harness, docs tree and
packaging. Query distribution served: "how do I handle X update type", "how do I
call API method Y", "where is type Z defined", "how do middlewares / FSM / scenes
work", "how do I run polling vs webhook", "how do I test this", "how do I add a
Bot API method" (via codegen, not hand edits).

Two deliberate omissions. AGENTS.md / CLAUDE.md bodies are host-injected, so the
contribution workflow, mandatory lint/type/test commands and butcher codegen
commands they document are never re-scheduled here. And no batch lists a subset
of the generated Bot API methods or types: a partial roster of 178 methods or
341 types would be worse than none, so the snapshot teaches the
one-module-per-entity convention (4.3) and points at the directories instead.
"""


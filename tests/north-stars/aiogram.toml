descriptor = "`BaseHandler` class-based handler ABC"
justification = """
`BaseHandler[T]`: receives an `event: T` and `**kwargs` data,
exposes `self.bot` (extracts from data), `self.update`, and an
abstract `handle()` coroutine. `__await__` delegates to
`handle()` so the framework can `await BaseHandler(event,
**data)` once registered.
"""

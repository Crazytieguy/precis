fixture = "aiogram"
revision_pin = "f6b2cd53"
summary = """
aiogram is a large, mostly auto-generated async framework for the
Telegram Bot API. The repository has two clearly different shapes:

1. A hand-written **dispatcher / runtime** that does the actual
   framework work — `aiogram/dispatcher/`, `aiogram/fsm/`,
   `aiogram/filters/`, `aiogram/handlers/`, `aiogram/webhook/`,
   `aiogram/client/`, `aiogram/utils/`. This is where almost every
   non-codegen task lands (handler/filter/middleware/FSM/scene logic,
   polling, webhook serving, sessions, defaults, exceptions, magic
   filters, keyboards, i18n).

2. A huge, **butcher-generated API surface** under
   `aiogram/types/` (~340 pydantic models), `aiogram/methods/` (~165
   `TelegramMethod` subclasses), and `aiogram/enums/`. Almost every
   file there mirrors a Telegram Bot API entity and is regenerated
   from `.butcher/` inputs (see AGENTS.md). Catastrophic-omission
   risk here is "agent thinks a Bot API method/type doesn't exist".

The ranking prioritizes orientation that serves both: dispatcher
public surface (Bot, Dispatcher, Router, Filter, FSM, Scene,
BaseMiddleware, BaseSession, the `Update.event_type` switch) early
and densely, plus location-only catalogs of the generated
`methods/` and `types/` directories so the agent can pinpoint any
Bot API method/type with one hop. AGENTS.md (codegen rules,
checks, changelog gating, Serena-MCP guidance) is treated as
first-class because misunderstanding the regen workflow is the
canonical failure mode for contribution tasks.
"""


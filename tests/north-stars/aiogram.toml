fixture = "aiogram"
revision_pin = "f6b2cd53"
summary = "aiogram is a mature, fully-asynchronous Python framework wrapping the Telegram Bot API (asyncio + aiohttp + pydantic v2). Its shape is bimodal: a compact set of hand-written orchestration modules (Router/Dispatcher event propagation, middleware chains, filters, FSM, Bot client + HTTP session) that a dev session actually edits/debugs, plus a huge autogenerated surface (aiogram/types ~350 files, aiogram/methods ~180 files, aiogram/enums 33 files, driven by the .butcher codegen tool from .butcher/schema/schema.json) that is structurally uniform -- one file's shape predicts the rest. AGENTS.md/CLAUDE.md already cover the contribution workflow (uv/ruff/mypy/pytest/towncrier/butcher commands), so this ranking does not re-buy that prose; given a hard 10k-token budget against a 6000+ file repo it spends almost all of it on complete directory breadth for every hand-written subpackage (so nothing is silently assumed absent) and on short, precise pointers into the control-flow algorithms most edits/debugging touch (Router/Dispatcher event propagation, middleware wrapping, filter/FSM checks, one representative each of a generated Type/Method/Enum) -- depth beyond a signature is deliberately left as a one-grep-away follow-up given the budget. The query distribution is dominated by framework-internals questions (routing/middleware/FSM semantics), 'how do I call/extend Telegram method or type X', and bot-building tasks against the public API."


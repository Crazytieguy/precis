fixture = "anyhow"
revision_pin = "769cba0b"
summary = """
dtolnay/anyhow 1.0.101 — a `no_std`-capable library crate (12 files in
`src/`, no binary, no CLI) whose entire product is one type: `anyhow::Error`,
a one-word-wide, `repr(transparent)` owning pointer to a heap `ErrorImpl<E>`
carrying a hand-rolled `ErrorVTable` instead of a fat `dyn` pointer.
Everything else in the crate is in service of that: `ptr.rs` (`Own`/`Ref`/`Mut`
raw-pointer wrappers), `error.rs` (vtable construction + downcasting),
`wrapper.rs` (adapters that give non-`Error` messages an `Error` impl),
`kind.rs` (autoref tagged dispatch so `anyhow!($expr)` picks the right
constructor without specialization), `context.rs` (the `Context` extension
trait for `Result`/`Option`), `chain.rs` + `fmt.rs` (cause iteration and the
`Caused by:` / backtrace rendering), `macros.rs` + `ensure.rs` (`bail!`,
`anyhow!`, and a ~780-line `__parse_ensure!` tt-muncher that re-parses Rust
expression grammar in macro_rules), and `backtrace.rs` + `build.rs` +
`nightly.rs` (a cfg matrix — `std_backtrace`, `error_generic_member_access`,
`anyhow_no_core_error`, `anyhow_no_clippy_format_args` — decided by a build
script rustc probe).

The ranking is ordered so that *what the library is and how it is used* is
bought before *how it is built*: identity and layout, then the exported item
roster with `Error`'s three defining guarantees, the `Context` trait and the
`{}`/`{:#}`/`{:?}`/`{:#?}` rendering contract, then the macro surface
(`bail!`/`ensure!`/`anyhow!` docs, expansions, and the `kind.rs` autoref
trick), then the integration tests that state expected behaviour as literal
strings and assertions, then the internal representation (`ErrorVTable`,
`ErrorImpl`, `ptr.rs`), the four remaining support modules, the cfg matrix
(`build.rs`, `backtrace.rs`, `nightly.rs`, CI), and finally the test
infrastructure (trybuild UI corpus, shared helpers). Feature/cfg-gated code is
pervasive, so cfg attributes are kept inside rendered spans rather than
trimmed away, and every roster is a closed class — a partial one would let the
agent conclude the unlisted items don't exist.
"""


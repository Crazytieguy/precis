descriptor = "What bail! and ensure! mean"
justification = """
The two control-flow macros, in the crate's own words: `bail!` is
`return Err(anyhow!($args...))` and requires the surrounding fn to return
`Result<_, anyhow::Error>`; `ensure!` is
`if !$cond { return Err(anyhow!($args...)); }` — analogous to `assert!` but
returning an `Error` rather than panicking. (`ensure!`'s doc lives on the
`__ensure!` wrapper macro at line 70 because the real macro has two
cfg-dependent definitions.) Highest zero-follow-up value per token in the

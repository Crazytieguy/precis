fixture = "anyhow"
revision_pin = "769cba0b"
summary = """
anyhow is a one-word-sized, trait-object-backed error type for Rust apps:
`anyhow::Error` wraps any `E: std::error::Error + Send + Sync + 'static` (or
any `Display + Debug` ad-hoc message), carries a backtrace when one isn't
already present, supports a `Context::context(...)` chain that can be
downcast to either the context type or the underlying error, and comes with
`anyhow!`/`bail!`/`ensure!` macros for ergonomic construction. The crate
is `no_std`-friendly (default feature `std`, opt-out alloc-only mode) and
its single-word layout comes from a hand-rolled per-type vtable rather than
fat pointers.

The ranking serves the full distribution of agent queries about anyhow:
  - "what does this crate give me / how do I use it" — crate docs, README,
    idiomatic examples.
  - "what's the exact signature of X" — Error / Context / Result / Chain,
    plus all the macros.
  - "how does the one-word Error actually work" — ErrorVTable, ErrorImpl,
    construct_from_* constructors, Own/Ref/Mut ptr types.
  - "how is context represented / downcast through a chain" — ContextError,
    context_chain_downcast.
  - "how are anyhow!/bail!/ensure! dispatched" — kind.rs tagged dispatch,
    macros.rs call forms, ensure.rs tt-muncher (breadth only — the body is
    huge and low-value per line).
  - "what compiler versions / features / cfgs are supported" — build.rs
    probe + Cargo features + CI matrix.
  - "how are errors tested" — tests/*.rs shape (one test file per aspect:
    downcast, context, chain, fmt, ensure, boxed, ffi, autotrait, repr).
"""


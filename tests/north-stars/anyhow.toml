fixture = "anyhow"
revision_pin = "769cba0b"
summary = """
`anyhow` is a Rust error-handling library: a single, flexible
`anyhow::Error` trait-object error type with downcasting, context
chains, automatic backtraces, and the `anyhow!` / `bail!` / `ensure!`
macros. It is `no_std`-compatible (with global allocator), built
around `std::error::Error` (or `core::error::Error` on new enough
toolchains) rather than a custom error trait.

The crate is small (~12 src files) but conceptually dense: behind the
public surface, `Error` is a one-word `Own<ErrorImpl>` whose
behaviour is dispatched through a hand-rolled vtable so that
downcasting, source/cause chains and backtrace plumbing all coexist
in a single thin pointer. A separate autoref-based "kind" tagged
dispatch in `kind.rs` lets `anyhow!($expr)` pick between the StdError
and Display+Debug code paths without specialization. `ensure!` is
implemented by a giant tt-muncher macro in `ensure.rs` that parses
Rust expressions to extract `lhs OP rhs` for "assertion failed (lhs
vs rhs)"-style messages, with a fallback path for shapes it cannot
parse.

The ranking serves the full distribution of plausible dev queries on
this crate: explaining concepts, looking up a public method, debugging
a downcast or context interaction, understanding the macro surface,
diving into the vtable / unsafe internals, working with the `no_std`
+ feature-flag matrix in `build.rs`, or extending the test suite. It
prioritises (1) breadth — locations of every public API symbol, every
test file, every src module — and (2) the high-information snippets
needed to actually reason about behavior (struct definition, Display
representations doc, Context trait, key macro arms).
"""


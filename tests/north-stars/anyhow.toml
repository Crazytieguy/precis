fixture = "anyhow"
revision_pin = "769cba0b"
summary = """
anyhow (v1.0.101, dtolnay) is a small #![no_std]+alloc Rust crate providing one
trait-object error type (`anyhow::Error`, pointer-sized, `repr(transparent)`)
for idiomatic error handling in application code (as opposed to thiserror,
which is for libraries defining their own error enums). Its whole surface is:
the `Error` struct + `Result<T, E=Error>` alias, the `Context`/`with_context`
extension trait for attaching human-readable context to any `Result`/`Option`,
the `anyhow!`/`bail!`/`ensure!` macros for ad-hoc errors, and `.downcast*`/
`.chain()`/`.backtrace()` for introspecting an error after the fact. The
interesting engineering is entirely internal: a hand-rolled unsafe vtable +
thin-pointer type-erasure scheme (error.rs/ptr.rs) so `Error` stays one word,
a build.rs probe that detects `error_generic_member_access` / `std::backtrace`
availability across rustc versions down to MSRV 1.68, and an enormous
tt-muncher macro (ensure.rs) that re-parses arbitrary Rust expressions so
`ensure!(cond)` can print "cond (lhs vs rhs)" without a derive macro. The
query distribution this NS serves: (a) "how do I use Context/anyhow!/bail!/
ensure!" (most common), (b) "what does the Debug/Display output look like
exactly" (test_fmt.rs has the literal expected strings), (c) "how does the
zero-cost type erasure / vtable work" (error.rs, ptr.rs, kind.rs), (d) "how is
this built/tested/configured across MSRV and no_std" (build.rs, CI, features),
(e) edge-case/regression questions answered by the tests/ integration suite
and tests/ui/ trybuild compile-fail cases.
"""


fixture = "audiobookshelf"
revision_pin = "eee377e0"
summary = """
Audiobookshelf is a self-hosted audiobook/podcast server: a Node.js
Express + Sequelize/SQLite backend with a Nuxt 2 (Vue) web client.
index.js bootstraps `server/Server.js`, which composes an Auth
singleton, ~20 stateful manager modules, a tree of route handlers
under `server/routers/` + `server/controllers/`, a Sequelize layer in
`server/Database.js` with ~25 models, and a file-watcher / library-
scanner pipeline rooted at `server/scanner/`. The Nuxt client lives
under `client/` with pages / components / store. Configuration is
driven by env vars + a `serverSettings` row in SQLite.

The walker should bias toward the server (where most coding tasks
land) but keep the client tree, build/docker plumbing, and tests
discoverable. Predominant query shapes: 'how is X implemented',
'where is feature Y', 'what shape is the data model for Z', 'how
does the auth/scanner/playback flow work', plus narrower debugging
that needs precise file:line pointers.
"""


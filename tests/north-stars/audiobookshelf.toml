fixture = "audiobookshelf"
revision_pin = "eee377e0"
summary = """
Audiobookshelf: a self-hosted audiobook/podcast media server. Node.js/Express
+ Sequelize (sqlite) backend under server/ (routers -> controllers ->
managers/scanner/models), a Nuxt2/Vue2 SPA client under client/, mocha/chai
unit tests under test/server, and Cypress component tests under
client/cypress. Query distribution: server route/business-logic changes
(controllers, managers, scanner, models), client UI changes (pages,
components, store), metadata-provider/scanning behavior, DB migrations, and
build/deploy/config questions (Docker, docker-compose, dev container).
"""


fixture = "audiobookshelf"
revision_pin = "eee377e0"
summary = """
Audiobookshelf v2.34.0: a self-hosted audiobook and podcast server. Two
halves live in one repo — an Express/Sequelize/SQLite Node server under
`server/` (routers -> controllers -> Sequelize models, plus managers,
scanner, metadata providers and a large vendored `server/libs/` tree) and
a Nuxt 2 / Vue SPA under `client/` (pages, ~185 auto-imported components,
Vuex store, socket.io + axios plugins, 40 locale files). `index.js` is the
process entrypoint; `test/` holds the mocha suite; `docs/` holds the
OpenAPI spec.

The ranking front-loads what the repo is and where its substance lives
(root/server/client listings, the run + build scripts, the entrypoint's
options), then per-directory rosters that turn "where does X live" into a
single grep, then the HTTP API route table (the most-queried surface),
then the runtime core (Server boot, Database accessors, auth routes,
ServerSettings keys, socket events), then client internals, and finally
packaging and CI configuration. Test and OpenAPI trees are rostered early,
with the roster batches, since locating them is what an agent needs most.
"""



[[batches]]
id = "7.2"
descriptor = "Documentation site tree"
justification = """
`docs/` is a VitePress site with its own `package.json`, a `.vitepress/`
config, a sponsor-data pipeline in `docs/scripts/`, and — the part that
matters for navigation — `docs/pages/` split into `advanced/`,
`getting-started/` and `misc/`, with the advanced directory listed in full:
`request-config.md`, `api-reference.md`, `interceptors.md`, `cancellation.md`,
`fetch-adapter.md`, `adapters.md`, `headers.md`, `http2.md`, `retry.md`,
`rate-limiting.md`, `testing.md` and the rest. The `es/`, `fr/` and `zh/`
siblings visible in the `docs/` listing mirror the same page set per locale,
which is worth knowing before editing docs.
"""
[batches.content]
kind = "fs"
groups = [
  { parent = "docs", entries = "all" },
  { parent = "docs/pages", entries = "all" },
  { parent = "docs/pages/advanced", entries = "all" },
]

[[batches]]
id = "7.3"
descriptor = "Test tree: suites and the unit-test file set"
justification = """
`AGENTS.md` gives the naming patterns and the runtime-first layout but no file
names. This lists `tests/` itself (browser, unit, smoke, module, setup, plus
`tests/README.md`, the contributor guide for this directory) and every
immediate child of `tests/unit/` — including the subject-named suites
`prototypePollution.test.js`, `regression.test.js`, `axiosHeaders.test.js`,
`toFormData.test.js`, `syntaxCompat.test.js`, `platform.test.js` and the
`adapters/`, `core/`, `helpers/`, `utils/`, `cancel/` subdirectories — so
"where is X tested" resolves without a search.
"""
[batches.content]
kind = "fs"
groups = [
  { parent = "tests", entries = "all" },
  { parent = "tests/unit", entries = "all" },
]

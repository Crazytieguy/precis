id = "1.9"
descriptor = "How the default axios instance is constructed"
justification = """
The most surprising fact about the codebase: `axios` is not an object but a
function bound to `Axios.prototype.request`, with `Axios.prototype` and the
instance context copied onto it and a `create` factory closing over the
default config. `lib/axios.js:28-47` shows `createInstance` in full plus the
`const axios = createInstance(defaults)` line that produces the exported
singleton — which is why `axios(...)`, `axios.get(...)` and
`axios.create({...})` all work, and why instance methods are copied rather
than inherited. Explains the export block at 1.5; the ellipsis marks the
static-property wiring that follows (`axios.Axios`, `axios.CancelToken`,
`axios.all`, `axios.getAdapter`, … — the runtime side of that export block).

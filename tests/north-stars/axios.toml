fixture = "axios"
revision_pin = "26a87296"
summary = """
axios is a promise-based HTTP client for the browser and node.js. The default
instance is exported from `lib/axios.js` via `index.js`; browser builds use the
XHR or Fetch adapter and Node uses the HTTP/HTTPS adapter, with platform
selection in `lib/platform/`. The repo ships ESM source (`type: module`) with
TypeScript declarations and Rollup-built bundles in `dist/` (not in the
fixture).

Likely query distribution this NS serves:
- How do I make a request / use an instance / set defaults / register an
  interceptor? (drives the public API + `lib/axios.js` + `lib/core/Axios.js`)
- How does config merge work, what fields are recognized, and how is precedence
  resolved? (drives `mergeConfig.js` + `AxiosRequestConfig` type)
- How are errors structured / what are the error codes / how do I wrap a
  third-party error? (drives `AxiosError.js` static-code table)
- Why is my header lowercased / how do I add a custom case-insensitive
  accessor? (drives `AxiosHeaders.js`)
- How is the adapter selected, what does each adapter do, where are
  cancellation hooks attached? (drives `adapters/`)
- Security: prototype-pollution guards, redaction, no-proxy bypass, XSRF
  same-origin check, `redact` in `toJSON`. (drives `mergeConfig.js`,
  `resolveConfig.js`, `shouldBypassProxy.js`, `AxiosError.toJSON`)
- Tests / lint / build commands? (drives `AGENTS.md`, `package.json`)

Ranking strategy:
1. AGENTS.md lede + top-level fs listing — agent-targeted contributor guide
   paired with the inventory it refers to.
2. Public API surface: `lib/axios.js` (static surface), `index.js` named
   re-exports, `Axios` class + method-alias loop, `AxiosError` codes,
   `InterceptorManager` (jsdocs elided).
3. Lifecycle + config + headers: `dispatchRequest`, `mergeConfig` per-key
   table, defaults shape, `AxiosHeaders` method list, transitional.
4. Adapter resolution + cancellation: `adapters.js`, xhr/fetch/http entry
   shape; CanceledError / isCancel / CancelToken public surface.
5. Helpers signatures (high-surface helpers), payload-kind transformer,
   platform, env, types, tests, threat model.

Catastrophic-omission hedges authored explicitly:
- Top-level + every lib/ subdirectory listed before any source bodies, so the
  agent can't assume away an unlisted directory.
- Every helper file's name lands in the helpers fs listing; signature batches
  for the surface-bearing helpers follow in late tiers.
- Full `AxiosError` error-code constant block as one batch (not partial).
- All Axios HTTP-method aliases (`get`/`post`/`postForm`/`query`/…) shown
  together via the registration loops, not just `.get`/`.post`.
- All headers convenience-accessor names listed together.
- `mergeConfig`'s per-key strategy map shown end-to-end.
- Adapter `knownAdapters` map shown end-to-end (http/xhr/fetch).
"""


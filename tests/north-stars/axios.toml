fixture = "axios"
revision_pin = "26a87296"
summary = """
axios 1.16.1 — a promise-based HTTP client for browsers and Node, shipped as
ESM source under `lib/` with a hand-maintained TypeScript declaration pair
(`index.d.ts` / `index.d.cts`). The public entry is `index.js`, which unwraps
the default instance built in `lib/axios.js`; the request pipeline lives in
`lib/core/` (Axios, dispatchRequest, mergeConfig, AxiosHeaders, AxiosError,
InterceptorManager), I/O lives in `lib/adapters/` (http / xhr / fetch),
environment selection in `lib/platform/`, and ~40 generic modules in
`lib/helpers/`. The repository also carries a VitePress documentation site
(`docs/`, four locales), a large vitest test matrix (unit / browser / smoke /
module), a threat model, and a migration guide.

The ranking is written knowing the agent already has `AGENTS.md` in context
(architecture boundaries, request-lifecycle prose, interceptor ordering rules,
canonical error-code list, commands, test layout). It therefore spends its
budget on what that document does *not* give: the exact public export set, the
concrete file rosters per directory, the real config-key universe and its
per-key merge strategy, the default values, the class/method surfaces, adapter
and platform entry points, and the locations of the repo's long-form docs.
Early batches answer "what is this and where does its substance live"; the
middle answers "what is the API, what can be configured, and how is a request
actually assembled"; the tail gives error/header/cancellation surfaces,
adapters, types, helpers, tests, build, docs and governance locations so that
any follow-up read is one hop.
"""


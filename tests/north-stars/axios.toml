fixture = "axios"
revision_pin = "26a87296"
summary = """
axios is a Promise-based, isomorphic HTTP client (browser + Node.js).
`lib/axios.js`/`index.js` build a default instance; `lib/core/Axios.js`
runs interceptor chains around `lib/core/dispatchRequest.js`, which picks
one of three adapters (`lib/adapters/{http,xhr,fetch}.js`) via
`lib/adapters/adapters.js`. `lib/core/mergeConfig.js` combines instance
defaults with per-request config; `lib/core/AxiosHeaders.js` and
`lib/core/AxiosError.js` are the header/error primitives threaded through
every adapter. `lib/helpers/` holds environment-agnostic utilities (URL/
form serialization, header parsing, progress/stream throttling, proxy
bypass); `lib/platform/` and `lib/env/` isolate Node-vs-browser globals
and the generated version string. The query distribution spans: request
config semantics ("what does option X do", "what's the default"),
interceptor/cancellation/error-handling behavior, adapter-specific
networking (proxying, redirects, decompression, streaming, HTTP/2) which
is Node-only and security-sensitive per THREATMODEL.md, form/URL
serialization edge cases, and packaging/build/test operation (dual ESM/
CJS/browser builds via Rollup, Vitest unit/browser/smoke/module suites).
AGENTS.md already covers architecture boundaries, naming conventions,
the request lifecycle, a bare list of AxiosError codes, and its own
pointer to THREATMODEL.md for security-sensitive changes, so this NS
buys breadth (every source file's location, including THREATMODEL.md's
existence in the root docs listing) and precise shapes (config/
response/error TypeScript types, per-key mergeConfig semantics) instead
of re-narrating what AGENTS.md already states or re-deriving the
security threat model, which is out of budget here and one file-read
away via AGENTS.md's own pointer.
"""


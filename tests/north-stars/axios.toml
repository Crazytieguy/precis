fixture = "axios"
revision_pin = "26a87296"
summary = """
axios is a promise-based HTTP client for browser and Node.js. The package
ships ESM source from `lib/` (with a Rollup build to CJS/UMD in `dist/`,
not present in this fixture), public types in `index.d.ts` / `index.d.cts`,
and a default instance constructed in `lib/axios.js` from `lib/core/Axios.js`
plus capability-selected adapters under `lib/adapters/` (xhr → http → fetch).
Domain code lives in `lib/core/` (request dispatch, header normalization,
config merge, interceptors, error class); reusable utilities live in
`lib/helpers/`; platform shims live in `lib/platform/`; cancellation lives
in `lib/cancel/`.

The query distribution this NS serves is the full spread of dev tasks against
a mature, widely-used library: "how do I cancel a request", "what config
options exist and what do they do", "where is the XHR adapter", "how do I
add a retry interceptor", "what does AxiosError look like", "is HTTP/2
supported", "how is the XSRF token attached", "where is the request-lifecycle
order documented", security/threat-model questions, contributor/test
questions. Public API breadth + lifecycle pointers + named-export locations
are the high-value rocks. lib/utils.js, lib/adapters/http.js, and the giant
README are too large to inline; they're surfaced as filenames + heading /
signature locations and read on demand.
"""


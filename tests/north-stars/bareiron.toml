fixture = "bareiron"
revision_pin = "ddb071c3"
summary = """
bareiron: a from-scratch, single-process Minecraft: Java Edition server
(protocol 772, MC 1.21.8) written in freestanding C, targeting extremely
memory-constrained embedded devices (ESP32) as well as PC. Priorities in
order: memory usage, performance, features; vanilla parity is explicitly
not a goal. All state is fixed-size global arrays (no heap growth at
runtime beyond a couple of small mallocs), sized by compile-time knobs in
include/globals.h. The whole protocol/game-logic implementation lives in
src/*.c with matching include/*.h declarations; a generated
src/registries.c + include/registries.h pair (produced by
build_registries.js from a dumped vanilla server JAR, gitignored, absent
from this tree) supplies block/item/registry ID tables that most of the
game code depends on by name (B_*, I_*, W_*, D_* macros). Query
distribution this NS serves: protocol/packet debugging, gameplay-logic
questions (crafting, combat, inventory slot mapping, block changes,
worldgen), config-knob tuning for a target device, build/compile
troubleshooting (including the registries-generation step), and general
architecture/design-rationale questions.
"""


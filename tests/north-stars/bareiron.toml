fixture = "bareiron"
revision_pin = "ddb071c3"
summary = """
bareiron is a minimalist Minecraft 1.21.8 (protocol 772) server written in
plain C, optimized for memory-restricted embedded systems (especially
ESP32) where memory > performance > features. It speaks the vanilla
Minecraft Java protocol over a single non-blocking accept-loop in main.c,
dispatching each packet through a big switch on (packet_id, state). The
codebase has three pillars:

  * `src/packets.c` + `include/packets.h` — every cs_/sc_ network packet
    handler (serverbound parsers, clientbound serializers).
  * `src/procedures.c` + `include/procedures.h` — game logic: player
    state, mining + placement, mob AI, chests, fluid flow, server tick.
  * `src/worldgen.c` + `include/worldgen.h` — deterministic terrain
    generation from `world_seed`: biomes, heights, ores, trees.

Supporting modules: `src/crafting.c` (crafting + smelting recipes),
`src/serialize.c` (optional `world.bin` persistence), `src/structures.c`
(tree placement), `src/tools.c` (recv/send + endian + RNG), `src/varnum.c`
(VarInt). `include/globals.h` is the central config header. The
`registries.h` / `registries.c` are generated from a vanilla server jar
via `extract_registries.sh` + `build_registries.js` and are gitignored.

Plausible queries: how does packet X get handled, where is config Y, how
is terrain at coordinate Z computed, what happens on player join /
mining / placement, where are recipes defined, how is data persisted to
disk, how do chests work (the README warns about memory hacks).
"""


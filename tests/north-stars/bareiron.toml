fixture = "bareiron"
revision_pin = "ddb071c3"
summary = """
bareiron is a from-scratch Minecraft 1.21.8 (protocol 772) Java-edition
server written in plain C, sized to run on an ESP32: ~7.7k lines across
10 `.c` files in `src/` and 9 headers in `include/`, with no dependencies
beyond libc and sockets (plus ESP-IDF when targeting an MCU). Its stated
priority order is memory, then performance, then vanilla feature parity.

The repository is far larger than the budget, so the ranking buys breadth
and exact coordinates rather than long bodies. First identity and the
file map, then the two build entry points (`build.sh` for gcc/cosmocc,
`src/CMakeLists.txt` for ESP-IDF) and `.gitignore` — because
`include/registries.h` and `src/registries.c` are *generated* by
`build_registries.js` from a vanilla server registry dump and are absent
from the tree; every `B_*` / `I_*` / `W_*` / `D_*` identifier in the
sources resolves there, and an agent that doesn't learn this burns many
searches. Tier 2 is the wire surface: the connection-state constants, the
complete `cs_*` / `sc_*` declaration set of `include/packets.h`, and the
VarInt primitives. Tier 3 is the shared vocabulary: `BlockChange`,
`PlayerData` with its documented flag bits, `MobData`, `EntityData`, the
global state externs, the complete `#define` roster of `include/globals.h`
(the file the README designates as the configuration surface, including
its commented-out toggles), the definitions in `src/globals.c`, the README
configuration prose, and the `build_registries.js` template that emits the
generated identifiers plus its fixed biome list. Tier 4 completes the
header set — `procedures.h`, `worldgen.h`, `tools.h`, `serialize.h`,
`crafting.h`, `structures.h` — so that after it every declaration in
`include/` has been rendered. Tier 5 is `src/main.c`: the maintainer's
design note on the packet handlers, the 0x00 login/configuration branch,
the complete packet-id dispatch table, the single-threaded accept/tick
loop, and the ESP32 entry points. Tier 6 buys one-hop definition locations for `procedures.c`
and `worldgen.c` (the only place their file-private helpers are visible),
the serializer's file paths, the chat command surface, and the smelting
table. Tier 7 covers operational periphery: the GitHub workflow and issue
template listing, the contribution rules, the registry extraction script's
top-level flow, and the license.
"""


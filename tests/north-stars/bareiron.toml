# ============================================================
# Tier 5 — Concrete bodies of central / short functions
# ============================================================
# Each lands a concrete 'how does X work' answer with minimal follow-up.
# Sized to fit within the remaining budget (cap is 10k tokens).

[[batches]]
id = "5.1"
descriptor = "getBlockAt body — block_changes overlay + terrain fallback"
justification = """
y<0 returns bedrock; otherwise scan block_changes for a matching coord;
fall through to deterministic terrain via getTerrainAt(x, y, z, anchor).
This is the single most-called function in worldgen — every cs_useItemOn
/ cs_playerAction / mob-AI step routes through it.
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "src/worldgen.c"
start = 374
end = 392
render = { kind = "full" }

[[batches]]
id = "5.2"
descriptor = "getBlockChange body — linear scan with chest skip"
justification = """
Linear scan of block_changes[] for a (x,y,z) match, with the
ALLOW_CHESTS branch that skips i+=14 past chest item-data entries (each
chest occupies 15 contiguous slots — see makeBlockChange). Without
this, the agent can't tell why naive 'find this block' code skips slots.
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "src/procedures.c"
start = 478
end = 492
render = { kind = "full" }

[[batches]]
id = "5.3"
descriptor = "getChunkBiome body — biome from world_seed bit pattern"
justification = """
The clever 'no extra hash needed' trick: 32-bit world_seed is treated
as a 4×4 biome matrix (2 bits per biome), looked up by (biome_x &
3, biome_z & 4) — only 4 non-beach biome types possible because of this.
Beaches are computed from a circular distance check, giving each biome
an 'island' shape. Frames the entire biome generation algorithm.
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "src/worldgen.c"
start = 24
end = 49
render = { kind = "full" }

[[batches]]
id = "5.4"
descriptor = "handlePlayerJoin body — chat + spawn entity broadcast"
justification = """
Composes '<name> joined the game' in recv_buffer (the codebase's idiom
for avoiding malloc), broadcasts via sc_systemChat, then sends
sc_playerInfoUpdateAddPlayer + sc_spawnEntityPlayer to every connected
client. Clears the 'client loading' flag (0x20) and the fallback timer.
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "src/procedures.c"
start = 177
end = 197
render = { kind = "full" }

[[batches]]
id = "5.5"
descriptor = "handleServerTick — world_time + per-player tick header"
justification = """
The first 13 lines: world_time advance modulo 24000 (one Minecraft day),
server_ticks++, the per-player loop entry, the 'client loading 3-second
fallback → handlePlayerJoin' branch. Frames every other thing the tick
handler does (attack cooldown, eating, lava/cactus damage, healing —
all in handleServerTick afterward).
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "src/procedures.c"
start = 1623
end = 1640
render = { kind = "full" }

[[batches]]
id = "5.6"
descriptor = "sc_blockUpdate body — concrete sc_ packet wire format example"
justification = """
A single representative sc_ packet (7 lines): VarInt length, packet ID
0x08, the BE 64-bit position-pack `((x & 0x3FFFFFF) << 38) | ((z &
0x3FFFFFF) << 12) | (y & 0xFFF)`, and the block VarInt looked up through
block_palette[]. Shows the canonical 'how a clientbound packet gets
serialized' pattern that every other sc_ function repeats.
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "src/packets.c"
start = 470
end = 477
render = { kind = "full" }


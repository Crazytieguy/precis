fixture = "beets"
revision_pin = "5df37abc"
summary = """
beets is a Python media-library manager: it catalogs music files in a
SQLite database, fetches/normalizes metadata from MusicBrainz and other
sources, and reorganizes/renames files via path-format templates. The
codebase has three big concentric layers:

  1. **dbcore** (`beets/dbcore/`) — a tiny ORM over SQLite. Defines
     `Model`, `Database`, the `Query`/`FieldQuery`/`Sort` hierarchy,
     and the `Type` hierarchy for field types. Library-agnostic.
  2. **library** (`beets/library/`) — concrete `Item` (track) and
     `Album` models, the `Library` subclass of `Database`, the
     `TYPE_BY_FIELD` mapping, query parsing wrappers, and schema
     migrations.
  3. **importer** (`beets/importer/`) + **autotag**
     (`beets/autotag/`) — the user-facing workflow. `ImportSession`
     drives a `pipeline.Pipeline` of coroutine stages (`read_tasks` →
     `lookup_candidates` → `user_query` → `manipulate_files` …);
     `autotag.match` produces `AlbumMatch`/`TrackMatch` candidates
     scored by a weighted `Distance`.

The CLI lives in `beets/ui/__init__.py` (`main()` → `_raw_main()` →
`SubcommandsOptionParser`), with built-in subcommands under
`beets/ui/commands/`. Almost everything user-visible is extensible
through plugins in `beetsplug/` (60+ shipped): a plugin subclasses
`BeetsPlugin` and may register commands, queries, types, template
funcs, import stages, or event listeners. Metadata sources subclass
`MetadataSourcePlugin`.

Likely dev queries this ranking serves: "how does a beet command get
wired up?", "what fields can I query?", "how is metadata matching
scored?", "what's the import pipeline?", "how do I write a plugin /
register a stage / listener?", "how do paths get stored?", "where's
the config schema?", "what's the model migration story?".
"""


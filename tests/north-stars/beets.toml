fixture = "beets"
revision_pin = "5df37abc"
summary = """
beets 2.11.0 — a Python CLI + library for cataloguing and auto-tagging a music
collection. Substance is split three ways: the `beets/` core package (~18.6k
lines across the `dbcore` mini-ORM, the `library` Item/Album models, `autotag`
matching, the `importer` pipeline, and the `ui` command layer), a flat
`beetsplug/` namespace package of 81 bundled plugin entries, and a `test/`
pytest suite mirroring both. The ranking front-loads identity and the shape of
those three trees, then the durable surfaces an agent needs to frame almost any
query: the Item/Album field schema (which *is* the database schema and the
query/template vocabulary), the shipped `config_default.yaml` (the complete
default config surface), the `beet` subcommand roster and global flags, the
importer pipeline's stage list, and the plugin authoring API (BeetsPlugin
methods plus the complete `EventType` literal). Deeper internals — the dbcore query/sort class hierarchy, the autotag matcher
and its distance machinery, and the beets.util helper vocabulary — follow as
symbol rosters with line coordinates, so an agent can grep one name rather than
search a 300-file tree.
"""


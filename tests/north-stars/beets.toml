fixture = "beets"
revision_pin = "5df37abc"
summary = """
beets (tests/fixtures/beets) is a Python 3.10-3.14 CLI + library for tagging,
organizing, and querying a personal music collection. `beet` (entry point
`beets.ui:main`) drives a plugin-extensible pipeline: `beets/importer/` walks
source directories and builds `ImportTask`s, `beets/autotag/` matches them
against MusicBrainz/Discogs/etc. candidates and scores `Distance`, and
`beets/library/` (built on the generic ORM-ish `beets/dbcore/`) persists
`Item`/`Album` rows to a SQLite `library.db` and renders/parses path templates
and query strings. `beets/ui/commands/` holds one module per CLI subcommand
(list, import, modify, move, ...). `beetsplug/` has ~80 first-party plugins
(one file/package each) registered via `beets/plugins.py`'s `BeetsPlugin`
base + `EventType` hook literal; `beets/metadata_plugins.py` adds the
autotag-source-plugin ABC (MusicBrainz, Discogs, Spotify, Deezer, ...).
Config is YAML via `confuse`, documented end-to-end in `docs/reference/` and
`docs/plugins/*.rst`; dev docs live under `docs/dev/`. Tests are pytest,
mirroring source layout under `test/` (plus `beets/test/helper.py`'s
TestHelper/ImportHelper mixins used by nearly every test module). Plausible
sessions: implement/debug a plugin hook or CLI flag, add a query operator or
path-template function, trace an import-pipeline stage, extend the Item/Album
schema, or wire up a new metadata-source plugin. The ranking favors: (1) the
CLI/plugin/import/autotag/dbcore architecture and its exact extension points
(signatures + line coordinates), (2) a full roster of every plugin, command,
util module, and config key so nothing looks card-carrying-absent, (3) the
concrete config/CLI/event/query surfaces an agent would otherwise have to
grep for, ahead of (4) plugin-body and test-suite depth.
"""


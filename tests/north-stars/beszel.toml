fixture = "beszel"
revision_pin = "c1c1cd1b"
summary = """
Beszel is a Go monorepo for a lightweight self-hosted server-monitoring
platform: a `hub` (web app built on PocketBase) and an `agent` (runs on each
monitored machine, reports via WebSocket-with-SSH-fallback using CBOR-encoded
payloads). Domain entities (system/container/systemd/smart stats) are shared
between agent and hub through `internal/common` and `internal/entities`.
The hub persists data as PocketBase collections (schema lives in
`internal/migrations`), runs alerting (`internal/alerts`), downsampling
(`internal/records`), and a React+Vite+TS dashboard (`internal/site`,
i18n via lingui, 32 locales). Deployment surfaces: Docker images, a Helm
chart, Debian packaging, and systemd install scripts under `supplemental/`.

This is a large repo (~390 files) against a tight token budget, so this NS
leans hard on breadth: directory listings establish what exists everywhere,
while a smaller number of line-level batches go deep only on the highest-
traffic paths (wire protocol, core entity schemas, agent/hub struct shapes,
the hub API route table, and the agent<->hub connection handshake). The
query distribution this serves: protocol/entity changes, new metrics or
collectors, hub API/alerting work, frontend feature work, build/release/
deployment questions, and debugging either binary.
"""

# ===========================================================================
# Ranking note: directory-listing (Fs) batches and small line-level content
# batches are interleaved rather than front-loaded/back-loaded. Fs listings
# are individually cheap and establish breadth; the growth-envelope cap means
# the biggest single-subsystem dives (struct definitions, the agent_connect
# handshake, the API route table) can only land once cumulative cost is large
# enough to absorb them, so they appear later even though several are
# high-value — see each batch's justification for why it's ranked where it is.
# ===========================================================================

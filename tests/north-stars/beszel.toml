fixture = "beszel"
revision_pin = "c1c1cd1b"
summary = """
Beszel v0.18.7 (`github.com/henrygd/beszel`) — a two-binary server-monitoring
platform. The **hub** (`internal/cmd/hub` -> `internal/hub`) is a PocketBase
application that stores metrics in SQLite collections and serves an embedded
React SPA (`internal/site`); the **agent** (`internal/cmd/agent` -> `agent/`)
runs on each monitored host and collects CPU / memory / disk / network / GPU /
temperature / battery / SMART / systemd / Docker-container metrics. They speak
a CBOR request/response protocol defined in `internal/common` over a WebSocket
(agent dials the hub) with an SSH fallback (hub dials the agent).

The ranking front-loads (1) what the project is and where its substance lives
— the root, `internal/` package map, and a semantically grouped roster of the
69-entry flat `agent/` directory; (2) how you build, run and configure it —
both `main`s, the agent CLI flag/subcommand surface, `Makefile` targets, the
docker-compose samples, and the ~40 environment variables that are the real
configuration API; (3) the hub<->agent wire protocol and shared entity structs,
which are the vocabulary every other file speaks; then hub internals (routes,
PocketBase collections, system updater, alerts, records), agent internals
(collectors and their per-OS build-tag variants), the frontend, and finally
packaging / CI / test surfaces.

Query distribution served: "what is this and how are the pieces wired",
"how do I build/run/configure the agent", "where is metric X collected",
"what does the hub expose over HTTP", "what is stored in the database",
"how does the frontend get its data", "where are the tests for Y".
"""


fixture = "beszel"
revision_pin = "c1c1cd1b"
summary = """
Beszel is a Go server-monitoring platform with two binaries that share a
single Go module: a `beszel-agent` daemon that collects host metrics on
each monitored system, and a `beszel` hub (a PocketBase-backed web app)
that aggregates data, serves a React/Vite dashboard from the embedded
`internal/site/dist`, and routes alerts. Agents push metrics to the hub
over WebSocket (outbound from agent to hub's `/api/beszel/agent-connect`)
and fall back to inbound SSH; both transports speak a CBOR-wrapped
request/response protocol defined in `internal/common/common-ws.go`.

The shape of an agent dev task is dominated by metric-collector source
files (cpu, memory, disk, network, GPU, sensors, SMART, systemd,
docker), platform-conditional build-tag variants (`*_linux.go`,
`*_darwin.go`, `*_windows.go`, `*_stub.go`), and the connection-manager
state machine that switches between WS and SSH. The shape of a hub task
is dominated by the PocketBase-style event hook plumbing in
`internal/hub/hub.go`, the custom routes in `internal/hub/api.go`, the
per-system updater goroutine in `internal/hub/systems/system.go`, the
threshold/quiet-hours/shoutrrr alert pipeline in `internal/alerts/`,
and the time-bucket aggregation in `internal/records/`. The wire
protocol and the entity types under `internal/entities/` are shared
across both sides and are load-bearing for almost any query.

The ranking front-loads: (1) what the project *is* and its two-binary
shape, (2) the wire protocol + shared entity types, (3) the agent's
metric-gathering surface and the WS/SSH transport switch, (4) the
hub's startup wiring + per-system updater + agent-connect handshake,
(5) the alerts and records (aggregation) subsystems, (6) the smaller
support packages and supplemental install/build assets.
"""


fixture = "bubbletea"
revision_pin = "c60f0c53"
summary = """
Bubble Tea v2 (`charm.land/bubbletea/v2`): a Go framework for terminal UIs
built on The Elm Architecture. The whole library is one flat package `tea` at
the repository root — ~40 `.go` files with no internal subpackages — plus a
separate `examples/` module (63 example programs, 38 of them written up in
`examples/README.md`), a `tutorials/` module, and
two large docs (the README tutorial and `UPGRADE_GUIDE_V2.md`, the v1→v2
migration guide).

The substance is concentrated in three places: `tea.go` (1439 lines: the
`Model`/`Msg`/`Cmd` contract, the declarative `View` struct, the `Program`
runtime and its event loop), `cursed_renderer.go` (860 lines: the cell-based
renderer that turns a `View` into ANSI output), and a wide spray of tiny
files that each define one or two message types plus their command
constructors (`key.go`, `mouse.go`, `color.go`, `clipboard.go`, `paste.go`,
`focus.go`, `termcap.go`, `xterm.go`, `environ.go`, `keyboard.go`,
`cursor.go`, `screen.go`, `profile.go`, `raw.go`). Platform differences live
in build-tagged pairs (`tty_unix.go`/`tty_windows.go`, `signals_*.go`,
`termios_*.go`).

The ranking front-loads identity plus the Elm contract (`Model`, `Msg`,
`Cmd`, `View`), then the complete root file map, then the `Program` runtime
surface (public methods, options, the event-loop dispatch table). After that
it buys breadth: closed rosters of every message type and every command
constructor across the small files, since "which message or command do I use
for X?" is the dominant question for this library. The renderer and the
platform/TTY layer come next, then the examples and tutorials inventory,
the two documentation section maps, the v1→v2 migration checklist that
answers "why doesn't `tea.WithAltScreen` exist any more?", the test-function
roster and the CI workflow inventory.
"""


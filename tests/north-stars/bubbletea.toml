fixture = "bubbletea"
revision_pin = "c60f0c53"
summary = """
Bubble Tea is a Go framework for building terminal UIs in the style of The
Elm Architecture. The user authors a `Model` (`Init`/`Update`/`View`), a
`Program` wraps it, the runtime translates terminal input events into typed
`Msg` values, hands them to `Update`, and renders the returned `View`. In
v2 (this fixture is post-v2 rewrite), what used to be imperative options or
commands (alt-screen, mouse mode, cursor, window title, colors, ...) became
declarative fields on `tea.View` returned each frame — that shift drives
much of the API surface.

Layout: package source is a flat set of single-purpose Go files at the
repo root grouped by concern (`tea.go` runtime + Program/View/Cursor;
`key.go`/`mouse.go`/`paste.go`/`focus.go`/`clipboard.go`/`color.go`/
`screen.go`/`keyboard.go` for message types; `commands.go` for
Batch/Sequence/Tick/Every; `options.go` for ProgramOptions; `exec.go` for
sub-process I/O; `logging.go`; `renderer.go`/`cursed_renderer.go`/
`nil_renderer.go` for output; `input.go`/`tty*.go`/`termios*.go`/
`signals*.go` for platform-conditional terminal plumbing). The richest
docs are `README.md` (lede + tutorial) and `UPGRADE_GUIDE_V2.md` (v1->v2
migration cookbook). `examples/` contains ~60 standalone main.go
programs (one per feature) plus `tutorials/{basics,commands}`.

Query distribution this NS serves: "how do I do X in Bubble Tea?"
(View-field knobs, Msg types, Cmds, examples to mimic); v1->v2 migration
mechanics; explanations of the runtime (event loop, batching, signals,
TTY, panic recovery, renderer); deep-dives into the cursed_renderer
(frame diffing, alt screen, kitty keyboard, progress bar, mouse).
"""


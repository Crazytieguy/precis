fixture = "chalk"
revision_pin = "aa06bb5a"
summary = """
Chalk is a Node.js library for terminal string styling: `chalk.red.bold('foo')`
returns the string wrapped in ANSI escape codes. The repo is small and
unusually well-known, so an agent's likely tasks span "how do I use it"
(API/styles), "how does the chaining work" (internal builder/styler model),
"why is color enabled/disabled here" (supports-color detection), and "what
types are exported" (TypeScript surface in `index.d.ts`).

The package's source has three pieces: `source/index.js` (the chainable
builder factory) plus two vendored modules — `source/vendor/ansi-styles/`
(ANSI escape tables + color-space conversions) and
`source/vendor/supports-color/` (environment detection, with a separate
browser variant). Each ships its own `.d.ts`. The README is the canonical
reference for the public API and the full list of style/color names; rank
it early because the style names are not enumerated anywhere terser.

Ranking favours: (1) the README API/styles list, (2) the public exports
and the chainable factory + style-attaching loops in `index.js`, then the
core runtime helpers `createStyler`/`createBuilder`/`applyStyle`, (3) the
ANSI escape tables + color-space conversions, (4) supports-color's
environment heuristics, with tests/examples/benchmark and peripheral docs
trailing.
"""


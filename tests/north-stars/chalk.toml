fixture = "chalk"
revision_pin = "aa06bb5a"
summary = """
Chalk 5.6.2 — a zero-dependency, ESM-only npm library that wraps strings
in ANSI escape codes ("Terminal string styling done right"). The whole
runtime is five JS files under `source/`: `index.js` (the chainable
builder/styler machinery and the `Chalk` class), `utilities.js` (two
string helpers used to re-open styles across nested codes and
linebreaks), and two *vendored* upstream packages inlined under
`source/vendor/` — `ansi-styles` (the style-name → ANSI code tables and
RGB/hex/ansi256 conversions) and `supports-color` (terminal color-level
detection from env vars, CLI flags and TTY-ness, with a `browser.js`
variant selected through package.json `imports`). The public contract is
declared twice: as runtime exports in `source/index.js` and as types in
`source/index.d.ts`.

The ranking front-loads what a session cannot function without: package
identity and the `imports`/`exports`/`scripts` wiring, the complete file
tree, the readme's section map, then the *public API contract* (export
rosters, the `Options`/`level` semantics, every `ChalkInstance` member,
and the readme prose that gives level numbers, `FORCE_COLOR` and
`--color` flag behaviour). Style vocabulary with actual ANSI codes comes
next, then the implementation of chaining/styling, then colour-support
detection, then the ava/tsd test surface, then the remaining type
rosters, the examples and the benchmark. Style-name
lists are bought once, from `ansi-styles`'s code table, rather than
re-bought from the readme's bulleted duplicates; license, code-of-conduct,
contributing, editorconfig, funding and the other boilerplate files are
left at listing level in 1.2/1.7 — `package.json` already states the
licence and none of them constrain code.
"""


fixture = "chalk"
revision_pin = "aa06bb5a"
summary = """
chalk is a small (single-package, no-runtime-dependency) ESM terminal-styling
library. All logic lives under source/: index.js is the chainable-builder
core (property-getter-per-style, a style-linking `createStyler`, and the
`applyStyle` function that assembles/reopens ANSI codes and fixes a
macOS line-break bleed bug), utilities.js has two string helpers used only
by applyStyle, index.d.ts is the public TS surface, and vendor/{ansi-styles,
supports-color} are frozen copies of chalk's own upstream sibling packages
(ANSI code tables + conversion math; environment/TTY color-level detection).
Tests (ava) exercise chaining, nesting/reset, per-instance vs global level,
and RGB/hex downsampling at each of the 4 color levels. Build/test/lint is a
single `xo && c8 ava && tsd` command; there are no source subpackages beyond
vendor/. The query distribution this NS serves: "how do I use/chain styles",
"how does nesting/reset/level actually work internally", "what ANSI code
does color X map to", "how is terminal color support detected/forced",
"what's the public TS type surface", "how do I build/test/lint", and
"what does chalk output for input Y at level Z" (grounded via test
fixtures). Chalk 5 is ESM-only; a recurring practical question is why
TS/bundler users might need Chalk 4 instead.
"""


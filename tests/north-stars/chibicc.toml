[[batches]]
id = "4.2"
descriptor = "Hideset intersection: macro-hygiene fixed point"
justification = "The one non-obvious rule in chibicc's macro expander: a token's hideset after nested macro expansion is the *intersection* of the two hidesets involved (not their union) — this single function is why macros don't infinitely re-expand themselves."

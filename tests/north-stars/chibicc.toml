fixture = "chibicc"
revision_pin = "90d1f7f1"
summary = """
chibicc is a small, single-binary, multi-stage C11 compiler (tokenize ->
preprocess -> parse -> type-check -> x86-64 codegen) plus its own driver
(argument parsing, subprocess orchestration for as/ld) and test suite.
Dev tasks span: adding/debugging a language feature (touches all four
stages), driver/CLI behavior (flags, linking modes, dependency-file
generation), ABI/codegen questions (struct passing, bitfields, VLA,
atomics, long double), and test-suite work (which test/*.c exercises a
feature). README.md already narrates the four-stage pipeline and the
project's design philosophy, so this NS spends its tight token budget on
the complement: the exact struct/enum shapes defining the compiler's
data model (chibicc.h, shown close to verbatim since it is the single
highest-value document here), a location roster of every function in
every stage file (so "where is X implemented" is one grep away without
re-deriving it from scratch), the CLI's full recognized-flag surface,
and one semantic slice an algorithm's signature can't convey (macro-hygiene
hidesets — the reason macro expansion doesn't infinitely recurse). Breadth
is prioritized over exhaustive
bodies given the fixture's size relative to budget: test/*.c and
include/*.h filenames are largely self-describing (vla.c, atomic.c,
bitfield.c, stdatomic.h...) and are surfaced via directory listings
rather than re-purchased as body excerpts.
"""


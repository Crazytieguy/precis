fixture = "chibicc"
revision_pin = "90d1f7f1"
summary = """
chibicc is a small but feature-complete C11 compiler written in C by Rui
Ueyama as the reference implementation for a book on compiler construction.
It is a multi-pass compiler: a tokenizer (`tokenize.c`) splits a source file
into a linked list of `Token`s, a preprocessor (`preprocess.c`) expands
macros and processes directives, a recursive-descent parser (`parse.c`)
builds an AST of `Node`s annotated by `type.c`, and a code generator
(`codegen.c`) emits x86-64 SystemV assembly. `main.c` is the driver:
it parses argv, dispatches to `-cc1` (compile a single C file) or to
external `as`/`ld` for assembly/linking, and orchestrates temp files.
A single header `chibicc.h` declares every shared type (`Token`, `Node`,
`Obj`, `Type`, `Member`, `Relocation`, `HashMap`, `StringArray`) and every
cross-translation-unit function. Supporting `.c` files are small:
`hashmap.c` (open-addressing hash map), `strings.c` (StringArray +
printf-format helper), `unicode.c` (UTF-8 codec, identifier char ranges,
wcwidth), `type.c` (type predicates, conversions, AST node typing).
`include/` contains tiny `stdarg.h`, `stdatomic.h`, `stddef.h`, etc.
that mostly just `#define` keywords/macros to chibicc's intrinsics.
`test/*.c` is one .c file per C11 feature, each `#include "test.h"`
and using the `ASSERT(expected, expr)` macro; `test/driver.sh` exercises
the driver's CLI flags. The query distribution the ranking serves is
broad: "where is X implemented?" / "what AST nodes exist?" / "how does
the preprocessor expand a macro?" / "how does the codegen handle a
struct return?" / "what test covers feature Y?" — answer first via the
chibicc.h schema + function-location indexes, then dive into bodies.
"""


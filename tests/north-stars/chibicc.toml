fixture = "chibicc"
revision_pin = "90d1f7f1"
summary = """
chibicc is Rui Ueyama's small C11 compiler: a flat root of nine `.c` files
plus one shared header, `chibicc.h`, that declares every cross-module type
and function grouped by the file that owns it. The pipeline is
tokenize -> preprocess -> parse -> codegen (x86-64 AT&T assembly text),
driven by a GCC-compatible driver in `main.c` that re-execs itself with
`-cc1` and shells out to `as` and `ld`. Supporting modules: `type.c`
(type constructors + `add_type` inference), `hashmap.c`, `unicode.c`,
`strings.c`. `include/` ships the freestanding headers chibicc provides
itself; `test/` holds 41 self-checking C programs plus `driver.sh`
(command-line behaviour) and `thirdparty/` scripts that build Git, SQLite,
libpng, tinycc and CPython with chibicc.

The ranking front-loads the repository's identity and its module map: the
README's four-stage "Internals" description, the complete root listing, the
build and self-host targets, and the `// <file>.c` section banners inside
`chibicc.h` that make the header a table of contents. It then spends budget
on the header's cross-module API declarations, on per-file function-name
rosters plus the two file-header comments that carry the load-bearing ideas
(the parser's `Token **rest` convention and the preprocessor's hideset
algorithm), and then on the core data structures (`Token`, `Obj`,
`Node`/`NodeKind`, `Type`/`TypeKind`, `Member`, `HashMap`). The tail spends
what is left on the places where the stages actually connect — `main()`,
`cc1()`, `parse()` — on the C grammar that the recursive-descent parser
records in comments above its functions (statements and the whole operator
precedence chain), and on the complete list of preprocessor directives that preprocess2 dispatches.

Deliberately left to a follow-up read, because the rosters already pin their
locations: function bodies, codegen's register and cast tables, the
tokenizer's keyword and punctuator lists, the driver's option-parsing chain
(main.c:114), the predefined macro list (preprocess.c:1060), test bodies and
the bundled headers' contents.

Serves: "how does chibicc parse/preprocess/emit X", "where is <feature>
implemented", "what C11 features are supported", "how do I build and run
the tests", and modification tasks that need the data-structure vocabulary
before touching any stage.
"""


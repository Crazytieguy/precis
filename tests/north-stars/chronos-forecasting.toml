fixture = "chronos-forecasting"
revision_pin = "f951d9ae"
summary = """
chronos-forecasting is a Python package distributing the **Chronos** family of
pretrained time-series forecasting models. Three generations co-exist:

- **Chronos** (`src/chronos/chronos.py`) — original LLM-style approach.
  `MeanScaleUniformBins` tokenizes a context tensor into discrete bins, a
  T5/GPT2 `PreTrainedModel` autoregressively samples tokens, and
  `ChronosPipeline` (`forecast_type=SAMPLES`) returns sample paths.
- **Chronos-Bolt** (`src/chronos/chronos_bolt.py`) — T5 encoder/decoder over
  patched context with a quantile head; `ChronosBoltPipeline`
  (`forecast_type=QUANTILES`).
- **Chronos-2** (`src/chronos/chronos2/`) — custom encoder with paired
  *Time*-self-attention (RoPE) and *Group*-self-attention along the batch
  axis, supporting multivariate targets, past-only and known-future
  covariates, and HF-`Trainer`-based fine-tuning via `Chronos2Pipeline.fit`.

All three subclass `BaseChronosPipeline` (`src/chronos/base.py`) which fixes
the public surface: `predict`, `predict_quantiles`, `predict_df` (pandas
long-format), `predict_fev` (fev benchmark), `from_pretrained` (HF
hub / local path / `s3://`, with optional `peft` LoRA adapters). The
`PipelineRegistry` metaclass dispatches `BaseChronosPipeline.from_pretrained`
to the right subclass based on the loaded config's `chronos_pipeline_class`.

Query distribution served: API-usage questions (forecast a DataFrame, supply
covariates, switch models), config questions (context length, quantiles,
patch size), architecture questions about Chronos-2 (RoPE, group attention,
long-horizon unrolling), tokenizer questions for original Chronos
(bucket boundaries, EOS handling), fine-tuning (LoRA, validation),
benchmark/training scripts, S3/HF loading, and pandas validation rules.
"""


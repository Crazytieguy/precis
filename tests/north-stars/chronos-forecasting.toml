fixture = "chronos-forecasting"
revision_pin = "f951d9ae"
summary = """
`chronos-forecasting` is the reference Python package for Amazon's Chronos
family of pretrained time-series forecasting models. Substance lives in
`src/chronos/`: a small abstract `BaseChronosPipeline` plus three concrete
pipeline families that all implement the same predict / predict_quantiles /
predict_df / predict_fev / from_pretrained contract — `ChronosPipeline`
(tokenize-and-sample LM), `ChronosBoltPipeline` (patched direct multi-step
quantile regression) and the flagship `Chronos2Pipeline` (multivariate +
covariate-informed, with in-package fine-tuning via `fit()`). Around that
core sit HF-transformers model/config/layer definitions for Chronos-2, a
DataFrame<->tensor adapter layer (`df_utils.py`, `chronos2/dataset.py`),
S3/CloudFront weight caching, a pytest suite exercised against dummy
checkpoints in `test/`, and standalone research scripts for pretraining,
KernelSynth data generation and benchmark evaluation under `scripts/`.

The ranking front-loads (a) what the project is and which model families it
ships, (b) the exact public symbol set and where each symbol lives, and (c)
the signatures of the user-facing prediction entry points — the content that
answers "how do I forecast with this?" with zero follow-up. It then supplies
symbol rosters for every source module so that any deeper question ("where
is RoPE implemented?", "what validates a user DataFrame?") is one grep away,
and finally covers the training/eval scripts, tests, packaging and CI.
"""


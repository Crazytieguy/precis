fixture = "clack"
revision_pin = "adb6af9f"
summary = """
Clack is a pnpm/TypeScript monorepo publishing two npm packages for
interactive terminal prompts: `@clack/core` (packages/core) — headless,
unstyled primitives built on a base `Prompt` class that wires
`node:readline` keypresses to a typed event emitter and a diff-based frame
renderer — and `@clack/prompts` (packages/prompts) — the opinionated,
pre-styled component layer most users import (`text`, `password`, `confirm`,
`date`, `select`, `autocomplete`, `multiselect`, `path`, `spinner`, `log`,
`taskLog`, `group`, ...). `examples/` holds runnable demos, both packages
carry vitest suites, releases go through changesets, builds through unbuild,
lint/format through biome.

Ranking priorities, in order: (1) the two-package split and where each
package's source lives; (2) both `index.ts` export barrels plus closed
per-symbol rosters, so no public API can be assumed absent; (3) the shared
contracts — `ClackEvents`, `PromptOptions`, the `Prompt` method roster,
`CommonOptions`, `ClackSettings`; (4) per-prompt option interfaces, rendered
as field lines with ellipses standing in for jsdoc, because "what options
does X take" is the single most common question and jsdoc is expensive;
(5) the two implementation bodies carrying the most non-obvious behaviour,
`Prompt.prompt()` and `Prompt.onKeypress`; (6) docs, tests and tooling.
Roster batches are authored closed over their class so a partial listing
never implies absence.
"""


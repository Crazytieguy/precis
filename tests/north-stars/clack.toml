fixture = "clack"
revision_pin = "adb6af9f"
summary = """
Clack is a TypeScript monorepo (pnpm workspaces) that ships two npm
packages: `@clack/core` — headless `Prompt<T>` base class + per-prompt
subclasses (text, password, confirm, select, multi-select, autocomplete,
date, multi-line, select-key, group-multiselect) plus shared utilities
(settings/aliases, cursor helpers, ansi string diff), and `@clack/prompts`
— pre-styled wrapper functions around the core primitives, with extra
output-only helpers (intro/outro, cancel, log, stream, note, box,
spinner, progress, tasks, taskLog, group). Code lives under
`packages/{core,prompts}/src/`; examples under `examples/{basic,changesets}/`.

The ranking serves the full distribution of CLI / prompts-library tasks an
agent might face: "what does prompt X do / what options does it take",
"how do I render a custom prompt by subclassing the core primitive",
"where is the keypress / state-machine logic", "where is the ANSI /
guide-bar styling defined", "how does the autocomplete filter / sliding
window work", debugging styling bugs, and adding new prompts. Breadth of
fs/signature locations is prioritised over deep bodies in early batches.
"""

# ---- Tier 1: top-of-repo orientation -----------------------------------
# What kind of repo is this, what packages does it ship, where to look.

[[batches]]
id = "1.1"
descriptor = "Clack lede — two packages + their roles"
justification = """
Two-line lede from the root README naming `@clack/prompts` (opinionated,
ready-to-use) and `@clack/core` (headless primitives). Zero-follow-up
for "what is clack".
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "README.md"
start = 9
end = 11
render = { kind = "full" }

[[batches]]
id = "1.2"
descriptor = "Repo top-level entries"
justification = """

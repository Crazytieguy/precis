fixture = "click"
revision_pin = "c943271a"
summary = """
Click 8.3.3 — the Pallets "Command Line Interface Creation Kit". A
declarative Python framework for building CLIs: decorate a function
with @click.command, declare options/arguments via further decorators,
and get a parser, help-page generator, type-conversion machinery, and
runner for free. Groups (@click.group) nest commands arbitrarily.

Query distribution this ranking serves:
- "How do I declare an option/argument with X behaviour?" — the
  decorator API in src/click/decorators.py is the highest-traffic
  surface; the docs (quickstart, options.md, parameters.md) are the
  semantic anchors.
- "What public symbols does click expose?" — answered up front by
  src/click/__init__.py's flat re-export wall.
- "How does X work internally?" — Command/Group/Context/Parameter/
  Option/Argument live in the 3500-line core.py monolith; we need
  cheap structural pointers (class headers + method signatures) so
  the agent can grep one hop.
- "How do I write a custom param type / exception?" — types.py and
  exceptions.py: shallow class trees, surface every class name.
- "How do I test a Click app?" — testing.py's CliRunner/Result.
- "What's available for terminal UI?" — termui.py: prompt, confirm,
  echo, progressbar, style/secho, edit, launch, getchar, pause.
- Examples folder (naval, repo, complex, ...) provides concrete
  patterns the docs reference; surface the layout.

Strategy: lead with README + package __init__ + identity, then the
decorator-API surface in decorators.py, then core's class skeletons
(signatures and method-name location batches as omission hedges),
then the param-type catalog and exceptions, then termui/testing/utils,
then a long tail of helper-module signatures, doc-section locations,
and the examples layout.
"""


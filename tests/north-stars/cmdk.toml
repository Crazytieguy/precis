descriptor = "filterItems(): scoring every item and deriving visible groups"
justification = "The filtering core at lines 434-470: when search is empty or shouldFilter is explicitly false every item is counted visible and each item self-renders; otherwise every registered id is re-scored into filtered.items, items with rank > 0 are counted, and a group is visible if any of its items scores above zero. Directly answers the most common bug-report class; with 4.1 and 4.2 the only unrendered lines in the 362-470 region are selectFirstItem's four-line body at 428-432, whose declaration 3.4 already located."

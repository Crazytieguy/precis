fixture = "cmdk"
revision_pin = "dd2250ed"
summary = "cmdk (⌘K) is a small, dependency-light headless React component library (pnpm monorepo: cmdk/ library, test/ Playwright harness, website/ Next.js demo site) implementing an accessible, filterable command-menu/combobox. Its defining constraint is full compound-component composability: consumers render <Command.Item>/<Command.Group> as real JSX (not data arrays or render props), and the library keeps every item mounted in the React tree while toggling DOM visibility + reordering by fuzzy-match score. The whole runtime lives in one file, cmdk/src/index.tsx (~1090 lines): a Context+external-store (useSyncExternalStore) state machine that tracks item/group registration, computes filter scores via cmdk/src/command-score.ts, sorts the live DOM via imperative appendChild reordering, and drives keyboard navigation (arrows, vim binds, Home/End, groups). Expect queries across the full range: 'how does filtering/sorting work', 'add a prop to Item', 'why is selection order X', 'how do I test a new interaction', 'how do I style a new part', 'how do I build/run this'. README.md is the authoritative prop/behavior spec (not auto-injected) and is cheaper to read than re-deriving behavior from source, so its structure and FAQ are scheduled alongside the source. Given a strict token budget relative to this repo's size, the ranking favors directory/heading/signature rosters (cheap, prevent catastrophic omission, put every location one hop away) over exhaustively rendering every file's body, reserving full-body rendering for the handful of most-asked-about chunks: the filter/sort algorithm, keyboard handling, the Item component, and the command-score weights."


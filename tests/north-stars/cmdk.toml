justification = "The least guessable part of the whole design, shown rather than gestured at: getValidItems() is sorted by descending score and each element is physically appendChild-ed back into either its group's cmdk-group-items container or the list inner element (climbing to the direct child of the group container when the item is nested deeper), then the groups themselves are re-appended in descending max-score order, closing sort() at line 426."

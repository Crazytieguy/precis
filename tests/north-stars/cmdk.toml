fixture = "cmdk"
revision_pin = "dd2250ed"
summary = """
⌘K (`cmdk`) is a React command-menu / combobox component library, published as the
npm package `cmdk` v1.1.1 from a three-package pnpm workspace: `cmdk/` (the library:
exactly two source files, `src/index.tsx` and `src/command-score.ts`), `test/` (a
Next.js app of fixture pages driven by Playwright e2e specs at `test/*.test.ts`), and
`website/` (a Next.js marketing/demo site with four themed command menus and the
drop-in stylesheets the README points users at).

The whole runtime is one 1091-line file. Its distinctive design — argued out in
ARCHITECTURE.md — is that every Item/Group stays mounted in the React tree while the
*DOM* is authoritative: items add/remove themselves from the DOM by search score,
selection is tracked by `value` (not index, because Strict Mode breaks index tracking),
and sorting is done by physically re-appending DOM nodes. So the ranking spends most of
its budget on `cmdk/src/index.tsx`: first its public shape (the `Command.*` export
object, the component roster, and the JSDoc'd props types that ARE the API reference),
then the state/context vocabulary, the filter/sort machinery rendered across lines 362-426
and 434-470 with the DOM re-append loop shown in full, and the per-component render bodies
with their `cmdk-*` data attributes (which double as the CSS styling API).

Alongside the source it buys the two documents that state what the source cannot: the
README FAQ (React 18+ required, no virtualization, `shouldFilter={false}` for manual
filtering, no RSC support, no built-in ⌘K listener) with its verbatim testing steps,
and ARCHITECTURE's rejected-API rationale.

Plausible sessions: "why isn't my item filtering?", "add a prop", "what keybindings
exist?", "how do I style X / what selector do I use?", "how is score computed?",
"add an e2e test", "run the tests", "controlled value semantics". The ranking front-loads
repo identity + build/test entry points (tier 1), then the public API surface and the FAQ
with rosters before bodies so nothing looks missing (tier 2), then the design rationale
and the store/keydown vocabulary (tier 3), then the filter/sort implementation and the
rendered markup of every part (tier 4), the scoring algorithm (tier 5), the Playwright
suite — spec titles as a behavioural contract, one spec and one fixture page rendered
whole as executable examples, and the runner and CI configs (tier 6), and finally the
website listings (tier 7). Rosters use `entries="all"` listings and name-only spans, and elided
regions carry an explicit ellipsis, so the agent never infers that an unlisted component,
prop, script, test file or page doesn't exist. Not bought here, deliberately: README prose
bodies beyond the lede, FAQ and Testing sections (the section map gives exact line ranges
for the rest), the bodies of the smaller type aliases and of Command's own setup block
(every one of them is named with its line number), the second half of the keydown switch
(its bindings are enumerated by the keybind spec titles instead), pnpm-lock.yaml, the
website's SCSS and demo bodies, and the recursive body of commandScoreInner.
"""


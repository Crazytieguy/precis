fixture = "cmdk"
revision_pin = "dd2250ed"
summary = """
cmdk is an unstyled, accessible React command-menu component library
authored by Paco (pacocoursey). The package surface is a compound
`Command` component with parts (`Command.Input`, `.List`, `.Item`,
`.Group`, `.Separator`, `.Empty`, `.Loading`, `.Dialog`) plus the
`useCommandState` hook and a `defaultFilter` export. The repo is a pnpm
workspace with three packages: the library itself (`cmdk/`), an E2E
test app of Next.js test pages driven by Playwright (`test/`), and a
showcase website with four themed demos — Raycast/Linear/Vercel/Framer
(`website/`).

Architecturally cmdk relies on the DOM as the source of truth: every
Item/Group is always rendered in the React tree but `null`s itself out
of the DOM when filtered, and selection is tracked by item value
(string) rather than index — this is why ⌘K is concurrent-mode-friendly
and survives Strict Mode double-renders. Filtering uses a fuzzy
`commandScore` algorithm with tunable scores for word jumps,
transpositions, and case mismatches.

The ranking serves the broad query distribution: API/usage questions
(README), behavior-spec questions (tests + test pages), implementation
questions on filtering/sorting/keybinds (`cmdk/src/index.tsx` +
`command-score.ts`), and theming/styling questions (the four website
demo + scss pairs).
"""


id = "5.2"
descriptor = "execute(): the ordered run pipeline"
justification = "The heart of the library and the source of most behavioural answers, with ellipses over the error-handling filler: deprecation warning; InitDefaultHelpFlag/InitDefaultVersionFlag deferred to the last possible moment for overridability; ParseFlags routed through FlagErrorFunc; the help-flag short-circuit returning flag.ErrHelp; the non-runnable short-circuit; preRun and deferred postRun; ValidateArgs against DisableFlagParsing; the parent walk that honours EnableTraverseRunHooks when choosing which PersistentPreRun fires; then PreRun, ValidateRequiredFlags and ValidateFlagGroups."

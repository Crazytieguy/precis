fixture = "cobra"
revision_pin = "ad460ea8"
summary = """
spf13/cobra: the Go library nearly every major Go CLI (kubectl, Hugo, gh, Docker
distribution, etcd, ...) is built on. Not an application -- a library whose entire
product surface is its exported API: the `Command` struct (spine of the whole
repo), package-level helpers in cobra.go, positional-arg validators in args.go,
flag-group validation, and the shell-completion/active-help/docgen subsystems
built on top. A `doc/` subpackage (separate Go package) generates man/md/rest/yaml
reference docs from a Command tree; `site/content/` holds the maintained
user-facing docs (user_guide.md is the most complete single narrative in the
repo). Query distribution: mostly "how do I use Cobra to do X" (define a command,
add a flag, validate args, add a completion, run code before/after Run) grounded
in either the struct/method signatures or the matching user_guide.md section;
occasionally "how does cobra internally resolve/execute a command" (Find/Traverse/
execute); occasionally build/test/CI/contribution questions. This NS ranks the
Command struct and its execute() lifecycle first (the load-bearing spine measured
in dependency graphs elsewhere), user_guide.md narrative next (cheapest path to
a correct usage pattern), then the supporting single-purpose files (args, flag
groups, cobra.go) each roster-then-body, then the larger completion/docgen
subsystems, then operational/repo-meta content.
"""


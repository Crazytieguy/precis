fixture = "cobra"
revision_pin = "ad460ea8"
summary = """
Cobra is a Go library for building modern subcommand-based CLI applications
(used by Kubernetes, Hugo, GitHub CLI, …). The package is dominated by one
giant `Command` struct in `command.go` whose public fields fully describe a
command (Use/Short/Long/Run/RunE/Args/PersistentPreRun…/Aliases/Annotations/
ValidArgs/CompletionOptions/Hidden/SilenceUsage/…) and whose methods make up
the tree-walking, flag-parsing, help, suggestions, completion-registration,
and template machinery. Around it sit small focused files: `args.go`
(positional-arg validators), `cobra.go` (package globals + helpers),
`flag_groups.go` (required-together / one-required / mutually-exclusive),
`shell_completions.go` (MarkFlag* annotations), `completions.go` (the
ShellCompDirective bitmask + hidden `__complete` command + the user-facing
`completion` command), per-shell generators (bash V1/V2, zsh, fish,
powershell), `active_help.go`, plus the `doc/` subpackage that renders
Markdown / ReST / man / yaml from a Command tree.

The ranking front-loads identity, the package's directory layout, and the
`Command` struct field surface (because almost every dev question resolves
to "which field on Command do I set / which method do I call"). Then come
cheap method-name indexes (Set*/Has*/Mark*/Init*/Flag*/Add*/Execute family),
args validators, package-level config knobs, the lifecycle (Execute →
execute → Find / Traverse / *Run hooks), the completion stack
(directives + public API), flag groups + MarkFlag* completion annotations,
per-shell generators, the doc/ subpackage, ActiveHelp, prose site/ guides
with section locations, and finally tests/CI listings. Catastrophic-
omission risk is high because `command.go` has ~127 methods and ~50 struct
fields, so location batches enumerate whole classes together (all *Run
hook fields, all Set*/Has*/Mark*/Init* method names, all
ShellCompDirective constants, all Gen<Shell>Completion entry points, etc.).
"""


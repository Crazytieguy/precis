fixture = "cobra"
revision_pin = "ad460ea8"
summary = """
Cobra (github.com/spf13/cobra) is a Go *library* for building git-style CLI
applications. Its substance is one flat root package `cobra` -- 14 non-test
.go files with 11 colocated *_test.go siblings -- plus a single subpackage
`doc/` that generates man / markdown / ReST / YAML pages from a command tree,
and a Hugo documentation site under site/content/. There is no binary here:
the scaffolding generator lives in the separate spf13/cobra-cli project.

Everything hangs off one type. `Command` (command.go, 2072 lines) is a
declarative struct -- Use/Short/Long, an Args validator, five pairs of *Run
hooks, a dozen behaviour toggles -- with ~98 exported methods, executed via
Execute()/ExecuteC(). The second-largest surface is shell completion:
completions.go implements the hidden `__complete` protocol and the generated
`completion` subcommand, while five per-shell files emit the actual
bash/zsh/fish/powershell scripts.

The ranking front-loads (1) what the library is and where every file lives,
including the build/test entry point, (2) the `Command` struct itself, the
most-consulted surface for nearly any question here, (3) the complete
exported method roster of `Command`, name-only and grouped by theme, (4)
navigation into the 887-line user guide plus the test harness and CI gates a
change must pass, then (5) execution semantics, (6) the command-declaration
API (arg validators, flag groups, flag markers), (7) the completion engine,
(8) the per-shell generators, (9) doc/, and (10) project policy. Rosters are
truncated at the opening paren so a whole surface costs ~10 tokens per symbol
and every name arrives with an exact line to jump to.
"""


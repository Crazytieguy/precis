fixture = "commander"
revision_pin = "82473649"
summary = """
Commander.js v14 — the node.js command-line-interface framework: a
zero-dependency CommonJS library whose whole implementation is six files
in `lib/` (Command, Option, Argument, Help, CommanderError, suggestSimilar)
re-exported by a 24-line `index.js`, with a hand-written 1113-line
`typings/index.d.ts` mirroring it for TypeScript, a 1176-line `Readme.md`
that is the primary user documentation, ~45 runnable `examples/`, and 110
jest test files (plus an ESM smoke test and a set of executable-subcommand
fixtures) in `tests/`.

The ranking front-loads (1) what the package is and what it exports, (2)
the *complete* method rosters of the six `lib/` classes — for a fluent
builder API the set of chainable method names is the single highest-value
artifact, and a partial roster would actively mislead — then (3) the
TypeScript declaration surface plus exhaustive inventories of docs,
examples and tests so any "where is X handled/tested/demonstrated"
question is one grep away, then (4) the semantics that are genuinely not
guessable from names: the parse life cycle, the `Command` instance-state
model, `parseOptions()`'s tokenizer rules, flag-string parsing, and the
help layout pipeline, and finally (5) build/tooling/meta config.

Query distribution served: "how do I declare an option that …" (Readme +
examples inventory), "why did parsing do X" (parseOptions + life cycle),
"how do I customise help output" (Help roster + help-in-depth + styling
methods), "where is this behaviour tested" (tests inventory), "what is the
TS type of …" (typings roster), and "add a feature" (constructor state +
registration paths).
"""


fixture = "commander"
revision_pin = "82473649"
summary = """
Commander.js — Node.js library for parsing CLI arguments. Public surface
is small (`Command`, `Option`, `Argument`, `Help`, `CommanderError`,
`InvalidArgumentError` plus a few factories) and exported from
`index.js`. Implementation lives in `lib/`: `command.js` is the bulk
(2.7k lines, ~80 methods on the `Command` class covering subcommand
declaration, option/argument registration, lifecycle hooks, and the
parsing pipeline); `help.js` formats help; `option.js` /
`argument.js` model individual flags and positional args; `error.js`
defines the error classes; `suggestSimilar.js` is the
"Did you mean?" Damerau-Levenshtein helper. TypeScript types live in
`typings/index.d.ts` and a comprehensive Readme.md (with deeper
dives in `docs/`) doubles as the user manual.

The ranking serves the full distribution of plausible dev tasks
against this library — debugging parser quirks, adding/removing API
methods, customising help output, writing/answering questions about
option semantics, locating a behaviour described in the README. Early
batches give breadth (top-level layout, public exports, README TOC,
class shapes); deeper batches drop into method bodies, the parsing
core, the help formatter, and per-doc/per-example locations.
"""


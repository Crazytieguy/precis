fixture = "commander"
revision_pin = "82473649"
summary = """
commander.js v14.0.3: the standard Node.js CLI-parsing library (npm 'commander').
Single-purpose package: six files under lib/ (Command, Option, Argument, Help,
error classes, and the smaller suggestSimilar typo-matching helper) exported
through index.js (CJS) and esm.mjs (ESM wrapper). Zero production dependencies.
Command extends EventEmitter and is the God-object: option/argument
registration, argv tokenizing, dispatch to subcommands or stand-alone
executables, help text generation (delegated to a separately-overridable Help
class), and error/exit handling all live on it. The query distribution spans:
explaining option/argument/help semantics to a library consumer, debugging a
parsing edge case, adding a Command/Option/Help feature, running/configuring
the jest+tsd+eslint+prettier check suite, and archaeology against documented
behavior in CHANGELOG.md. README.md and docs/*.md are the closest thing to a
spec (this is a library, not an app with a separate design doc) so they carry
real semantic weight alongside the source. Token budget here is small relative
to the ~4200-line lib/ + 1176-line README, so this NS leans on location
rosters (exact file+line for every public method) backed by a handful of
full-body excerpts for the highest-frequency debugging targets, trusting the
roster + one follow-up read for everything else — not full-body coverage.
Every span in this draft ends at a natural boundary (full file, full function/
class body, a full doc section, or a deliberately-trimmed prose chunk stopping
at a paragraph/code-fence break) — none cuts off mid-list or mid-body, so no
span carries a rendered ellipsis marker.
"""


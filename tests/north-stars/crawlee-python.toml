fixture = "crawlee-python"
revision_pin = "b3b8c59b"
summary = """
`crawlee-python` is the Python port of Crawlee: a library for building web
crawlers and scrapers that unifies plain-HTTP crawling and headless-browser
crawling behind one crawler/context/router API, with pluggable storages,
HTTP clients, sessions, proxies and autoscaling. The installable package is
`crawlee` (`src/crawlee/`, hatchling wheel from `src/`), it ships a `crawlee`
console script that scaffolds projects from cookiecutter templates, and it
carries a very large Docusaurus documentation tree (`docs/`, `website/`)
whose runnable code examples are linted as part of the repo.

The ranking assumes an agent whose harness has already injected
`AGENTS.md`/`CLAUDE.md` (identical to `GEMINI.md` and `.rules.md`): those
cover dev commands, code style, the crawler-hierarchy sketch, the key
directory list and the router idiom. So this ranking spends nothing on
re-stating them and instead front-loads what they do not give: the exact
public export rosters of every package, the constructor option set of
`BasicCrawler`, the fields of `BasicCrawlingContext` and `Request`, the
`Configuration` settings with their defaults, the storage
and storage-client method surfaces, the CLI flags, and precise file
locations for every subsystem plus the docs/tests inventories.

Ordering principle: identity and the module map first (cheapest breadth),
then the crawler layer that is the repo's substance, then storages, then
the request/session/event/HTTP services, then configuration and CLI, then
the documentation, test and CI inventories that answer "where is the guide
/ test for X".
"""


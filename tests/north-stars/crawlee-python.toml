fixture = "crawlee-python"
revision_pin = "b3b8c59b"
summary = """
crawlee-python is a Python web scraping / crawling framework: instantiate
a crawler (BeautifulSoupCrawler / ParselCrawler / PlaywrightCrawler /
HttpCrawler / Adaptive*, Stagehand*), register
`@crawler.router.default_handler` and/or labelled handlers,
`await crawler.run([urls])`. The PyPI package is `crawlee`, src layout
under `src/crawlee/`. A coding-agent session against this repo
overwhelmingly needs: (a) the user-facing crawler + context + router
shape so generated example code compiles, (b) where the heavy
`BasicCrawler` lifecycle methods live so behavioural questions
(retries, sessions, autoscaling, robots) land in the right file fast,
(c) the storage / storage-client split and the
Dataset/KVS/RequestQueue surface, (d) HTTP-client and Playwright
pluggability, (e) the docs/examples corpus that doubles as
copy-pasteable tutorial code. Ranking front-loads the README lede,
the public re-export surface, the canonical quick-start example, and
the CLAUDE.md architecture summary, then drills into BasicCrawler /
context / router / Request / Configuration. Catastrophic-omission
risk is "agent assumes a crawler type or storage backend doesn't
exist because we only listed some" — every subpackage __init__/tree
gets a locations-style batch.
"""


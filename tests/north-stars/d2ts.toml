fixture = "d2ts"
revision_pin = "418591d5"
summary = """
d2ts is a pnpm monorepo implementing differential dataflow in TypeScript: a
push-based incremental-computation engine (D2 graph + versioned MultiSet
changesets) with three published packages. `packages/d2ts` is the
full-featured engine (multi-dimensional Version/Antichain frontiers,
optional SQLite-persisted operator variants, an ElectricSQL glue layer).
`packages/d2mini` is a simplified fork with no version/frontier tracking,
for synchronous in-memory incremental view maintenance. `packages/d2ql` is
an experimental SQL-like query language compiled to a d2ts pipeline, plus a
fluent query-builder and a small reactive `Store`. Session queries span the
full range: "how do I build an incremental pipeline", "why did my join
version come out wrong", "what operators exist", "how do I add a SQLite-
backed operator", "how does D2QL compile GROUP BY", "how do I build/test/
release this", and "what's the difference between d2ts and d2mini". Given a
tight token budget, the ranking favors breadth (fs listings, signature
rosters) and short, surgical excerpts of the handful of genuinely tricky
algorithms (join/reduce versioning, partial-order frontiers) over full-body
dumps of the many structurally-identical operator files.
"""


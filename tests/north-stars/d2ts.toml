fixture = "d2ts"
revision_pin = "418591d5"
summary = """
`d2ts` is a pnpm monorepo implementing differential dataflow in TypeScript.
Four workspace packages sit under `packages/`: `@electric-sql/d2ts` (the
published library — multi-dimensional `Version`/`Antichain` frontiers, a
piped operator API, an optional SQLite state backend and an optional
ElectricSQL ShapeStream bridge), `@electric-sql/d2mini` (same operator
surface with versions and frontiers removed), `@electric-sql/d2ql`
(private; a JSON/TS SQL-like query language plus a fluent query builder
compiled down to a D2 pipeline) and `d2ts-benchmark` (private).
`examples/` is itself a workspace glob and holds runnable scripts plus a
full ElectricSQL demo app.

The ranking front-loads (a) what the project is and how the workspace is
laid out, (b) a complete file roster of every `src/` tree and the export
barrels that define each package's public surface, (c) build/test/release
entry points, then (d) the d2ts core dataflow model, (e) the operator
factory roster with its README documentation index, (f) D2QL's query
schema, (g) d2mini's deltas, (h) the SQLite/Electric backends, and
(i) the examples. Queries this must serve range from "what operators
exist / what does `frontier` mean" through "how do I add an operator" and
"how do I run the tests" to "where is the join implemented for the SQLite
backend".
"""


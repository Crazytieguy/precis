Four sentences defining the repo's hardest concept: versions are a
lattice of integers (a single int suffices for most uses, the lattice is
for multidimensional cases); frontiers are the antichain lower bound on
versions that may still arrive; `v()` is the preferred cached `Version`
factory; an `Antichain` is a set of disjoint versions. Without this an
agent cannot frame a question about `advanceBy` or `lessEqualVersion`.
"""

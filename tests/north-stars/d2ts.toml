fixture = "d2ts"
revision_pin = "418591d5"
summary = """
d2ts is a TypeScript pnpm-workspace monorepo implementing differential
dataflow for incremental view maintenance. The repo contains four
packages: `d2ts` (the full library — multidimensional `Version` /
`Antichain` frontiers, `MultiSet`, the `D2` graph builder, the
operator catalog under `src/operators/`, persistent variants under
`src/sqlite/`, and an ElectricSQL ShapeStream adapter under
`src/electric/`); `d2mini` (a slim in-memory variant without
frontiers); `d2ql` (an experimental SQL-like query language that
compiles to a d2ts pipeline + a fluent query builder + a Store
materialization layer); and `d2ts-benchmark` (a perf harness pitting
d2ts/SQLite/naive against each other). There are also worked
examples under `examples/` (basic, joins, iterate, includes,
fruit-processed, min/max, plus a `d2ql/` subdir and a full
PG+Electric integration in `electric/`).

The ranking is built for the full distribution of plausible dev
queries against this repo: explanations of differential-dataflow
concepts (versions, frontiers, multisets, the index trace structure,
how `iterate`/`reduce`/`join` actually work); pipeline-author
questions ("how do I key/join/aggregate?", "what operators are
available?", "what does `consolidate` do?"); type-system / API
discovery (`pipe` overloads, `KeyValue`, `Message`, `IStreamBuilder`);
extension / plugin work in `d2ts` (adding a new operator, hooking a
new source, persisting state via SQLite); cross-package work in
`d2ql` (compiling new SQL features, the `Query` schema, the query
builder, the `Store`); ops/CI/release questions (changesets, the CI
workflow, eslint/tsconfig). Catastrophic-omission hedges show up as
location batches: every operator file under `src/operators/`
together; the full `index.ts` re-export set; every `Select`/`Where`
field together; every aggregate function name together. Breadth is
weighted ahead of depth — a small budget should let an agent reach
the right *file* even when it can't read the body.
"""


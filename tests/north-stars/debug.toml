fixture = "debug"
revision_pin = "f405ade8"
summary = """
`debug` (npm package `debug@4.4.3`) is a small, widely-used Node/browser
logging utility: a factory `createDebug(namespace)` returns a decorated
logger gated by the `DEBUG` env var / `localStorage`, with namespace
wildcard matching, per-namespace colors, printf-style `%o/%O/%s/%d/%j`
formatters, and a `.extend()` API. The whole runtime is ~825 lines split
three ways: `src/common.js` (shared factory + enable/disable/wildcard
matching), `src/node.js` (TTY colors, stderr, process.env), `src/browser.js`
(CSS-console colors, localStorage) selected by `src/index.js` at require
time (also declared via package.json's `main`/`browser` fields for
bundlers). README.md (481 lines) is the primary source of *behavioral*
semantics (env vars, formatter table, wildcard syntax, extend/dynamic-
enable examples) that isn't restated in code comments. Plausible session
distribution: "why isn't X namespace showing output", "add a custom
formatter", "how does wildcard/extend work", "why no colors in this
environment", "run/add a test", "what does the DEBUG_* env var do",
config/build questions (there's no bundler config beyond karma+browserify,
no TS, no lint config file beyond package.json's inlined `xo` block).
"""


fixture = "debug"
revision_pin = "f405ade8"
summary = """
`debug` is a tiny JavaScript logging utility for Node.js and the
browser. The runtime concept is a `createDebug` factory that returns
namespaced logger functions, gated by a wildcard-matched `DEBUG` env
(Node) or `localStorage.debug` (browser). The package has a small,
two-pronged shape: `src/common.js` houses platform-agnostic logic
(`setup`, `createDebug`, `enable`/`disable`/`enabled`,
`matchesTemplate`, `extend`); `src/browser.js` and `src/node.js`
inject env-specific `formatArgs`/`useColors`/`save`/`load` plus the
color palette and `formatters`; `src/index.js` picks one at require
time.

The ranking serves a wide query distribution — how is `DEBUG=*,-foo`
parsed? where do ANSI escapes come from? how do `%O`/`%o` formatters
work? how is the browser/node split actually wired? — by frontloading
the dispatch entry, the public-API surface, and namespace-matching
semantics, then drilling into env-specific format/IO details and
color tables.
"""


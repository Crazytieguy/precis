fixture = "dockly"
revision_pin = "a817de79"
summary = """
Dockly is a Node.js terminal UI (TUI) for Docker, built on the
`blessed` + `blessed-contrib` widget toolkit. The runtime has three
top-level modes — containers, services, images — each rendering a
12×12 grid of widgets that observe a `dockerode` connection. The
codebase is a small plugin system: `src/screen.js` orchestrates;
`src/assetsLoader.js` glob-loads everything matching
`hooks/*.hook.js` (event emitters that pump docker data) and
`widgets/**/*.widget.js` (presentation). `src/grid.config.js`
decides which widgets land in which mode + at what grid coordinates.
Most concrete widget files are thin shells over base classes in
`src/widgetsTemplates/`.

The ranking front-loads the load-bearing conventions (assets glob,
modes, grid keys, baseWidget mixin), then surfaces complete listings
of `dockerUtil`'s methods and the toolbar key dispatch, then breadth-
hedges (full directory listings of hooks/ and widgets/). Concrete
widget bodies are mostly signature-only — the templates do the work.
Goal: an agent asked "where does pressing 'r' restart a container?"
or "where is image listing rendered?" can land in one hop.
"""


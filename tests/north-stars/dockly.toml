fixture = "dockly"
revision_pin = "a817de79"
summary = """
`dockly` is a Node.js terminal dashboard (blessed / blessed-contrib) that
manages Docker containers, services and images over the dockerode client.
It is a single global CLI binary (`index.js` -> `bin.dockly`) with no test
suite: the whole repository is runtime code plus a Gatsby marketing site
under `docs/`.

The architecture is small but indirect, and that indirection is what an
agent must not have to rediscover: `src/screen.js` owns the blessed screen
and a 12x12 grid; `src/assetsLoader.js` glob-loads `hooks/*.hook.js` and
`widgets/**/*.widget.js` by convention; `src/grid.config.js` decides which
widget names are instantiated for each of the three modes in `lib/modes.js`
(containers / services / images); `src/widgetsTemplates/*.template.js` are
abstract base classes whose unimplemented methods `throw new Error(...)`,
and the leaf files under `widgets/<mode>/` are mostly a `getLabel()` plus a
few overrides. Hooks are the data/event layer (docker polling, keypress
actions); widgets are the view layer; they talk through a shared
`widgetsRepository` Map and EventEmitter events.

The ranking therefore buys, in order: what the project is and where its
code lives (complete directory listings, so no file class looks absent);
the user-facing surfaces (CLI flags in `src/cli.js`, the runtime keybinding
table, how to build/run/lint it); the orchestration core; the dockerode
wrapper's method surface; the template/hook framework contracts; then the
concrete widgets, themes and the peripheral docs site. Symbol rosters are
ranked before bodies so that "where is X?" is one grep away, and bodies are
bought where the semantics are non-obvious (mode toggling, asset globbing,
connection/filter parsing, and shelling into a running container).
"""


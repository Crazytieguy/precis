fixture = "drizzle-orm"
revision_pin = "48e54060"
summary = """
drizzle-orm is a headless TypeScript ORM monorepo. The package layout
is the dominant fact: a core `drizzle-orm/src/` with cross-cutting
abstractions (`Table`, `Column`, `SQL` template tag, `entityKind`
runtime tagging, `relations`), three parallel SQL-dialect cores
(`pg-core/`, `mysql-core/`, `sqlite-core/`) that each ship their own
table factory + dialect + db + view + columns/ + query-builders/, a
fourth `singlestore-core/`, and ~30 sibling driver dirs
(`node-postgres/`, `postgres-js/`, `better-sqlite3/`, `mysql2/`, `d1/`,
`libsql/`, `neon-http/`, `neon-serverless/`, `planetscale-serverless/`,
`vercel-postgres/`, `bun-sqlite/`, `bun-sql/`, `xata-http/`, `gel/`,
`pglite/`, `aws-data-api/`, `expo-sqlite/`, `op-sqlite/`,
`durable-sqlite/`, `prisma/`, `supabase/`, `tidb-serverless/`,
`netlify-db/`, `sql-js/`, `knex/`, `kysely/`, plus `*-proxy/` HTTP
adapters) each exposing a `drizzle(client, config)` factory. Sibling
packages in the monorepo are `drizzle-kit` (migration CLI),
`drizzle-zod`/`drizzle-valibot`/`drizzle-typebox`/`drizzle-arktype`
(schema-to-validator converters), `drizzle-seed`, `eslint*`,
`integration-tests`, `docs/`, `changelogs/`.

The agent's job typically involves (1) finding where a given column
type / operator / dialect concept lives (very high cardinality,
location-heavy), (2) understanding the table/column/SQL abstraction
hierarchy (semantic), or (3) wiring a driver. Snapshot leans toward
breadth: directory listings + signature spans for the dialect cores,
columns dirs, query-builders, drivers, and SQL helpers — the agent
should be one read or grep away from any specific operator,
column type, dialect method, or driver factory.
"""


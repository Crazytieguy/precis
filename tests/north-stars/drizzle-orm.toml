fixture = "drizzle-orm"
revision_pin = "48e54060"
summary = """
drizzle-orm is the upstream monorepo of Drizzle: a headless, zero-dependency
TypeScript ORM (`drizzle-orm`), its migration CLI (`drizzle-kit`), schema-
validator bridges (`drizzle-zod`/`-typebox`/`-valibot`/`-arktype`), a data
seeder (`drizzle-seed`), an ESLint plugin, and a large integration-test
package, wired together as a pnpm + turbo workspace.

The substance is `drizzle-orm/src`: dialect cores (`pg-core`, `mysql-core`,
`sqlite-core`, `singlestore-core`, `gel-core`) that hold the table/column/
query-builder/dialect logic, ~30 thin driver adapters (`node-postgres`,
`neon-http`, `d1`, `bun-sqlite`, ...) that each export a `drizzle()` factory,
and a dialect-agnostic root (`table.ts`, `column.ts`, `column-builder.ts`,
`sql/`, `relations.ts`) that every dialect builds on. Every `src/**/*.ts` file
becomes a published subpath export, so the file layout *is* the public API map.

The ranking front-loads (1) what the repo is and where each package/dialect
lives, (2) the dialect-agnostic core primitives an agent must understand to
read any dialect, (3) the `sql` expression vocabulary, (4) pg-core as the
reference dialect in depth, then the other dialect cores and drivers,
drizzle-kit's CLI/config surface, the companion packages, and finally the
test/build/tooling layout. Rosters are name-only truncated spans so that
"does X exist, and where?" is answered without paying for bodies.
"""


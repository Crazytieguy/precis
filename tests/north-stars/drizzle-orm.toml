fixture = "drizzle-orm"
revision_pin = "48e54060"
summary = """
drizzle-orm is a pnpm/turbo monorepo for a TypeScript-first, zero-dependency
SQL ORM. The workspace has ~9 published packages: the core `drizzle-orm`
library (dialect-agnostic query builder + 5 dialect cores: pg/mysql/sqlite/
gel/singlestore, each fanning out to ~25 thin per-driver adapters), the
`drizzle-kit` CLI (schema diffing + migration generation), 4 schema-generator
siblings (drizzle-zod/valibot/typebox/arktype, near-identical shape),
drizzle-seed (fake-data seeding), and eslint-plugin-drizzle. Sessions on this
repo range across: adding/using a new column type or SQL operator, wiring a
new database driver, understanding the relational query API, migration/CLI
workflows, schema-generator parity across zod/valibot/typebox/arktype, and
monorepo build/test/release plumbing (turbo + pnpm workspaces). The dominant
catastrophic-omission risk here is the repo's fractal parallelism: 5 dialect
cores with identical file rosters, ~25 driver adapters with identical
4-file shape, and 4 schema-generator packages with identical 8-file shape —
showing depth for one member of any of these classes without also
establishing that the others exist (via listings) would mislead an agent
into thinking a dialect/driver/generator is unsupported.
"""


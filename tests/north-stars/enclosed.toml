fixture = "enclosed"
revision_pin = "461c3d41"
summary = """
Enclosed is an end-to-end encrypted private-notes web app, organized as a
pnpm monorepo with six packages: a SolidJS frontend (`app-client`), a
HonoJS backend with Node and Cloudflare Workers entrypoints
(`app-server`), a shared TypeScript library exposing the high-level
`createNote`/`decryptNote` API (`lib`), cross-environment crypto
primitives over SubtleCrypto and `node:crypto` (`crypto`), a citty CLI
(`cli`), and a VitePress documentation site (`docs`). The
walker-targeted query distribution is dominated by self-host /
configuration questions (env vars, Docker, Cloudflare KV), end-to-end
encryption explainers (AES-256-GCM + PBKDF2, base key in URL hash),
backend route + storage tracing, lib API consumers (CLI / app-client /
external npm users), and i18n / UI questions on the SolidJS client.
Ranking favors orientation + the public lib surface + server routing +
the env-var config schema in the early tiers, then descends into
package-internal detail.
"""


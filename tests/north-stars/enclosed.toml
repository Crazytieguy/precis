fixture = "enclosed"
revision_pin = "461c3d41"
summary = """
Enclosed ("@enclosed/*") is a pnpm-workspace TypeScript monorepo: a
minimalistic end-to-end-encrypted note/file sharing web app (like
PrivateBin/Bitwarden Send). Seven packages under packages/: `crypto`
(cross-env AES-256-GCM + PBKDF2 primitives, node:crypto vs SubtleCrypto),
`lib` (core note creation/decryption orchestration, CBOR serialization,
API client — the package README calls "the core functionalities"),
`app-server` (Hono API, pluggable storage: fs-lite/memory/Cloudflare-KV,
JWT auth, cron-based expired-note cleanup, zod+figue env-var config),
`app-client` (SolidJS UI: create/view-note pages, i18n in 17 locales,
dark mode, QR/file-attachment UX), `cli` (`enclosed create|view|config`),
`docs` (VitePress self-hosting/config/CLI guides, cross-importing
app-server's config schema to render an env-var table), and
`deploy-cloudflare` (build.sh + wrangler.toml Cloudflare Pages deploy
scripts — the README's own Project Structure prose names this as one of
its 5 highlighted packages but omits `crypto` and `docs`). Deploys as a
single Docker image (client build served as static assets by the node
server) or split across Cloudflare Pages (client+worker) / Cloudflare KV.

Query distribution this ranks for: understanding the E2E-encryption flow
(crypto+lib), adding/debugging API routes or storage drivers, adding a
config option or CLI flag, fixing a UI flow (create/view note, auth,
i18n), and operational tasks (build/test/docker/env-config). Given the
scale (7 packages, ~9k source lines) most of the tree is necessarily
surfaced only via exhaustive fs listings, name rosters, or heading
outlines — full-body rendering is reserved for the small set of files
that most directly implement the README's "How It Works" contract and
the handful of highest-traffic API/CLI entry points.
"""


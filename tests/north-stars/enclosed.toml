fixture = "enclosed"
revision_pin = "461c3d41"
summary = """
Enclosed (v1.16.0) is a pnpm-workspace monorepo for an end-to-end-encrypted
note/file sharing service: notes are encrypted in the browser (AES-256-GCM,
key derived with PBKDF2-SHA-256 from a client-generated base key plus an
optional password), the base key travels in the URL hash fragment, and the
server stores only ciphertext. Substance lives in seven packages under
`packages/`: `lib` (the `@enclosed/lib` note API), `crypto` (cross-env
primitives with separate web and node implementations), `app-server` (Hono
API that runs both on Node and on Cloudflare Workers), `app-client`
(SolidJS SPA), `cli` (citty CLI), `docs` (VitePress site) and
`deploy-cloudflare` (Pages build script).

The ranking is ordered: (1) identity, workspace shape, and how to run or
self-host it; (2) the `@enclosed/lib` + `@enclosed/crypto` core — export
surface, note-creation flow, URL scheme, algorithm constants and the
ciphertext format; (3) `app-server` — the complete HTTP endpoint set, the
middleware stack, the figue/zod config definition with every environment
variable, storage drivers and the expiry task; (4) the CLI command and
flag surface; (5) the SolidJS client — routes, runtime config, module
roster, i18n; (6) per-package scripts, CI workflows, Docker, Cloudflare
deploy and the documentation site. Directory listings use
`entries = "all"` so file-set questions need no follow-up; symbol rosters
render export lines and signature heads so "where is X?" is one grep away.
"""


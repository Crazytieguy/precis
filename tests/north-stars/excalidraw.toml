fixture = "excalidraw"
revision_pin = "f6d85bc8"
summary = """
Excalidraw is a large TypeScript/React monorepo (Yarn workspaces): a core
editor library (`packages/excalidraw`, published as `@excalidraw/excalidraw`)
built on four smaller packages (`common`, `element`, `math`, `utils`,
`fractional-indexing`), plus the hosted web app that consumes the library
(`excalidraw-app/`, excalidraw.com) with its own Firebase/IndexedDB sync and
realtime-collaboration layer. `packages/excalidraw/components/App.tsx` is a
~13k-line single class (`App`) that owns nearly all interactive editor
behavior (pointer/keyboard handling, rendering orchestration, clipboard,
cropping, frames, collaboration hooks) — most editor-behavior questions
route through it. Query distribution this NS optimizes for: (a) integrators
asking "how do I embed/configure the `<Excalidraw>` component" (props,
imperative API, actions); (b) contributors debugging/extending specific
editor features (element model, pointer/selection/binding logic, rendering,
actions); (c) contributors working on the hosted app (collab, persistence
backends); (d) operational questions (build/test/lint/CI/docker/self-host);
(e) data-format questions (the `.excalidraw` JSON schema, fractional
indexing for ordering). `CLAUDE.md` (host-injected) already covers the
high-level package map and the `yarn test:update`/`yarn fix`/`yarn
test:typecheck` workflow, so this NS spends its (tight, given the repo's
size) budget on fs breadth, exact symbol/method locations, and the handful
of semantic docs/type-shapes it does not restate, rather than re-deriving
whole file bodies wherever a location pointer is nearly as useful.
"""


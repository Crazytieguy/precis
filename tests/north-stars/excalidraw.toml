fixture = "excalidraw"
revision_pin = "f6d85bc8"
summary = """
Excalidraw is an open-source virtual hand-drawn-style whiteboard, shipped
as a React component library (`@excalidraw/excalidraw`) plus the
excalidraw.com web app that consumes it. The repo is a Yarn-workspace
monorepo: `packages/excalidraw/` holds the editor; `packages/common`,
`packages/element`, `packages/math`, `packages/utils`,
`packages/fractional-indexing` factor out core domain code;
`excalidraw-app/` is the deployable app (Firebase-backed collab,
end-to-end-encrypted share links); `examples/with-nextjs` and
`examples/with-script-in-browser` are integration recipes; `dev-docs/` is
the Docusaurus docs site.

Agent queries cluster around: integration (embed `<Excalidraw>`, props,
SSR, deep imports), editor internals (the 13kLoC `App` class in
`packages/excalidraw/components/App.tsx`, `AppState` /
`ExcalidrawProps` / `ExcalidrawImperativeAPI` in
`packages/excalidraw/types.ts`), element model (the `ExcalidrawElement`
discriminated union in `packages/element/src/types.ts`, `Scene`, `Store`,
fractional indexing for collab ordering), actions (~40 modules under
`packages/excalidraw/actions/` behind `ActionManager`), collaboration
(`excalidraw-app/collab/`, Firebase, `WS_SUBTYPES` socket protocol),
export/persistence (`data/*.ts`, `scene/export.ts`), UI (~70 components
under `packages/excalidraw/components/`, i18n + 50+ locale JSONs),
tooling (Vite, esbuild, vitest, ESLint).

The ranking prioritises: (1) root identity + monorepo shape; (2) the
published API surface in `packages/excalidraw/index.tsx`; (3) the
`ExcalidrawElement` union + `AppState` / `ExcalidrawProps` shape;
(4) the action and component catalogs as catastrophic-omission hedges;
(5) collab + app wiring; (6) constants, locales, docs. Heavy use of
single-line full-render anchors and FS listings to give a wide location
map at low cost.
"""


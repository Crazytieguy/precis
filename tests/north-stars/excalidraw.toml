fixture = "excalidraw"
revision_pin = "f6d85bc8"
summary = """
Excalidraw is a TypeScript/React monorepo for an open-source, hand-drawn
style virtual whiteboard. Two top-level deliverables live in the same
tree:

- `packages/excalidraw/` — the `@excalidraw/excalidraw` npm package
  (React `<Excalidraw />` component). Consumers embed this in their
  own apps.
- `excalidraw-app/` — the full SPA hosted at excalidraw.com, layered
  on top of the package, adding PWA, collaboration, sharing, and
  Firebase persistence.

The package is itself a monorepo: `packages/common` (constants,
colors, low-level utils), `packages/element` (the `ExcalidrawElement`
data model + element ops like binding/bounds/collision/store),
`packages/math` (geometry primitives), `packages/utils` (export
helpers), `packages/fractional-indexing` (vendored). Build is Vite
for the app, esbuild for the packages; tests run via Vitest.

Query distribution the ranking targets:
- "How do I embed Excalidraw?" — Hits at the package README,
  `packages/excalidraw/index.tsx` exports, `ExcalidrawProps` shape.
- "What does an Excalidraw element look like?" — Hits at
  `packages/element/src/types.ts` (`ExcalidrawElement` union +
  `_ExcalidrawElementBase`).
- "Where does X feature live?" — Resolved via the components/actions
  filename surface (60+ small action files; 150+ component files)
  and the package fs trees.
- "How is collaboration/persistence wired up?" — Hits at
  `excalidraw-app/` (App.tsx, collab/, data/firebase.ts).
- "What constants/keybindings exist?" — Hits at
  `packages/common/src/constants.ts` and `keys.ts`.

Catastrophic-omission concerns specific to this fixture:
- 60+ public action files in `packages/excalidraw/actions/` — listing
  some without all implies the missing ones don't exist; instead show
  the directory as an fs listing.
- 150+ entries in `packages/excalidraw/components/` — must be exposed
  as a directory listing rather than enumerated piecemeal.
- The `ExcalidrawElement` union has 9 variants; missing any from the
  union summary is misleading.
- Public exports of `packages/excalidraw/index.tsx` enumerate the
  full editor API surface; partial listing is misleading.
"""


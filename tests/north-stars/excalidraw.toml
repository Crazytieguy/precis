fixture = "excalidraw"
revision_pin = "f6d85bc8"
summary = """
Excalidraw: an open-source, hand-drawn-style infinite whiteboard, shipped
both as a React component (`@excalidraw/excalidraw`) and as the
collaborative, end-to-end-encrypted web app at excalidraw.com. The repo is
a yarn-workspaces monorepo: `packages/excalidraw` (the editor library and
its React UI), `packages/element` (the element data model plus all
geometry/binding/mutation logic over it), `packages/common`,
`packages/math`, `packages/utils`, `packages/fractional-indexing`,
`excalidraw-app` (the excalidraw.com app: collaboration, firebase,
local-first storage), `examples/`, `dev-docs/`, and `scripts/`.

The ranking front-loads (1) what the project is and where its substance
lives — monorepo map plus full directory rosters for the library, the app
and the element package; (2) the npm package's host-facing API — the
complete export block of `packages/excalidraw/index.tsx` plus complete
rosters of `ExcalidrawProps` and `ExcalidrawImperativeAPI`; (3) the element
data model in `packages/element/src/types.ts` and the source listings of the
supporting packages; (4) editor runtime architecture — the `App` class, `AppState`, the
action system, scene/renderer/store/history; (5) the excalidraw-app
collaboration + persistence layer; and (6) dev workflow: test config, every test
directory, the docs tree, the integration examples, build scripts and CI.
"""


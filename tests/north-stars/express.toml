fixture = "express"
revision_pin = "f873ac23"
summary = """
Express is a mature, unopinionated Node.js HTTP framework. Its public
surface is three prototypes — `app` (application), `req` (request),
`res` (response) — plus a `Router`/`Route` re-export and a handful of
body-parser/static middleware re-exports on the `express` function
itself. The lib is six files: `lib/express.js` (factory + exports),
`lib/application.js` (settings, mounting, routing entrypoints, render,
listen), `lib/request.js` (header / content-negotiation / proxy
methods + getters), `lib/response.js` (send/json/render/sendFile/
cookie/redirect on the response prototype), `lib/view.js` (default
`View` class with engine resolution), `lib/utils.js` (setting
compilers for etag, query parser, trust proxy).

The query distribution this ranking serves is roughly: "how do I use
res.X / req.X / app.X" (huge — most plausible question), "how does
mounting / routing / settings work internally" (lib/application.js
walkthroughs), "what does Express's view layer do" (view.js +
app.engine / res.render), and "how is feature X tested / shown in an
example" (test/* and examples/*). Because the count of public methods
is large and each one is plausibly the target, exhaustive *location
maps* of every method on each prototype rank very early — the
snapshot's chief job is to make "where does X live" trivially
answerable.

Tests are one-test-per-method (`test/res.send.js`, `test/req.is.js`,
`test/app.use.js`, …) so the test directory listing is also a
secondary public-API index. The 27 `examples/` apps are the
user-facing tutorial surface.
"""

# ============================================================
# Tier 1 — orientation: identity, entry chain, top-level shape
# ============================================================

[[batches]]
id = "1.1"
descriptor = "Top-level directory listing"
justification = """
First thing an agent needs: what's in the repo. Six lib files, an
examples/ tree, a test/ tree, the README, package.json, and the
entry index.js. Establishes that this is a Node package with all
source in lib/.
"""
[batches.content]
kind = "fs"
[[batches.content.groups]]
parent = "."
entries = ["lib", "test", "examples", "index.js", "package.json", "Readme.md", "History.md", "LICENSE", ".github", ".eslintrc.yml", ".eslintignore", ".editorconfig", ".gitignore", ".npmrc"]

[[batches]]

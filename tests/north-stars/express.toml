fixture = "express"
revision_pin = "f873ac23"
summary = """
Express 5.2.1 — the Node.js web framework. The whole shipped library is six
files under `lib/` (~2760 lines) plus a one-line `index.js` re-export; the
rest of the tree is a ~120-file mocha suite under `test/`, 25 runnable
sample apps under `examples/`, a 3887-line `History.md`, and GitHub Actions
config. Express 5 is deliberately thin: routing lives in the external
`router` package, body parsing in `body-parser`, static serving in
`serve-static`, file transfer in `send` — `lib/` is mostly the `app` /
`req` / `res` prototype surface, the settings system, request dispatch, and
view resolution.

The ranking is built for the fact that almost every question about this repo
is either "what does <some app./req./res. member> do, and where is it" or
"what happens when a request arrives". So the top of the ranking buys, in
order: repository shape and the module's export surface (`lib/express.js`),
then *complete* name rosters for all three prototypes (`app.*`, `req.*`,
`res.*`) so the agent never wrongly concludes a member is absent, then the
settings/configuration machinery (the one piece of genuinely non-obvious
semantics: `app.set`'s side effects, the `compileETag` /
`compileQueryParser` / `compileTrust` value grammars, and the `req.ip` /
`req.ips` consumers of the compiled trust-proxy predicate), then the
request-lifecycle bodies themselves (`app.handle`, `app.use`'s path
disambiguation and sub-app mounting, `res.send`, `View.prototype.lookup`),
then test + example breadth (test file names map almost 1:1 onto API
members, so the `test/` listing doubles as a "where is X tested" index),
then dependency/CI/lint operations, then the JSDoc blocks that are the
de-facto API documentation for option bags, then the pending changelog.

The `app.*` and `res.*` rosters are name-only first and refined to full
signature lines by later predecessor batches, so a small budget still gets
total breadth and a larger one gets parameter lists.
"""


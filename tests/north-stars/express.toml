# ---------------------------------------------------------------------------
# Tier 4 — the request lifecycle: what actually happens when a request arrives
# ---------------------------------------------------------------------------

[[batches]]
id = "4.1"
descriptor = "app.handle() — the per-request dispatch entry point"
predecessor = "2.8"
justification = """
The most load-bearing function in the repo for "what happens when a request
comes in": builds the `finalhandler` fallback from `env` + `logerror`, sets
`X-Powered-By` when the setting is enabled (the 3.1 default), wires the
`req.res` / `res.req` circular references, `Object.setPrototypeOf`s req and
res onto *this* app's prototypes (which is what makes a mounted app's
requests see the right augmentations), lazily creates `res.locals`, then
hands off to `this.router.handle` — the boundary where control leaves this
repo for the `router` package.
"""
content.kind = "lines"
content.spans = [
  { path = "lib/application.js", start = 152, end = 178, render.kind = "full" },
]

[[batches]]
id = "4.2"
descriptor = "app.use() — argument/path disambiguation"
predecessor = "2.8"
justification = """
How `app.use` tells `app.use(fn)`, `app.use([fn, fn])` and
`app.use(path, fn)` apart: unwrap leading arrays until a non-array is found,
treat a non-function first argument as the mount path (default `'/'`), then
`flatten` the remaining arguments into a handler list and throw
`TypeError('app.use() requires a middleware function')` if it is empty.
The second-most-asked lifecycle question after dispatch itself; the ellipsis
at 218 marks that the function body continues into 4.3.
"""
content.kind = "lines"
content.spans = [
  { path = "lib/application.js", start = 190, end = 217, render.kind = "full" },
  { path = "lib/application.js", start = 218, end = 218, render.kind = "ellipsis" },
]

[[batches]]
id = "4.3"
descriptor = "app.use() — the sub-app mounting branch"
predecessor = "4.2"
justification = """
The remainder of `app.use`, and the emitting half of the mount story: a
handler that has both `.handle` and `.set` is recognised as an Express app,
gets `mountpath` and `parent` assigned, is wrapped in `mounted_app` so
`req`/`res` prototypes are restored to the parent app once the sub-app
finishes, and then `fn.emit('mount', this)` fires the listener rendered in
3.10. Everything else just goes to `router.use(path, fn)`.
"""
content.kind = "lines"
content.spans = [
  { path = "lib/application.js", start = 219, end = 244, render.kind = "full" },
]

[[batches]]
id = "4.4"
descriptor = "res.send() body-type dispatch"
predecessor = "2.9"
justification = """
The most-called method in the framework, and the funnel every other
send-shaped helper (`json`, `jsonp`, `sendStatus`, `redirect`) ends up in.
Shows the type switch: strings default to html (or get a charset appended to
an existing Content-Type), `null` becomes empty, typed arrays become `bin`,
and every other object is delegated to `res.json` — the reason
`res.send({...})` produces JSON.
"""
content.kind = "lines"
content.spans = [
  { path = "lib/response.js", start = 126, end = 158, render.kind = "full" },
]

[[batches]]
id = "4.5"
descriptor = "View.prototype.lookup() — view file resolution"
predecessor = "2.5"
justification = """
The algorithm behind "why can't Express find my view": `this.root` is
normalised to an array (so `app.set('views', [...])` works), each root is
`resolve`d against the requested name, and `this.resolve(dir, file)` returns
the first hit. The single highest-value body in view.js and a recurring
debugging question.
"""
content.kind = "lines"
content.spans = [
  { path = "lib/view.js", start = 104, end = 123, render.kind = "full" },
]

[[batches]]

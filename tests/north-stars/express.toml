[[batches]]
id = "3.7"
descriptor = "req.ip / req.ips — the consumers of `trust proxy fn`"
predecessor = "2.4"
justification = """
Closes the trust-proxy loop that 3.3 opens and 3.6 compiles: both getters
read `this.app.get('trust proxy fn')` — the predicate `app.set('trust
proxy', …)` produced — and hand it to `proxyaddr` / `proxyaddr.all`, with
`req.ips` reversing the list to farthest→closest and popping the socket
address. This is the mechanism behind "req.ip shows the proxy's address, not
the client's", and it is why the setting exists at all. Placed here rather
than with the other bodies so the setting, its compiler and its two readers
land as one narrative.
"""
content.kind = "lines"
content.spans = [
  { path = "lib/request.js", start = 340, end = 343, render.kind = "full" },
  { path = "lib/request.js", start = 357, end = 366, render.kind = "full" },
]


justification = """
This tree is `3.2.0.dev`, mid-refactor, and the top of the changelog is the
only place that says so: Python 3.9 dropped, `__version__` removed,
`RequestContext` merged into `AppContext` with the old name a deprecated
alias, and the dispatch methods now taking `ctx: AppContext` as their first
parameter with a compatibility shim for subclasses. The ellipsis at 17 marks
the remaining 3.2 bullets and the 1665 lines of release history below them. Without this an agent
reading `Flask.__init_subclass__` (5.1) or `AppContext` (2.7) has no idea why
that machinery exists, and may write code against the pre-3.2 signatures.

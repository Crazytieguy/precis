fixture = "flask"
revision_pin = "9fcd34c9"
summary = """
Flask 3.2.0.dev — the Pallets WSGI web framework, packaged as a single flat
Python package at `src/flask/` (24 modules, ~11.5k lines) with flit, plus a
large Sphinx `docs/` tree, three runnable `examples/`, and a pytest suite in
`tests/`.

The repository's substance is the `src/flask/` package, and its shape is a
three-level class hierarchy that is *not* obvious from filenames:
`Scaffold` (`sansio/scaffold.py`) is the shared base holding the routing and
request-hook decorators; `App` (`sansio/app.py`) adds application-level
registration; `Flask` (`app.py`) adds everything that touches IO. The
`sansio/` split exists so alternative implementations (Quart) can reuse the
non-IO half — a fact stated only in `src/flask/sansio/README.md`. The same
split repeats for blueprints (`sansio/blueprints.py` -> `blueprints.py`).

Ranking priorities, in order: (1) what Flask is and the definitive public
export surface (`src/flask/__init__.py` re-exports every public name — 39
lines, ranked complete and early); (2) the class spine plus the routing /
hook decorator surface, which is what most "how do I ..." questions land on;
(3) the configuration surface — `Flask.default_config`'s 29 keys and
`Config`'s loaders — because config questions are a large share of sessions
and the key table is not derivable from anything else; (4) the `flask` CLI
and the build/test entry points; (5) per-module method and function rosters,
including the dispatch spine and the session interface; (6) the context
proxies and inventories of `docs/`, `tests/`, `examples/`, so follow-up reads
land on one file rather than a wide grep.

Symbol rosters are rendered as name-only truncated spans so that whole
classes are closed at once: showing half a decorator surface would let an
agent conclude the missing half does not exist.
"""


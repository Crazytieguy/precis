fixture = "flask"
revision_pin = "9fcd34c9"
summary = """
Flask is a small, popular WSGI Python web framework wrapping Werkzeug
(WSGI/routing) and Jinja (templating). Architecture is layered: a sansio
core (`src/flask/sansio/`) that is IO-free so alternative implementations
like Quart can reuse it, and IO-bound modules on top (`app.py`,
`testing.py`, `cli.py`, `helpers.py`, `wrappers.py`).

The `Flask` class extends `App` (sansio) extends `Scaffold` (sansio).
`Blueprint` mirrors that, also rooted at `Scaffold`. Per-request state
lives on an `AppContext` (`ctx.py`), pushed onto a `ContextVar`; the
module-level `current_app`, `request`, `session`, `g` are
`werkzeug.local.LocalProxy` over that var.

Query distribution served:
- "How do I X with Flask?" usage questions → docs/, examples/, public
  API surface in `flask/__init__.py`, and method docstrings.
- Internal mechanics — request dispatch, blueprint registration, app
  context push/pop, template loading, json/session serialization,
  CLI app discovery, config loading.
- Subclassing / extension authoring (Scaffold/App/Blueprint structure,
  signals, `JSONProvider`, `SessionInterface`).
- Tests as exemplars: `tests/test_*.py` mirrors module names 1:1.

The ranking front-loads framework identity + the `__init__.py` public
surface (the most reused fact about Flask), then walks the class
hierarchy from leaves toward IO, then dispatch internals, then docs +
test/example catalogs.
"""


descriptor = "Built-in middleware and helper constructors: complete package-level roster"
justification = """
Every exported package-level function gin offers outside gin.go,
context.go, routergroup.go and mode.go, with its file and line: the logging family
(Logger, LoggerWithFormatter, LoggerWithWriter, LoggerWithConfig,
ErrorLogger, ErrorLoggerT, DisableConsoleColor, ForceConsoleColor), the
recovery family (Recovery, CustomRecovery, RecoveryWithWriter,
CustomRecoveryWithWriter), the auth family (BasicAuth, BasicAuthForRealm,
BasicAuthForProxy), the adapters (Bind, WrapF, WrapH), `Dir` for static
serving, and the test helpers (CreateTestContext, CreateTestContextOnly).
Each family is shown whole — the `*WithWriter`/`Custom*` variants are
exactly the kind of thing an agent otherwise assumes doesn't exist — and
CreateTestContext is what almost every "how do I unit-test a gin handler"
question needs. Closed out with `IsDebugging()` and the `gin.H` map alias
— the single most-typed identifier in gin user code, and otherwise
invisible in this whole document.
"""

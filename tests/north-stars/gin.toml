justification = """
The only environment-variable configuration gin has. `EnvGinMode =
"GIN_MODE"` with DebugMode/ReleaseMode/TestMode, plus `DefaultWriter`
(os.Stdout) and `DefaultErrorWriter` (os.Stderr) which Logger, Recovery
and all debug output go through. "How do I silence gin / run it in
production / redirect its logs" is answered outright, and these three
constants are the only legal mode values (6.2 locates the setter).

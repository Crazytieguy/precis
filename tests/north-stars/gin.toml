descriptor = "Bind vs ShouldBind vs ShouldBindBodyWith: the semantic difference"
justification = """
The single highest-value prose in context.go, and the thing the 4.4
roster cannot convey: `Bind` picks the engine from method +
Content-Type and *writes a 400 and aborts* on failure; `MustBindWith` is
the general aborting form; `ShouldBind` is identical but leaves error
handling to the caller; `ShouldBindBodyWith` caches the body so it can be
re-bound into a second struct, at a performance cost. Choosing wrongly
between these is one of the most common gin bugs, so buying the doc
comments outright turns a whole query class into zero follow-ups.

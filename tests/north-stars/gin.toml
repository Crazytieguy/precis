fixture = "gin"
revision_pin = "5f4f9643"
summary = """
gin is the gin-gonic Go web framework: a thin layer on net/http that
provides routing (radix tree), middleware chains, request binding
(JSON/XML/YAML/TOML/MsgPack/Protobuf/form/header/uri), response
rendering (JSON/XML/YAML/TOML/HTML/Protobuf/MsgPack/PDF/redirect/
reader/data/SSE), and a per-request Context that aggregates almost
every handler-side API. Public surface is dominated by three types
(Engine, RouterGroup, Context) plus the binding/ and render/
subpackages. Likely agent queries: how do I register routes, define
middleware, bind a request body, render a response, customise the
Logger/Recovery, configure trusted proxies, swap the JSON codec, run
TLS/QUIC/Unix sockets, do basic auth, set/read cookies, serve static
files, stream SSE, write tests. Snapshot prioritises the high-level
package shape, the Context method index (binders, getters, renderers,
flow control), and locations for every binding/render variant — body
content is added only after the names are placed.
"""


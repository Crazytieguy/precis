fixture = "go-multierror"
revision_pin = "edef97ed"
summary = """
go-multierror (module github.com/hashicorp/go-multierror, go 1.13, zero
external deps per an empty go.sum) is a small, mature Go library exposing
one concrete type, *multierror.Error, that aggregates multiple `error`
values behind the standard `error` interface. Seven small source files
split cleanly by concern: multierror.go holds the Error type plus stdlib
errors.Is/As/Unwrap interop (via the unexported `chain` helper); append.go's
Append() is the primary construction entrypoint; group.go's Group wraps a
WaitGroup+mutex for concurrent error collection; flatten.go, prefix.go,
format.go, and sort.go are small single-purpose utilities (nested-error
flattening, per-error prefixing, custom Error()-string formatting, and
sort.Interface). Every source file has a colocated same-named `_test.go`
file that doubles as its primary usage documentation — there is no
separate examples directory. The README's opening note flags this package
as semi-legacy now that Go 1.20 ships stdlib errors.Join, and devotes a
full "Migrating to errors.Join" section to before/after code; that framing,
plus the Usage section's six worked examples, is often more directly
load-bearing for "should/how do I use this" queries than the source
itself. The likely query distribution: understanding or extending one of
the seven source files, deciding whether to adopt this vs. errors.Join,
debugging Unwrap/Is/As interop or the Group/mutex concurrency pattern,
and checking build/CI (Makefile, the multi-go-version GH Actions matrix).
"""


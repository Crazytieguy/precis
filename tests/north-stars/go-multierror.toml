fixture = "go-multierror"
revision_pin = "edef97ed"
summary = """
`hashicorp/go-multierror` is a single-package, zero-dependency Go library
(package `multierror`, module `github.com/hashicorp/go-multierror`) that
represents a list of `error` values as one `error`. Its substance is a flat
root of seven small implementation files — `multierror.go` (the `Error`
struct, its `error`/`Unwrap` methods, and the unexported `chain` type that
makes `errors.Is/As/Unwrap` work), `append.go`, `flatten.go`, `prefix.go`,
`format.go`, `group.go`, `sort.go` — each with a colocated `*_test.go`, plus
a README that is half migration guide (the package now recommends stdlib
`errors.Join`) and half usage cookbook.

The ranking front-loads (1.x) identity and the *complete* exported-symbol
roster with real signatures, since almost every plausible query ("how do I
accumulate errors", "does it support errors.As", "where is Group") is
answered by knowing which symbol lives in which file. 2.x adds the doc
comments and README recipes that carry the semantics — nil handling,
flattening on Append, the custom `ErrorFormat` hook, the errors.Join
migration. 3.x is implementation bodies (small enough to include whole),
4.x the test roster and the tests that pin observable behaviour (the exact
formatted output, the Group table), 5.x the build/CI/governance periphery.
"""


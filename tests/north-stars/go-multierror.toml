fixture = "go-multierror"
revision_pin = "edef97ed"
summary = """
Tiny Go library (~300 LOC across 8 source files) that aggregates a list
of `error` values as a single `error`. The package is named
`multierror`; the central type is `Error` (a struct with `Errors`
+ `ErrorFormat` fields). The primary entry point is `Append`, with
helpers `Flatten`, `Prefix`, `Group` (concurrent), and a default
formatter `ListFormatFunc`. The library implements stdlib
`errors.Is/As/Unwrap` semantics through an internal `chain` type and
also satisfies `sort.Interface` on `*Error`.

The README opens with a deprecation-style notice: as of Go 1.20,
stdlib `errors.Join` covers basic aggregation; this package remains
relevant for custom formatting, the `Group` pattern, and the
`Append`/`Flatten`/`Prefix` helpers. A substantial migration guide is
the first thing in the README.

Likely query distribution:
- "How do I accumulate errors?" → `Append` semantics, nil handling,
  flattening behaviour.
- "How does this play with stdlib `errors.Is/As/Unwrap`?" → quirky:
  `*Error.Unwrap` returns a `chain` slice and walks one-at-a-time,
  *not* the Go 1.20 `Unwrap() []error` shape.
- "How do I customise the format?" → `ErrorFormat` field +
  `ListFormatFunc` default.
- "How do I collect errors from goroutines?" → `Group`.
- "Should I still use this?" → README lede.
- Smaller-tail queries: `Prefix`, `Flatten`, `sort.Interface` impl,
  `ErrorOrNil`, `WrappedErrors`/errwrap compat, MPL-2.0 licence,
  CI shape, supported Go versions.

Ranking strategy: top-level FS + identity first; then breadth across
the public API surface (every public fn name in every file) so the
agent can pinpoint follow-ups; then signatures-with-doc-comments;
then the README's usage and migration sections; then key bodies
(`Append`, `Unwrap`/`chain`, `Group.Go`, `Flatten`, `Prefix`,
`ListFormatFunc`); then test inventory and remaining bodies.
"""


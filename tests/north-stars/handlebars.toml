fixture = "handlebars"
revision_pin = "3105ca73"
summary = """
Handlebars.js is the canonical implementation of the Handlebars template
language: parse a `{{...}}` template, compile it to a JavaScript function
(or a precompiled spec for runtime-only environments), then execute it
with a context. The crate splits roughly into four layers:

1. `lib/handlebars.js` (full build) and `lib/handlebars.runtime.js`
   (runtime-only): the public Handlebars object factories that wire
   together the environment, utils, helpers, decorators, and (in the
   full build) the compiler.
2. `lib/handlebars/base.js` + `lib/handlebars/runtime.js`: the
   `HandlebarsEnvironment` class (helpers / partials / decorators
   registries, version constants, revision-compat table) and the
   `template()` runtime that turns a precompiled spec into a callable
   template, plus the `container` object whose `lookupProperty` /
   `lookup` / `program` / `invokePartial` machinery is what generated
   template code calls into.
3. `lib/handlebars/helpers/` (7 built-in helpers: each, if/unless,
   with, log, lookup, helperMissing, blockHelperMissing) and
   `lib/handlebars/decorators/inline.js` — the user-visible building
   blocks of the templating language.
4. `lib/handlebars/compiler/`: a two-pass compiler. `compiler.js`
   walks the AST and emits opcodes; `javascript-compiler.js` (1208
   lines, the largest file in `lib/`) consumes those opcodes and emits
   JavaScript via `code-gen.js`. `bin/handlebars.js` + `lib/precompiler.js`
   are the CLI for precompiling `.handlebars` files to JS.

Cross-cutting concerns: `internal/proto-access.js` (prototype-pollution
mitigation), `internal/wrapHelper.js` (helper-options shim), and the
`#source-node` import map split between `source-node.node.js` (the
real `source-map` package) and `source-node.browser.js` (a minimal
stub). Type definitions live in `types/index.d.ts`; a deep `spec/`
folder holds vitest tests + the Mustache spec submodule; `tasks/`
holds release / publish scripts; root-level files include `runtime.js`
+ `runtime.d.ts` re-export shims, the README, FAQ, release-notes, and
the rspack/vitest/oxlint/eslint configs.

Query distribution to serve:
- "How does Handlebars compile / render a template?" — entry-point
  fan-out, `template()`, `compile()` / `precompile()`, opcode flow.
- "How do I register / extend helpers / partials / decorators?" —
  `HandlebarsEnvironment` registry methods, built-in helper bodies.
- "What's the built-in `if` / `each` / `with` etc. doing?" — every
  helper body is small and fits inline.
- "How does the prototype-access security work?" — proto-access.js
  and where it's wired in.
- "How do I extend the JS compiler?" — `nameLookup` / `appendToBuffer`
  / `initializeBuffer` overrides and the `compiler-api.md` doc.
- "What's the runtime-vs-compile split?" — `lib/handlebars.runtime.js`
  vs `lib/handlebars.js` and the revision-compat table.
- Tasks / release / CI plumbing, type signatures, configs, and the
  legacy-package-manager `components/` directory for the long tail.
"""


fixture = "handlebars"
revision_pin = "3105ca73"
summary = """
Handlebars.js v5.0.0-alpha.1 — the reference JavaScript implementation of the
Handlebars semantic templating language. The repository is a plain ESM npm
package: `lib/` holds all shipped source, split into a runtime half and a
compiler half that ship as two separate entry points (`handlebars` and
`handlebars/runtime`); `bin/handlebars.js` + `lib/precompiler.js` are the
`handlebars` precompiler CLI; `types/index.d.ts` is the hand-maintained
TypeScript surface; `spec/` holds the unit suite and `tests/`, `tasks/`,
`components/` hold benchmark, browser, bundler-integration and release
tooling plus legacy package-manager metadata.

The ranking runs: (1) what the project is and where its substance lives —
identity, a complete root listing and the complete lib/ tree before any
peripheral inventory; (2) the public API surface — the `lib/index.js` export
block, the `HandlebarsEnvironment` registration methods, every built-in helper
name, the version/compiler-revision constants and the TypeScript option
interfaces; (3) the compile pipeline, `compiler.js`'s AST visitor feeding
`javascript-compiler.js`'s code generator; (4) the runtime that executes a
compiled template spec, including the `container` object that generated code
calls into and the prototype-access guards; (5) the built-in helper
implementations; (6) the precompiler CLI's flag surface and the npm task
surface. Symbol rosters — one line per method, export, member or CLI flag —
are ranked ahead of the bodies they name, so any budget cut leaves the agent
with a complete inventory of a class plus exact line numbers rather than a
partial one it would mistake for whole. Elided regions are marked with
rendered ellipses rather than silently dropped.
"""


fixture = "healthchecks"
revision_pin = "ac7b523a"
summary = """
Healthchecks is a self-hosted Django web application that monitors cron jobs
and similar periodic tasks by listening for HTTP "pings". Checks that don't
ping on time raise alerts through 30+ pluggable notification integrations
(Slack, email, Telegram, PagerDuty, SMS, etc.). Built on Django 6.0,
Python 3.12+, PostgreSQL/MySQL/SQLite, organized as a `hc/` package with
sub-apps `api/`, `front/`, `accounts/`, `logs/`, `payments/`, and one
`integrations/<kind>/` package per notification transport.

The query distribution this ranking serves:
- "where does X live" navigation across a large Django codebase with sub-apps
- understanding the central data model (Check / Ping / Flip / Channel /
  Notification / TokenBucket and how they connect via the ping flow and
  alert flow)
- adding or modifying a notification integration (CONTRIBUTING.md
  explicitly outlines this workflow; integrations are highly parallel)
- configuration / env-var / self-hosting questions (a large fraction of
  this codebase is config knobs in `hc/settings.py` plus the docs in
  `templates/docs/*.md`)
- bug-fixing in views, forms, transports, management commands
- understanding the test setup (`hc/test.py` `BaseTestCase`)

Top priority is breadth — locations of every URL route, view function,
transport class, management command, and integration package — so the
agent can grep precisely. Catastrophic-omission risk is high because
the `integrations/` package has 30 highly-parallel sub-packages and
because `hc/settings.py` has many integration-toggle constants whose
absence would lead an agent to "this integration doesn't exist".
"""


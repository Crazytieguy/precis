fixture = "healthchecks"
revision_pin = "ac7b523a"
summary = """
Healthchecks is a Django 6 web application for cron-job monitoring: jobs send
HTTP or email "pings" to a per-check URL, and when a ping is late the app fans
out notifications through ~30 integration backends. The substance lives in
`hc/`: `hc/api/models.py` (Check, Ping, Channel, Notification, Flip,
TokenBucket, plus the TRANSPORTS registry), `hc/accounts/models.py` (Profile,
Project, Member, Credential), three routed apps (`hc/api` REST + ping
endpoints, `hc/front` web UI, `hc/accounts` auth/teams), one Django app per
integration under `hc/integrations/<kind>/`, shared helpers in `hc/lib/`, and
env-var configuration in `hc/settings.py`.

The ranking front-loads (1) what the project is and where its code lives,
(2) the persisted domain model and its status/ping semantics, (3) the account
/project/team model, then (4) the URL surface, which doubles as the view
roster, (5) view function rosters, (6) the integration plug-in shape and
transport base classes, (7) env-var configuration and the
operational management commands, (8) the colocated test suites, and
(9) the template roots. Peripheral material — the CHANGELOG, LICENSE,
SECURITY.md, CI workflows, `static/`, `stuff/`, and the hundreds of files
under `hc/*/migrations/` — is left to the root listing rather than ranked.
"""


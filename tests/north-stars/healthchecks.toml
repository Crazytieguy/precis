fixture = "healthchecks"
revision_pin = "ac7b523a"
summary = """
Healthchecks is a Django 6 web app + API that ingests cron-job "pings" over
HTTP and email, tracks per-Check up/down state (with cron/oncalendar/simple
schedule kinds), and fans out alerts through 30+ notification-channel
"integrations" (Slack, webhook, email, SMS/Twilio, Signal, Matrix, PagerDuty,
etc). Code is a conventional multi-app Django project (hc/accounts, hc/api,
hc/front, hc/payments, hc/logs, hc/lib, hc/integrations/<kind>) plus
Django templates, static assets, and Markdown product docs rendered at
runtime. The plausible session distribution: adding/debugging a specific
notification integration (a very uniform, well-documented recipe in
CONTRIBUTING.md), tracing the Check up/down/grace state machine, working the
ping/API endpoints, editing account/team/project flows, or adjusting
deployment config (env vars, Docker, CI). Given the repo's size (1200+
files, 30 near-identical integration packages), the ranking front-loads
cheap directory listings for breadth (every app, every integration package,
every template family), then spends the remaining budget on the handful of
files that concentrate real domain logic: the TRANSPORTS dispatch table,
the Check state machine, and the alert fan-out rule, rather than on
exhaustive per-file deep dives.
"""


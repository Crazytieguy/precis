fixture = "helm"
revision_pin = "b2786f15"
summary = """
Helm v4 — the Kubernetes package manager, a Go monorepo housing both
the `helm` CLI and the `helm.sh/helm/v4` Go SDK. The codebase is
large (≈14k lines in `pkg/action/` alone, ≈17k lines under
`pkg/cmd/`) so this NS optimizes for orientation + precise pointers
over verbatim content: the agent needs to know *which* package owns
*which* concern (CLI plumbing vs. action SDK vs. data model vs. k8s
infra), the directory split conventions (`pkg/` public, `internal/`
private; `chart/v2` stable vs. `internal/chart/v3` next-gen;
`release/v1` vs. `release/v2`), and the per-package signature shape so
follow-up reads land in one hop. Query distribution we serve:
"where is the install flow implemented", "how do I add a new flag to
`helm install`", "what fields does `Chart.Metadata` carry",
"how does the storage driver interface look", "what hook events exist",
"how does the post-renderer integrate", "Cobra command wiring", etc.
"""


fixture = "helm"
revision_pin = "b2786f15"
summary = """
Helm is the package manager for Kubernetes, written in Go. The repository
is a large, mature CLI + SDK split: `cmd/helm` is the binary entry point
that wires everything to `pkg/cmd` (cobra commands), which in turn calls
high-level operations in `pkg/action` (Install/Upgrade/Rollback/etc.).
The SDK packages under `pkg/` form Helm's public API surface — actions,
chart format (`chart/v2`), template engine, kube client, release type,
storage drivers (configmap/secret/memory/sql), repo, registry (OCI). The
v4 codebase carries a v3-compatible chart format (`pkg/chart/v2`) plus
an in-development v3 format (`internal/chart/v3`); release types live
in `pkg/release/v1` with a parallel `internal/release/v2`. Cross-cutting
concerns: the cobra subcommand tree rooted in `pkg/cmd/root.go`, Helm's
extensive environment-variable contract for cache/config paths, and the
extism + subprocess plugin runtimes under `internal/plugin`.

Plausible queries span: how does a particular CLI subcommand get wired
(cmd dispatch and flags), how does install/upgrade actually work
(action pipeline, hooks, CRDs, post-renderers, kube apply, waiters),
where does a chart get loaded/rendered (loader + engine), what's the
Release shape and how is it stored, how do I add a plugin, and the
v3-vs-v4/chart-v2-vs-v3 split. Breadth across `pkg/action`, `pkg/cmd`,
and `pkg/chart` is more useful than depth in any single subsystem.

Note: top-level AGENTS.md is host-auto-injected and already in context,
so this NS does not pull any line ranges from it.
"""


fixture = "helm"
revision_pin = "b2786f15"
summary = """
Helm v4 (helm.sh/helm/v4) — the Kubernetes package manager, a Go monorepo
with a Cobra CLI (`cmd/helm` -> `pkg/cmd`) layered over a public SDK
(`pkg/action`, `pkg/chart`, `pkg/release`, `pkg/kube`, `pkg/engine`,
`pkg/storage`, `pkg/repo`, `pkg/registry`) plus a private `internal/`
half holding the next-gen chart v3 format, the plugin runtime and misc
utilities.

The ranking assumes the agent has already been handed `AGENTS.md`
(package map, make targets, compat rules, key patterns), so it spends
almost nothing re-stating that prose and instead buys what AGENTS.md
cannot give: exact file/line locations, complete rosters (every action
type, every constructor, every `Run` entry point, every registered
subcommand, every `EnvSettings` field, every make target), and the shape
of the interfaces that everything else is written against.

Order: repository identity and the top-level directory map first; then
the CLI surface (subcommand roster + env/settings) because the largest
share of plausible sessions start from a `helm <verb>` behaviour; then
the action layer, which is where CLI and SDK meet; then the core domain
interfaces (chart / release / kube / storage / getter) that make the
rest of the tree legible; then supporting subsystems (registry, repo,
downloader, provenance, plugins, values parsing); and finally the
development/meta surface (the complete make-target roster, CI workflows,
scripts and testdata).
"""


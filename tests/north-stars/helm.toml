fixture = "helm"
revision_pin = "b2786f15"
summary = """
Helm (helm.sh/helm/v4) is the Kubernetes package manager: a Go CLI (cmd/helm ->
pkg/cmd) plus an embeddable SDK (pkg/action orchestrating pkg/chart, pkg/engine,
pkg/kube, pkg/registry, pkg/storage) for installing/upgrading/templating charts.
AGENTS.md already covers the architecture overview, make targets, package map,
compatibility rules, and branching model (main=v4 dev, dev-v3=v3 stable) — this
NS deliberately buys the complement: exact file/package rosters (catastrophic-
omission hedges for the ~530 Go files across cmd/pkg/internal), concrete type
shapes with line coordinates (Configuration, Chart, Release, Install/Upgrade
flags, kube.Interface, storage.Driver), the actual CLI command roster wired in
root.go, the chart-authoring scaffold `helm create` embeds, a canonical values
sample and rendering example, the v4-era plugin system (WASM/extism runtime),
and the OCI registry / getter / repo-index plumbing. Query distribution served:
explaining chart/release/action concepts, adding a CLI subcommand or template
func, debugging install/upgrade/render, writing or invoking a plugin, working
with storage backends or OCI push/pull, and build/test/CI operational tasks.
Ellipsis markers throughout signal deliberately-elided tails of larger enums/
structs/templates — the surrounding batch names the file:line to read on for
the rest.
"""


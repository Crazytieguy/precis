fixture = "htmy"
revision_pin = "4694fb86"
summary = """
htmy is a small (~3.2k line), pure-Python, async-first server-side rendering / component library (React/JSX-like, but with zero custom syntax): any object with a sync or async htmy(context) -> Component method is a component; strings and lists/tuples of components are components too. Core axes an agent's session is likely to probe: (1) the component/context protocols (htmy/typing.py, htmy/core.py) and the @component function-component decorators (htmy/function_component.py); (2) the Tag/TagWithProps machinery that generates the ~80 built-in HTML tags in htmy/html.py; (3) two interchangeable renderer implementations (htmy/renderer/default.py, the optimized default, vs. baseline.py, the simple recursive reference/streaming impl) unified behind RendererType; (4) feature components layered on top: ErrorBoundary, Snippet/Slots (text+slot templating), htmy.md (Markdown via the `markdown` package), etree.ETreeConverter (XML/HTML string -> component tree), and htmy.i18n (async JSON translations). The `examples/` tree has four small, runnable FastAPI/plain-asyncio demos that exercise these features end-to-end; `tests/` is a pytest suite (pytest-asyncio, random order) that doubles as executable usage documentation, including a three-way default/baseline/streaming renderer-equivalence check. Build/lint/test is uv + poethepoet + ruff + mypy + pytest; docs are built with zensical + mkdocstrings. Given a tight token budget for an 84-file repo, the ranking favors small dense protocol/utility files, treats htmy/html.py's ~80 mechanical tag declarations as a cheap name-only roster (its docstrings are ~100% identical MDN-link boilerplate), trims larger implementation files down to signatures + the few lines that carry real logic, and prefers runnable example/test code over the markdown prose that narrates it near-verbatim.
"""


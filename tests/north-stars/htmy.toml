fixture = "htmy"
revision_pin = "4694fb86"
summary = """
htmy is an async, pure-Python server-side HTML/XML rendering engine.
The library is built on a small protocol — any object with a sync or
async `htmy(context: Context) -> Component` method is a component —
and ships a rich set of built-in helpers around it: a `Renderer` (and
a streaming/baseline alternative), all baseline HTML tags, function-
component decorators, `Snippet`/`Slots` for native HTML/XML templates,
`md.MD` for markdown, `I18n` for JSON-based translations,
`ErrorBoundary` for graceful failure, an `ETreeConverter` for XML →
components, and a `Formatter` that turns Python kwargs into HTML
attributes (snake_case → kebab-case, etc.).

Likely sessions: building components and pages with htmy or with
fasthx + FastAPI; integrating snippet/markdown/i18n; debugging
rendering / context propagation / formatting edge cases; subclassing
or replacing the renderer or the formatter; understanding the public
type vocabulary; writing tests against the three renderer flavours.
The ranking front-loads the "what is the public surface and how do I
use it" picture (concept lede + public exports + tag inventory),
then pivots to per-feature mechanics, then to implementation bodies
and tests."""


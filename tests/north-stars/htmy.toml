fixture = "htmy"
revision_pin = "4694fb86"
summary = """
`htmy` is an async, pure-Python server-side rendering engine: a Jinja
alternative in which HTML is written as Python objects and functions rather
than in a template language. The whole library is one small package
(`htmy/`, ~2.4k lines across 12 modules plus the `renderer/` and `md/`
subpackages) organised around three protocols in `htmy/typing.py`: an object
is a component if it has `htmy(context) -> Component`, a context provider if
it has `htmy_context()`, and a renderer if it has `render()`. Everything
else -- the `html` tag set, `Snippet`/`Slots`, `MD`, `I18n`, `ErrorBoundary`,
`Formatter` -- is built on those, and the public surface is one explicit
re-export block in `htmy/__init__.py`.

The ranking is built for the full spread of session-opening queries against
a library like this. It leads with identity, the repository's shape, and the
*complete* export block, because "what can I import" is the single most
common thing a caller needs and a partial answer is actively misleading.
It then buys semantic prose that is not recoverable from signatures (what a
component is, the attribute-name conversion rules, the XSS caveats), the
build/test entry points (`poe` tasks and the dependency set), the type
vocabulary, and the two renderer implementations and how they differ.
Deeper tiers close each class systematically: every symbol in `core.py`,
every built-in component module, then the full roster of ~130 tag constants
in `html.py`, then tests, examples, docs and CI. Line-level rosters are
preferred over sampled bodies so a follow-up read lands in one hop.

Note that `docs/index.md` is a near-verbatim copy of `README.md` (they differ
only in link forms and one extra README section), so this ranking buys the
README once and never re-buys the same prose from `docs/`.
"""


fixture = "htop"
revision_pin = "b7f9df97"

summary = """
htop is a cross-platform interactive process viewer in C99 (~22k LOC
at the root, plus per-OS subdirectories). The codebase uses a hand-
rolled OOP idiom: a base Object with a virtual-method table, from
which Row descends (then Process), and which Panel and Meter also
extend. A thin htop.c calls CommandLine_run, which sets up Machine/
Settings/Header/MainPanel/ScreenManager and drives the input/recalc/
redraw loop. Each supported OS ships Platform.[ch] plus
<P>Machine.[ch], <P>Process.[ch], <P>ProcessTable.[ch] under its own
subdirectory (linux/, darwin/, freebsd/, netbsd/, openbsd/,
dragonflybsd/, solaris/, pcp/, unsupported/), with shared helpers in
generic/ and zfs/. Action.c owns a single key→handler lookup table
(Action_setBindings) that any key-binding query resolves against.
Settings persists in ~/.config/htop/htoprc, parsed by a long
key=value chain in Settings_read.

Query distribution: "what is htop / where does main start", "what's
the OOP backbone, what does Object/Row/Process/Meter/Panel look like",
"what keys does htop handle and where", "what's the contract each
platform port must implement", "what htoprc keys are persisted",
"where does Process_writeField / Meter draw mode / Settings_read /
Action_setBindings live", "what build flags exist", "how do PCP
dynamic columns/meters/screens get configured". Early tiers ground
the agent in the file tree and OOP spine; later tiers fan out into
the Action keymap and docs section headings.
"""


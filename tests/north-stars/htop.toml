fixture = "htop"
revision_pin = "b7f9df97"
summary = """
htop is a cross-platform interactive process viewer written in C99, laid
out as one large flat root of ~140 CamelCase `.c`/`.h` modules plus one
directory per supported platform (`linux/`, `darwin/`, `freebsd/`,
`netbsd/`, `openbsd/`, `dragonflybsd/`, `solaris/`, `pcp/`,
`unsupported/`) and shared helpers in `generic/` and `zfs/`. Because the
substance is a flat directory, the ranking first partitions that root
into semantic groups (core data model; entry points and runtime/UI core;
meters; panels and screens; utility infrastructure; docs/build/meta;
subdirectories) so that a reader learns which types exist before learning
where the platform variants live.

The repo ships an AGENTS.md (auto-loaded by the harness, so no batch
takes body lines from it) that already narrates the build commands, the
code style and the Object -> Row -> Process / Panel / Meter hierarchy in
prose. This ranking therefore buys the complement: exact declarations
with line coordinates (Object/Row/Table/ProcessTable/Machine/Process/
Panel/Meter/Settings structs and their vtable class structs), the two
user-facing surfaces that no prose covers - the complete key-binding
table in `Action.c` and the `--help` text in `CommandLine.c`, each bought
exactly once - a real `htoprc` sample as the config-format evidence, the
enum tables that config values are drawn from (RowField, MeterMode,
HeaderLayout, ColorScheme), the operational surface (Makefile.am
conditionals, configure.ac option roster, CI job roster, TESTPLAN /
test_spec.lua), the platform contract (`Platform.h` symbols, the meter
registry array), the pcp dynamic-definition config samples, and finally
the supporting container/string/curses APIs.
"""


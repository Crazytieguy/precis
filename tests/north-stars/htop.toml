fixture = "htop"
revision_pin = "b7f9df97"
summary = """
htop is a cross-platform interactive process viewer in C99 using an
object-oriented C pattern with virtual method tables. The codebase is
roughly three layers: a small reusable OOP core (Object/Row/Process,
Panel, Meter, Vector/Hashtable) at the top of the source tree; a
platform-abstraction layer with one directory per OS (linux/, darwin/,
freebsd/, netbsd/, openbsd/, dragonflybsd/, solaris/, pcp/, plus
unsupported/) that each ship Platform.[ch] + <P>Machine + <P>Process +
<P>ProcessTable; and a wide set of concrete UI panels, screens, and
meters at the top level. Entry is a one-line htop.c that calls
CommandLine_run() in CommandLine.c; the inner loop lives in
ScreenManager_run() and dispatches keys through a per-MainPanel
Htop_Action table set up by Action_setBindings() in Action.c.

The query distribution this ranking serves: agents asking "where is
the keybinding for X / where is action Y handled", "how do I add a
meter / column / screen", "what's the platform interface a new OS port
needs to provide", "how is htoprc parsed", "what's the OOP idiom and
what's a class struct", "what build flags exist", plus debugging
journeys that need a precise filepath:line entry point. Early batches
favour the top-level orientation files (README, AGENTS.md/CLAUDE.md
architecture section, key entry points and class structures); platform
breadth comes next because a port-specific question is otherwise an
expensive hunt; the Action keymap and the central enums get their own
batches because they are pure index data; per-file body content is
deferred to late batches because most agent questions can be answered
from structural pointers + one targeted read.
"""


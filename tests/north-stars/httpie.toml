fixture = "httpie"
revision_pin = "5b604c37"
summary = """
HTTPie 3.2.4 — a Python command-line HTTP client. Two user-facing
binaries (`http`/`https`) plus a third (`httpie`) for managing
plugins and sessions. Single source package `httpie/` with ~9.8k
LoC across a handful of clearly named sub-packages: `cli/`
(argparse-based declarative parser + key=value request-item syntax
+ nested-JSON DSL), `output/` (write/stream/format/colorize
pipeline + Rich-based help UI), `plugins/` (Auth/Transport/
Converter/Formatter plugin types, with builtin Basic/Digest/Bearer
auth), `manager/` (the `httpie` admin CLI), `internal/` (background
update-check daemon), `legacy/` (session-format migrations).
Top-level glue: `core.py` (main/raw_main/program loop),
`client.py` (collect_messages — drives `requests`), `models.py`
(HTTPRequest/HTTPResponse wrappers), `context.py` (Environment),
`config.py`, `sessions.py`, `downloads.py`, `uploads.py`,
`status.py` (ExitStatus enum). Ranking serves a broad mix of dev
queries: tracing the request lifecycle, finding the option/flag
that drives a behavior, modifying parsing or output formatting,
extending via a plugin, fixing a bug in session/download/upload
paths. The CLI parser is unusually large (`cli/definition.py` is
~960 lines of declarative ParserSpec) so its surface is split
heavily into the ranking.
"""


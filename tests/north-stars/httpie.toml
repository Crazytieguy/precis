fixture = "httpie"
revision_pin = "5b604c37"
summary = """
HTTPie CLI: a human-friendly command-line HTTP client. One installable distribution shipping two programs -- `http`/`https` (build and send a request, pretty-print the exchange) and `httpie` (a manager for plugins and stored sessions). The substance lives in one package: core.py drives invoke -> parse -> send -> write; cli/ turns the declarative ParserSpec in cli/definition.py into argparse, JSON and man pages; client.py builds the requests.Session; output/ formats and colours the exchange through pluggable formatters and Pygments lexers; and plugins/, manager/, internal/ and legacy/ carry the extension, management, update-check and session-migration surfaces. The ranking leads with repository identity and a complete map of the package tree, then the runtime spine from entry point to exit status, then the CLI's flag and request-item surface (the artifact most queries are about), then the argument-parsing internals, the send and output pipelines, the plugin and manager subsystems, and finally the test suite, docs tree and dev workflow. Filesystem listings are exhaustive and symbol batches are whole-file rosters so that no class of module, flag, exit code or separator ever appears partially.
"""


fixture = "hyperfine"
revision_pin = "f12f3d9f"
summary = """
hyperfine is a command-line benchmarking tool written in Rust. The crate
builds a single binary `hyperfine` (src/main.rs) that:

  1. Parses CLI flags via clap (src/cli.rs::build_command).
  2. Builds three top-level inputs: `Options` (src/options.rs), `Commands`
     (src/command.rs), and `ExportManager` (src/export/mod.rs).
  3. Drives a `Scheduler` (src/benchmark/scheduler.rs) that calibrates an
     `Executor` (Raw / Shell / Mock; src/benchmark/executor.rs) then runs
     each `Benchmark` (src/benchmark/mod.rs::Benchmark::run) — performing
     warmup, optional --prepare, the timed run, optional --conclude, and
     final --cleanup; computing mean/stddev/median/min/max; flagging fast
     execution / non-zero exit / outliers via modified Z-scores
     (src/outlier_detection.rs).
  4. Prints a relative-speed comparison
     (src/benchmark/relative_speed.rs) and writes results to any
     requested CSV/JSON/Markdown/AsciiDoc/Orgmode exports
     (src/export/*.rs; markup formats share src/export/markup.rs).

Cross-cutting modules: src/parameter/ (parameter scans/lists, ranges,
tokenization), src/timer/ (wall-clock + per-OS CPU/memory timers),
src/util/units.rs (Second/Unit), src/util/exit_code.rs, src/output/ (CLI
formatting helpers, warnings prose, indicatif progress bar).

Query distribution served: "how does hyperfine decide N runs?",
"where is the warmup loop?", "how is shell spawning time subtracted?",
"how do --parameter-list / --parameter-scan expand into benchmarks?",
"how is each export format implemented?", "what fields land in the
JSON?", "what triggers an outlier warning?", "how do platform-specific
CPU timers work?", "what flags does the CLI accept?", "where is X
configured / defaulted?", plus general orientation queries.
"""


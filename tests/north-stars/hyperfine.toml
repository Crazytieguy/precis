fixture = "hyperfine"
revision_pin = "f12f3d9f"
summary = """
`hyperfine` 1.20.0 (sharkdp) is a single-binary Rust CLI that benchmarks shell
commands: it runs each command N times, corrects for shell spawning overhead,
computes mean/stddev/median/min/max plus modified-Z-score outlier detection,
prints a relative-speed comparison, and exports results as CSV/JSON/Markdown/
AsciiDoc/org-mode. Substance lives under `src/` in a real module hierarchy
(`benchmark/`, `export/`, `output/`, `parameter/`, `timer/`, `util/`) plus four
flat top-level modules (`cli`, `command`, `options`, `error`).

The ranking is built around what a session actually asks for. First: what the
crate is, the complete filesystem shape, and the `run()` pipeline in
`src/main.rs` that wires cli -> Options/Commands/ExportManager -> Scheduler.
Second: the CLI contract -- the complete 32-option roster in `src/cli.rs` with
short aliases and enumerated value sets, because the user-visible surface is
what most questions are phrased in. Third: the configuration model in
`src/options.rs` (the option enums, the `Options` struct, its concrete
defaults) and the two error enums whose messages are the user-facing
diagnostics. Fourth: the measurement engine (`Scheduler`, the `Executor` trait
and its Raw/Shell/Mock implementations, `Benchmark::run`, the timers) together
with the `BenchmarkResult` field set that doubles as the documented JSON export
schema. Then the exporter surface, then command/parameter construction, then
the test suites and the build/CI/scripts operational layer.

Deliberate non-duplication: `doc/hyperfine.1` restates the clap help text, so
the option surface is bought once from `src/cli.rs` (the source of truth) and
the manpage is only named in a listing. The long clap help paragraphs are
likewise not re-bought where `src/options.rs` encodes the same semantics in
doc-commented enum variants at a fraction of the cost. `README.md`'s twenty
distribution-specific install snippets and the badge wall are appendix
material and are not scheduled at all.
"""


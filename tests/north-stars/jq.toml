fixture = "jq"
revision_pin = "f58787c4"
summary = """
jq is a portable C command-line JSON processor with a small embeddable
library (libjq) at its core. A jq program is a pipeline of filters,
parsed by Bison/Flex from `src/parser.y` + `src/lexer.l`, compiled to
bytecode by `src/compile.c`, and interpreted by the stack VM in
`src/execute.c`. Values are the immutable refcounted `jv` type defined
in `src/jv.h` and implemented in `src/jv.c`. Builtins are split across
C functions registered in a `function_list[]` table near the bottom of
`src/builtin.c` and a jq-coded prelude `src/builtin.jq` (embedded at
build time via `builtin.inc`). The CLI entry point is `src/main.c`.
Tasks span the full distribution: extending the filter language,
adding builtins, debugging compiler/VM behavior, fixing CLI flag
handling, navigating the manual, and understanding the build (autotools
+ Bison/Flex codegen).
"""


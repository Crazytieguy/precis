fixture = "jq"
revision_pin = "f58787c4"
summary = """
jq is a command-line JSON processor written in portable C, shipped as both a
binary (`src/main.c`) and an embeddable library `libjq` whose entire public
surface is two headers: `src/jq.h` (compile/run a jq program) and `src/jv.h`
(the refcounted JSON value type). Everything else in the flat `src/` directory
is one pipeline: flex lexer + bison parser (`lexer.l` / `parser.y`, with the
generated `lexer.c` / `parser.c` checked in) -> `compile.c` block IR ->
`bytecode.h` / `opcode_list.h` instruction set -> `execute.c`, a backtracking
VM whose `jq_next()` is a giant opcode switch; builtins are half C
(`builtin.c`'s `function_list`) and half jq source (`builtin.jq`); modules are
resolved by `linker.c`; values live in `jv*.c`. Build is autotools
(`configure.ac` + `Makefile.am`), tests are shell drivers over `.test` data
files run through `jq --run-tests`, and the manual/manpage/website are
generated from `docs/content/manual/dev/manual.yml`.

The ranking is ordered for a session that could ask anything: identity and the
file map first, then the two public headers (the surface an embedder or a
builtin author touches), then the CLI/build/test operational surface, then the
compiler/VM spine, then value-representation internals and the docs pipeline.
Rosters are kept closed - every entry of a listed directory, every CFUNC in
`function_list`, every `def` in `builtin.jq`, every opcode - so absence in the
snapshot can be trusted as absence in the tree.
"""


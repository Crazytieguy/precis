descriptor = "normalized-adapter.ts — RawData type + class shape"
justification = "RawData is the on-disk lowdb shape (allows `$schema` string + other `Item | Item[]`), Data is the in-memory shape (no `$schema`). The Normalized adapter strips `$schema` on read, coerces numeric `id`s to strings, fills missing ids via `randomId()`, and re-injects `$schema` on write. The id-normalization invariant the v1 migration notes promise."

fixture = "json-server"
revision_pin = "89a34a44"
summary = """
json-server v1 (beta): a CLI that turns a `db.json` / `db.json5` file into a
full REST API. `src/bin.ts` is the executable — it parses args, wraps a lowdb
`JSONFile`/`DataFile` adapter in `NormalizedAdapter` (id coercion, `$schema`
stripping) and `Observer` (read/write hooks used for file watching), then hands
the `Low<Data>` to `createApp` in `src/app.ts`. `app.ts` mounts a tinyhttp app:
sirv static serving, CORS, milliparsec JSON body parsing, an Eta-rendered index
page (`views/index.html`), and the `/:name` + `/:name/:id` REST routes, which
delegate to the `Service` class in `src/service.ts`. `Service` holds the data
semantics: `_embed` relation expansion, sort (sort-on), pagination
(`src/paginate.ts`), filtering (`src/matches-where.ts` over the where-tree
produced by `src/parse-where.ts` from `field:operator=value` query strings,
with the operator vocabulary in `src/where-operators.ts`), foreign-key
nullification and `_dependent` cascade deletes.

The ranking front-loads (a) what the project is and how you run it, (b) the
user-facing HTTP/CLI contract that `README.md` documents and that most feature
and bug questions are phrased in terms of, then (c) a complete roster of every
module-level function, exported type and `Service` method across `src/` so the
agent can name and locate anything before reading it, then (d) the bodies of
the query/pagination/persistence logic where behaviour actually lives, and
finally the test-name roster, build config, example databases and the Eta view.
CI and license text are named in the listings but not rendered. Expected queries
span "how do I filter/sort/paginate", "what happens on DELETE with _dependent",
"where is the id generated", "add a new query operator", "why does this route
404", and "how do I run the tests".
"""


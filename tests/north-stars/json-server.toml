fixture = "json-server"
revision_pin = "89a34a44"
summary = """
json-server v1.0.0-beta.15: a zero-backend REST API mock server. A single TypeScript
source tree (src/, thirteen .ts files plus src/adapters/'s three) implements: CLI arg parsing
(bin.ts) that loads a db.json/db.json5 file into a lowdb store, wrapped by a
NormalizedAdapter (strips the $schema key, coerces/generates string ids) and an
Observer (read/write hooks used for console logging and chokidar-driven reload);
an app.ts tinyhttp HTTP layer exposing REST routes per top-level db key (array
resources vs singular object resources) with CORS, static file serving
(public/ plus --static dirs), and an eta-rendered index page (views/index.html);
and a Service class implementing find/findById (filtering via parse-where.ts +
matches-where.ts's operator DSL: eq/ne/lt/lte/gt/gte/in/contains/startsWith/
endsWith, an `or` combinator, embed, and a raw-JSON `_where` override), sort,
paginate.ts pagination, and mutation methods (create/update/patch/destroy, with
foreign-key nullification and `_dependent` cascading delete). Six of the ten
implementation files have a colocated *.test.ts (node:test) — bin.ts,
observer.ts, random-id.ts, and where-operators.ts are untested; the
matches-where/parse-where test files double as executable specs for the query
DSL and its legacy underscore-operator compatibility mode. Expected query
distribution: the query/filter/sort/
pagination/embed API surface (README + parse-where/matches-where), CLI flags and
static-file config, the db.json/db.json5 data shape, extending routes or adding
a where-operator, debugging a specific route's status code, and the
build/lint/test/CI pipeline (tsc, oxlint, oxfmt, GH Actions, husky pre-commit).
No batch below uses an ellipsis marker: every multi-line span was checked
against its source file and lands on a natural syntactic boundary (file end,
a function/type/class closing brace, or a markdown list/table/fence close)
rather than cutting off mid-construct.
"""


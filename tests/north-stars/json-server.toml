fixture = "json-server"
revision_pin = "89a34a44"
summary = """
json-server v1 beta: a TypeScript Node CLI that turns a `db.json`/`db.json5`
file into a REST API backed by lowdb + tinyhttp. The repo is small (~1.5k SLOC
across ~10 source files) and structured by concern: `bin.ts` is the CLI entry,
`app.ts` builds the HTTP routes via `createApp`, `service.ts` holds the
`Service` class (CRUD over an in-memory `Data` map), `parse-where.ts` /
`matches-where.ts` / `where-operators.ts` implement an operator-based query
language (`field:op=value`), `paginate.ts` formats list responses, and
`adapters/` plugs lowdb into normalized read/write with observer hooks for
live reload. The ranking serves the spread of tasks an agent might face:
adding/changing routes, extending operators, adjusting CRUD semantics,
debugging response shapes, tweaking CLI flags, wiring tests, or just
understanding what the project is. Breadth (Service signatures, route table,
operator list, response shapes) outranks deep dives into any one body —
those land later in narrower batches.
"""


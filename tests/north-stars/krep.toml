fixture = "krep"
revision_pin = "ae96fbd2"
summary = """
krep is a single-binary C CLI that searches text files/directories for
patterns very fast. It picks among multiple search algorithms (Boyer-
Moore-Horspool, KMP, memchr, Aho-Corasick for multi-pattern, POSIX
regex) and switches in SIMD acceleration (SSE4.2 / AVX2 / AVX-512 /
NEON) when the host supports it. The repo is essentially flat: two C
source files (`krep.c` ~5300 lines, `aho_corasick.c` ~470 lines), two
headers, a `Makefile`, a README, and a `test/` directory with C unit
suites and a `krep` vs `ripgrep` benchmark script.

Likely agent queries: how the CLI is invoked and which flags exist,
what algorithm gets picked for a given pattern, where individual
algorithms live, the public `search_*` / `match_result_*` API, the
threading model, recursive-search filtering (skip lists, gitignore),
how SIMD is gated, and how the test/build harness is structured. The
ranking front-loads the README, the `krep.h` public surface, the
`select_search_algorithm` dispatcher, the option parser, then fills
in algorithm locations and structural bodies, with build/CI scaffolding
later.
"""


fixture = "krep"
revision_pin = "ae96fbd2"
summary = """
`krep` is a single-binary POSIX C command-line string search utility ("a
faster, smaller grep"): two translation units (`krep.c`, 5287 lines;
`aho_corasick.c`, 466 lines) behind one shared header `krep.h`, built by a
hand-written `Makefile` that sniffs the host arch to pick SIMD compiler
flags, with a `test/` directory of four C test programs (three linked into
one `krep_test` binary, one built standalone) and two GitHub Actions
workflows.

The overwhelming fact about this repository is the size imbalance:
`krep.c` is 5287 of the 6115 lines of non-test source, and its largest
functions (`print_matching_items`, 620 lines; `search_file`, 800 lines;
`main`, 440 lines) are each bigger than whole files elsewhere. A snapshot that only quoted prose would leave an
agent grepping blind through it. So the ranking buys, in order: (1) what
the tool is and what files exist; (2) the semantic surface a session needs
before it can even frame a question — feature list, the complete CLI flag
table, the documented algorithm-selection policy; (3) the `krep.h`
contract, which is the real API boundary between the two `.c` files and
the tests; (4) exhaustive *name-only* rosters with line numbers for every
top-level function in `krep.c`, `aho_corasick.c` and all four test files,
plus the `// --- ... ---` section banners that are the only navigation
inside the giant functions — this is what makes "where is X" a one-hop
grep; (5) build/test/CI mechanics; (6) the load-bearing bodies
(`select_search_algorithm`, the constants block, the gitignore matcher's
data model, the getopt wiring); (7) appendix metadata.

Query distribution served: adding or changing a CLI flag (getopt table +
`print_usage` + README options), adding or tuning a search algorithm
(`search_func_t`, `select_search_algorithm`, the `#if KREP_USE_*` ladder),
debugging output formatting (`print_matching_items` internal banners),
recursive-search / gitignore behaviour, threading and chunking, and
"how do I build and run the tests".
"""


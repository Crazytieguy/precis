fixture = "ky"
revision_pin = "eb5c3eba"
summary = """
`ky` is a tiny, dependency-free HTTP client that wraps the Fetch API,
published as ESM-only TypeScript (`source/` compiles to `distribution/`).
The library is about 2,600 lines: `source/index.ts` builds the callable `ky`
instance and re-exports the public surface; `source/core/Ky.ts` is the
single engine class that normalizes options, runs the four hook phases,
applies the retry policy and installs the `.json()/.text()/…` body
shortcuts on the returned promise; `source/core/constants.ts` holds
feature detection, the option registries and the `ky.stop` / `ky.retry()`
markers; `source/types/` is the documented public type surface (options,
hooks, retry, `KyInstance`, `ResponsePromise`); `source/utils/` holds
option-merging, normalization, timeout, delay, progress-stream and
type-guard helpers; `source/errors/` holds `HTTPError`, `TimeoutError`,
`ForceRetryError` and the internal `NonError`. `readme.md` (1,356 lines)
is the user-facing API reference, and `test/` is a large AVA suite plus
Playwright browser tests with shared helpers.

The ranking front-loads (1) what the package is and where its code
lives, (2) the exact public export list and the full option / hook /
retry contract with its concrete defaults, since most sessions start
from "how do I configure X" or "what does ky do on Y"; then (3)
navigation rosters — every readme heading, every `Ky` member, every
exported util — so anything not spelled out is one grep away; then (4)
the engine's instance-creation, retry-decision and request-construction
code, (5) the option-merging utilities behind `ky.create` / `ky.extend`,
(6) readme prose the source does not duplicate, and (7) build and test
mechanics.
"""


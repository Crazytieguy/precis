fixture = "ky"
revision_pin = "eb5c3eba"
summary = """
ky is a small TypeScript HTTP client wrapping the Fetch API. The whole
shipped library lives under `source/`: a public-facing `index.ts` that
wires `Ky.create` into method shortcuts (`get`/`post`/…) plus
`extend`/`create`/`stop`/`retry`, a single internal `core/Ky` class
that owns the request/retry/hook lifecycle, a constants module with
feature detection + the `ForceRetryOptions` / `RetryMarker` plumbing
behind `ky.retry()`, an options/types tree describing every public
option, four error classes (`HTTPError`, `TimeoutError`,
`ForceRetryError`, internal `NonError`), and a handful of utils
(deep-merge with header/hook/searchParams/signal special-casing,
retry defaults, fetch-timeout race, abortable delay, body-stream
progress, type guards). The fixture is paired with an extensive
`readme.md` (≈1.4k lines of API reference + tips + FAQ) and a deep
test suite under `test/` (ava, against an express-based helper
server) covering every option, every hook callback shape, every
retry path, and headers/streams/browser scenarios.

The query distribution this NS serves: orientation ("what does ky
do, what does it export"), API/option lookup ("what are the retry
defaults / hook signatures / what does prefixUrl do"), behavior
debugging ("why does retry skip this status / how does the hook
chain interact with cloned responses / when does timeout fire"),
type integration ("how do I extend types / what shape is
NormalizedOptions"), and test-anchored questions ("is there a test
for X"). The ranking front-loads structural breadth (file tree +
public exports + option/hook/error names with locations) before
diving into the engine internals (`Ky` class) and the readme's deep
options reference.
"""


fixture = "linkding"
revision_pin = "573b6f54"
summary = """
linkding is a mature, single-maintainer self-hosted bookmark manager: a
Django 6 monolith (bookmarks/) with a hand-rolled boolean search query
language, a Huey-backed background task pipeline (favicons, preview
images, Wayback Machine snapshots, local HTML/PDF snapshots via
single-file-cli), a DRF REST API, a Lit-based vanilla-JS frontend
bundled with Rollup, and an Astro docs site (docs/). Deployment is
Docker-first (uwsgi + optional supervisor-managed Huey worker), with
SQLite as the default DB and optional Postgres/OIDC/auth-proxy support.

The query distribution this NS serves: explaining/extending the search
query language or tag/bundle filtering; adding or changing a model
field, API field, or settings/profile option (and tracing it through
model -> form -> view -> template -> serializer); background-task and
snapshot/archiving bugs; Docker/CI config questions; frontend component
(Lit + Turbo) behavior; and "where do I configure X" / "how do I build,
test, or deploy this" onboarding queries. Given the tight per-token
budget, ranking favors full directory closure and full per-model
field-name/constant catalogs (cheap, breadth-preserving) over
exhaustive method bodies; most code batches are short, carefully chosen
excerpts (a defining signature, constant block, or field list) rather
than whole functions, so an agent gets a precise landing spot plus one
grep/read away from the rest.
"""


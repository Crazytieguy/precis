fixture = "linkding"
revision_pin = "573b6f54"
summary = """
linkding is a self-hosted bookmark manager: a single Django 6 web
application (`bookmarks/`) with a server-rendered, Turbo-driven UI, a
DRF REST API under `bookmarks/api/`, a business-logic layer in
`bookmarks/services/`, SQLite-or-Postgres persistence, huey background
tasks, lit-based web components in `bookmarks/frontend/`, and an Astro
Starlight docs site in `docs/`. It ships as a Docker image and is
configured almost entirely through `LD_*` environment variables.

The ranking front-loads what the repository *is* and where its substance
lives (root + `bookmarks/` listings, the app's sub-package map), then the
domain model in `bookmarks/models.py`, then the URL/route table and view
roster, then the REST API surface, then the service layer and the search
query pipeline, then configuration/deployment (`LD_*` options,
Docker/scripts/management-command listings), and finally the frontend
component tree. Template, migration and test directories are surfaced as
directories in the listings rather than by content, so work inside them
starts from a known path. Query distribution served: "what is this and
how do I run it", "where is feature X implemented", "what fields does a
bookmark/profile have", "what endpoints/settings exist", "how do I add a
view/service/test", "how is search parsed", "how is it deployed".
"""


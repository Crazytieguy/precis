fixture = "linkding"
revision_pin = "573b6f54"
summary = """
linkding is a self-hosted bookmark manager: a Django 6 webapp with a
Hotwired-Turbo + LitElement frontend, packaged as a Docker image and
configured almost exclusively through `LD_*` environment variables.
There is a single Django app, `bookmarks/`, that owns everything —
models (Bookmark, Tag, BookmarkBundle saved searches, BookmarkAsset
snapshots, UserProfile, FeedToken, ApiToken, GlobalSettings, Toast,
plus a non-ORM BookmarkSearch value type), DRF API viewsets, server-
rendered HTML views, a services layer (bookmarks CRUD, importer/
exporter for Netscape HTML, parser, search_query_parser with a
recursive-descent AST, auto_tagging rule matcher, single-file/PDF
snapshot pipeline, favicon/preview/wayback loaders), Huey background
tasks, Django migrations, templates, and the rolled-up JS bundle in
`bookmarks/frontend/`.

Likely sessions an agent walks into: adding/tweaking a settings option
(`LD_*` plumbed through `bookmarks/settings/base.py` → service modules,
documented in `docs/src/content/docs/options.md` and `.env.sample`);
extending the REST API (`bookmarks/api/routes.py` viewsets +
`serializers.py` + `bookmarks/urls.py` router includes); changing
bookmark fields (`models.py` Bookmark + a numbered migration in
`bookmarks/migrations/`); search behaviour (the new
`services/search_query_parser.py` AST + `queries._convert_ast_to_q_object`,
or `queries._filter_search_query_legacy` for `profile.legacy_search`);
import/export (`services/importer.py` + `services/parser.py`'s
NetscapeBookmark HTMLParser, `services/exporter.py`); auto-tagging
rules; snapshot/archival pipeline (`services/tasks.py` Huey tasks +
`services/assets.py` + `services/singlefile.py` + supervisord configs);
auth (DRF token via `api/auth.py`, session + OIDC + auth-proxy
configured in `settings/base.py`, `middlewares.py` for the request
extension); deployment (Dockerfile multi-stage, `bootstrap.sh`,
`uwsgi.ini`, supervisord-*.conf).

The ranking front-loads identity + the top-level layout, then the
`LD_*` configuration surface (because so many sessions are
config-driven), then the data model (models.py is the single source of
truth most other modules ground against), then the URL/API routing
table, then service- and view-module signatures so the agent knows
where every public function lives, then domain-logic bodies (bookmark
lifecycle, search parsing, importer, auto-tagging, tasks, asset
pipeline), then frontend/templates/deployment last.
"""


fixture = "linkwarden"
revision_pin = "22723575"
summary = """
Linkwarden is a self-hosted, collaborative bookmark manager that also
*preserves* every saved page (screenshot, PDF, monolith single-file HTML,
Readability text, optional Wayback push), annotates it (highlights),
organises it (collections / sub-collections / tags), searches it
(Meilisearch), and shares it publicly. The repo is a Yarn-4 workspace
monorepo: three apps (`apps/web` — a Next.js *pages-router* app that is
simultaneously the UI and the REST API; `apps/worker` — a long-running
Node process that does preservation, AI tagging, indexing, RSS polling;
`apps/mobile` — an Expo/React-Native client) over five shared packages
(`packages/prisma` the Postgres data model, `packages/types` shared TS
types + enums, `packages/lib` shared server/client helpers, `packages/router`
TanStack-Query hooks shared by web and mobile, `packages/filesystem` a
local-disk/S3 storage abstraction).

The ranking is ordered for an agent that could be asked anything: first
*what the product is* and *how the monorepo is carved up*; then the
Prisma data model, because nearly every question ("how are permissions
stored?", "what is `indexVersion`?") bottoms out in a model field; then
breadth over the HTTP surface (`pages/api/v1/**` route files and the
`lib/api/controllers/**` implementations behind them, listed
exhaustively so no route looks absent); then the shared TypeScript
vocabulary — the numeric enums that encode preservation formats and
sort orders, the zod request schemas, the shared query hooks; then the
worker's job loop and preservation entry point; then the web UI
inventory; then the authentication gate, deployment topology and
environment variables; and last the mobile client. Directory rosters use complete listings so that an
unlisted file can be trusted not to exist; symbol rosters name every
export in the file they claim.
"""


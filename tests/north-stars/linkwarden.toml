fixture = "linkwarden"
revision_pin = "22723575"
summary = """
Linkwarden is a self-hosted bookmark manager: collect, annotate, and
preserve webpages (screenshot/PDF/Monolith/readability). It's a yarn
workspace monorepo with three apps (`web` — Next.js + Prisma + Meili
backend and frontend; `worker` — background preservation/indexing/RSS
poller; `mobile` — Expo React Native) and five shared packages
(`prisma`, `lib`, `router` — tanstack-query hooks, `filesystem` —
local/S3 abstraction, `types`).

A coding agent landing here will face a wide query distribution:
end-to-end bookmark flows (UI → REST → Prisma → worker preservation),
auth/SSRF/subscription guardrails, schema/migration questions, mobile
parity vs web, search (Meili w/ Postgres fallback), i18n, Docker
deployment, integrations with NextAuth's many providers, etc. The
ranking front-loads the monorepo shape and data model (Prisma schema
+ enums drive nearly every query), then surfaces locations for the
HTTP API surface and the React Query hook layer (because every
client/mobile feature talks through `packages/router`), then dives
into the preservation pipeline and finally into call-site detail for
deeper questions.
"""


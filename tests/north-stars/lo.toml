The project lints hard, and unusual entries in the enabled set change how
code must be written: `funlen`, `gocyclo`, `nestif` and `prealloc`
constrain helper bodies; `godot` demands full stops on comments;
`paralleltest`/`tparallel`/`thelper` demand the test conventions of tier

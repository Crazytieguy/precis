id = "1.9"
descriptor = "Scope caveat, versioning contract, zero dependencies, Go floor"
justification = """
Constraints on any change an agent might propose. First the author's
admission that 5-10 helpers overlap the stdlib `slices` and `maps`
packages -- load-bearing for the recurring "does this helper belong
here" question. Then: v1 under strict SemVer,
no breaking changes to exported APIs before v2 *except* under `exp/`, and
no dependencies outside the standard library. go.mod backs that up --
module path `github.com/samber/lo`, `go 1.18` as the compile floor, and a
comment marking the require block that follows as dev-only and excluded
from releases. That combination is why
new helpers must be hand-rolled rather than delegated to a library.
"""

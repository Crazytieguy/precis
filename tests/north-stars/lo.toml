fixture = "lo"
revision_pin = "ea94cc5c"
summary = """
samber/lo is a large, generics-based Lodash-style utility library for Go. The
codebase is essentially a flat catalog of helpers grouped by category file
(`slice.go`, `map.go`, `find.go`, `string.go`, `tuples.go`, `errors.go`,
`channel.go`, etc.) plus four parallel sub-packages that mirror parts of the
API with different evaluation semantics: `it/` (Go 1.23 lazy iterators),
`parallel/` (concurrent), `mutable/` (in-place), and `exp/simd/` (Go 1.26 SIMD
experiment). Most "interesting" content per file is the *roster of public
helpers*, not implementation — the bodies are short, repetitive, and largely
template-driven (Async2..Async6, T2..T9, Tuple2..Tuple9, Try0..Try6,
Must..Must6, Duration0..Duration10, Partial1..Partial5, Zip2..Zip9). The
ranking therefore prioritizes (a) the README's master index of categories +
helper names (a single artifact that subsumes hundreds of "does X exist?"
queries), (b) sub-package identity, and (c) full public-API name listings per
.go file so the agent can answer "does function Y exist? in which package?"
in zero hops. Bodies are demoted to late tiers and shown only for shapes that
aren't obvious from a signature (ifElse builder, Transaction, Debounce,
ChannelDispatcher, SIMD feature dispatch). Tests, examples, benchmarks, and
the Docusaurus docs site are surfaced as locations only; their contents are
derivable from category and pattern.
"""


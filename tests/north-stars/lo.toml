[[batches]]
id = "6.1"
descriptor = "docs/ npm scripts: every documentation checker"
justification = """
Adding a helper means passing these checks, and the `scripts` block of
`docs/package.json` is the only place the full list appears. The elision
marker stands for the ten stock Docusaurus scripts above them (`start`,
`build`, `typecheck`...); the checkers are: `check-cross-references`,
`check-duplicates-in-category`, `check-filename-matches-frontmatter`,
`check-similar-exists`, `check-similar-keys-exist-in-directory`,
`check-function-signatures`, plus `sync-function-signatures` -- which
points at `./scripts/sync-function-signatures.js`, a file that does not
exist in `docs/scripts/` (the directory has `check-function-signatures.js`
instead). Worth knowing before an agent tries to run it. What these
scripts validate -- the frontmatter schema of the 444 files in
`docs/data/`, `sourceRef` line links, `variantHelpers`/`similarHelpers`
cross-references -- is documented exhaustively in `docs/CLAUDE.md`, which
the harness already injects, so no batch here spends budget re-deriving
it from an example file.
"""

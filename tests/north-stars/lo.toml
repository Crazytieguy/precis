fixture = "lo"
revision_pin = "ea94cc5c"
summary = """
`samber/lo` is a Lodash-style utility library for Go 1.18+ generics: several
hundred standalone helper functions over slices, maps, strings, channels,
tuples, time and errors. There is no framework, no runtime state and almost
no internal machinery -- the repository *is* its API surface, spread across
a flat root package (`lo`) plus four sibling flavours of the same helpers:
`it/` (Go 1.23 `iter.Seq`), `mutable/` (in-place), `parallel/` (goroutine
per element) and `exp/simd/` (AVX/AVX2/AVX-512, Go 1.26 + GOEXPERIMENT).
Around it sit a colocated test suite (`*_test.go` and `*_example_test.go`
next to every source file), a separate `benchmark/` package, and a
Docusaurus site under `docs/` whose per-helper pages are generated from 444
frontmatter files in `docs/data/` and checked by Node scripts.

The ranking is therefore dominated by *name-and-location rosters*: for a
library of this shape the most valuable thing a snapshot can carry is
"which helpers exist, and at which file:line", because nearly every
plausible session ("add helper X", "why does Y behave like this", "is there
already something that does Z", "port helper W to the iterator package")
starts by locating a helper or proving one is absent. Rosters are complete
for the line range they claim, so a missing name is real evidence of
absence; where a file is a pure arity/type family (`Zip2..Zip9`,
`SumInt8..SumFloat64`) the family is rendered head + elision marker + tail
rather than in full, which shows the shape at a fraction of the cost.
Identity, the package split and the directory skeleton come first (tier 1);
then the core package's rosters, most-used files first (tier 2); then the
sibling packages and `internal/` (tier 3); then test, example and benchmark
conventions (tier 4); the experimental SIMD module (tier 5); the docs
pipeline (tier 6); and finally CI, lint and repo metadata (tier 7).
Function bodies are almost never included -- they are short and formulaic,
and one `Read` away once a roster has given the exact line.
"""


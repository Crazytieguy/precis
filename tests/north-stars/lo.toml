counting helpers, `Subset`/`Slice`, `Replace`/`ReplaceAll`, `Compact`,
`IsSorted`, `Splice`, `CutPrefix`/`CutSuffix`, the `Trim` block
including the seq-only
`TrimFirst`/`TrimLast`, and `Buffer`. Note the names that deliberately
differ from the core package (`DropLast` vs `DropRight`) -- a rename trap
this roster makes visible.

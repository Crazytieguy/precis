README.md's title line names the domain (iterate over slices, maps,
channels) and line 13 is the project's own one-sentence pitch: a
Lodash-style Go library built on 1.18+ generics. Lines 4-11 are a
shields.io badge wall and are deliberately never scheduled anywhere in
this document.
"""

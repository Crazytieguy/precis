fixture = "log"
revision_pin = "43f2c283"
summary = """
`log` 0.4.29 — the Rust logging *facade*. It defines an API (five level macros,
a `Log` trait, `Record`/`Metadata` payloads, one process-global logger slot)
and deliberately ships no backend; downstream binaries pick one. Two facts
dominate its design and therefore this ranking: (a) severity is filtered twice
— at compile time through the `STATIC_MAX_LEVEL` const that the `max_level_*`
Cargo features resolve, and at run time through an atomic
`MAX_LOG_LEVEL_FILTER`; (b) everything past the bare facade — structured
key-values (`kv`), `std`, `serde`/`sval` capture — is feature-gated, so most
symbols are conditional and "does this exist without feature X?" recurs
constantly.

Order: repository identity and the complete file/feature map; the crate-root
public surface, rosters first so no reader believes an unlisted public item is
absent; then the two things a reader actually touches — implementing and
installing a `Log`, and the macro expansion path from `src/macros.rs` through
`src/__private_api.rs`; then the `Record`/`Metadata` payload types; then the
`kv` subsystem (`Source`/`VisitSource`, `Value`/`VisitValue`, `Key`, the
`value_bag` vs dependency-free backends); finally tests, CI, changelog and the
structured-logging RFC. Query classes served: "how do I write a logger", "why
is my log line dropped", "what does `key:serde` expand to", "which types can
carry key-values", "what breaks without `std`".
"""


fixture = "log"
revision_pin = "43f2c283"
summary = """
`log` is a lightweight, facade-only logging crate for Rust: library code calls
macros (`error!`/`warn!`/`info!`/`debug!`/`trace!`/`log!`/`log_enabled!`) and
the binary installs one `&'static dyn Log` via `set_logger` (or a boxed
variant). A compile-time `STATIC_MAX_LEVEL` plus a runtime atomic
`max_level()` gate every call-site. The crate is small (one main `src/lib.rs`,
`src/macros.rs`, a private `src/__private_api.rs` shim, an optional
`src/serde.rs`, and a `src/kv/` module for structured logging), and its API
surface is mostly data types (`Level`, `LevelFilter`, `Record`, `Metadata`,
`Log`) with a handful of free functions for global state. The optional `kv`
feature adds a typed key-value API on `Record` powered by `value-bag`, with
capture modifiers `:?`/`:%`/`:err`/`:sval`/`:serde`.

Query distribution to serve: explaining the facade pattern and how levels /
filtering work; pointing at the macro rules when someone is debugging macro
expansion or adding a call form; locating `Log` / `Record` / `Metadata` and
their builders; wiring a custom logger and calling `set_logger` +
`set_max_level`; explaining Cargo features (`std`, `kv*`, `max_level_*`,
`release_max_level_*`) and the no-std story; finding the `kv::Source` /
`kv::Value` API surface; navigating CI, MSRV, tests, and the structured-logging
RFC when there's historical/design context needed.
"""


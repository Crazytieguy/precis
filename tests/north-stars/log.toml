fixture = "log"
revision_pin = "43f2c283"
summary = """
`log` is the de-facto Rust logging facade (rust-lang/log): a `no_std`-friendly
crate of macros (`error!`/`warn!`/`info!`/`debug!`/`trace!`/`log!`/`log_enabled!`),
a global logger indirection (`set_logger`/`set_boxed_logger`/`logger()`), the
`Log` trait implementors write, and an optional `kv` feature for structured
key-value log records (`Key`/`Value`/`Source`). It has near-zero runtime
dependencies (all deps behind `kv_*` feature flags) and a large Cargo
feature-flag surface (`std`, `kv`, `kv_std`/`kv_sval`/`kv_serde`,
`max_level_*`/`release_max_level_*`). The query distribution this NS serves:
"how do I emit/filter logs", "how do I implement a Logger", "how does the kv
capture syntax (`key:? = val`) work", "what feature flag enables X", "how is
MSRV/CI/no_std supported", plus targeted debugging of the macro-expansion
chain (`log!` -> `__log!` -> `__private_api`) and the kv `Value`/`Source`
types. Given a hard per-NS token budget, depth is concentrated on the small
set of types/macros every consumer touches (Level, LevelFilter, Log, Record,
log!/error!, kv capture dispatch); everything else is reachable one grep/read
away from a location pointer here.
"""


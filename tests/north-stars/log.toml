fixture = "log"
revision_pin = "43f2c283"
summary = """
`log` is the canonical Rust logging facade: a tiny crate that defines a
log-call API (`error!`/`warn!`/`info!`/`debug!`/`trace!` macros driving a
global `Log` trait object) and leaves the actual sink up to a swappable
logger implementation. Public surface is small but heavily documented:
five level macros + `log!`/`log_enabled!`, the `Log` trait, `Level`,
`LevelFilter`, `Record`, `Metadata` (and their builders), `set_logger`
and `set_max_level`, and an opt-in `kv` submodule for structured fields.

Likely tasks an agent dropping into this repo faces: documentation
tweaks (lib.rs is a 2k-line README in disguise); macro reshaping (every
macro has 4 invocation patterns crossed with target/logger overrides —
the matchers are all in `src/macros.rs`); kv feature work in
`src/kv/`; level/filter ordering and Display/FromStr behavior; serde
and CI/feature-flag edge cases; debugging the global logger's
atomic-state machine in `set_logger_inner`. The ranking front-loads
identity + macro/trait surface, then level enums and Record/Metadata,
then the kv module, then features, tests, and CI.
"""


fixture = "log"
revision_pin = "43f2c283"
summary = """
`log` is a small (~5k lines under src/) logging *facade* for Rust: it
defines the vocabulary (Level / LevelFilter / Record / Metadata / Log
trait) and the six macros (error!/warn!/info!/debug!/trace!/log! +
log_enabled!), but does no rendering or routing itself. A downstream
executable installs a global `&dyn Log` via `set_logger` +
`set_max_level` exactly once; libraries just call the macros. Under
the hood there's a three-state initialization dance (UNINITIALIZED /
INITIALIZING / INITIALIZED) plus twelve feature flags that bake a
static max level at compile time (`max_level_*` +
`release_max_level_*`). Behind the `kv` feature there's a structured
logging subsystem — `kv::{Source, VisitSource, Key, Value, VisitValue,
ToKey, ToValue, Error}` — that lets macros carry typed attributes and
capture them via `:?` / `:%` / `:err` / `:serde` / `:sval` modifiers.

A coding-agent session against this repo is usually one of: (1) an
'implement a logger backend' task — requires the `Log` trait, Record /
Metadata shape, set_logger state machine, max-level semantics; (2) a
'use the macros in my library' task — requires macro surface + Level +
target/kv syntax; (3) a 'debug why my logs vanish' task — requires
STATIC_MAX_LEVEL + set_max_level + the noop-fallback story; (4)
structured-logging questions — requires the kv module re-exports + the
value data model; (5) feature-flag / no_std / MSRV questions —
requires Cargo.toml + the max_level_* matrix; (6) serde integration —
requires src/serde.rs + the kv_serde feature. The ranking prioritises
catastrophic-omission coverage (every subsystem gets a cheap location
batch early) over dumping full bodies.
"""


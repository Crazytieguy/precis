fixture = "marked"
revision_pin = "a7affc3b"
summary = """
`marked` v18 is a markdown-to-HTML compiler written in TypeScript, shipped as an
ESM/UMD library, a `Marked` class for scoped instances, and a `marked` CLI. The
substance is thirteen files in `src/`: a fixed pipeline of
`Lexer` -> `Tokenizer` (regex grammars in `rules.ts`) -> `Parser` -> `Renderer`,
wrapped by `Instance.ts` (the `Marked` class, `use()` extension merging, sync and
async parse paths) and re-exported by `src/marked.ts`. Everything user-facing is
an override point: renderer methods, tokenizer methods, hooks, `walkTokens`, and
custom `extensions`, all typed in `MarkedOptions.ts` and documented in `docs/`.

The ranking front-loads (a) what the package is and where its files are, (b) the
complete public export surface and per-class method rosters — because the single
most common task class here is "override/extend method X", and a partial roster
would make the agent believe a method does not exist — and (c) the option set and
its defaults. After that come pipeline semantics (block and inline precedence
order in the lexer, the parser's renderer-extension dispatch, the parse paths and
extension-merging logic in `Instance.ts`), then the grammar layer — the rule-key
set of each flavor and the complete token union — then the CLI as documented by
its man page source, and finally the test/docs directory tree and the TypeScript
settings src/ is written against. Spec fixtures under `test/specs/` are data, not
code, and are represented by their directory grouping only.
"""


[[batches]]
id = "5.2"
descriptor = "man/marked.1.md: OPTIONS, -o through -n"
justification = "Semantics for the six flags that take arguments or change I/O: output defaults to stdout, input falls back to the last positional argument then stdin, -s takes a literal markdown string, -c overrides the default `~/.marked.json` / `~/.marked.js` / `~/.marked/index.js` search, -t dumps a token list instead of HTML, -n refuses to clobber. These are behaviours, not just names, so they answer CLI questions with no follow-up."

fixture = "marked"
revision_pin = "a7affc3b"
summary = """
`marked` is a TypeScript markdown→HTML compiler distributed as a Node.js
library (ESM/UMD) and a CLI (`bin/marked`). The pipeline is a 4-stage
rope: Lexer → Tokenizer → Parser → Renderer; everything in `src/` is
one of those stages, a token-type definition, a hook surface, an
options shape, or shared helpers. The library is bundled to `lib/`
(gitignored) by `esbuild.config.js`; spec compliance is checked
against vendored CommonMark/GFM/original/redos JSON+md/html fixtures
in `test/specs/`.

Ranking goals — four query distributions:

1. **API consumer.** "How do I parse markdown?" "What options exist?"
   "How do I override a renderer method?" Served by surfacing the
   `marked()` entry, `Marked` class, the option keys, and the
   override-via-`use()` protocol (return `false` to fall through).
2. **Grammar / spec compliance.** "Where is the rule for tables?" "How
   does paragraph interruption work?" Served by the `Tokenizer` method
   locations (one per element), the `rules.ts` regex pools (normal /
   gfm / pedantic / breaks), and the `test/specs/` corpus layout.
3. **Custom extension authoring.** "What does my tokenizer return?"
   "What does my renderer get?" Served by the `Token` union, the
   `Tokens.*` field shapes, and the `USING_PRO.md` extension manual.
4. **CLI / integration.** "How do I run it?" "What flags exist?"
   Served by `bin/main.js`, `man/marked.1.md`, and `package.json`.

Catastrophic-omission hedges that recur: the `Tokens.*` interfaces, the
`Tokenizer` / `Renderer` / `TextRenderer` / `Hooks` method sets, the
`MarkedOptions` keys, and the rule-set variants are each shown as
complete name lists (location batches) before any single member's
body — listing only some implies the others don't exist. Big bodies
(Lexer dispatch loops, rules grammar) get structural ellipsis-padded
sketches so the *try order* survives without 200 lines of code.
"""


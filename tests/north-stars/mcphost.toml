fixture = "mcphost"
revision_pin = "191dcea1"
summary = """
mcphost is a Go CLI (cobra + charmbracelet TUI) that hosts LLMs and wires them
to Model Context Protocol servers. Its substance is a thin main.go / cmd/
cobra layer over ten internal/ packages: config (the .mcphost.yml schema,
transport mapping, ${env://VAR} substitution), models (provider dispatch
across anthropic/openai/google/ollama/azure/vertex plus a generated model
catalogue), tools (the MCP client and tool manager), builtin (in-process MCP
servers), agent (the tool-calling loop), hooks (lifecycle shell hooks),
session, auth (Anthropic OAuth), tokens, and ui. A sdk/ package exposes the
same behaviour in-process.

The ranking serves the whole plausible query distribution at session start:
what the tool is and can do (README lede and feature list); where things live
(complete fs listings for every directory in the tree); the CLI contract
(cobra command tree and the entire flag registration block); the configuration
schema (MCPServerConfig, Config, GetTransportType, Validate and the
${env://VAR} substitution engine); then the runtime pipeline (agent -> MCPToolManager -> MCP clients ->
providers), the builtin servers, the hooks system, script mode, the session
file format, the SDK and slash-command surfaces, and finally release
packaging. Symbol rosters are file-scoped and complete for the file
they name, so an agent can grep one name and land in one hop.
"""


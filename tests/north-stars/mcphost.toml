fixture = "mcphost"
revision_pin = "191dcea1"
summary = """
mcphost is a Go CLI that hosts an LLM and connects it to tools via the
Model Context Protocol (MCP). It speaks to four model providers
(Anthropic / OpenAI / Google / Ollama, plus Azure / Vertex variants),
loads MCP "servers" of three kinds — `local` (stdio subprocess),
`remote` (streamable HTTP / SSE), and `builtin` (in-process: fs, bash,
todo, fetch, http) — and drives an agent loop that streams responses
and dispatches tool calls. On top of that core sit a script subcommand
(YAML frontmatter + ${var:-default} substitution), an OAuth /
API-key auth subcommand for Anthropic, a hooks system
(PreToolUse / PostToolUse / UserPromptSubmit / Stop with sh-c
commands), session save/load, a UsageTracker for token costs, a
Bubble Tea CLI with slash commands and tool-approval prompts, and a
public Go SDK that wraps the same agent.

The ranking front-loads: what the project *is* (README lede + module
path); the **shape of an MCP server config** (the type that's the load-
bearing concept across the README, configs, scripts, and the agent);
the CLI entry points and full flag list; the four config schemas
(server / hooks / session / theme); and the builtin tool inventory.
Mid-tiers cover the agent loop and streaming, provider creation,
the connection pool, and the hooks executor + schemas. Late tiers add
auth/OAuth, session persistence, environment-variable substitution,
the SDK, and UI rendering.
"""


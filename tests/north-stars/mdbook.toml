fixture = "mdbook"
revision_pin = "b8c90970"
summary = """
mdBook is a Rust CLI + library that turns a directory of Markdown files
(guided by a `SUMMARY.md` table of contents) into a navigable static
HTML book — similar in spirit to GitBook. The repo is a workspace of
nine crates: the top-level `mdbook` binary dispatches CLI subcommands
(`init`/`build`/`watch`/`serve`/`test`/`clean`/`completions`) that
call into the `mdbook-driver::MDBook` orchestrator, which loads a book
from disk, runs preprocessors (`links`/`index` builtin, plus external
`mdbook-*` commands), then hands the resulting `Book` to renderers
(`html` builtin via `mdbook-html`, `markdown` builtin, plus external
command renderers). Shared types — `Book`/`Chapter`/`Config`/`Summary`
— live in `mdbook-core`/`mdbook-summary` and are re-exported through
`mdbook-preprocessor` and `mdbook-renderer` so plugin authors pin
against stable surfaces.

Agent queries this snapshot needs to serve:
- "where is X implemented" — CLI dispatch in `src/main.rs` +
  `src/cmd/*`, driver glue in `crates/mdbook-driver/src/mdbook.rs`,
  HTML rendering in `crates/mdbook-html`, markdown-tree pipeline in
  `crates/mdbook-html/src/html/` (submodules `tree`/`serialize`/
  `tokenizer`/`print`/`hide_lines`/`admonitions`), search index in
  `mdbook-html/src/html_handlebars/search.rs`.
- "what's the public API for writing a preprocessor / renderer /
  custom backend" — the two trait files (`mdbook-preprocessor`,
  `mdbook-renderer`) + `PreprocessorContext` / `RenderContext` +
  the two example programs under `examples/`.
- "what config options are supported" — `HtmlConfig` + siblings in
  `crates/mdbook-core/src/config.rs`, documented in
  `guide/src/format/configuration/`.
- "how do I add a test" — `tests/testsuite/` with `BookTest` helper.
- "what was recently changed" — `CHANGELOG.md`; the 0.5 section has a
  large Rust-API breaking-change summary worth surfacing early.
"""


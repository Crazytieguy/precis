fixture = "mdbook"
revision_pin = "b8c90970"
summary = """
mdBook 0.5.2 — the Rust tool that turns a directory of Markdown files plus a
`SUMMARY.md` table of contents and a `book.toml` config into a static HTML
book. The repository is a Cargo workspace: the root package `mdbook` is only
the CLI binary (`src/main.rs` plus one module per subcommand under `src/cmd/`),
while all the substance lives in the nine crates under `crates/`:
`mdbook-core` (the `Book`/`Chapter` model and the whole `book.toml` `Config`
schema), `mdbook-summary` (the `SUMMARY.md` parser), `mdbook-markdown` (a thin
pulldown-cmark wrapper), `mdbook-preprocessor` and `mdbook-renderer` (the two
public plugin traits third-party tools implement), `mdbook-driver` (the
`MDBook` orchestrator plus the built-in `links`/`index`/`cmd` preprocessors and
the markdown/cmd renderers), `mdbook-html` (the HTML renderer, handlebars
templates and the bundled `front-end/` CSS/JS theme), plus the dev-only
`mdbook-compare` and `xtask` crates. Tests are a snapbox integration suite in
`tests/testsuite/` and browser `.goml` tests in `tests/gui/`; the user-facing
documentation is an mdBook of its own under `guide/`.

The ranking is built for a session that could go anywhere. First identity and
the workspace carve-up, then the source roster crate by crate, then the public
API surfaces a plugin author or embedder touches (each crate's `lib.rs`, the
`Preprocessor`/`Renderer` traits and their context structs), then the CLI
surface, then the `Book` data model and the `book.toml` configuration schema
(the largest single source of "what does this key do" questions), then the
driver's build pipeline, the HTML renderer and its bundled theme, and finally
the test harness, the contributor workflow and the CI inventory.
"""


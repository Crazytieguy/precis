fixture = "mdbook"
revision_pin = "b8c90970"
summary = """
mdBook is a Rust CLI that turns a directory of Markdown files into a
themed, searchable static-HTML book (the model used for the Rust
language's own books and many other rust-lang.github.io guides). It
is laid out as a Cargo workspace: a thin top-level `mdbook` bin in
`src/` (clap subcommands `init`, `build`, `watch`, `serve`, `test`,
`clean`, `completions`) that delegates to `mdbook-driver`'s `MDBook`
type, which in turn composes the focused `mdbook-core` (`Book` /
`Chapter` / `Config` types), `mdbook-summary` (`SUMMARY.md` parser),
`mdbook-markdown` (pulldown-cmark wrapper), `mdbook-preprocessor` /
`mdbook-renderer` (plugin-author trait crates), and `mdbook-html`
(default Handlebars-templated HTML backend, with included CSS / JS /
font assets). Built-in `links` and `index` preprocessors expand
`{{#include}}` / README→index rewrites; non-HTML backends and
non-builtin preprocessors are spawned as `mdbook-<name>` subprocesses
over a JSON stdin/stdout protocol. Plausible agent queries span
build/render orchestration, plugin authoring (preprocessor or
backend), config schema (`book.toml` keys, `MDBOOK_*` env vars),
markdown features (admonitions, definition lists, hide-lines),
SUMMARY.md grammar, theme overrides, and the `BookTest`/snapbox
testsuite. The ranking front-loads orientation (workspace shape,
crate graph, public API surface) before drilling into specific
implementations.
"""


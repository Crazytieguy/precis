fixture = "microbootstrap"
revision_pin = "609c420b"
summary = """
microbootstrap is a Python framework that wires Sentry / Prometheus /
OpenTelemetry / Pyroscope / structlog logging / CORS / Swagger / health
checks into Litestar, FastAPI, or FastStream apps via a Bootstrapper
builder. The query distribution to serve:

- "How do I bootstrap a <framework> app with these instruments?" — answered
  by the README lede + examples/.
- "What knobs does <instrument> expose?" — answered by per-instrument
  Config pydantic models in microbootstrap/instruments/.
- "How is <instrument> wired into <framework>?" — answered by the
  per-framework subclasses in microbootstrap/bootstrappers/<framework>.py
  (each is a small wrapper around the generic Instrument + a
  bootstrap_before/bootstrap_after override).
- "How do I add a custom instrument?" — answered by the README "Advanced"
  section and microbootstrap/instruments/base.py.
- "Why is my settings field not picked up?" — answered by
  microbootstrap/settings.py (env_prefix, AliasChoices, populate_by_name)
  and tests/test_settings.py.
- "How does configure_instrument merge configs?" — answered by
  microbootstrap/helpers.py (merge_pydantic_configs / merge_dict_configs).
"""


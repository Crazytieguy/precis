fixture = "microbootstrap"
revision_pin = "609c420b"
summary = """
`microbootstrap` is a Python library that builds a ready-to-run micro-service
application: you declare a pydantic-settings object, hand it to a framework
`Bootstrapper`, and get back a Litestar / FastAPI / FastStream app with Sentry,
OpenTelemetry, Prometheus, Pyroscope, logging, CORS, Swagger and health-check
"instruments" already wired in — or an `InstrumentsSetupper` context manager
for services with no web framework at all.

The architecture is a small set of repeated shapes: every instrument is a
`BaseInstrumentConfig` (a pydantic field bag) plus an `Instrument` subclass with
`is_ready` / `bootstrap` / `bootstrap_before` / `bootstrap_after`; every
framework bootstrapper re-registers those instruments through
`@Bootstrapper.use_instrument()` with framework-specific overrides; and each
settings class is a multiple-inheritance union of the instrument configs.

The ranking front-loads (a) what the project is and where its files are,
(b) the settings and instrument-config field surface — the single largest thing
a session query is likely to be about, (c) the `Instrument` protocol and the
`InstrumentBox` registry that make the plugin system work, (d) rosters naming
every remaining member of the instrument package and every per-framework
adapter class, and only then supporting modules and packaging metadata.

Because the repository is roughly 3000 source lines and the budget cannot hold
them, the ranking deliberately favours complete rosters and complete config
classes over the bodies of individual overrides: a name plus a line number puts
a body one grep away, whereas a missing name is not recoverable. Wherever a
roster names a symbol whose body is not rendered anywhere, an ellipsis marker
follows it, so the reader sees that content was withheld rather than inferring
the symbol is a stub.
"""


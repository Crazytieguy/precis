justification = "The literal implementation of the merge/override semantics 11.1's README excerpt describes in prose: set/tuple/list/dict values are merged/expanded (union for set, concatenation for tuple/list, key-union for dict, raising helpers.exceptions.ConfigMergeError on a type mismatch), everything else (str/int/float/etc.) is a plain overwrite. This is the one function every 'why did my reconfigured X not do what I expected' session needs verbatim rather than inferred from the README's prose alone."

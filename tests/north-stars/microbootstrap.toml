fixture = "microbootstrap"
revision_pin = "609c420b"
summary = """
microbootstrap is a Python library that wires up production instruments \
(sentry, prometheus, opentelemetry, pyroscope, logging, cors, swagger, \
health-checks) for FastAPI, Litestar, and FastStream services (or none of \
those, via InstrumentsSetupper), driven entirely by a pydantic-settings \
object. The query distribution this NS serves: 'how do I enable/configure \
instrument X for framework Y', 'why isn't Z instrument bootstrapping', \
'how do I add a custom instrument', 'what does merge/override semantics do \
when reconfiguring', plus routine build/test/lint workflow and debugging \
individual instrument logic or framework-specific wiring.
"""


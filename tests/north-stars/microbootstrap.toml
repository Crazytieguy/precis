[[batches]]
id = "5.2"
descriptor = "`ApplicationBootstrapper.bootstrap()` — the whole application-assembly pipeline"
predecessor = "5.1"
justification = """
The single most important function in the repository, and it defines an exact
order: ready instruments run `bootstrap()` and contribute `bootstrap_before()`
dicts merged by `merge_dict_configs`; every instrument writes its status to the
console table; the dataclass application config is merged in with defaults
stripped; the application is constructed; the
`bootstrap_before_instruments_after_app_created` hook fires; then each ready
instrument's `bootstrap_after` wraps the application. Any question about
ordering or precedence resolves here with no follow-up.
"""
[batches.content]

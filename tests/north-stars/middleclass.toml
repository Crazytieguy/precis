fixture = "middleclass"
revision_pin = "359f0e27"
summary = """
middleclass is a 193-line single-file OOP library for Lua (kikito/middleclass v4.1.1).
The entire shippable product is `middleclass.lua`; everything else is documentation
(README.md, CHANGELOG.md, UPDATING.md), a busted spec suite under `spec/` (~1000 lines,
8 files), a two-file micro-benchmark under `performance/`, six near-identical LuaRocks
rockspecs, a Travis matrix and the MIT license.

The ranking therefore front-loads `middleclass.lua`: first the module identity table and
the `class(name, super)` entry point, then the complete roster of the `DefaultMixin`
public class API (`new`, `allocate`, `subclass`, `subclassed`, `isSubclassOf`, `include`,
plus the instance-level `__tostring`/`initialize`/`isInstanceOf`) with each body ranked
right behind its roster line, then the README usage example and the current-version
migration docs, then the internal machinery (`_createClass`, `_includeMixin`,
`_propagateInstanceMethod`, `_declareInstanceMethod`, `_createIndexWrapper`), then the
spec suite's describe skeleton, and finally an appendix of superseded 2.x/3.x history,
packaging, CI, benchmarks and license.

Query distribution served: "how do I define a class / subclass / mixin" (README Quick
Look + the static API bodies), "why does inheritance/metamethod X behave this way"
(`_propagateInstanceMethod` + `_createIndexWrapper` + the metamethod specs), "what
changed between 3.x and 4.x" (CHANGELOG + UPDATING), "where is behaviour X tested" (the
spec describe rosters give a file+line for every describe block), and "how is this built
and released" (rockspecs + .travis.yml).
"""


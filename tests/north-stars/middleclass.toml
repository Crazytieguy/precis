# Tier 5 — Class-construction & method-propagation internals.
# These are the *how* behind tier 4's *what*. Order: _createClass first
# (it's what every class is), then _includeMixin, then the propagation
# helpers that drive metamethod inheritance.
# ---------------------------------------------------------------------------

[[batches]]
id = "5.1"
descriptor = "_createClass body"
justification = """
The heart of the library: builds the class table with `name`, `super`,
`static`, `__instanceDict`, `__declaredMethods`, weak `subclasses` set;
wires `static`'s `__index` to fall back through super; sets the class
table's metatable so `__index = static`, `__call = _call` (lets
`Class()` work like `Class:new()`), `__newindex = _declareInstanceMethod`
(this is what makes `function Class:foo() … end` trigger propagation).
The single most important function for understanding class internals.
"""
predecessor = "2.3"
content = { kind = "lines", spans = [
  { path = "middleclass.lua", start = 81, end = 107, render = { kind = "full" } },
] }

[[batches]]
id = "5.2"
descriptor = "_includeMixin body"
justification = """
Copies non-"included"/non-"static" mixin keys onto the class, copies
`mixin.static` keys onto the class's static, calls `mixin:included(class)`
if present. Answers all mixin semantics questions. Used by both
`include` and the `middleclass.class` entry point to install
`DefaultMixin` on a root class.
"""
predecessor = "2.3"
content = { kind = "lines", spans = [
  { path = "middleclass.lua", start = 109, end = 122, render = { kind = "full" } },
] }

[[batches]]
id = "5.3"
descriptor = "_propagateInstanceMethod + _declareInstanceMethod"
justification = """
The pair that drives method inheritance: `_declareInstanceMethod` is
the class's `__newindex`, intercepting `Class.foo = fn`; if the key is
`__index` it wraps `fn` via `_createIndexWrapper`; then
`_propagateInstanceMethod` writes into `__instanceDict` and recurses
into every subclass that hasn't shadowed the name. This is the
mechanism that makes runtime method updates show up on existing
subclasses — a frequently misunderstood behavior the metamethods spec
explicitly tests.
"""
predecessor = "2.3"
content = { kind = "lines", spans = [
  { path = "middleclass.lua", start = 57, end = 76, render = { kind = "full" } },
] }


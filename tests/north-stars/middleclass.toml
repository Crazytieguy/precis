fixture = "middleclass"
revision_pin = "359f0e27"
summary = """
middleclass is a single-file Lua OOP library (~194 lines in
`middleclass.lua`) plus busted specs, luarocks rockspecs, a tiny perf
harness, and migration docs. The whole library is one module:
`require 'middleclass'` returns a callable table whose `class(name, super?)`
constructor builds a class table with a `DefaultMixin` of instance + static
methods (`initialize`, `isInstanceOf`, `allocate`, `new`, `subclass`,
`subclassed`, `isSubclassOf`, `include`). Subclassing copies the instance
method table down; mixins copy the mixin's keys; metamethods are propagated
through a custom `__newindex` that intercepts method assignment and walks
the `subclasses` weak set. Queries the snapshot should serve: "how do I
use this library?" (Quick Look + DefaultMixin signatures), "how does
inheritance/mixins/metamethods actually work?" (the propagation helpers
plus the spec files), "what changed between versions?" (CHANGELOG +
UPDATING), and the usual project-meta queries (license, deps, Lua
versions, rockspec layout).
"""


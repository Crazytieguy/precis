[[batches]]
id = "4.1"
descriptor = "Migration filename grammar (MIGRATIONS.md:10-23)"
justification = "The normative spec: `{version}_{title}.up.{extension}` / `.down.{extension}`, title unused, extension unchecked, version is any 64-bit unsigned integer, applied ascending for up and descending for down. Every user-facing \"why isn't my migration picked up\" question resolves here, with zero follow-ups."
content = { kind = "lines", spans = [

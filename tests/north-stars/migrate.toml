fixture = "migrate"
revision_pin = "2bd822b3"
summary = """
golang-migrate/migrate v4: a Go library plus CLI that reads versioned
up/down migration files from a *source* driver and applies them to a
*database* driver. The repository is a thin engine wrapped in two plugin
ecosystems: the root `package migrate` (migrate.go, migration.go, log.go,
util.go) owns all ordering, buffering, locking and dirty-state logic;
`database/driver.go` and `source/driver.go` define the two "dumb" driver
interfaces; and implement them and self-register in `init()`; the database side has
around twenty driver subpackages and the source side a dozen-plus. The CLI lives in
`internal/cli` (flag-based, one `build_<driver>.go` file per build tag)
behind two `package main` shims, `cmd/migrate` and the deprecated `cli`.

The ranking front-loads (1) what the project is and where things live,
(2) the root package's public API and its dirty/lock protocol, (3) the two
driver contracts including their "how to implement a driver" checklists,
because those dominate the plausible query distribution: using the library,
debugging a stuck/dirty database, and adding or fixing a driver. Then come
the migration data model and filename grammar, the CLI surface, the
documentation's own question/heading inventories, and finally the
shared conformance-test harnesses. Packaging and CI files (three
Dockerfiles, .goreleaser.yml, .travis.yml, .circleci/, .github/) are
deliberately left as filenames in the root listing rather than read.
"""


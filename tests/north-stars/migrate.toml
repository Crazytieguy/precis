justification = "database/postgres/postgres.go:24-54 — the `init()` that registers the driver under both \"postgres\" and \"postgresql\", `DefaultMigrationsTable = \"schema_migrations\"` and `DefaultMultiStatementMaxSize = 10 MB`, and the whole `Config` struct; the ellipsis at 36 stands for the driver-local sentinel error block at 37-42. Its fields — MigrationsTable, MigrationsTableQuoted, MultiStatementEnabled, DatabaseName, SchemaName, StatementTimeout, MultiStatementMaxSize — are what the `x-`-prefixed URL parameters populate, making this the concrete counterpart to FilterCustomQuery in 2.11 and the model any new driver copies."

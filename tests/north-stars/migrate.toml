fixture = "migrate"
revision_pin = "2bd822b3"
summary = """
golang-migrate/migrate: a Go database migration library + CLI. A central
`Migrate` orchestrator (in migrate.go at the repo root, package `migrate`)
drives applying migrations by gluing together two pluggable driver
interfaces — `source.Driver` (where migrations are read from: filesystem,
io/fs, S3, GitHub, GitLab, GCS, Bitbucket, go-bindata, pkger, godoc-vfs,
httpfs, stub) and `database.Driver` (what migrations run against: postgres,
pgx, pgx5, mysql, sqlite, sqlite3, sqlcipher, sqlserver, cassandra,
clickhouse, cockroachdb, yugabytedb, mongodb, neo4j, spanner, redshift,
firebird, rqlite, snowflake, ql, crate, shell, stub). Migration files
follow `{version}_{title}.{up|down}.{ext}`; the source driver indexes
them, the database driver tracks the current version + a dirty flag in a
schema_migrations table and runs the bodies. Each driver self-registers
in `init()` and is wired into the CLI by per-driver build-tag stubs under
internal/cli/build_*.go. CLI lives in internal/cli/ (Main, commands.go)
with thin entry points at cmd/migrate/main.go (current) and cli/main.go
(deprecated). Query distribution: "configure driver X / add a new
driver", "Migrate.Up vs Steps vs Migrate(v)", "filename format /
NilMigration / NilVersion", "CLI flags / signal handling", "per-DB
locking", "add support for source/db Y".
"""


fixture = "mitt"
revision_pin = "6b416705"
summary = """
mitt is a ~200-byte functional event emitter / pubsub published as an npm
package. The entire library is one 123-line TypeScript file, `src/index.ts`:
six exported type aliases, the `Emitter<Events>` interface, and a default-
exported `mitt()` factory that returns an object literal with `all`, `on`,
`off` and `emit` closing over a `Map`. Everything else in the repo is
documentation (`README.md`, which carries a documentation.js-generated API
section), two test files (`test/index_test.ts` runtime behaviour under
mocha/chai/sinon, `test/test-types-compilation.ts` a compile-only check of
generic inference with `@ts-expect-error` markers), and packaging/tooling
config (`package.json` entry points + scripts, `tsconfig.json`, `.eslintrc`,
`.editorconfig`, two GitHub Actions workflows).

The ranking therefore front-loads (1) what the project is and where its
files are, (2) the exported API surface and the consumer-facing usage
examples, (3) the three method implementations in full — they are short
enough that reading them is cheaper than pointing at them, (4) how to build
and test, (5) the test suite's map and the type-level expectations, (6) the
runtime behavioural tests, which are the only place several real semantics
are pinned down (event names are case-sensitive, duplicate listeners are
registered twice, `off` removes only the first match, `off(type)` clears
all handlers of a type, `'*'` handlers run after type-matched handlers),
and (7) packaging/lint/CI appendix material. Queries this serves: "how do I
type my events", "why is my `*` handler firing after", "how do I remove a
listener", "what does `emit` do when there are no handlers", "how do I run
the tests", "what are the published entry points".
"""


fixture = "mitt"
revision_pin = "6b416705"
summary = """
Mitt is a tiny (~200b gzipped) functional event-emitter / pubsub library
written in TypeScript. The whole implementation lives in a single file
(`src/index.ts`) exposing a default `mitt<Events>()` factory plus the
type aliases `EventType`, `Handler`, `WildcardHandler`,
`EventHandlerList`, `WildCardEventHandlerList`, `EventHandlerMap`, and
the `Emitter<Events>` interface. The factory returns an object with
`all` (a `Map` of handler arrays keyed by event type), `on`, `off`, and
`emit`. A `'*'` wildcard event type fires for every emit. Tests live in
`test/index_test.ts` (mocha + chai + sinon) and a type-only compilation
test in `test/test-types-compilation.ts`. Repo is small, browser-targeted
(no `this`-binding, IE9+), bundled by microbundle, linted by ESLint.

Likely query distribution: explaining the API; copy-paste usage; reading
or modifying the `on`/`off`/`emit` body (e.g. memory-leak analysis of
`off("type")` stashing `[]`, splice trick `>>> 0`, slice-before-iterate
re-entrancy guard, `'*'`-after-typed dispatch order); deriving generic
event types; build/test tool config.
"""


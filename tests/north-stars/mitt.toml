fixture = "mitt"
revision_pin = "6b416705"
summary = """
Mitt is a tiny (~200 byte) functional event emitter / pubsub library
written in TypeScript. The whole runtime is a single 124-line module
(`src/index.ts`) that exports a default `mitt()` factory returning
`{ all, on, off, emit }` plus a wildcard `'*'` listener channel.

Plausible agent queries the ranking should serve:
- "How do I use mitt?" / "What does the API look like?" — README usage,
  `Emitter<Events>` interface, the four method shapes.
- "How does it work internally?" — the `on`/`off`/`emit` bodies, the
  `Map<keyof Events | '*', …>` storage, the slice-then-iterate pattern.
- "How are types inferred?" — overloaded signatures on
  `on`/`off`/`emit`, `WildcardHandler`, the type-test fixture.
- Test/build mechanics — mocha runner config, microbundle dual ESM/CJS/
  UMD output, `npm run docs` regenerating README API.
- Ancillary: linting style (developit + tabs), CI, license, gzip-size
  guard.

Because the package is so small, the snapshot can quickly cover the
whole public surface; later batches refine implementation detail and
test/build context.
"""


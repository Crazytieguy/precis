fixture = "mkcert"
revision_pin = "1c1dc4ed"
summary = """
mkcert is a single-binary Go CLI (module `filippo.io/mkcert`, `package main`)
that creates a local development CA and issues locally-trusted leaf
certificates for it. The whole program is seven `.go` files in a flat root
with no subpackages and no tests: `main.go` (flag surface, the `mkcert`
struct, CAROOT resolution, install/uninstall orchestration, small process
helpers), `cert.go` (leaf and CA certificate construction, key generation,
output filenames, PKCS#12, CSR path, CA load/create), and five
`truststore_*.go` files. Three of those — `truststore_darwin.go`,
`truststore_linux.go`, `truststore_windows.go` — are selected by Go's
filename build constraints and each supplies the *same* small contract:
`installPlatform()`/`uninstallPlatform()` plus the package-level vars
`FirefoxProfiles`, `NSSBrowsers` and `CertutilInstallHelp`. The other two,
`truststore_nss.go` (certutil / Firefox / Chromium NSS databases) and
`truststore_java.go` (keytool / `cacerts`), compile everywhere.

The ranking is built for the fact that almost every question about this
repository is either "what does flag/env var X do", "where does the
per-platform behaviour for Y live", or "how is the certificate/CA
constructed". So it front-loads: repository identity, the flat file
roster, a name-level roster of every top-level declaration in every source
file (so no symbol looks absent), then the complete flag set and the two
usage strings that are the program's real documentation, the `mkcert`
struct, the per-platform constant blocks that encode the
platform-detection contract, then `Run`'s control flow, `cert.go`'s
certificate bodies, the truststore implementations, and finally the
README's build instruction and the dependency manifest. LICENSE, AUTHORS, go.sum and the .github workflows are ranked only as filesystem entries — their contents earn nothing against this budget.
"""


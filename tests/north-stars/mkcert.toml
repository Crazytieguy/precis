fixture = "mkcert"
revision_pin = "1c1dc4ed"
summary = """
mkcert is a small Go CLI for generating locally-trusted development
certificates: it lazily creates a local CA in a user-data folder, can
install/uninstall that CA into platform trust stores (macOS keychain,
Windows root store, Linux ca-certificates, Java cacerts, NSS for
Firefox/Chromium), and signs leaf certs for hostnames / IPs / emails /
URIs or from a supplied CSR.

The codebase is flat: `main.go` parses flags and dispatches; `cert.go`
holds CA + leaf-cert generation and file-naming logic; the five
`truststore_*.go` files implement a duck-typed per-platform interface
(`installPlatform`/`uninstallPlatform`/`checkPlatform` for system
stores, plus shared NSS and Java helpers). Build tags on the
`truststore_{darwin,linux,windows}.go` filenames pick one
`installPlatform` per GOOS, so the *same* method signature recurs in
each file — agents need to know which file to read for each platform.

Common tasks: adding a new platform trust store, debugging a flag,
extending output filename rules, tweaking validity periods or key
algorithms, understanding the CAROOT discovery rules, or
explaining/reproducing one of the README install flows. The ranking
favors breadth across all five truststore files and a complete
catalogue of public flags + struct methods before drilling into any
single body.
"""


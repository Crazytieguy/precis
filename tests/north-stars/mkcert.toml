fixture = "mkcert"
revision_pin = "1c1dc4ed"
summary = """
mkcert (filippo.io/mkcert) is a small single-package Go CLI (~1650 lines
across 7 .go files) that creates a local certificate authority and
locally-trusted TLS certs for development, installing the CA into OS/
browser/Java trust stores. The whole repo is `package main`: main.go owns
flag parsing + CAROOT/dispatch, cert.go owns cert/CA generation, and five
truststore_<target>.go files (darwin, linux, windows, nss, java) each
implement install/uninstall for one trust-store target behind the shared
`mkcert` struct. No test files exist in this fixture; CI (test.yml/
release.yml) is the only verification signal. Expected queries span the
full range: "how does CA generation work", "why didn't install pick up
Firefox", "add a flag", "what does -CAROOT do", "how do I build/test
this", "what's the CLI surface", debugging a specific platform's
trust-store quirk, and generic "what is this repo" orientation.

At this fixture's size, main.go + cert.go alone (~760 raw lines) would
consume nearly the entire 10k-token budget at full fidelity, so ranking
makes explicit tradeoffs: (1) whole-repo breadth first — every file,
every top-level declaration, via cheap per-file census batches — so no
platform or function is invisible even at small budgets; (2) full-body
depth is reserved for the primary "generate a cert and install the CA"
path (main() dispatch, Run, install, makeCert, loadCA/newCA,
generateKey/fileNames) — the one marked exception is a single
ellipsis in Run() covering both its bare no-args-usage guard and its
per-arg hostname-classification loop, the latter elided since it
duplicates the SANs classification makeCert() itself performs in
full; (3) secondary
paths (uninstall, the -csr flow, small error/exec helpers) are left at
census (signature + config-var) depth rather than full body; (4) among
the five trust-store backends, only truststore_nss.go (Firefox/Chrome,
compiled on every OS) gets full depth beyond census — darwin/linux/
windows/java still have their full config vars and every function
signature from the census tier, just not expanded bodies; (5) CI and
README how-tos are kept minimal and high-signal rather than exhaustive;
legal boilerplate (AUTHORS/LICENSE) is left at existence-only in the
root listing (1.1), with no dedicated content batch.
"""


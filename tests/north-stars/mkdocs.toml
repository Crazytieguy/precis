fixture = "mkdocs"
revision_pin = "28625367"
summary = """
MkDocs 1.6.1 — a Python static site generator that turns a `docs/` tree of
Markdown plus a single `mkdocs.yml` into an HTML site. The repository is one
installable package, `mkdocs/`, containing: a Click CLI (`mkdocs/__main__.py`,
commands `serve` / `build` / `gh-deploy` / `get-deps` / `new`); a
descriptor-based configuration system (`mkdocs/config/` — `base.py` machinery,
`config_options.py` option types, `defaults.py` the `MkDocsConfig` schema that
defines every `mkdocs.yml` key); a document model (`mkdocs/structure/` —
`File`/`Files`, `Page`, `Navigation`/`Section`/`Link`, `TableOfContents`); the
build pipeline (`mkdocs/commands/build.py`); a plugin API with ~20 `on_*`
lifecycle events (`mkdocs/plugins.py`); two bundled Jinja themes with
gettext locales (`mkdocs/themes/{mkdocs,readthedocs}/`); a livereload dev
server; the built-in `search` plugin (`mkdocs/contrib/search/`); a large
dogfooded user/developer guide under `docs/`; and unittest suites colocated
in `mkdocs/tests/`.

The ranking front-loads repository identity and the package map, then the CLI
surface, then the configuration schema (the single most-queried surface for
both users and plugin authors), then the plugin/event API, then the document
model and build pipeline, then themes/localization/dev-server/utilities, and
finally the documentation corpus, test suite, and project tooling. Symbol
rosters are ranked before bodies so that "where does X live" is answerable
from the snapshot and "what does X do" costs at most one file read.
"""




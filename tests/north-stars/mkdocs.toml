fixture = "mkdocs"
revision_pin = "28625367"
summary = """
MkDocs is a Python static site generator for project documentation: it
takes a tree of Markdown files plus a single `mkdocs.yml` configuration
file and produces a static HTML site. CLI subcommands are `build`,
`serve` (with livereload), `gh-deploy`, `new`, `get-deps`. The codebase
is a single Python package `mkdocs/` with `commands/`, `config/`,
`structure/`, `plugins.py`, `theme.py`, `livereload/`, `utils/`,
`contrib/search/` (the built-in plugin), and two built-in themes
(`mkdocs/themes/{mkdocs,readthedocs}`) carrying Jinja templates,
CSS/JS, and gettext locale catalogs for ~17 languages. Documentation
lives in `docs/` (and is itself built with mkdocs, dogfooding). Tests
are unittest-based under `mkdocs/tests/`, mirroring the package layout.

The ranking serves the full distribution of dev queries: "where is the
CLI defined / how do I add a subcommand", "what config options exist
and how are they validated", "what plugin events can I hook", "how is
a page rendered from Markdown to HTML", "how does the livereload
server work", "where are the themes / how do I add a translation",
"how does the built-in search plugin work", "what changed between
versions". Early batches cover orientation + top-level structure;
middle batches expose the config / plugin / structure API surfaces
(class names, on_* event names, field names) so an agent can locate
features; later batches surface docs site structure, locale/asset
breadth, and the test tree.
"""


fixture = "mkdocs"
revision_pin = "28625367"
summary = """
MkDocs: a Python CLI/library that builds static documentation sites from a
directory of Markdown files (`docs/`) driven by one YAML config (`mkdocs.yml`).
This repo is dogfooded: its own `mkdocs.yml` + `docs/` is the MkDocs project
site, built by the very code in `mkdocs/`. Core domains: CLI entry (`__main__.py`
-> commands/{build,serve,gh_deploy,new}.py), the config schema
(`config/defaults.py` MkDocsConfig + `config/config_options.py` option types),
the plugin/event system (`plugins.py` BasePlugin hooks), the structure domain
model (`structure/{files,nav,pages,toc}.py`), two built-in themes
(`themes/{mkdocs,readthedocs}/`) with Jinja templates + i18n locale catalogs,
a bundled search plugin (`contrib/search/`), a live-reload dev server
(`livereload/`), and a sizeable `mkdocs/tests/` suite (unit + integration
fixture projects). Ranking serves the full spread of dev tasks: "how do I
build/serve/deploy", "what config keys exist and what do they do", "how do
plugins hook into the build", "where's the Page/File/Nav model", "how is a
theme structured", as well as narrower debugging/reading tasks that benefit
from precise file+line pointers over prose.
"""


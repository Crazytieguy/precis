fixture = "monaco-editor"
revision_pin = "6c8488c6"
summary = """
Monaco Editor — the browser-based code editor that powers VS Code,
packaged as the `monaco-editor` npm library. It enhances the upstream
`monaco-editor-core` (compiled from VS Code) with a large catalog of
basic-language Monarch tokenizers (~85 languages under
`src/languages/definitions/`), rich language services for CSS/HTML/
JSON/TypeScript backed by web workers (`src/languages/features/`),
~63 editor contrib features that side-effect-register on import
(`src/features/`), an experimental LSP client subpackage
(`monaco-lsp-client/`), a community webpack plugin (`webpack-plugin/`),
the public playground/docs website (`website/`), integration samples
(`samples/`) and Playwright smoke tests (`test/`). The ranking
optimizes for the wide query distribution this repo attracts: "how do
I integrate / bundle / configure?" (samples + docs + webpack-plugin),
"add a new language", "find a feature's source", debugging the build
pipeline (ESM/AMD rollup/vite), worker plumbing, and one-off API
questions on the language-service configuration surfaces.

Breadth dominates depth: most files are short shims or per-language
contributions, so the snapshot prioritizes exposing the directory
shape (locations of every feature, every language, every adapter)
over deep dives into any single file. The TypeScript language service
in `src/languages/features/typescript/` is by far the most semantically
dense and gets disproportionate depth.
"""


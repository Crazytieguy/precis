fixture = "monaco-editor"
revision_pin = "6c8488c6"
summary = """
`monaco-editor` (v0.55.1) is *not* the editor itself: the editor core is generated from VS Code
and consumed here as the npm package `monaco-editor-core` (pinned by `vscodeRef` in
package.json). This repository is the packaging + language-support layer on top of it. Its
substance is `src/`: `src/index.ts` re-exports the core editor API (`src/editor.ts`), pulls in 65
editor-feature shim modules (`src/features/<feature>/register.js`), 84 Monarch language
definitions (`src/languages/definitions/<lang>/`), and four *rich* language services that run in
web workers (`src/languages/features/{css,html,json,typescript}`). Around that sit four
satellites: `monaco-lsp-client/` (a new LSP client package), `webpack-plugin/`
(monaco-editor-webpack-plugin), `build/`+`scripts/` (the ESM/AMD dist build), and
`samples/`+`test/`+`website/`.

The ranking front-loads (a) what the project is and where the boundary with monaco-editor-core
lies, (b) the entry-point/registration chain an agent must trace for almost any change, and
(c) the configuration surfaces users actually ask about (`cssDefaults`/`jsonDefaults`/
`typescriptDefaults`, `ModeConfiguration`, `DiagnosticsOptions`, `CompilerOptions`,
`MonacoEnvironment.getWorker`). Directory listings are used aggressively as cheap breadth: the
per-language and per-feature directories are huge and uniform, so one `entries = "all"` listing
plus one worked example of the uniform file shape answers far more queries per token than any
single file body. Deeper bodies (worker plumbing, build scripts, satellites, tests/website/CI)
follow in that order.
"""


fixture = "monaco-editor"
revision_pin = "6c8488c6"
summary = """
monaco-editor is the wrapper repo that packages the browser code editor used by
VS Code. Its own src/ is a thin shim: it does NOT contain the editor engine
(that lives in the `monaco-editor-core` npm devDependency, built from the
separate microsoft/vscode repo and not vendored into this fixture) — instead
src/ lazily re-exports vscode-core contribution modules under a stable
`monaco-editor` package surface, adds ~81 Monarch tokenizers for lightweight
syntax highlighting (src/languages/definitions), and adds worker-backed rich
IntelliSense for css/html/json/typescript (src/languages/features). Around
that shim sits: a multi-target build (ESM via rollup, AMD-min-dev via vite, in
build/esm + build/amd) producing out/monaco-editor; a community webpack plugin
(webpack-plugin/); a new (0.55) native LSP client (monaco-lsp-client/, alpha);
smoke/manual tests and 13 bundler samples; and a separate website/ playground
app. Session queries span the full distribution: "how do I add a
language/feature", "where is X wired to vscode-core", "how do web workers get
resolved at runtime", "how do I build/test/package this", "what's the LSP
story", "how do I integrate with webpack/vite/parcel". Given the 10k-token
cap and this repo's huge scale (a 200k-line bundled typescriptServices.js, 81
language dirs, 64 feature dirs, 5 semi-independent subprojects), the ranking
buys breadth first — complete rosters with exact per-item locations for the
two biggest catastrophic-omission risks (features, languages) and a listing
of every subproject/build surface — and reserves full-file depth for the few
files that are either genuinely unique (find/register.js's a11y patch) or
central mechanism (the _.contribution.ts loader, workers.ts's environment
contract). Deep dives into near-duplicate content (81 near-identical register.ts bodies
across src/languages/definitions) are represented by one grounded example
plus a complete name/location roster, once the shared pattern is documented
once via _.contribution.ts / CONTRIBUTING.md. The monaco-lsp-client
subproject's 22 structurally-similar LSP feature adapters get the same
complete name/location roster (6.2) without a matching single-adapter deep
dive, given the tighter budget remaining at that tier.
"""


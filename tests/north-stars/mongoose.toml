fixture = "mongoose"
revision_pin = "1d373ce5"
summary = "Mongoose 7.21 (Cesanta): an embedded C/C++ network library - event-driven non-blocking TCP, UDP, HTTP, WebSocket and MQTT, plus an optional built-in TCP/IP stack, a built-in TLS 1.3 stack and OTA firmware updates for bare-metal MCUs. The tree has an unusual shape that this ranking front-loads: the real sources are the ~118 flat files in src/ (plus src/drivers/), while the root mongoose.c/mongoose.h are generated amalgamations produced by rules in test/Makefile. Order: (1) identity, root layout, version, the canonical usage example and the amalgamation rules; (2) the src/ roster split into closed classes - core, protocols, built-in stack, TLS, OTA, arch, drivers - plus the test/, tutorials/, resources/ and CI listings; (3) the core API (event table, mg_connection, mg_mgr, mg_str, iobuf, timers, logging); (4) the protocol headers that carry the most traffic - HTTP, WebSocket, MQTT, TLS, JSON/JSON-RPC - with full signatures for HTTP and name rosters elsewhere; (5) compile-time configuration and the build/test entry points; (6) the built-in TCP/IP stack and its driver contracts; (7) implementation landmarks inside the big .c files; (8) the unit-test harness and the files of a runnable example. Headers not reached here (dns.h, ota.h, dash.h, printf.h, fs.h, modbus.h, sntp.h, url.h, base64.h, wifi.h, l2.h, phy.h) are named in the tier-2 listings, so they are one file read away."


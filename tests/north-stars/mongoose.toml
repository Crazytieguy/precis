Every NIC/MAC/PHY/WiFi/SDIO driver Mongoose ships, named at one
shot: at_cmd, cmsis, cyw (Cypress WiFi), imxrt (NXP IMXRT),
nxp_wifi, phy (generic PHY), pico-w, ra (Renesas RA),
rw612 (NXP RW612), same54 (Microchip SAME54), sdio, st67w6, stm32f,
stm32h, tm4c (TI Tiva), tms570 (TI TMS570), w5100, w5500
(Wiznet), xmc (Infineon XMC4), xmc7 (Infineon XMC7). Header + impl
pair for each (except w5100/w5500 which are .c only).
"""
[batches.content]
kind = "fs"
groups = [{ parent = "src/drivers", entries = "all" }]

[[batches]]
id = "3.3"
descriptor = "tutorials/ top-level taxonomy"
justification = """
The top-level `tutorials/` directory is organized by protocol
(http, mqtt, websocket, udp, tcp, tcpip, tls, smtp) and by board
vendor (arduino, stm32, nxp, ti, infineon, renesas, wch, pico-sdk,
zephyr, micropython). Plus core (multi-threaded, memory, timers,
embedded-filesystem), device-dashboard, and webui. Tells agents
"there are dozens of working examples per protocol and per board".
"""
[batches.content]
kind = "fs"
groups = [{ parent = "tutorials", entries = "all" }]


[[batches]]
id = "3.4"
descriptor = "Built-in TCP/IP driver vtable (struct mg_tcpip_driver)"
justification = """
mongoose.h:3424-3432 — struct mg_tcpip_driver (init/tx/rx/poll
function pointers) and the mg_tcpip_event_handler_t typedef. The
minimum surface for "how does a driver plug into mip?". The full
struct mg_tcpip_if (with all DHCP / link-state / statistics fields)
and the mg_tcpip_init/free/qwrite/arp_request entry points sit
nearby at mongoose.h:3434-3513; not included here to stay under the
budget cap but the agent has the location.
"""
predecessor = "1.10"
[batches.content]
kind = "lines"
spans = [{ path = "mongoose.h", start = 3424, end = 3432, render = { kind = "full" } }]


[[batches]]
id = "3.5"
descriptor = "src/config.h pointer — MG_ENABLE_TCPIP and key build switches"
justification = """
src/config.h:4 / :16 / :70. Three concrete lines from the
compile-time switch file: MG_ENABLE_LOG (default 1), MG_ENABLE_TCPIP
(default 0, opt-in for the built-in stack), MG_ENABLE_DIRLIST
(default 0, opt-in for HTTP directory listing). Tells the agent the
file exists and shows the canonical `#define MG_ENABLE_X N`
pattern — every other build switch follows the same shape, with
~25 distinct switches between lines 3 and 212.
"""
[batches.content]
kind = "lines"
spans = [
  { path = "src/config.h", start = 4, end = 4, render = { kind = "full" } },
  { path = "src/config.h", start = 16, end = 16, render = { kind = "full" } },
  { path = "src/config.h", start = 70, end = 70, render = { kind = "full" } },
]


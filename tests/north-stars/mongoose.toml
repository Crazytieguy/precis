fixture = "mongoose"
revision_pin = "1d373ce5"
summary = """
Mongoose is a single event-driven C/C++ networking library (cesanta/mongoose):
one mg_mgr + mg_connection model with MG_EV_* callbacks drives TCP/UDP, HTTP,
WebSocket, MQTT (3.1.1/5), DNS/mDNS, SNTP, Modbus, JSON-RPC, and TLS (builtin
or mbedTLS/OpenSSL/WolfSSL), plus an optional built-in TCP/IP stack with 38
embedded MAC/PHY/Wi-Fi driver backends. Canonical source of truth is the
per-module split under src/*.{c,h} (~118 files); root mongoose.c/mongoose.h
are the generated single-file amalgamation end users copy into their own
build (see resources/pack.js / test/pack.c for the generation tooling).
Ranking serves: (a) "how do I wire up protocol X" (dense public headers for
the README-advertised protocols: HTTP/MQTT/WS/JSON/SNTP, plus entry points
for the less-advertised ones: DNS/mDNS, Modbus — JSON-RPC/rpc.h, like most
other subsystems, is named via the src/ listing only, one grep away), (b) "what config
knob controls Y" (config.h, arch.h), (c) build/test/CI entry points, and
(d) breadth-first orientation across src/, drivers/, test/, and tutorials/
so an agent never has to guess what else exists before drilling in. Given a
hard token budget, depth is deliberately biased toward the core event model
and the two headline protocols (HTTP, MQTT); most other subsystems (TLS
internals, the built-in TCP/IP stack, OTA, the device-dashboard framework,
per-chip drivers) are named via filesystem listings only, one grep away.
"""


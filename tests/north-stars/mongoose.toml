fixture = "mongoose"
revision_pin = "1d373ce5"
summary = """
Mongoose is a single-header embedded C network library (v7.21) from
Cesanta — event-driven TCP/UDP/HTTP/WebSocket/MQTT/MQTT5/SNTP/Modbus
plus a built-in TCP/IP stack ("mip") with bare-metal drivers for
STM32/NXP/Microchip/TI/Renesas/Infineon/Wiznet/Cypress/WCH, OTA flash
backends, multiple TLS backends (built-in / mbedTLS / OpenSSL /
WolfSSL), and a device-dashboard subsystem. Dual GPL-2.0-or-commercial
licensed.

Distribution shape is unusual and load-bearing: the library is
shipped as two amalgamated artifacts at the root, `mongoose.h`
(~4.3k lines) and `mongoose.c` (~30.5k lines), produced from the
modular `src/` tree (97 files including 39 driver pairs under
`src/drivers/`). End users typically drop those two files into their
project; contributors edit the `src/` tree and regenerate. The single
public API is a flat namespace of `mg_*` functions and `struct mg_*`
types.

Plausible queries this ranking serves: "how do I serve files with
HTTP?", "what's the MQTT client event handler signature?", "how is
TLS configured?", "what fields are on `struct mg_connection`?", "how
does the built-in TCP/IP stack interact with a driver?", "where do I
add a new MCU driver?", "what MG_ENABLE_* options exist?", "where's
the test for X?", and "what does a minimal mongoose program look
like?". The walker should front-load the public API surface (header
signatures, struct fields, event enum) and the breadth of supported
protocols / drivers / tutorials, because most user questions are
"where is X named" or "what's the shape of Y" rather than "how does
the implementation of Z work".
"""


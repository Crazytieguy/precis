justification = "Where prefill collapses to one hidden state per sequence using `context.cu_seqlens_q[1:] - 1`, and how tensor-parallel logits are gathered onto rank 0 (returning None on other ranks — the reason ModelRunner only samples on rank 0). Two behaviours that surprise readers of the sampling path."

fixture = "nano-vllm"
revision_pin = "2f214426"
summary = """
nano-vllm is a from-scratch reimplementation of vLLM's offline inference
engine in ~1200 lines of Python, packaged as `nanovllm`. Its public
surface is two names — `LLM` (a bare subclass of `LLMEngine`) and
`SamplingParams` — while every tunable lives on the `Config` dataclass
that `LLMEngine.__init__` filters kwargs into.

The substance is split three ways and the ranking follows that split.
(1) `nanovllm/engine/`: `LLMEngine` (tokenizer + tensor-parallel worker
spawn + the `generate`/`step` loop), `Scheduler` (a waiting/running
deque pair implementing prefill-then-decode batching with preemption),
`Sequence` (per-request token state, block bookkeeping, and the
`__getstate__`/`__setstate__` pair that makes it cheap to pickle to TP
workers), `BlockManager` (paged KV blocks with xxhash-keyed prefix
caching), and `ModelRunner` (CUDA setup, KV-cache sizing from free GPU
memory, prefill/decode tensor marshalling, CUDA-graph capture, and a
shared-memory RPC to rank>0 workers). (2) `nanovllm/layers/` +
`nanovllm/models/qwen3.py`: the tensor-parallel building blocks
(Column/Row/QKV/Merged linear shards, vocab-parallel embedding and LM
head, RMSNorm, rotary embedding, a Triton KV-cache store kernel wrapped
around flash-attn) and the single supported architecture assembled from
them. (3) `nanovllm/utils/`: a process-global `Context` dataclass that
smuggles per-step attention metadata into layer code, and a safetensors
weight loader driven by `packed_modules_mapping`.

Ranking priorities: identity and the two-name public API first, then the
directory map and per-file symbol rosters so any "where is X" question is
one grep away, then engine semantics (scheduler policy, prefix caching,
sequence state) which are what the repository exists to demonstrate, then
model execution and the layer/model code, and finally the benchmark claim. The
cap forces real omissions: bench.py and example.py bodies, LICENSE and
.gitignore are left to the root listing, and several conventional layer
bodies stay at roster granularity.
Non-obvious things worth surfacing early because the code does not
announce them: subpackages have no `__init__.py`, greedy sampling is
asserted away in `SamplingParams`, and `kvcache_block_size` is asserted
to be a multiple of 256 while `Sequence.block_size` is hardcoded to 256.
"""


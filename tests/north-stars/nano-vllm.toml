fixture = "nano-vllm"
revision_pin = "2f214426"
summary = """
Nano-vLLM is a ~1,200-line Python reimplementation of vLLM: an offline LLM
inference engine for the Qwen3 family with prefix caching, tensor parallelism,
flash-attention, torch.compile, and CUDA-graph decode. Public API is a single
class hierarchy `LLM(LLMEngine)` plus a `SamplingParams` dataclass, exposed
from `nanovllm/__init__.py`; usage is `LLM(model_path).generate(prompts, sp)`.
Under the hood `LLMEngine` wires a `Scheduler` (prefill/decode with preemption),
a `BlockManager` (xxhash-keyed KV-cache prefix caching), a `Sequence` request
object, and a `ModelRunner` that owns the model + KV-cache tensors + CUDA
graphs and dispatches over `multiprocessing.SharedMemory` to TP worker ranks.
The model itself (`models/qwen3.py`) is assembled from hand-written tensor-
parallel layers in `nanovllm/layers/` — Attention (flash-attn + Triton kvcache
store kernel), {Column,Row,Merged,QKV}ParallelLinear, VocabParallelEmbedding /
ParallelLMHead, RMSNorm, RotaryEmbedding, SiluAndMul, Sampler.

Query distribution this ranking serves: explanations of the engine loop /
scheduler / prefix cache; questions about the public API surface and how
sampling params flow; debugging weight-loading / TP / KV-cache layout;
extending to new model architectures by mirroring `qwen3.py`; reading any
single layer in isolation. Breadth-over-depth: the snapshot should make the
location of every public class/function obvious so follow-up reads are one
hop away, with semantic bodies inlined for the most load-bearing pieces
(scheduler, block manager, attention, model runner orchestration).
"""


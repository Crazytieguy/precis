fixture = "nano-vllm"
revision_pin = "2f214426"
summary = """
nano-vllm is a ~1500-line, single-package reimplementation of vLLM's inference \
engine, hard-wired to one model family (Qwen3). It has no test suite, no CI, \
and no config file format of its own -- it's driven entirely by Python kwargs \
into LLM(...)/SamplingParams(...). A session against this repo could be \
'explain the prefix-caching scheme', 'add a sampling knob', 'why does TP rank 1 \
hang on startup', 'what's the exact benchmark invocation', or 'trace a request \
from add_request to token output'. Given the repo's line-density (long, \
type-hinted, chained-call Python), a frozen North Star can only afford to spend \
full-body tokens on a fraction of it, so the ranking leans hard on cheap \
name-only "locations" catalogs (every class/method name in a file) to fix each \
file's surface for free, and reserves full bodies for a small set of genuinely \
load-bearing spans, in this order of priority: (1) project identity and the \
full file tree; (2) the three-class public API (LLM/SamplingParams/Config); \
(3) the engine's own control flow -- Scheduler's prefill/decode loop, \
BlockManager's hash-based prefix-caching allocator, Sequence's block-arithmetic \
properties -- nano-vllm's actual novel content, not boilerplate transformer \
code; (4) ModelRunner's per-step dispatch and its shared-memory multi-process \
RPC (the most surprising infra decision, alongside CUDA-graph capture which is \
named but not spent on); (5) the tensor-parallel embedding/attention/linear \
primitives and the Qwen3Attention/Qwen3ForCausalLM wiring, plus name-only \
locations for layers/layernorm.py and layers/rotary_embedding.py (the two \
layers/ files everything else in this tier's roster is built around but that \
carry no novel logic of their own); (6) the two runnable scripts that ground \
'how do I actually run this' in concrete commands. Every rendered span in this \
draft ends at a natural boundary -- end of file, or the line before the next \
top-level def/class/section -- rather than mid-body; there are no ellipsis \
spans because none were needed, not because coverage was skipped.
"""


# ---------------------------------------------------------------------
# Tier 3 — engine semantics. The serving loop, the scheduling policy,
# per-sequence state, and the paged-KV / prefix-cache allocator. This is
# what the repository exists to demonstrate, so bodies are rendered in
# full here rather than summarized.
# ---------------------------------------------------------------------

[[batches]]
id = "3.1"
descriptor = "LLMEngine.step and is_finished"
justification = "Ten lines that are the whole engine in miniature: schedule() returns (seqs, is_prefill), model_runner.call(\"run\", ...) executes them, scheduler.postprocess appends the sampled tokens, finished sequences are harvested as (seq_id, completion_token_ids), and num_tokens is signed to distinguish prefill throughput from decode. Ranked first in this tier because it names the collaborators every later batch elaborates."
predecessor = "2.3"
content = { kind = "lines", spans = [ { path = "nanovllm/engine/llm_engine.py", start = 48, end = 57, render = { kind = "full" } } ] }

[[batches]]
id = "3.2"
descriptor = "Scheduler construction and queue predicates"
justification = "Scheduler.__init__ copying max_num_seqs / max_num_batched_tokens / eos off Config, constructing the BlockManager from num_kvcache_blocks and kvcache_block_size, and declaring the two deques `waiting` and `running` that are the entire scheduler state — plus is_finished and add. Explains the data structure before the policy."
predecessor = "2.4"
content = { kind = "lines", spans = [ { path = "nanovllm/engine/scheduler.py", start = 10, end = 22, render = { kind = "full" } } ] }

[[batches]]
id = "3.3"
descriptor = "Scheduler.schedule — the prefill pass"
justification = "The first half of the scheduling policy: pull from `waiting` while under max_num_seqs, stop when num_batched_tokens + len(seq) would exceed max_num_batched_tokens or block_manager.can_allocate fails, allocate, count only uncached tokens toward the batch budget (`len(seq) - seq.num_cached_tokens`), flip status to RUNNING, and return early with is_prefill=True if anything was scheduled. Prefill strictly preempts decode — a policy question an agent will otherwise mis-answer."
predecessor = "2.4"
content = { kind = "lines", spans = [ { path = "nanovllm/engine/scheduler.py", start = 24, end = 42, render = { kind = "full" } } ] }

[[batches]]
id = "3.4"
descriptor = "Scheduler.schedule — the decode pass and preempt"
justification = "The while/else loop that appends one token slot per running sequence, evicting the most recently queued sequence (`self.running.pop()`) when can_append fails and falling back to preempting the sequence itself when it is the only one left, then `assert scheduled_seqs` and restoring order with extendleft(reversed(...)). preempt's body shows eviction is a full deallocate plus re-queue at the front of `waiting`, i.e. recompute-not-swap."
predecessor = "2.4"

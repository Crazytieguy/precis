justification = "The most intricate function in the repository: per block, hash only full blocks (partial blocks get h = -1), look up hash_to_block_id, treat a token_ids mismatch as a miss, latch cache_miss so no block after a miss can hit, bump seq.num_cached_tokens by block_size on a hit, ref-count a block already in used_block_ids instead of re-allocating, and publish the hash. Anyone debugging prefix caching needs exactly these lines."

[[batches]]
id = "5.3"
descriptor = "model_runner.py: exit, loop, read_shm, write_shm, call -- the shared-memory RPC"
justification = "The full RPC mechanism behind tensor parallelism: rank 0's call() pickles (method_name, *args) into a length-prefixed SharedMemory buffer and sets one Event per worker; each worker's loop() blocks on its Event, unpickles, and re-invokes call() locally, exiting only on method_name==\"exit\". A distinctive, easy-to-miss architectural choice (no torch.distributed RPC, no sockets) worth surfacing verbatim rather than described; __init__'s own setup of this same SharedMemory segment is named in 5.1 but not spent here."
predecessor = "5.1"
content = { kind = "lines", spans = [ { path = "nanovllm/engine/model_runner.py", start = 50, end = 89, render = { kind = "full" } } ] }


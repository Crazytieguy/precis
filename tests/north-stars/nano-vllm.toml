[[batches]]
id = "5.2"
descriptor = "model_runner.py: run() and run_model() -- the per-step dispatch"
justification = "run() picks prepare_prefill or prepare_decode, calls run_model, then samples (rank 0 only) and resets the context; run_model() itself branches on `is_prefill or enforce_eager or bs > 512` to call the eager model directly versus replaying a captured CUDA graph after copying inputs into its fixed buffers. This is the answer to 'what actually happens when a batch executes' -- ranked as the single highest-value model_runner span since nearly every model_runner question routes through it."

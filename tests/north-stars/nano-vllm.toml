[[batches]]
id = "5.6"
descriptor = "Sampler.forward — the exponential-noise argmax trick"
justification = "Six lines that are easy to misread as top-k sampling: logits are divided by per-sequence temperatures, softmaxed, then divided by an Exponential(1) sample clamped at 1e-10 and argmaxed — the Gumbel-max reparameterization of multinomial sampling, torch.compile'd. Explains why SamplingParams asserts temperature > 1e-10 and why there is no greedy path."
predecessor = "2.8"

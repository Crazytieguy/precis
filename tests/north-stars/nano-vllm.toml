descriptor = "Qwen3Attention.forward — QKV split, q/k norm, RoPE"
justification = "The one model method with real logic: a single qkv_proj split into q/k/v by q_size/kv_size, reshaping to (-1, num_heads, head_dim), the Qwen3-specific per-head q_norm/k_norm RMSNorms applied only when qkv_bias is false, rotary application, the Attention call and the o_proj flatten. Anyone porting a second architecture reads this first."

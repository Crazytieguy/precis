fixture = "nats-server"
revision_pin = "8f41bed8"
summary = """
nats-server is the reference NATS messaging server: a Go implementation of
the NATS protocol with JetStream persistence, clustering (routes), gateways
between clusters, leafnodes (account-scoped tunnels), MQTT 3.1.1 and
WebSocket adapters, JWT-based account auth, and HTTP monitoring. A single
~370k-LoC `server/` package holds nearly all server logic; sibling
packages (`conf`, `logger`, `internal/*`) handle config parsing and shared
utilities. `main.go` is a thin shim — `server.ConfigureOptions` parses
flags+config, `server.NewServer`, `s.ConfigureLogger`, `server.Run(s)`,
`s.WaitForShutdown()`. The CLI flag inventory (full text of `usageStr`)
lives in main.go; the equivalent conf-file keys are in `Options` struct
field JSON tags inside server/opts.go.

The agent query distribution skews heavily toward navigating this very
large monolithic package: "where is X feature implemented", "what config
keys exist", "what does Y option mean", "how does subsystem Z hook in",
"what's the data model for streams/consumers/accounts". Catastrophic
omission risk is high — the `server/` directory has 156 files; partial
listing misleads. Priority is therefore breadth of file pointers and
signature locations first, then short concept ledes. The 10k-token cap
punishes large struct dumps disproportionately on a codebase this size;
what's included in full is the lock-ordering invariants and the on-wire
INFO frame.
"""


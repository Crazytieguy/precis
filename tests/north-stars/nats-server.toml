fixture = "nats-server"
revision_pin = "8f41bed8"
summary = """
nats-server is the Go reference implementation of the NATS messaging server (github.com/nats-io/nats-server),
a single `package server` (~140 .go files, ~370k lines incl. co-located _test.go files) plus a handful of
support packages (conf config-format parser, logger, internal/{ldap,ocsp,fastrand,antithesis,testhelper}, and
server-scoped leaf packages: avl/gsl/stree/thw/ats for JetStream storage data structures, and
certstore/certidp/tpm/sysmem/pse for platform/security adapters). One process, one binary (`main.go` ->
`server.NewServer` -> `server.Run`), configurable via CLI flags, a custom `conf` config-file format, or both.
Core subsystems: client protocol handling + pub/sub routing (client.go, parser.go, sublist.go), accounts/
security (accounts.go, auth.go, auth_callout.go, jwt.go, nkey.go), clustering (route.go, gateway.go, raft.go),
leaf/edge federation (leafnode.go), JetStream (jetstream*.go, stream.go, consumer.go, store.go +
memstore.go/filestore.go), protocol adapters (mqtt.go, websocket.go), and HTTP monitoring/system events
(monitor.go, events.go). The query distribution this NS serves: "how do I configure/run/build/test this",
"where does subsystem X live and what's its public surface", "how does the wire protocol/clustering/JetStream
storage work", and debugging entry points (lock ordering, error catalog, CI test matrix). Given this repo's
size (~300 files across ~20 directories, many platform-specific variants of the same file, colocated
_test.go files), ranking prioritizes fs-listing closure and a curated set of the most load-bearing struct/
const/interface shapes and config samples over exhaustive per-file function enumeration, which this NS's
token budget cannot afford at the depth a repo this large would otherwise warrant. Where a subsystem isn't
expanded in a code batch, its file(s) are still named in a tier-2 directory listing, one grep away.
"""


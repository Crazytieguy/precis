fixture = "nats-server"
revision_pin = "8f41bed8"
summary = """
nats-server is the Go implementation of the NATS messaging server: a single binary (main.go) wrapped around one very large flat package, server/ - 71 implementation and data files, 73 colocated test files, twelve subpackages, ~370k lines in all - plus a hand-written config-language package (conf/), a logging package (logger/), small internal/ helpers, and a separate black-box integration suite in test/.

The ranking is built around the fact that no snapshot can hold this repository. It front-loads identity and a complete filesystem map, then the user-facing surfaces that are small and self-describing (the CLI usage string, the config language with worked examples, the complete set of top-level config keys), then the file rosters that turn every later 'where is X' question into one targeted read. After that it proceeds subsystem by subsystem: server lifecycle, the seven connection kinds, lock ordering, the INFO protocol, the monitoring endpoints and their handlers, the protocol op handlers and the sublist, options internals, accounts, auth and the system-account subjects, JetStream with its storage and raft layers, the protocol parser and the MQTT design doc, and finally the integration-test harness, the CI test split and the README itself. Within a subsystem the preference is for declaration-line rosters - types, handlers, parsers, accept loops - over bodies: line numbers come free with every rendered line, and breadth beats depth when the alternative is grepping a 13k-line file.

Ellipsis markers appear wherever a span stops inside a longer const block, struct, interface or switch, so a partial rendering never reads as a complete one.
"""


fixture = "neco"
revision_pin = "9e8e19e4"
summary = """
Neco is a single-file C library that provides Go-style concurrency primitives
on top of stackful coroutines: starting/joining/cancelling coroutines,
channels, generators, mutexes/rwlocks, waitgroups, condition variables,
non-blocking POSIX I/O wrappers, networking helpers (dial/serve), signal
handling, buffered streams, deadlines, and a background-worker bridge to OS
threads. The user-facing API lives in neco.h (~460 LOC, 18 Doxygen-grouped
sections). The full implementation is amalgamated into neco.c (~8.7k LOC),
which embeds three sibling libraries (sco scheduler, stack allocator,
worker thread pool) plus an AA-tree macro header, and is what consumers
actually compile. The repo also ships an autogenerated docs/API.md
reference, a directory of small idiomatic examples, and an extensive C test
suite driven by tests/run.sh.

Plausible queries the snapshot serves: "how do I send between coroutines"
(channel/generator API), "what error codes does neco return" (NECO_* defines),
"how is the runtime scheduler structured" (rt_scheduler, runtime struct,
embedded sco/llco), "is X available on Windows" (platform notes / compile
options), "how do I add a feature/test" (run.sh, test_*.c shape), "what's
the dependency graph" (deps/ + embed.sh). Because the implementation is one
giant file, line-pointers into named sections of neco.c are uniquely
valuable; the agent can grep for "// BEGIN X" / "// channels" banners to
jump directly.
"""


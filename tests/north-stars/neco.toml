fixture = "neco"
revision_pin = "9e8e19e4"
summary = """
Neco is a small single-file C library (neco.c/neco.h) implementing stackful \
coroutines for concurrent I/O in C, with channels/generators/mutexes/\
waitgroups/condvars, deadline+cancelation semantics on every blocking op, and \
POSIX-style networking wrappers. It embeds three vendored dependencies (sco.c \
scheduler, aat.h AA-tree, worker.c thread pool) via a BEGIN/END amalgamation \
script (deps/embed.sh). Dev sessions on this repo skew toward: (a) \
learning/using the API (README's worked examples + neco.h's @defgroup \
surface — the README's own prose/example bodies are out of this NS's budget, \
see below), (b) debugging or extending coroutine/channel/scheduler internals \
in neco.c, (c) adding a test_*.c following the existing do_test/expect \
harness, and (d) build/CI questions (tests/run.sh flags, amalgamation vs \
NECO_NOAMALGA). Given the 10k-token ceiling (this fixture's neco.h+neco.c \
alone are ~9200 lines), this NS deliberately spends almost its entire budget \
on breadth and precise pointers rather than prose: full fs listing of every \
directory, the complete neco.h signature surface (cheap, dense, load-bearing \
for nearly every query), a roster of every one of the ~133 top-level neco_* \
definitions in neco.c (so the agent never has to grep blind for "does X \
exist"), and doc-comment + implementation bodies for just the 3 highest-value \
non-obvious functions (cancelation, channel send, channel recv). The \
tests/tests.h do_test/expect harness — the scaffold every test_*.c reuses — \
gets its own tier since query (c) depends on it directly. Worked README \
examples, the vendored deps/ sources, and individual test_*.c bodies didn't \
fit the budget and are left for the agent to open on demand — their \
filenames are still visible via the tier-2 directory listings.
"""


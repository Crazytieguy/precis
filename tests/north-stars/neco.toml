[[batches]]
id = "4.6"
descriptor = "neco.c — rt_scheduler core loop"
justification = "The 23-line rt_scheduler() body: while sco_active(), call rt_sched_paused_step (deadline + event-queue wake-up phase), rt_rc_step, sco_resume(0) to advance the sco scheduler, then on exit close qfd and free pooled coroutines. The shortest possible answer to 'how does the Neco runtime tick?' — a zero-follow-up snippet for any scheduler-shape question."
[batches.content]
kind = "lines"
spans = [
    { path = "neco.c", start = 4272, end = 4294, render = { kind = "full" } },
]


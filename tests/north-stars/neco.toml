[[batches]]
id = "3.5"
descriptor = "The scheduler, context switching, and the thread-local runtime"
justification = """
Scheduling is delegated to sco (fair and deterministic: no coroutine takes priority, concurrent operations reproduce in a predictable order) and context switching to llco (assembly, roughly 11ns). One scheduler per thread; cross-thread coroutine communication must use pipes, eventfd or atomics; pthread mutexes and condvars behave badly inside coroutines. This answers the most common architectural question about the library outright.
"""
[batches.content]

fixture = "neco"
revision_pin = "9e8e19e4"
summary = """
Neco is a single-file C library -- neco.c plus neco.h, copied into a
project and compiled with `cc -c neco.c`, no build system -- providing stackful
coroutines on a fair, deterministic, thread-local scheduler. Its public surface is
about 119 functions in neco.h, organized into eighteen doxygen groups: coroutine
lifecycle, channels, generators, mutexes, waitgroups, condition variables,
non-blocking Posix wrappers, file-descriptor helpers, networking (dial/serve),
streams and buffered I/O, signals, random, a background worker, stats, global
environment, time constants, and a nineteen-value error-code table. Nearly every
blocking call has a `_dl` deadline twin and is cancelable, and those two
cross-cutting conventions carry more semantics than any individual signature.
neco.c is an amalgamation: lines 154-2834 are vendored copies of sco.c (the
scheduler, itself embedding llco.c context-switch assembly and aat.h), stack.c and
worker.c, regenerated by deps/embed.sh; Neco's own implementation follows.
docs/API.md is generated from doc comments and must not be hand-edited. Tests are a
shell-driven suite (tests/run.sh) of per-subsystem test_*.c files compiled with
-DNECO_TESTING against shim headers that let any syscall be forced to fail.

The ranking assumes the query is unknown at snapshot time. It puts identity and the
complete file map first, then the public API group by group -- the substance of this
repository really is one 460-line header -- then the cross-cutting semantics
(deadlines, cancelation, error handling, platform limits, scheduler model) that the
signatures imply but never state, then a navigational map of neco.c and its core
data structures, then the test harness, then vendored dependencies, one example and
project metadata.
"""


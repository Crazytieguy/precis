descriptor = "neco.c — error_guard / async_error_guard macros"
justification = "Every public neco_* function's implementation ends by calling one of these two macros — they set the thread-local `lasterr`, convert POSIX errno into a NECO_* code on -1, panic on NECO_INVAL/PERM/NOMEM if neco_env_setpaniconerror(true) was called, and (async variant only) immediately terminate the coroutine on NECO_CANCELED when NECO_CANCEL_ASYNC is active. Explains 'why did my operation panic' or 'why did my coroutine vanish mid-cancel' for literally any API call."

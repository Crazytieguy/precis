[[batches]]
id = "7.1"
descriptor = "neco.c — neco_cancel(_dl) implementation"
justification = "No doc comment exists for these two (neco.h's Cancelation group is undocumented beyond the group blurb), so this is the only place the semantics live: cancel finds the target coroutine, and if its cancel state is enabled sets co->canceled and wakes it immediately; otherwise the canceling coroutine queues onto the target's cancellist and retries once released. Directly explains the claim that 'a cancel takes higher priority than a deadline'."
predecessor = "6.1"
content = { kind = "lines", spans = [
  { path = "neco.c", start = 4640, end = 4681, render = { kind = "full" } },
] }


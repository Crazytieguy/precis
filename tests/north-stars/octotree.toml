fixture = "octotree"
revision_pin = "470747c7"
summary = """
Octotree v3.0.10 — a browser web-extension (Chrome/Firefox/Edge/Opera/
Safari/Brave) that injects a left-side file-tree sidebar into github.com
repo pages. Content script renders a jstree-driven sidebar, calls the
GitHub REST API (with optional access token) to fetch the repo tree,
handles PR-diff overlays, lazy-loads huge repos, and persists user
options via chrome.storage / localStorage. Pure jQuery + jstree, no
build framework — sources concatenated by gulp in a fixed dependency
order (util → core → adapters → views → main) into one content.js,
plus a less-compiled content.css and a webextension manifest.

The ranking prioritises (1) the gulp concat order in `gulpfile.js` —
the single most load-bearing file because it both lists every source
file and dictates the global execution / dependency order at the
content-script's IIFE scope — and (2) the Adapter/GitHub class hierarchy
in `src/adapters/`, which is where any non-trivial feature work or bug
fix is likely to land. Plausible queries skew toward: where is the
sidebar rendered? how is the GitHub tree fetched? how are options
persisted? what triggers a tree refresh? how is a PR-diff page handled?
how does it detect the current branch? what events fire when? Smaller
budgets get architecture + file inventory; larger budgets fill in
class method surfaces and the critical impl details (branch detection,
PR diffMap construction, error handling switch).
"""


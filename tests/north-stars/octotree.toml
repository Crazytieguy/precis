commit-id when type=='commit', 'master' for releases/tags, the branch
label from `.branch-select-menu summary`, commit href from
`.overall-summary .commits a`, tree/blob typeId, PR target branch from
`.commit-ref`, last-selected from currentRepo, cached default branch,
or finally a real API call. Includes the JSDoc explaining the two
GitHub branch-DOM structures (short vs. truncated). Zero follow-up for
any branch-detection question.

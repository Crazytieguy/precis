[[batches]]
id = "5.2"
descriptor = "adapter.js _handleError switch (HTTP status → user message)"
justification = """
The error-mapping switch in Adapter._handleError. Maps jqXHR.status to
{error, message}: 0 → Connection error, 409 → Empty repository, 401 →
Invalid token (delegated to octotree.getInvalidTokenMessage), 404 →
Private repository (prompts for token), 403 → either "API limit
exceeded" (X-RateLimit-Remaining=0) or "Forbidden" (also prompts for
token); fallback uses jqXHR.statusText. Most "why does Octotree show
error X?" tickets resolve here.
"""
predecessor = "3.9"
content.kind = "lines"
content.spans = [
  { path = "src/adapters/adapter.js", start = 146, end = 200, render = { kind = "full" } },
]

[[batches]]
id = "5.3"
descriptor = "github.js _getPatch — PR diffMap construction"
justification = """
The PR-page tree builder. Hits /pulls/{N}/files?per_page=300; for each
file emits a diffMap entry {type:'blob', diffId, action, additions,
deletions, sha, ...}, then walks each file's path components and
aggregates per-folder {filesChanged, additions, deletions} so parent
directories also get patch metadata. Returns a tree-shape array sorted
alphabetically. This metadata is what adapter.js _loadCodeTreeInternal
turns into the colored +N/-N badges and per-file diff anchor links.
"""
predecessor = "3.12"
content.kind = "lines"

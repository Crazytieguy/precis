fixture = "octotree"
revision_pin = "470747c7"
summary = """
Octotree: a browser extension (Chrome/Firefox/Edge/Safari/Brave/Opera) that
injects a resizable code-tree sidebar into github.com pages. This repository
is an archived, deliberately limited snapshot of what is otherwise
proprietary software, so the ranking treats it as read-mostly: agents will
be asked to explain how the sidebar works, how a GitHub page is detected and
turned into a jstree, where a user setting is stored, how the unbundled
files become one content script, and occasionally to patch or extend a
piece of it.

The codebase has no module system. Every file under `src/` is a bare script
concatenated in a fixed order by `gulpfile.js` and communicating through
`window` globals, so the ranking front-loads (a) the repository's identity
and complete filesystem shape, (b) the shared vocabulary those globals carry
-- `STORE` / `DEFAULTS` / `EVENT` in `src/core.constants.js`, the WebExtension
`manifest.json`, and the concat order in `buildJs` -- and (c) name-complete
symbol rosters for every class and top-level function in `src/`, so that any
"where is X" question is one grep away. Only then does it spend budget on
bodies: the adapter error table, GitHub repo/branch detection, the settings
template's `data-store` bindings, storage key routing, the tree-building
loop, and finally the gulp task graph, LESS variables, tooling config and
project metadata.
"""


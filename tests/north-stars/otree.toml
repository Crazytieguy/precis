fixture = "otree"
revision_pin = "a02bdf44"
summary = """
`otree` is a Rust terminal UI for browsing structured data files. It reads a
JSON / YAML / TOML / XML / HCL / JSONL document (from a path or stdin), converts
it into a `serde_json::Value`, builds a ratatui `tui-tree-widget` tree from it,
and shows a two-pane TUI: a collapsible tree overview on one side and a
syntax-highlighted data block for the selected node on the other, plus a header,
a footer, a filter input and a help popup. Everything visible — key bindings,
colors, layout, type labels — is user-configurable from `~/.config/otree.toml`,
and every config knob also has a CLI override.

The code splits cleanly into five concerns: the entry point and control flow
(`src/main.rs`, `src/ui/mod.rs`), the CLI surface (`src/cmd.rs`), the parse
layer (`src/parse/` — a `Parser` trait with one impl per format plus a
`SyntaxToken` highlighter), the config layer (`src/config/` — serde structs
with macro-generated defaults for keys, colors and type labels), and the widget
layer (`src/ui/` — an `App` event loop dispatching `Action`s to focused
widgets). Peripheral features live in their own small modules: `tree.rs`
(the data model), `live_reload.rs`, `edit.rs`, `clipboard.rs`, `debug.rs`.

The ranking front-loads what the program is and where its substance lives
(identity, directory rosters, the `run()` pipeline), then the CLI surface, then
the data + parse model, then the config schema, then the widget layer as
name-complete method rosters. It is aimed at the full spread of plausible
sessions: "add a new input format", "add a key binding", "why is this colour
wrong", "make the filter case-insensitive", "what does --to do", "where are the
tests". Build metadata, CI workflows, the changelog and the sample documents
are deliberately surfaced only as filenames in the directory listings: within a
10k budget those tokens buy more as source coverage.
"""


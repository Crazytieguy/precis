fixture = "otree"
revision_pin = "a02bdf44"
summary = """
otree is a single-binary Rust TUI (ratatui) that renders a JSON/YAML/TOML/XML/HCL/JSONL
file as a collapsible tree on the left with a syntax-highlighted, scrollable data block on
the right. Entry point src/main.rs wires: CLI parsing (src/cmd.rs) -> Config (src/config/*,
loaded from ~/.config/otree.toml or a --config path, seeded by config/default.toml) -> content
read (file arg, --live-reload watcher in src/live_reload.rs, or stdin) -> src/parse/*
(ContentType-dispatched Parser trait: json/yaml/toml/xml/hcl/jsonl/any-autodetect) -> src/tree.rs
(serde_json::Value -> tui_tree_widget::TreeItem tree + an ItemValue side-table keyed by
"a/b/0"-style path identifiers, holding pre-highlighted src/parse/syntax.rs SyntaxToken runs) ->
src/ui/* (App owns TreeOverview/DataBlock/Filter/Header/Footer/Popup; Action enum from
src/config/keys.rs routes key events; 'e' shells out via src/edit.rs, 'y'/'Y' write to the
system clipboard via src/clipboard.rs).

Expected query distribution: "how do I configure/rebind keys/theme this", "how does format X
get parsed/highlighted", "where does the tree get built from a serde_json::Value", "how does
filtering/scrolling/root-changing work in the TUI", "how do I build/test this", "add support
for format Y", "why does <action> do <behavior>", debugging a specific parser or a specific
UI widget. This is a dev/coding-agent session, not an end-user install: end-user packaging
docs (AUR/Homebrew, roadmap checklist) are deliberately thin so the 10k budget buys source
structure instead. The ranking favors: the actual default config file (config/default.toml)
as the cheapest evidence of the config schema; the shared Parser trait plus toml.rs's
distinctive section-path/complex-field-deferral logic as the one format deep-dived beyond
that trait, leaving json/xml/hcl/yaml at file-listing depth (1.4) rather than exhaustively
re-deriving every format parser at Full depth; struct locations for every default.toml
top-level config table and every UI widget so nothing is catastrophically omitted; and the
App::on_key dispatch as the hub that ties keybindings to widget behavior.
"""


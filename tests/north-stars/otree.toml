# AnyParser auto-detect. Bodies kept tight; the most-asked details
# (Parser-trait impl signature + extension/allow_array_root/parse_root
# behavior) are on the threshold cut, the deep highlight bodies are
# late.
# ----------------------------------------------------------------------

[[batches]]
id = "4.1"
descriptor = "parse/ module layout"
justification = """
Every immediate child of src/parse/ — any.rs, hcl.rs, json.rs,
jsonl.rs, mod.rs, syntax.rs, toml.rs, xml.rs, yaml.rs, plus the
test_cases/ directory. Confirms one parser per file.
"""
content = { kind = "fs", groups = [
  { parent = "src/parse", entries = "all" },
] }

[[batches]]
id = "4.2"
descriptor = "SyntaxToken enum"
justification = """
The shared token type all parsers emit. Variants: Symbol, Name, Tag,
String, Number, Null, Bool, Section, Break, Indent. Drives both the
styled render and pure_text re-emission used by --to and clipboard.
"""
content = { kind = "lines", spans = [
  { path = "src/parse/syntax.rs", start = 11, end = 27, render = { kind = "full" } },
] }

[[batches]]
id = "4.3"
descriptor = "Per-parser Parser impl headers"
justification = """
For every concrete Parser impl, just the impl block opener +
extension() + allow_array_root() lines — the schema-flag triple.
Catastrophic-omission hedge: a single batch makes it obvious that
JSON+YAML+JSONL allow array roots; TOML/XML/HCL don't. Reveals
JsonlParser advertises extension "json" (intentional).
"""

fixture = "otree"
revision_pin = "a02bdf44"
summary = """
otree is a Rust TUI (ratatui + tui-tree-widget) that opens a structured-data
file (JSON / YAML / TOML / XML / HCL / JSONL) or stdin and lets the user
browse it as a tree with a side-by-side syntax-highlighted data block,
filter mode, popup help, external-editor open, clipboard copy, optional
file live-reload, and extensive config (keys, palette/colors, layout,
type labels).

The ranking targets the full distribution of plausible dev questions about
this crate: "what does it do / how do I run it", "what CLI flags and
keybindings exist", "how is parsing pluggable across the six formats",
"what's the Tree / ItemValue data model", "how does filter mode interact
with the tree pane", "where is <specific behavior>". Tier 1 is orientation
+ the smallest user-surface anchors (README lede, module map, enum
vocabularies). Tier 2 is type declarations + signature teases that tell
the agent every function/struct exists and where. Tier 3 fills in the
most load-bearing function bodies. Catastrophic-omission targets: the
live-reload + --to + stdin features (easy to miss from UI code alone),
the 30-action keybinding surface, the palette/theme system, JSONL/HCL/XML
support (README title only says JSON/YAML/TOML/XML), and config
discovery order (OTREE_CONFIG env → ~/.config/otree.toml).
"""


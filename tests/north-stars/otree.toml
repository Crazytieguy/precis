fixture = "otree"
revision_pin = "a02bdf44"
summary = """
otree is a Rust CLI that renders structured-data files
(JSON / YAML / TOML / XML / HCL / JSONL) as an interactive TUI tree
viewer, built on ratatui + tui-tree-widget. A `Parser` trait normalizes
every format to `serde_json::Value`; a `Tree` walks that Value into
`TreeItem`s with per-node `ItemValue` (type + description + syntax
tokens); a ratatui `App` drives a two-pane tree-overview + data-block
layout plus filter, footer, header, popup, external-editor hand-off,
clipboard copy, and optional `--live-reload` file-watch. Config is TOML
(palette, per-element colors, per-action keybindings, layout, type
labels). The query distribution the ranking serves: how do I add a
new format / action / color? what keys do what by default? where do
focus, filtering, change-root, wrap, and scroll live? how does `--to`
convert between formats?
"""


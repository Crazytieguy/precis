fixture = "otree"
revision_pin = "a02bdf44"
summary = """
otree is a Rust TUI for viewing structured data (JSON / YAML / TOML /
XML / HCL / JSONL) as a tree alongside a syntax-highlighted data
block. Architecturally: parsers under src/parse turn input bytes into
a serde_json::Value; src/tree.rs builds a tui-tree-widget tree of
items keyed by `/`-joined paths; src/ui composes the App from
TreeOverview, DataBlock, Filter, Footer, Header, and Popup widgets,
all driven by a config-driven keybinding system in src/config/keys.rs.
Cross-cutting features: --to format conversion, --live-reload (file
watcher), system-clipboard copy, external editor (read-only), filter
mode with highlight or exclude variants, configurable colors / key
bindings / type labels, optional debug log file. The query
distribution we expect: "where does parsing for format X live", "how
does filter mode work", "what keys are bound by default", "how does
the App dispatch events to widgets", "how is data rendered with
wrapping and scrolling", "how do I add a new content type / config
option", plus targeted bug-fix and feature-extension queries against
specific widgets or parsers.
"""


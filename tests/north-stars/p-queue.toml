fixture = "p-queue"
revision_pin = "fc4b7369"
summary = """
p-queue is a TypeScript ESM library: a promise queue with concurrency control,
optional rate limiting (intervalCap + interval, with strict sliding-window
mode), priority ordering, abort-signal cancellation, per-task timeouts, and a
rich event/promise lifecycle surface (active/idle/empty/pendingZero/rateLimit
/rateLimitCleared/error etc.). Public surface is `source/index.ts`
(the `PQueue` class) plus `source/priority-queue.ts` (the default queue
implementation). The README is unusually long and doubles as API + FAQ docs;
many user queries are answerable from its prose. The ranking prioritizes:
(1) crate identity + the fact that PQueue is the default export, (2) a
catastrophic-omission-safe enumeration of every public method, getter, event
name, and constructor option, (3) the readme's API/options/events sections,
(4) priority-queue internals + key behavioral hot spots in PQueue (add(),
tryToStartAnother(), rate-limit state), and (5) a survey of the test files
including all test names so the agent can find behavioral precedents
quickly.
"""


fixture = "p-queue"
revision_pin = "fc4b7369"
summary = """
`p-queue` v9.2.0 is a single-purpose TypeScript ESM library: a promise queue
with concurrency control, rate limiting (fixed-window and strict sliding-window),
priorities, per-task timeouts and AbortSignal cancellation. Essentially all
behaviour lives in one class, `PQueue`, in `source/index.ts` (985 lines); the
supporting modules are tiny (`source/options.ts` option types, `source/queue.ts`
the pluggable `Queue` contract, `source/priority-queue.ts` the default
implementation, `source/lower-bound.ts` a binary-search helper). `readme.md` is
1077 lines and is the project's real API documentation; `test/` holds ~190
node:test cases across seven files that are the de-facto behavioural spec.

The ranking is: (1) identity and a complete map of the tree, the event set and
the public export surface; (2) the complete public member roster of `PQueue`
plus the signatures and doc-comments that let an agent answer usage questions
with no follow-up; (3) configuration — every option key, its default and its
validation; (4) the scheduling internals: a name roster of all 21 private
methods, the complete instance state, the admission/dispatch decision, the
`add()` pipeline end to end, and both branches of interval gating (the
rate-limit state machine and the timer helpers are located by the roster rather
than rendered); (5) `PriorityQueue`'s head-cursor design and `lowerBound`;
(6) the readme guidance the source doesn't state — custom queue classes, the
cancellation policy, backpressure; (7) test-title indexes for the four focused
suites plus build scripts and CI. Option and method semantics are taken from
the TypeScript doc-comments rather than duplicated from the readme, and the
readme is scheduled only where it uniquely adds (lede, usage, the `.add()` and
`.clear()` warnings, section and FAQ indexes, and the FAQ answers above).
"""


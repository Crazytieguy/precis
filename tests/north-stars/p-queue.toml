descriptor = "The strict option explained: sliding window vs fixed window"
justification = "`strict` is the most consequential and least obvious option, and the doc comment is the only place its semantics are stated precisely: fixed-window mode can burst at window boundaries (two tasks at 999ms and two more at 1000ms), strict mode enforces no more than `intervalCap` in any rolling `interval`. It also records the two interaction facts — strict is more resource-intensive because it tracks per-execution timestamps, and `carryoverIntervalCount` has no effect under it. Directly determines which rate-limiting mode a user should pick."

descriptor = "add(): settlement, completed/error events, and the finally block that defers #next"
justification = "Closes the task lifecycle: success resolves the caller's promise and emits `completed` with the result, failure rejects and emits `error` — so both channels always fire, which is why `.onError()` does not relieve you of handling the `add()` promise — and the finally block removes the abort listener, deletes the `#runningTasks` entry and defers `#next()` through `queueMicrotask` to avoid deep recursion. Paired with `#next` itself, which decrements pending, emits `pendingZero` at zero and pumps the queue."

fixture = "peepdb"
revision_pin = "929064dd"
summary = """
peepDB is a small Python CLI tool + library for quickly inspecting tables in
eight databases (MySQL, PostgreSQL, MariaDB, SQLite, MongoDB, Firebase, MSSQL,
OracleDB) without writing SQL. Architecture: a thin Click-based CLI
(`peepdb/cli.py`) calls `core.peep_db`, which dispatches `db_type` strings to
one of eight `BaseDatabase` subclasses under `peepdb/db/` (each implementing
`connect` / `disconnect` / `fetch_tables` / `fetch_data`). Connection details
are persisted Fernet-encrypted in `~/.peepdb/config.json`; the symmetric key is
held in the OS keyring or derived from an interactive password via PBKDF2
(`peepdb/config.py`).

The ranking is breadth-first across the eight DB adapters (the dominant axis of
variation — agents are very likely to be asked "how does the X adapter work" or
"add a new adapter"), then depth into the persistence/encryption layer, the
CLI/output formatting, and finally the test + CI surface. Special early
attention goes to the public surface of the `db/` package, the
`connect_to_database` dispatch in core, and the abstract method set on
`BaseDatabase`, because those three together let an agent place new behavior
with one or two follow-up reads.
"""


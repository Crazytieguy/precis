fixture = "peepdb"
revision_pin = "929064dd"
summary = """
peepDB is a small Python CLI + library ("peepdb") that lets a developer
inspect database tables without writing SQL. The whole repository is one
installable package, `peepdb/`, with four flat modules — `cli.py` (a Click
command group: save / list / view / remove / remove-all), `core.py` (the
`peep_db` orchestrator plus table/JSON value formatting), `config.py` (an
encrypted local connection store under `~/.peepdb`, keyed either from the
OS keyring or from a PBKDF2-derived password), and `exceptions.py` — plus
a `peepdb/db/` subpackage where one abstract `BaseDatabase` is implemented
eight times (MySQL, PostgreSQL, MariaDB, MongoDB, SQLite, Firebase, MSSQL,
Oracle). Everything else in the repo is periphery: a colocated
`peepdb/tests/` pytest suite, a Jekyll "just-the-docs" site under `docs/`,
two GitHub Actions workflows, and *two* competing packaging manifests
(`project.toml` and `setup.py`) whose dependency lists disagree.

The ranking is built for a session that opens on an arbitrary task. It
front-loads (a) what the tool is, (b) the complete filesystem shape, and
(c) name-level rosters of every public symbol in every module — so that
"where does X live?" is one grep away — before spending budget on bodies.
It then goes surface-first: the exact CLI flag contract, then the
execution pipeline (`peep_db` + the `BaseDatabase` ABC), then the eight
backends (ranked by how much each *diverges* from the common shape rather
than by repeating boilerplate), then the encryption/config store, then
tests, then docs-site/packaging/CI appendix material.
"""


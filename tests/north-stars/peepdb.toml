[[batches]]
id = "4.7"
descriptor = "FirebaseDatabase: the backend that does not call super().__init__"
justification = "A real structural trap worth having in context: Firebase's `__init__` sets only `service_account_path`, `kwargs` and `db`, never invoking `BaseDatabase.__init__`, so `self.host`, `self.port`, `self.extra_params` and `self.logger` do not exist on this class — which is why it uses a module-level `logger` and why `disconnect()` is a no-op. `connect` initialises the Admin SDK from a certificate and raises `ConnectionError` on failure."
predecessor = "4.1"

justification = "The spine of the encryption layer: the elided head of `get_key_security_config` reads `security_config.json`; the rendered lines bootstrap it via `add_key_security` on first use, then `get_key` branches on `type == KeySecurity.KEYRING` to either fetch the key from the keyring or re-derive it from a prompted password plus the stored salt. `encrypt`/`decrypt` are one-liners over `Fernet(get_key())`, which is why a wrong password surfaces as `InvalidToken` rather than a decode error."

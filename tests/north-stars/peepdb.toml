fixture = "peepdb"
revision_pin = "929064dd"
summary = """
peepDB is a small Python CLI + library (`peepdb` console script, entry point
`peepdb.cli:main`) that lets a developer or DBA inspect database tables
without writing SQL: `save` a connection, `list`/`view`/`remove` it. It
speaks eight backends (MySQL, PostgreSQL, MariaDB, SQLite, MongoDB,
Firebase, MSSQL, OracleDB) behind one `BaseDatabase` ABC
(connect/disconnect/fetch_tables/fetch_data), dispatched by
`core.connect_to_database`. Connection details persist encrypted in
`~/.peepdb/config.json` (Fernet, key from OS keyring or a
password-derived PBKDF2 key) via `config.py`. Output is a `tabulate`
grid or JSON, with paging and a scientific-notation toggle.

Sessions against this repo skew toward: "how do I add/fix a DB backend"
(the `peepdb/db/*.py` family, all implementing the same 4-method
contract), "how are connections stored/encrypted" (`config.py`), "what
does the CLI actually do for command X" (`cli.py`), and ordinary
build/test mechanics (setuptools + a GitHub Actions matrix that also
publishes to (Test)PyPI, plus a separate Jekyll docs site on GitHub
Pages). Within the 10k-token budget the ranking front-loads breadth
(every file, every CLI verb, every DB backend named) before depth, then
spends depth on the CLI/core/config request-flow spine a session is
most likely to touch end-to-end. Of the 8 structurally parallel DB
backends, only the ones that genuinely diverge from the shared contract
get deep treatment (SQLite's print-based tracing and its real test
coverage; Firebase's incompatible constructor; Mongo's hand-built URI)
— the other five are named in the roster/contract batches and are a
single file-read away, a deliberate depth-vs-breadth trade rather than
an oversight. Release mechanics, the Jekyll doc site, and most test
bodies get correspondingly thin coverage (existence + one worked
example each) to keep the budget on the spine above.
"""


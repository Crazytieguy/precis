justification = "Concrete crypto parameters an auditor or a doc-writer needs and cannot guess: PBKDF2HMAC over SHA256, 32-byte length, 480000 iterations, base64 salt, result urlsafe-b64-encoded for Fernet; and the keyring path that generates + stores a fresh `Fernet.generate_key()` on first run. Both are wrapped in `@cached(TTLCache(maxsize=1024, ttl=600))`, so the password prompt is skipped for ten minutes — a behaviour that surprises people."

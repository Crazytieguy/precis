id = "7.2"
descriptor = "The two disagreeing dependency lists (setup.py vs project.toml)"
justification = "This repo ships both a legacy `setup.py` and a `project.toml`, and their requirement sets differ: `setup.py` additionally pins `cachetools`, `keyring`, `pymongo==4.9.1` and `dnspython`, all of which `peepdb/config.py` and `peepdb/db/mongodb.py` actually import, while `project.toml` lists neither. Neither declares `pyodbc`, `oracledb` or `firebase-admin` despite four backends importing them. An agent adding a dependency or diagnosing an ImportError needs both blocks side by side."

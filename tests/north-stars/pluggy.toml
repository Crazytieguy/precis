fixture = "pluggy"
revision_pin = "4cc08c15"
summary = """
pluggy is the small (~1.7k LoC), mature plugin/hook system that powers
pytest, tox, and devpi. Its public surface is narrow and stable —
`PluginManager` (register/unregister plugins), `HookspecMarker` /
`HookimplMarker` (decorate hookspecs/hookimpls), `HookCaller` (the 1:N
caller you reach via `pm.hook.<name>`), `Result` (used inside wrappers),
plus a handful of error/warning classes and TypedDicts. Almost every
agent query about a pluggy-using codebase reduces to "what does this
decorator/option do" or "how does the multicall loop order/wrap impls".

The ranking front-loads: the README lede + a top-level FS map; the
re-exports out of `pluggy/__init__.py` (the canonical public surface);
the toy example wiring spec→impls→PluginManager→hook call; the public
class+method signatures of PluginManager / HookCaller / markers /
Result; and the core call-ordering rules in `_hooks.HookCaller` (the
six-bucket reverse-iteration order encoded in `_add_hookimpl`) plus
the wrapper semantics in `_callers._multicall`. After that we layer in
the docs/index.rst section bodies for zero-follow-up coverage of
`firstresult`/`historic`/`specname`/`callorder`/`hookwrappers`/
tracing/blocking/`call_extra`/`subset_hook_caller`, then the H2-only
heading map of the long tutorial so the agent can pinpoint deeper
sections, then test breadth + dev scaffolding (tox, pyproject, CI,
changelog, docs build).

Catastrophic-omission hedges: every public name in `__all__` is
covered by a signature batch; every method on `PluginManager` and
`HookCaller` shows up by name (truncated signatures) before we drill
into bodies; every `_callers.py` / `_hooks.py` / `_manager.py` source
file gets a function-name location batch; the docs section structure
is covered as a heading-locations batch.
"""


fixture = "pluggy"
revision_pin = "4cc08c15"
summary = """
pluggy is the small, mature Python library that implements pytest's plugin/hook
system: `HookspecMarker`/`HookimplMarker` decorators mark functions, a
`PluginManager` registers plugins and hookspecs, `HookCaller` holds the
ordered list of `HookImpl`s for one named hook, and `_multicall` (in
_callers.py) is the actual call loop that runs non-wrapper impls, then
new-style (`wrapper=True`) and old-style (`hookwrapper=True`) wrapper
teardowns, handling firstresult / historic / exception-propagation
semantics. `Result` carries the outcome through old-style wrappers;
`TagTracer` is the built-in debug tracer. The whole runtime is ~1600 lines
across 6 files in src/pluggy/, everything else is tests, sphinx docs (with
a worked toy example), and packaging/release/CI plumbing (tox, GitHub
Actions matrix over CPython 3.10-3.14 + PyPy, towncrier changelog
fragments, a scripted release process, and shell scripts that smoke-test
pluggy against real downstream consumers). CLAUDE.md/AGENTS.md already
give a one-paragraph architecture summary, file-to-concept map, and the
`uv run pytest` / `uv run pre-commit run -a` command pair, so this NS
buys the complement: exact class/method signatures with line coordinates,
the option-semantics prose that lives in the marker docstrings, the
hookimpl-ordering and call-loop algorithms themselves, the test roster,
and concrete config/CI shapes. Query distribution: "how does firstresult/
historic/wrapper work", "where is X defined", "is Y tested and how", "how
do I run/lint/release/configure this", "what's pluggy's public API
surface", and debugging a specific hook-call-order or
exception-propagation question.
"""


fixture = "pluggy"
revision_pin = "4cc08c15"
summary = """
pluggy is the Python plugin / hook-calling framework that backs pytest,
tox, devpi, and many other tools. The repo is small and focused: a
hand-rolled `src/pluggy/` package (markers, manager, hook caller, the
multicall execution engine, a Result wrapper helper, a tracer, and a
warnings module), plus a comprehensive Sphinx guide in `docs/index.rst`
that doubles as the conceptual reference, two runnable tutorial
projects under `docs/examples/`, and a thorough pytest suite under
`testing/`.

The ranking front-loads breadth - the top-level layout, the public
API surface (`src/pluggy/__init__.py`'s `__all__` and the re-exports
that pin each symbol to a file), the README headline + canonical
example, and signatures for every public class/method - so that a
coding agent landing in the repo can answer "what is pluggy / what's
its surface area / where does X live" without a follow-up. Mid-tier
batches cover the conceptual machinery the docs articulate (hookspec
opts, hookimpl opts, call-order rules, wrapper / hookwrapper, historic,
firstresult) plus the core call loop in `_multicall`, which is the
single most load-bearing function in the codebase. Later tiers fill
in the tutorial examples, test-suite shape (per-file fn name lists),
configuration files, and changelog so debugging / feature work has
the right pointers.
"""


fixture = "pluggy"
revision_pin = "4cc08c15"
summary = """
pluggy is the hook-specification / hook-implementation / plugin-manager
library that pytest, tox and devpi are built on. The whole shipped
library is eight files under `src/pluggy/` (~1600 lines); everything
else in the repo is documentation (`docs/index.rst` is a 1082-line
narrative manual plus two runnable example packages), a large pytest
suite under `testing/`, towncrier changelog plumbing, and packaging /
CI config.

The ranking is built for an agent that must, in order of how often the
need arises: (a) know what the library is and what its public names
are, (b) navigate from a concept ("historic hooks", "trylast",
"wrapper teardown") to the exact file and line that implements it,
(c) understand the two hard parts of the semantics — the hookimpl
ordering rules in `HookCaller._add_hookimpl` and the wrapper
setup/teardown loop in `_callers._multicall` — without reading
anything else, and (d) find the doc section, example, or test that
already covers a behaviour before writing new code.

So: identity and the `__all__` roster first, then the filesystem shape,
then a symbol-level roster of every module plus a complete section map
of the manual, so any name or concept resolves to a line, then the
semantics of the option TypedDicts and the two call-loop
algorithms, then the documentation map and worked examples, then the
shared test fixtures and the tooling/packaging appendix. CLAUDE.md and
AGENTS.md are host-injected, so the commands and the one-paragraph
architecture summary they already carry are deliberately not
re-scheduled here; what they lack — line-level locations and actual
signatures — is what this ranking spends its budget on.
"""


fixture = "posting"
revision_pin = "56703a11"
summary = """
Posting is a Textual-based TUI HTTP client (à la Postman/Insomnia, but keyboard-driven and run in a terminal).
Requests are persisted as `.posting.yaml` files inside a *collection* directory and loaded via `--collection`.
Variables resolved from `--env` dotenv files are substituted into URLs/headers/bodies/auth using `$VAR` /
`${VAR}` syntax; `:name` placeholders in URL paths become "path params" with their own tab.
Users can attach Python *scripts* (`setup`, `on_request`, `on_response`) per request; scripts get a `Posting`
context object exposing variables + notifications.

The codebase is a single Python package `src/posting/`: `app.py` is the entrypoint (Textual `App` + `MainScreen`,
~1700 lines including most action handlers); `collection.py` holds the pydantic `RequestModel`/`Collection`
schema; `config.py` defines `Settings` (`POSTING_*` env vars, `config.yaml`); `widgets/` is the bulk of the
code, split into `widgets/request/*` (URL bar, method, headers/body/auth/...), `widgets/response/*`,
`widgets/collection/*`, and shared widgets at the top level. CLI is a Click group: `posting` (default TUI),
`posting locate <thing>`, `posting import` (OpenAPI/Postman), `posting sponsors`.

The ranking expects queries to span: configuration ("how do I change the theme / keymap"), request lifecycle
("where does a request get built and sent"), the YAML on-disk format, scripting, importing/exporting, theming,
specific widgets, and the Textual integration. The most load-bearing model is `RequestModel` + `apply_template`
+ the `send_request` pipeline in `MainScreen`.
"""


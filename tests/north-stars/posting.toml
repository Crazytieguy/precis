fixture = "posting"
revision_pin = "56703a11"
summary = """
Posting is a terminal (Textual/TUI) HTTP API client — a keyboard-driven
alternative to Postman/Insomnia that runs over SSH. It is a Python package
(src/posting/, ~12k LOC) built on the Textual framework, packaged with
`hatchling`/`uv`, entry point `posting` (src/posting/__main__.py). Requests
live as human-readable `*.posting.yaml` files inside a "collection"
directory (src/posting/collection.py); the app lets a user build, save,
send (via httpx), script (pre/post-request Python hooks), and export
(curl/YAML) those requests, with import from curl/OpenAPI/Postman. `docs/`
is an mkdocs-material user guide/changelog/roadmap/FAQ; `tests/` is a
pytest suite plus large Textual-snapshot (SVG) UI regression tests driven
by fixtures under `tests/sample-*`.

The plausible query distribution spans: "how do I configure/theme/keymap
this", "where is the send-request / curl-import / scripting code path",
"what does the request YAML / collection model look like", "how do
snapshot tests work and how do I run the test suite", "what CLI
subcommands and keybindings exist", and ordinary feature-add/bugfix work
inside app.py, collection.py, config.py, or one of the widgets/ modules.

Given a ~10k-token budget against a ~12k-line source tree plus ~1.7k
lines of docs and ~2.2k lines of tests, this NS deliberately favors
breadth (exhaustive fs listings + signature/class "location catalogs")
over depth almost everywhere, reserving full-body inclusion for the
handful of code paths that are the load-bearing spine of the app
(send_request, RequestModel.apply_template/to_curl, the scripting
context object) and for the config-key reference table, which is the
single densest piece of semantic documentation in the repo.
"""


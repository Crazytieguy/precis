fixture = "posting"
revision_pin = "56703a11"
summary = """
Posting is a keyboard-centric HTTP client that runs as a terminal UI, built on
Textual and installed as the `posting` console script. Requests live on disk as
`*.posting.yaml` files inside a collection directory; pydantic models in
collection.py define that format, config.py defines a layered configuration
system (YAML file, POSTING_* env vars, dotenv), and app.py hosts a single
MainScreen composed of a collection browser, a request editor and a response
area. Around that core sit variables and environments, user-authored Python
pre/post-request scripts, user themes, a command palette, jump-mode navigation,
and importers for curl, OpenAPI and Postman.

The ranking front-loads identity and a complete filesystem map, then the CLI
surface, the request/collection data model, the configuration surface, the
application shell with its keybindings, the feature subsystems, and finally the
test, documentation and packaging appendix. Rosters are preferred to prose
wherever a class of symbols could otherwise look partial: every CLI subcommand,
every Settings key, every screen binding, every widget class, every command
palette entry and every builtin theme name appears in full, name-only where the
bodies would be expensive.
"""


fixture = "preact-signals"
revision_pin = "cca91a3c"
summary = """
preact-signals is a pnpm monorepo implementing the @preact/signals reactive
state-management library and its ecosystem: a framework-agnostic core
(packages/core), Preact and React bindings (packages/preact, packages/react
+ runtime/utils subpackages), Babel transforms that auto-track signals in
components (react-transform, preact-transform), an eslint/oxlint plugin
catching signal misuse, and a distinctive "AI-native" debugging stack
(packages/debug, devtools-adapter, devtools-ui, vite-plugin
"@preact/signals-agent-vite", a Chrome extension, and a repo-root
skills/signals-debugging skill) that streams structured signal/network/page
events to a local HTTP API for coding-agent consumption. The ranking serves
the full spread of plausible sessions against this repo: understanding the
core reactivity algorithm (dependency tracking, lazy computed refresh,
batching), using/debugging a framework integration, extending or fixing a
Babel transform or lint rule, and operating the AI-debugging HTTP surface.
Given the repo's size relative to the token cap, the ranking leans on cheap
breadth (directory listings, exported-signature rosters) over exhaustive
body dumps, reserving full-body depth for the handful of spots (core's
dependency tracking and lazy recompute, the debug-patch mechanism) that are
most load-bearing for understanding *why* the system behaves as it does.
"""


fixture = "preact-signals"
revision_pin = "cca91a3c"
summary = """
`preact-signals` is a pnpm monorepo for the Signals reactive state library: a
tiny core (`signal`/`computed`/`effect`/`batch`/`untracked`/`action`/`createModel`)
plus framework adapters (`@preact/signals`, `@preact/signals-react` with its
`runtime` and `utils` subpackages), two Babel transforms, an Oxlint/ESLint rule
plugin, and an unusually large debugging stack: `@preact/signals-debug`,
a devtools adapter/UI pair, a Chrome extension, and `@preact/signals-agent-vite`,
a Vite plugin that exposes captured signal/network/page events over a local HTTP
API for coding agents.

The ranking front-loads (a) what the project is, (b) which packages exist and
what each one is for, and (c) the public API surface of core and the adapters —
the content that answers "what can I call, and from which package" without a
tool call. It then covers the repo's workflow (build/lint/test scripts, vitest
project layout, test file inventory), the transform and lint-rule tooling, the
agent-facing Vite debug API, the devtools stack, and finally the demo site and
appendix config. Throughout, rosters are given as whole classes — every package
identity, every rule file, every public export of an index module — so absence
from the snapshot can be read as absence from the repo.
"""


fixture = "preact-signals"
revision_pin = "cca91a3c"
summary = """
Preact Signals monorepo: a small reactive-primitive library (signal,
computed, effect, batch, untracked, action, createModel) plus Preact and
React framework bindings (useSignal, useComputed, useSignalEffect,
useModel), an extensive devtools ecosystem (debug runtime,
communication adapters, embeddable UI, Chrome extension), Babel
transforms that auto-wrap React components and inject names into signal
calls, a Vite plugin that exposes an HTTP/SSE event stream for AI-agent
debugging, and an Oxlint/ESLint plugin that catches common signal
misuse. Top-level shape: pnpm workspace with `packages/*`,
`packages/preact/utils`, `packages/react/{utils,runtime}`, `docs/`
(demo site), `extension/` (Chrome extension), `skills/` (agent skill
docs). Ranking serves explanation, debugging, extending the reactive
core, writing new framework hooks, authoring devtools/extension
features, integrating the Vite plugin into a host app, and writing or
debugging the eslint rules.
"""


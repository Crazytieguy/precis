fixture = "pretty-ts-errors"
revision_pin = "980c274b"
summary = """
`pretty-ts-errors` is a VS Code extension (npm-workspaces + turbo monorepo)
that rewrites TypeScript compiler diagnostics into readable, syntax-highlighted
hovers and a sidebar webview. Substance is split four ways: `packages/formatter`
(IDE-agnostic regex rule engine + prettier-based type re-formatting),
`packages/vscode-formatter` (hover/sidebar renderers and their HTML component
helpers), `packages/utils` (dedent + tiny type guards), and
`apps/vscode-extension` (activation, diagnostic listener + cache, hover
provider, webview sidebar with pin/lock modes, five commands, logger, build
script and webview assets).

The ranking front-loads identity and the four-workspace map (tier 1), then a
filesystem roster covering every source directory in the repo (tier 2), then a
name-level roster of every module-level symbol in all four workspaces plus the
extension's `activate()` wiring and shared store (tier 3). Only then does it
spend tokens on bodies: the formatter's rule engine and type-repair passes
(tier 4), the hover/sidebar renderers and their code-block backends (tier 5),
the VS Code manifest's declared surface (tier 6), and finally the remaining
directory listings, the contributor guide's outline and the formatter's mock
error corpus (tier 7). The intent is that "what is this / where does X live"
needs zero follow-ups, and "how exactly does rule N, command N or component N
work" needs exactly one read at a line number the snapshot already printed.
"""


fixture = "pretty-ts-errors"
revision_pin = "980c274b"
summary = "pretty-ts-errors is a VS Code extension (npm/turbo monorepo) that rewrites raw TypeScript/JS-Doc/Vue/etc diagnostic messages into readable, syntax-highlighted markdown/HTML for hover tooltips and a sidebar webview. Query distribution: extension activation/commands/providers (how it runs in VS Code), the diagnostic-to-HTML pipeline in packages/formatter + packages/vscode-formatter (the actual prettification algorithm: regex rule table, type-block reformatting via prettier, bracket-balancing for truncated types), build/lint/test entry points (turbo + per-package npm scripts + CI), and the shared packages/utils grab-bag. Given a tight token budget for a ~3000-line source tree, ranking favors breadth (full directory closure, per-file symbol rosters) over deep single-file dumps, with full bodies reserved for the handful of files that carry the core algorithm or the activation entry point."


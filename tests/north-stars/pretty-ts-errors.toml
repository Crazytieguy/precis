fixture = "pretty-ts-errors"
revision_pin = "980c274b"
summary = """
`pretty-ts-errors` is a VSCode extension that reformats noisy TypeScript
diagnostics into human-readable hovers and sidebar panels. The
repository is a Turborepo npm monorepo with one app (`apps/vscode-extension`)
that wires VS Code activation/commands/providers, and three packages:
`packages/formatter` (pure regex-rule pipeline that rewrites error
messages, plus a Prettier-based type pretty-printer), `packages/vscode-formatter`
(adds hover/sidebar HTML rendering, embeds command links, syntax-highlights
via shiki), and `packages/utils` (tiny shared helpers — `has`, `d`/dedent,
`objectKeys`, `invert`). `examples/` holds buggy `.ts`/`.js`/`.vue`/
`.type` files used for manual hover testing.

The ranking serves the full dev-task distribution: explaining how the
extension reshapes diagnostics, adding/tweaking a regex rule in the
formatter, extending the VS Code surface (a new command, sidebar
behavior, hover provider), debugging the bundle/build pipeline
(esbuild + tsdown + vitest + turbo), or onboarding via the docs. Breadth
over depth: locate every source file, command, and public export before
diving into bodies. The two load-bearing flows — `errorMessagePrettifier`'s
regex-rule loop and `webviewViewProvider`'s mode+pin state machine — get
the most body coverage.
"""


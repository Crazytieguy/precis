fixture = "py3xui"
revision_pin = "6004c163"
summary = """
py3xui is an object-oriented Python SDK over the 3x-UI panel HTTP API.
The crate is a thin twin pair of facades — `Api` (sync, `requests`) and
`AsyncApi` (async, `httpx`) — each owning four sub-clients (`client`,
`inbound`, `database`, `server`) that subclass a shared `BaseApi` for
session/login/retry/TLS handling. Domain payloads are Pydantic v2
models (`Client`, `Inbound` + `Settings`/`Sniffing`/`StreamSettings`,
`Server` + its breakdowns, `RealityKeyPair`).

The ranking serves the full agent-task distribution against this
shape. Top batches orient: project blurb, dependency surface, exported
names, the sync/async mirror, and the four-sub-API split. Mid batches
catalog every public method on every sub-API (sync names first, then
async, then the data models) — this is the load-bearing breadth that
makes "where is X" land in one hop. Later batches surface the
load/login/retry plumbing (TLS verify branch, `_check_response`,
`ApiFields`), the Pydantic alias conventions (`JsonStringModel`
JSON-string preprocessing, `populate_by_name`), and the
environment-variable + cookie-name conventions. Examples, tests, and
the demo land last and refine call-site patterns.
"""


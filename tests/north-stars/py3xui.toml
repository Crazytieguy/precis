fixture = "py3xui"
revision_pin = "6004c163"
summary = """
py3xui is a small, single-purpose Python SDK: an object-oriented client for the
3x-ui VPN panel's HTTP API, published to PyPI as `py3xui`. Its whole substance is
one package, `py3xui/`, split into six sub-packages: two near-identical transport
families (`api/` = synchronous, built on `requests`; `async_api/` = asynchronous,
built on `httpx`), three Pydantic model packages (`client/`, `inbound/`,
`server/`), and `utils/` for environment-variable credential loading. The two
transport families mirror each other method-for-method — the same class names
with an `Async` prefix, the same endpoints, the same docstrings — so the single
most load-bearing fact for an agent is *that* mirroring plus the short list of
places the two genuinely diverge.

The ranking therefore goes: (1) identity, repository layout and the export
surface of every `__init__.py`; (2) what you can *do* — the `Api`/`AsyncApi`
facades, the method roster of each of the four sub-APIs paired line-for-line
with the `panel/api/...` endpoint each method hits, credential/TLS
configuration; (3) the Pydantic data models and their JSON wire aliases, which
are what most "why is this field empty / what does the panel return" questions
turn on; (4) shared transport internals — retry loop, TLS `verify` selection,
cookie/session handling — and the sync/async divergences; (5) the sync test
suite plus lint and dev-dependency config, with the recorded JSON responses, dev
scripts, CI workflows, editor settings and community docs surfaced as directory
listings rather than bodies.

Package-level `README.md` files under `py3xui/*/` are machine-generated by
`dev/pydoc.sh` from the very docstrings already ranked above; the last batch
exists only to say so, so that their ~2600 lines are not mistaken for design
documentation.
"""


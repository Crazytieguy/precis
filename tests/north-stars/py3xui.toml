descriptor = "Async error handling: different exception types, different terminal error"
justification = "The second and last real divergence, and one that breaks copy-pasted error handling: the async path catches httpx.RequestError/TimeoutException, re-raises httpx.HTTPStatusError, sleeps via asyncio.sleep, and on exhaustion raises a plain ConnectionError rather than the sync side's requests.exceptions.RetryError."

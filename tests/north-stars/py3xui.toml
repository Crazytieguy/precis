justification = "Concrete failure semantics: connection errors and timeouts retry with a `1 * (retry + 1)` second sleep, any other RequestException propagates immediately, `skip_check` bypasses the success-field check, and exhaustion raises requests.exceptions.RetryError. Debugging and reliability questions land straight here."
predecessor = "4.4"

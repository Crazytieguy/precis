fixture = "py3xui"
revision_pin = "6004c163"
summary = """
py3xui is a small (~3.5k LoC) Python SDK wrapping the 3x-ui VPN panel's REST API. Its defining
structural trait is a near-perfect 1:1 sync/async mirror: py3xui/api/* (requests, blocking) and
py3xui/async_api/* (httpx, async/await) implement the exact same four sub-APIs (client, inbound,
database, server) with identical method names, endpoints and docstrings, differing only in the
`async`/`await` keywords and a per-request httpx.Client construction (see 4.10). Wire objects are
Pydantic models under py3xui/client, py3xui/inbound and py3xui/server; several inbound-related
fields (settings, streamSettings, sniffing) are themselves JSON-encoded strings in the panel's
responses, unwrapped via inbound/bases.py's JsonStringModel. Given a hard ~10k-token budget and
real per-line costs several times higher than a naive char-count would suggest, this NS trades
near-total full-body coverage for a much larger set of cheap location/fs pointers (so nothing is
silently implied absent) plus a curated handful of full-body renders on the highest-value, most
central code paths: the Api/AsyncApi entry points, one CRUD method per resource, BaseApi's
retry/TLS/login internals, and the two Pydantic models (Client, Inbound) an integrator touches
constantly. Per-package READMEs under py3xui/*/README.md are pydoc-markdown-generated dumps of the
same docstrings rendered from source (see dev/pydoc.sh) -- their existence is surfaced via fs
listings but bodies are never scheduled, since they're redundant with the source spans ranked here.
"""


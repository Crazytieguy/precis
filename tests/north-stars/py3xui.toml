[[batches]]
id = "4.8"
descriptor = "AsyncBaseApi: where the async transport actually differs"
justification = "The async base is a line-for-line copy of BaseApi except in one method. This batch isolates the difference: httpx instead of requests, `_request_with_retry` taking a method *string* rather than a callable, and a fresh `httpx.AsyncClient(cookies=..., verify=..., follow_redirects=True)` per attempt dispatching on ApiFields.GET/POST — including the ValueError for an invalid method. Everything else in the file is already covered by 4.2-4.7."

revision_pin = "6e83187b"
summary = """
psf/requests 2.34.2 — the `requests` HTTP client library for Python, `src/`-layout
(`src/requests/`, 19 modules plus `py.typed`, 6385 lines), pytest suite in `tests/`
(~5.1k lines, httpbin-backed, plus a raw-socket `testserver/` package), Sphinx docs in
`docs/`, eight GitHub Actions workflows, Makefile + pyproject + tox as the operational
surface.

Ranking rationale. A session opening on this repo is overwhelmingly about (a) the
public API shape — `requests.get/post/...`, `Session`, `Response`, `PreparedRequest`,
the exception hierarchy — and (b) which of the 19 modules a given behaviour lives in
(redirects, cookie-jar merging, proxy resolution, TLS verify/cert, chunked bodies,
encoding detection). So the top of the ranking buys identity, the complete module and
directory rosters and the canonical `requests.get(...)` example, then the public API
surface — the re-export map, the eight verb functions, the whole exception hierarchy,
and `Session`'s declaration / attributes / methods / `request` signature — then the
data model and transport rosters (`models.py`, `adapters.py`, `cookies.py`,
`auth.py`), then the type vocabulary and the environment-variable rules, then the
supporting modules (`utils`, `structures`, `status_codes`, `help` and the small
shims). Only after all of that breadth does the ranking pay for the two pieces of
control flow that cannot be reconstructed from names — the rules
`SessionRedirectMixin.resolve_redirects` enforces, and the urllib3-exception-mapping
tail of `HTTPAdapter.send` — and it closes with the operational config that didn't fit
up top plus test-suite and docs topology, so "where is X tested / documented /
configured" is one grep away.

Completeness is deliberate where a partial list would mislead: every entry of every
directory listed, every module in `src/requests/`, every function in `api.py` and
`utils.py`, every method of `Session`, `Response`, `PreparedRequest` and
`HTTPAdapter`, every class in `exceptions.py`, every free function and class in
`cookies.py`, every handler and method in `auth.py`, every `##` heading of the README,
every target of the Makefile, every table of `pyproject.toml`, every symbol of the
socket test server, and every section heading of `docs/api.rst`. Where a span stops
inside a longer list or body — the pyproject classifiers, multi-line type-alias unions,
the `_codes` table, the skipped stretches of the redirect loop, the module-level tests
after the classes in `tests/test_requests.py` — an ellipsis line marks the elision so
the rendered slice is never read as the whole thing. The deeper bodies not paid for
here (`prepare_body`, `HTTPAdapter.send`'s pre-flight, `RequestsCookieJar`'s methods,
the individual test bodies) are left as line-numbered anchors: one targeted read away.
"""


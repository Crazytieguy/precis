fixture = "requests"
revision_pin = "6e83187b"
summary = """
Requests is the canonical Python HTTP client library — a thin, ergonomic
facade over urllib3. The public surface is two layered APIs: a flat
functional API (`get`, `post`, `put`, `patch`, `delete`, `head`,
`options`, `request`) in `api.py`, and a `Session` class (in
`sessions.py`) carrying cookies, headers, auth, proxies, and adapters
across calls. Underneath, `Request` -> `PreparedRequest` -> `Response`
data flow lives in `models.py`, transport in `adapters.py` (HTTPAdapter
wrapping urllib3 PoolManagers), authentication in `auth.py`
(HTTPBasicAuth, HTTPDigestAuth, HTTPProxyAuth, plus AuthBase for
plugins), cookies in `cookies.py` (RequestsCookieJar with dict-like
behavior over http.cookiejar), and a large pile of URL/encoding/proxy/
netrc helpers in `utils.py`. Errors are a tree rooted at
RequestException in `exceptions.py`.

Plausible queries this NS serves: "how do I send a POST with JSON?",
"how does Session reuse connections?", "what does prepare_url do to my
URL?", "how do redirects work?", "where is digest auth implemented?",
"how does requests pick a CA bundle / proxy / netrc credentials?",
"which exceptions can my call raise?", "what version of Python is
supported?", "how do I write a custom auth handler / transport
adapter?", plus debugging tasks ("why is content-length being set
this way?", "how is the Cookie header constructed?", "what triggers
strip-auth on redirect?").
"""


fixture = "requests"
revision_pin = "6e83187b"
summary = """
`requests` (psf/requests) is the canonical Python "HTTP for Humans" client
library: a thin, well-documented layer over urllib3 providing Request/
PreparedRequest/Response modeling, a Session object for connection pooling
and cookie/auth persistence, pluggable transport adapters, and Basic/Digest
auth. Source lives under src/requests/ (~7.4k LoC across 18 modules); the
test suite under tests/ (~4k LoC, dominated by tests/test_requests.py's
3068-line integration suite) is a large share of the repo and a common
target for "where's the test for X" queries. Sessions against this fixture
skew toward: understanding the request lifecycle (Request -> prepare ->
Session.send -> HTTPAdapter -> urllib3 -> Response), debugging redirect/
auth/cookie/proxy/SSL edge cases, adding a utility or exception, writing or
locating a test, and routine build/lint/typecheck/CI operations. Per-line
rendering cost in this fixture is high relative to entry count, so the
ranking favors breadth (complete, honest symbol rosters with exact line
locations) over depth; only the two highest-value, hardest-to-reconstruct
control-flow bodies (Session's redirect-resolution loop, HTTPAdapter's
send()/exception-mapping) get full-body treatment. Everything else is one
grep/Read hop away from its roster-listed line number.
"""


# ============================== TIER 6: Control flow you cannot guess ==============================

[[batches]]
id = "6.1"
descriptor = "`resolve_redirects`: the rules the redirect loop enforces"
justification = "The hardest logic in the repo to reconstruct from names, reduced to the decisions no signature implies: exceeding `self.max_redirects` raises `TooManyRedirects(f\"Exceeded {self.max_redirects} redirects.\", response=resp)`; a redirect that is *not* `codes.temporary_redirect` / `codes.permanent_redirect` drops the body and purges `Content-Length`, `Content-Type` and `Transfer-Encoding`; and a consumed file-like body is rewound via `rewind_body` only when `_body_position` is set and a length/encoding header is present — the comment there explains why a failed `tell()` yields `UnrewindableBodyError` rather than a hung connection. Ellipses mark the stretches of the loop (the `while url:` head and request copying, URL normalisation, cookie carry-over, the recursive `self.send(..., allow_redirects=False)`) that are not rendered — the loop's entry point is the `get_redirect_target` anchor from 3.8."

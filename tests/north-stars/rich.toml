fixture = "rich"
revision_pin = "46cebbb0"
summary = """
`rich` (v15.0.0, Textualize) is a pure-Python library for rich text and
beautiful formatting in the terminal: styled/markup text, tables, progress
bars, syntax highlighting, markdown, tracebacks, live displays and a
pretty-printing REPL hook. Everything is funnelled through one engine —
`rich.console.Console` — which renders any object implementing the console
protocol (`__rich_console__` / `__rich__`) down to a stream of
`rich.segment.Segment`s.

Ranking rationale. The repository is one large flat package (`rich/`, 79
entries) plus a `tests/` suite whose files mirror it name-for-name, 36
runnable example scripts, a Sphinx `docs/` tree, asv benchmarks, dev tools,
and 17 translated READMEs. An agent arriving cold most often needs (a) what
the library is and which module owns a given feature, (b) the shape of the
central `Console` API and the renderable protocol every feature plugs into,
(c) the constructor surface of whichever renderable the query is about, and
(d) how to run the tests / type-check / build docs. So the ranking goes:
identity and directory closure first; then the `Console` engine and the
protocol contract; then a module-by-module symbol roster covering every
remaining file in `rich/` — renderables first, then the style / colour /
segment / measurement primitives, then the platform-specific tail — so that
any "where does X live" question is one grep away; and finally the test,
example, documentation and dev-workflow surfaces.
"""


fixture = "rich"
revision_pin = "46cebbb0"
summary = """
Rich (Textualize/rich): a Python library for rich text and beautiful
formatting in the terminal. The package `rich/` is organized one-class(ish)-
per-module around a small "console protocol" core (rich/protocol.py,
rich/console.py's ConsoleOptions/RenderableType, rich/measure.py,
rich/segment.py): any object implementing `__rich__` / `__rich_console__` /
`__rich_measure__` can be printed. Around that core sit ~30 renderable
widgets (Table, Panel, Progress, Tree, Live, Layout, Syntax, Markdown,
Traceback, Pretty, Prompt, RichHandler, ...), each its own module under
rich/, each with a 1:1 tests/test_<module>.py. docs/source/*.rst is a
Sphinx narrative+reference manual (introduction, one page per renderable,
protocol.rst, appendix/box+colors) that is often a cheaper source of "how do
I use X" than re-deriving it from docstrings. examples/*.py are runnable
demos, one per feature. Packaging is poetry (pyproject.toml); CI is
GitHub Actions (pythonpackage.yml matrix + codeql/codespell/comment bots);
docs build via Sphinx/readthedocs; benchmarks via asv. No AGENTS.md/CLAUDE.md
is present in this fixture. The query distribution is expected to span:
"how do I render/style/build a <widget>", "where is <class/fn>", "how do I
build/test/lint", "what changed recently", "how does console markup/the
render protocol work", and debugging a specific renderable's behavior.
"""


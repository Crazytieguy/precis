descriptor = "The console protocol: RichCast, ConsoleRenderable, RenderableType, RenderResult"
justification = """
The extension contract of the entire library, verbatim and complete: an
object is renderable if it implements `__rich_console__(console, options)
-> RenderResult` or `__rich__()`, and `RenderResult` is an iterable of
renderables or `Segment`s. Every class in `rich/` — Table, Panel, Text,
Progress — is built against exactly this, so "how do I make my own
renderable" and "why isn't my object printing" both resolve here with no
follow-up read.
"""

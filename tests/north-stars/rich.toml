fixture = "rich"
revision_pin = "46cebbb0"
summary = """
Rich is a Python library for rich text and beautiful terminal output: a
single `Console` object renders structured "renderables" (Text, Table,
Tree, Panel, Columns, Markdown, Syntax, Progress, Live, Layout, …) to a
terminal, plus pretty-printing of arbitrary Python objects, BBCode-like
markup for inline color/style, emoji codes, syntax highlighting via
pygments, and rich tracebacks. The public entry points (`rich.print`,
`rich.inspect`, `rich.print_json`, `Console.print`/`log`) drive everything;
all renderables share the `__rich_console__` / `__rich__` protocol.

The crate is a flat namespace of ~80 modules under `rich/`. The ranking
front-loads (1) what the library *is* and how to import it, (2) the
`Console` API surface and shape of `ConsoleOptions`, (3) the renderable
protocol and the foundational types (Style, Color, Segment, Box,
markup), then fans out file-by-file across the renderables (Text,
Table, Tree, Panel, Markdown, Syntax, Progress, Live, Layout, etc.)
and the specialized helpers (Traceback, RichHandler, Prompt, Pretty,
JSON, Highlighter). Tests, examples, and the sprawling `_emoji_codes`
/ `_palettes` / `_spinners` data tables are surfaced as directory
listings or short pointers only — body content there is low value-per-
token.
"""


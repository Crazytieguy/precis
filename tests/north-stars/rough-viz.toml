fixture = "rough-viz"
revision_pin = "17c7ea86"
summary = """
roughViz.js (v2.0.5) is a small JavaScript chart library that renders
hand-drawn / sketchy charts in SVG, built on top of D3v5 + roughjs.
The public surface is a flat set of 9 chart classes exported from
src/index.js: Bar, BarH, Donut, Force, Line, Network, Pie, Scatter,
StackedBar. Each class extends an abstract Chart base (src/Chart.js)
and is instantiated as `new roughViz.X({element, data, ...opts})`;
internally each chart goes through resolveData -> drawFromObject /
drawFromFile, calling initRoughObjects + addScales + addAxes +
makeAxesRough + addLabels + (chart-specific draw) + optional
addInteraction. Build is vite-driven (vite.config.js) emitting ESM,
UMD and CJS bundles to dist/. Tests are jest stubs (only
src/utils/roughCeiling has real coverage in tests/utils/). A demo
front-end lives in website/, and assets/ holds large TTF font blobs
inlined as base64 in src/utils/addFonts.js.

The ranking serves the full distribution of dev queries that hit a
small JS dataviz library: "how do I use Bar?" / "what options does
Donut accept?" / API explanations from the README, plus structural
queries like "where is the rough/D3 boundary?" / "where are bars
actually drawn?" / "why doesn't my chart redraw on resize?". Breadth
of locations and the API tables get priority over deep chart-body
text, because the chart files are highly redundant (Bar/BarH/Donut/
Pie/Scatter/StackedBar share 80%+ of their method shape) and an
agent only needs one or two of them to extrapolate the others.
"""


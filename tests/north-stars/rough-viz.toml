fixture = "rough-viz"
revision_pin = "17c7ea86"
summary = """
roughViz.js (npm `rough-viz` 2.0.5) is a browser charting library that draws
hand-drawn/sketchy SVG charts on top of D3 v5 modules and roughjs. All the
substance is the flat `src/` directory: a small abstract base class
(`src/Chart.js`) plus nine sibling chart classes (Bar, BarH, Donut, Line,
Network, Force, Pie, Scatter, StackedBar) that each re-implement the same
lifecycle — the constructor reads an `opts` object, `initChartValues` sizes
the container, `resolveData` branches on csv/tsv/object input, and
`drawFromObject` / `drawFromFile` emit roughjs nodes — plus five helpers in
`src/utils/`. `README.md` is the user-facing API reference (one section per
documented chart type); `website/` is a demo site, `dist/` holds built
bundles, `tests/` is jest.

The ranking front-loads what the library *is* and where its substance lives
(the README lede, the `src/` roster, the export block of `src/index.js`,
and a line-addressed map of the README's sections), then the shared architecture (`Chart.js`, plus a
method-name roster for every chart class so the uniform lifecycle is visible
without reading 4,600 lines), then per-chart constructors — the
authoritative option/default list for each chart, including the two
(Network, Force) the README never documents. Rendering internals, the shared
utils, the test suite, and build/demo configuration follow. The README's
per-chart option prose is deliberately not reproduced — the constructors
carry the same information with the real defaults, and 1.7 gives the line
number of each README section for a one-hop read.
"""


fixture = "rqlite"
revision_pin = "c74c936d"
summary = """
`rqlite` is a distributed, fault-tolerant relational database written
in Go. It puts SQLite (via a forked `go-sqlite3` driver that adds
preupdate/commit hooks and disables checkpoint-on-close) behind the
Raft consensus algorithm from `hashicorp/raft`. Every write goes
through Raft and is applied by every node's FSM to its local SQLite
file; reads can run locally with a tunable consistency level (`none`,
`weak`, `linearizable`, `strong`). The binary is a single statically
linked executable (`cmd/rqlited`) with a sibling CLI (`cmd/rqlite`)
that speaks the HTTP API.

The `store/` package is the load-bearing centre: it owns the Raft
instance, the SQLite database (via `db.SwappableDB`), the snapshot
store, the Bolt log store, the network transport, and all the
bookkeeping that ties those subsystems together. `db/` shapes SQLite
to be safe under Raft (`SYNCHRONOUS=OFF`, autocheckpoint disabled,
`MaxOpenConns(1)` on the writer, custom `CheckpointManager`). `http/`
serves `/db/execute`, `/db/query`, `/db/request` plus snapshot,
backup, load, boot, status, nodes endpoints. `cluster/` carries
intra-node control-plane traffic (request forwarding, joins, removes,
CDC high-watermark broadcast, backup streaming) multiplexed over the
Raft port via a one-byte mux header. `snapshot/` implements a custom
Raft snapshot store that supports full + incremental WAL-based
snapshots with an MRSW lock so a slow follower can't stall the
leader. `cdc/` streams row-level changes to a webhook via a BoltDB
FIFO independent of the Raft log.

This NS serves coding-agent queries spanning explanations of the
overall architecture, locating where specific HTTP endpoints,
SQL/Raft entry points, consistency-level semantics, snapshot
orchestration, checkpoint coordination, cluster bootstrap/discovery,
CDC event flow, configuration flags, command-line subcommands, or
proto messages live. Each major package has a hand-written
`DESIGN.md` — including these early gives strong zero-follow-up
coverage for "why does X work this way?" questions; the function-
signature batches give "where does X happen?" precision.
"""


fixture = "rqlite"
revision_pin = "c74c936d"
summary = """
rqlite is a Go-implemented distributed relational database: SQLite under
Hashicorp Raft consensus, exposed over a REST/JSON HTTP API. The repository
is a sprawling, multi-package Go module (`github.com/rqlite/rqlite/v10`) with
two production binaries — `rqlited` (the server) and `rqlite` (the CLI) —
plus a benchmarking tool `rqbench`.

The ranking prioritizes:

1. Establishing the "what is this" within the first few hundred tokens —
   distributed SQLite, Raft, single-binary, the v10 generation, the top-level
   module path.
2. Locating the major architectural seams. Six packages do the load-bearing
   work: `store/` (FSM bridge to Raft + snapshot orchestration + cluster
   formation), `db/` (SQLite wrapper, WAL ownership, CDC hook plumbing),
   `http/` (REST API + endpoint dispatch), `cluster/` (intercluster control
   plane + bootstrap), `snapshot/` (custom Raft snapshot store with
   incremental snapshots), `cdc/` (Change Data Capture FIFO). Each has a
   `DESIGN.md` that is exceptionally well-written and high-signal; surfacing
   their key paragraphs early gives the agent semantic context that would
   otherwise require many tool calls.
3. Mapping the HTTP API. `/db/execute`, `/db/query`, `/db/request`,
   `/db/backup`, `/db/load`, `/boot`, `/snapshot`, `/reap`, `/remove`,
   `/status`, `/nodes`, `/leader`, `/readyz`, `/licenses` — agents asking
   "how do I X via the API" or "where does request Y get handled" should
   land directly.
4. The configuration surface. `rqlited` has dozens of CLI flags generated
   from `cmd/rqlited/flags.toml`; the generated `config_flags.go` Config
   struct documents every option.
5. The protobuf surface — every cluster message and every command type is
   declared in three `.proto` files. These are short, structured, and
   extremely high-value because they enumerate the entire wire API.

Likely query distribution: API behavior questions (consistency levels,
queued writes, backup/restore), Raft/snapshot internals, CDC delivery
semantics, cluster formation/discovery, build/operate (Docker, CLI flags),
and contributor-style "where is the code that handles X" questions.
"""


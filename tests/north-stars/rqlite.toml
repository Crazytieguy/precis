fixture = "rqlite"
revision_pin = "c74c936d"
summary = """
rqlite is a distributed relational database: SQLite behind a Hashicorp-Raft
consensus layer, shipped as a single Go binary. The repository is a flat set of
Go packages under the module root — `store/` (Raft + FSM + snapshot
orchestration, the centre of gravity), `db/` (SQLite/WAL abstraction), `http/`
(the REST API), `cluster/` (internode control plane over a muxed TCP port),
`snapshot/` (custom incremental Raft snapshot store), `cdc/` (change data
capture), `command/` (protobuf wire types), plus `cmd/rqlited`, `cmd/rqlite`
and `cmd/rqbench` binaries and a large `internal/` support layer. Five
package-level `DESIGN.md` documents carry the architectural reasoning that the
code cannot state.

The ranking serves the full spread of session-opening queries. First: what the
system is, the top-level file map, where the entry points and the design docs
live. Then the source roster (per-package listings and package ledes), then the
user-facing contracts an agent is most often asked about — the HTTP endpoint
table, the handler roster, query parameters, consistency levels, auth
permissions, the response envelope — then the Store core (its design-doc
section map, the FSM bridge, the complete exported API, the sentinel errors,
the operator-settable fields), then the operator configuration surface
(`rqlited` flags with defaults, the `rqlite` CLI dot-commands), then section
maps into the db, cluster, snapshot and cdc design documents together with the
command protobuf surface, and finally the support packages (internal/, auto/),
the test suites and the build/CI inventory.
Note that `CLAUDE.md` at the repo root is auto-loaded by the host harness; this
ranking deliberately spends nothing on content that file already covers
(package one-liners, data-flow summary, dependency list) and instead buys
precise locations and the material it omits.
"""


fixture = "sameboy"
revision_pin = "208ba4af"
summary = """
SameBoy is a cycle-accurate Game Boy (DMG) / Game Boy Color (CGB) emulator
written in portable C11, structured as a reusable emulation core (`Core/`,
public header `Core/gb.h`, all symbols `GB_`-prefixed) wrapped by several
independent frontends: a Cocoa app (`Cocoa/` + `HexFiend/` + `JoyKit/`), an
iOS app (`iOS/`), an SDL frontend (`SDL/`), a libretro core (`libretro/`), a
headless test runner (`Tester/`), macOS Quick Look plugins (`QuickLook/`) and
a FreeDesktop thumbnailer (`XdgThumbnailer/`). Open-source boot ROMs live in
`BootROMs/` (rgbds SM83 assembly), scalers in `Shaders/`, and one hand-written
GNU Makefile drives every target.

The ranking is built for the full spread of session-opening questions on a
repository like this: "how do I embed the core in my program" (gb.h's
lifecycle / loading / callback API), "where is <hardware subsystem> emulated"
(the Core header per subsystem plus the run-loop entry point in each .c),
"what does the debugger support" (its command table), "how do I build target
X or disable feature Y" (Makefile targets and GB_DISABLE_* switches), "where
does the SDL/Cocoa/iOS UI handle Z" (frontend rosters and entry points), and
"what does a save state contain" (save_state.h, the GB_SECTION layout, and
BESS.md). Early batches establish identity and the folder-to-language map;
the middle establishes the core's public API and its per-subsystem module
map; later batches cover the frontends, the build system, boot ROMs and
shaders, and the documentation's structure.
"""


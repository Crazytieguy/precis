fixture = "sameboy"
revision_pin = "208ba4af"
summary = """
SameBoy is a Game Boy (DMG) and Game Boy Color (CGB) emulator. The
emulation core is a portable C11 library under `Core/`, exposing a
`GB_*` API around an opaque `GB_gameboy_t`. That core is consumed by
several frontends — a Cocoa app for macOS (with embedded HexFiend +
JoyKit), an SDL app for everything else, an iOS app, a libretro core,
QuickLook previewers/thumbnailers, and an automatic tester. Boot ROMs
live under `BootROMs/` and are written in rgbds SM83 assembly; visual
scaling/filter shaders under `Shaders/` are polyglot GLSL/Metal. The
build system is a single ~940-line GNU Makefile with target-specific
toggles (`DISABLE_DEBUGGER`, `DISABLE_REWIND`, `DISABLE_CHEATS`, …)
that filter out the corresponding `Core/*.c` files and disable code
guarded by `#ifdef GB_DISABLE_*`.

Likely agent queries: "how do I integrate the core into a new
frontend?" (start at `Core/gb.h` public API near `GB_init` /
`GB_run`), "where is X register handled?" (`Core/memory.c` /
`Core/apu.c` / `Core/display.c` switch on `GB_IO_*` constants from
`Core/gb.h`), "how does the SDL build target work?" (`SDL/main.c`
+ Makefile `sdl:` target), "how do save states work?" (`Core/save_state.c`
+ `BESS.md`), "what does the debugger support?" (`Core/debugger.c`
command table + `Core/debugger.h`). Ranking favors breadth over depth:
list public API names everywhere first, drill into bodies only after
all subsystems are at least named.
"""


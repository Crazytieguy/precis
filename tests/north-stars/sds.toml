fixture = "sds"
revision_pin = "5347739b"
summary = """
antirez/sds — Simple Dynamic Strings, the small C dynamic-string library
extracted from Redis. ~10 files, ~2.6k LOC, drop-in to a C99 project by
copying sds.c + sds.h + sdsalloc.h.

Mental model the snapshot is built around:
- The user holds an `sds`, which is just `char *` pointing past a packed
  header. Five header sizes (sdshdr5/8/16/32/64) trade header bytes for
  max length; the type-tag is the byte at `s[-1]`.
- Most mutating fns may reallocate, so they return a (possibly new)
  pointer the caller MUST reassign — the cardinal usage rule.
- Append-style growth doubles up to SDS_MAX_PREALLOC (1 MB).
- A small zero-copy idiom (sdsMakeRoomFor + sdsIncrLen) lets callers
  read directly into the tail.

Query distribution served:
- "How does the dynamic header work / why 5 sizes" — design.
- "Which fn for X" / "what does fn Y do" — API navigation.
- "How do I embed sds / swap the allocator" — integration.
- "What's the contract for fn Z's return value" — usage correctness.
- "Where is feature W implemented" — code navigation.

Note: the README's `SDS internals` section diagrams the *v1* layout
(single sdshdr struct with len/free/buf); the actual code is v2 with
five packed types. Snapshot deliberately surfaces both so the agent
notices the discrepancy rather than trusting the prose blindly.
"""


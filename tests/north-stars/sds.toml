fixture = "sds"
revision_pin = "5347739b"
summary = """
SDS 2.0 (antirez' Simple Dynamic Strings) as a stand-alone vendored C
library: two implementation files (`sds.c`, `sds.h`), an allocator shim
(`sdsalloc.h`), a 57-line test-macro header (`testhelp.h`), an 8-line
Makefile that builds the in-file test main, and a 917-line README that is
the project's entire manual. There is no build system beyond the Makefile,
no CI, no test directory: the unit tests live inside `sds.c` behind
`#if defined(SDS_TEST_MAIN)`.

The ranking is built for an agent that will be asked to use, embed, patch
or debug this library. It leads with what SDS *is* (a string whose header
lives before the returned `char *`), then the complete public API surface
of `sds.h` — the prototype block plus the six `static inline` accessors
that are easy to miss because they are not prototypes — then the five
packed `sdshdr*` structs and the `SDS_TYPE_*` machinery that make the
header dynamic, then a name-level roster of every function defined in
`sds.c` (so any "where is X implemented" question is one grep away),
then the allocation core (`sdsReqType`/`sdsHdrSize`/`sdsnewlen`/
`sdsMakeRoomFor` growth policy), then the README's semantic content that
the headers cannot supply (preallocation rule, OOM contract, embedding
instructions, allocator swap, zero-copy append, and the fact that the
README's internals section still documents the *v1* single `sdshdr`),
then the remaining function bodies, then build/test/periphery.
"""


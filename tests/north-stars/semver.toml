fixture = "semver"
revision_pin = "5993c2e4"
summary = """
node-semver: the reference JS implementation of the semver.org v2.0.0 spec, used by npm itself.
Small (~2k LoC), mature, almost entirely pure functions. Shape: classes/{SemVer,Range,Comparator}
hold the real parsing/comparison/range-matching logic; functions/ and ranges/ are thin one-file-
per-function wrappers around the classes (function name == file name); internal/ holds the regex
tokenizer (re.js), constants, identifier-compare, an LRU memo cache, and options normalization;
bin/semver.js is the CLI; index.js is a lazy-getter barrel re-export. README.md is a genuine
worked spec (range grammar, prerelease semantics, CLI flags) and is treated as first-class content
here rather than boilerplate. Query distribution: (a) "how do I use function/flag X" — served by
the fs rosters + README; (b) "why does version/range Y behave like Z" — served by the class bodies
(SemVer parsing/compare, ranges/subset.js's algorithm) where the actual behavior is decided; (c)
"what does this project support/build as" — served by package.json + fs breadth. Given this
fixture's token density, this NS spends most of its 10k budget on breadth (complete fs listings +
signature rosters, so no follow-up read can turn up an unlisted file or function) and reserves a
smaller number of full-body batches for the handful of places where the real logic — not just the
name — is what an agent would actually need to read.
"""


justification = """
The commented rtl algorithm and the regex selection it drives: walk a global
regex, manually advancing `lastIndex` past the matched major/minor so overlapping
matches are seen, and stop once a match ends at the end of the string. The loop
body itself is elided. This is why
`'1.2.3.4'` coerces to `2.3.4` rather than `3.4` or `4`, and it is the piece of the
package most likely to be the subject of a bug report.

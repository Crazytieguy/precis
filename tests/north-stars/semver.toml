justification = "The satisfies/valid/clean identity-checking trio, prerelease (array-of-parts accessor), the parse() throwErrors shim, and inc()'s thin try/catch wrapper around SemVer.inc — the switch-driven bump logic itself stays roster-only (2.1) given budget, so this file is the deepest inc() coverage in this NS. rsort.js (also listed in 1.5) is skipped: it's compareBuild in the identical one-line shape as sort.js (3.7), just with swapped comparator args. Three other functions/ files are not bundled as trivial because they hold real, non-wrapper logic: cmp.js (the operator-dispatch switch used by Comparator.test), coerce.js (regex-based forgiving-version extraction), and diff.js (release-type classification between two versions) — their existence is established by the functions/ listing (1.5) but their bodies aren't rendered here given budget."

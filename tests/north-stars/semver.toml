justification = """
The most subtle behavior of the library: prerelease versions only
satisfy a comparator set if some comparator with the same [major, minor,
patch] tuple also has a prerelease tag, unless `includePrerelease` is
set. Worked examples for `>1.2.3-alpha.3`. Without this prose, the agent
cannot answer "why does my range not match my alpha version?" without
reading test fixtures.
"""
predecessor = "2.6"

fixture = "semver"
revision_pin = "5993c2e4"
summary = """
node-semver is the JavaScript implementation of the SemVer 2.0.0 spec used
by npm. The repo is a thin top-level `index.js` re-exporting from a strict
directory layout: `classes/` for the OOP core (`SemVer`, `Range`,
`Comparator`), `functions/` for ~24 small free functions (most are 5-line
delegators to `compare` / `SemVer` / `Range`), `ranges/` for higher-level
range queries (`subset`, `outside`, `min-version`, `simplify`,
`max-satisfying`, etc.), `internal/` for the regex tokenizer + constants +
helpers, and `bin/semver.js` for the CLI. The README is the canonical
prose reference for range semantics — hyphen / X / tilde / caret
desugaring, prerelease semantics, options, and coercion.

Likely query distribution: explanations of how a range desugars; what the
options mean; where a public API like `satisfies` / `inc` / `coerce` is
implemented; how versions and prereleases are compared; what the SemVer
regex tokens are; what the CLI flags are; where to add a new free
function. Authoring favors breadth — listing every public function, every
regex token, every README section heading — because the API is a long
list of small files and "what does X do?" / "where is X?" are the
dominant queries.
"""


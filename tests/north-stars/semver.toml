fixture = "semver"
revision_pin = "5993c2e4"
summary = """
`node-semver` v7.7.4 — the CommonJS implementation of the SemVer 2.0.0 spec that npm
itself uses, published as the `semver` package plus a `semver` CLI. Its substance is
three hoisted classes (`SemVer`, `Comparator`, `Range` in `classes/`) sitting on a
generated regular-expression token table (`internal/re.js`), wrapped by ~35 tiny
single-purpose modules split between `functions/` (version-level: parse, compare,
inc, coerce, diff) and `ranges/` (range-level: satisfies helpers, min-version,
outside, intersects, simplify, subset). `index.js` re-exports all of them as one
object; every published module is also individually requirable, so file paths *are*
API names. The 665-line README is the canonical human spec for range syntax
(hyphen / X / tilde / caret desugaring, prerelease-matching rules) and `range.bnf`
is its formal grammar.

The ranking front-loads (a) what the package is and where each API name physically
lives, (b) the range/prerelease *semantics* an agent needs before it can frame any
question about this library, then (c) the class internals and the desugaring
pipeline in `classes/range.js`, then (d) the regex token table and other
`internal/` primitives, the CLI, and finally the tap test tree, benchmarks and
npm/template-oss tooling. Plausible sessions here are: "why doesn't `^0.0.3` match
X", "add a release type", "fix a coercion edge case", "where is this regex built",
"how do I add a test", "why is this ReDoS-safe".
"""

# ---------------------------------------------------------------------------
# Tier 1 — identity and the physical map of the API surface.
# ---------------------------------------------------------------------------

[[batches]]
id = "1.1"
descriptor = "Package identity: README title + package.json name/version/description/main"
justification = """
Cheapest possible answer to "what is this repo". The README's setext title
(`semver(1) -- The semantic versioner for npm`) plus the four identifying
`package.json` fields pin down name, published version (7.7.4), purpose and the
CommonJS entry point. Nothing downstream makes sense without it, and it costs a
few dozen tokens.
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "README.md"
start = 1
end = 1
render = { kind = "full" }
[[batches.content.spans]]
path = "package.json"
start = 2
end = 5
render = { kind = "full" }

[[batches]]
id = "1.2"
descriptor = "Complete root directory listing"
justification = """
The whole top level in one shot: the five source directories (`classes/`,
`functions/`, `ranges/`, `internal/`, `bin/`), `index.js`/`preload.js`/`map.js`,
`range.bnf`, the docs, and the template-oss config files. `entries = "all"` so the
agent can trust that anything not listed does not exist at the root — the single
most useful orientation batch per token in a repo whose directories are its
API taxonomy.
"""
[batches.content]
kind = "fs"
[[batches.content.groups]]
parent = "."
entries = "all"

[[batches]]
id = "1.3"
descriptor = "package.json `bin` + `files`: CLI entry point and published surface"
justification = """
Answers two structural questions at once: `semver` the command is `bin/semver.js`,
and the published tarball is exactly `bin/ lib/ classes/ functions/ internal/
ranges/ index.js preload.js range.bnf` — i.e. `test/`, `benchmarks/` and
`tap-snapshots/` are repo-only. Tells an agent adding a module where it must live
to actually ship.
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "package.json"
start = 27
end = 40
render = { kind = "full" }

[[batches]]
id = "1.4"
descriptor = "Complete listings of classes/, internal/ and bin/"
justification = """
The core of the library as filenames: `classes/{semver,range,comparator,index}.js`
and `internal/{re,constants,parse-options,identifiers,lrucache,debug}.js`. These
are the files every other module requires, so knowing the exact set (and that there
are exactly six internals) turns most "where does X live" questions into a single
targeted read.
"""
[batches.content]
kind = "fs"
[[batches.content.groups]]
parent = "classes"
entries = "all"
[[batches.content.groups]]
parent = "internal"
entries = "all"
[[batches.content.groups]]
parent = "bin"
entries = "all"

[[batches]]
id = "1.5"
descriptor = "Complete listing of functions/ (24 version-level modules)"
justification = """
In this repo a filename *is* an exported API name: `functions/coerce.js` is
`semver.coerce`. Listing the directory exhaustively therefore delivers most of the
version-level public API — parse, valid, clean, inc, diff, major/minor/patch,
prerelease, compare/rcompare/compare-loose/compare-build, sort/rsort,
gt/lt/eq/neq/gte/lte, cmp, coerce, satisfies — for the price of a directory
listing. Partial listing here would be actively misleading, hence `entries = "all"`.
"""
[batches.content]
kind = "fs"
[[batches.content.groups]]
parent = "functions"
entries = "all"

[[batches]]
id = "1.6"
descriptor = "Complete listing of ranges/ (11 range-level modules)"
justification = """
The other half of the API taxonomy: `gtr`, `ltr`, `outside`, `intersects`,
`min-version`, `min-satisfying`, `max-satisfying`, `simplify`, `subset`,
`to-comparators`, `valid`. Ranked just after `functions/` because it is the same
class of content and smaller; splitting them keeps each independently satisfiable
and keeps early cost low.
"""
[batches.content]
kind = "fs"
[[batches.content.groups]]
parent = "ranges"
entries = "all"

[[batches]]
id = "1.7"
descriptor = "index.js aggregate export object, first half (parse..Range)"
justification = """
The file listings give paths; this gives the *names* callers actually type. First
half of the literal `module.exports` object at lines 45-91: parse, valid, clean,
inc, diff, major/minor/patch, prerelease, the compare family, sort/rsort, the six
comparison predicates, cmp, coerce, and the `Comparator`/`Range` classes. The
trailing ellipsis marks that the object continues past line 70 so the surface is
visibly partial rather than falsely complete; 1.8 fills it in.
"""
[batches.content]
kind = "lines"
[[batches.content.spans]]
path = "index.js"
start = 45
end = 70
render = { kind = "full" }
[[batches.content.spans]]

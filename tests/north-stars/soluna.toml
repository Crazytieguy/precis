fixture = "soluna"
revision_pin = "be822052"
summary = """
Soluna is a C + Lua 2D game engine/framework ("Sokol + Lua = Soluna"): a
small sokol_app/sokol_gfx-based C host (src/entry.c, src/luamods.c) embeds
a Lua runtime (src/lualib, src/service) running on the `ltask` multithreaded
task scheduler (3rd/ltask, vendored empty in this fixture as a git
submodule). Game code is a single Lua entry file (see test/*.lua, chosen by
a `.game` datalist config or `entry=` CLI arg) that returns a `callback`
table of frame/input handlers and draws through a `batch` object using
sprite/material modules (soluna.material.quad/text/mask/perspective_quad).
The public Lua API is hand-documented as LuaLS ---@meta stubs under docs/
(one file per `soluna.*` submodule) but two C modules, soluna.image and
soluna.font, expose materially more functions than their docs/ stub lists
— this NS surfaces the real luaL_Reg tables next to the docs so an agent
doesn't assume the stub is exhaustive. Query distribution: "how do I
use module X" (docs/ + real signatures), "how do I build/run/configure"
(Makefile, .game files, settingdefault.dl), "where does frame/event data
flow" (entry.c -> module registry -> Lua services), and C-level debugging
of the renderer/sprite-packing/font layers. Given the 10k-token budget
relative to this repo's size (~12.5k lines of C alone), this NS trades
depth for breadth: full bodies for the highest-traffic docs/example
files, location/signature pointers for everything else, with directory
listings guaranteeing no C module or example is silently unlisted.
"""


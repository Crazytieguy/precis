fixture = "soluna"
revision_pin = "be822052"
summary = """
Soluna is a 2D game framework: you write a game as a Lua script that returns a
callback table, and the engine — a C host built on sokol (window/gfx/args) plus
ltask (multithreaded services) — drives it. The repository has four distinct
substances, and the ranking interleaves them by value-per-token rather than by
directory: (1) the *game-authoring contract* — the `callback` table, the `args`
/ `Batch` object passed to the entry script, the `.game` settings file and its
complete default key set; (2) the *Lua API surface* — LuaCATS `---@meta` stubs
under `docs/` mirroring the C modules registered in `src/luamods.c`, plus the
pure-Lua runtime in `src/lualib/`; (3) the *service architecture* — `src/service/*.lua`
(start, render, loader, settings, log, gamepad) running as ltask services, booted
by `src/lualib/main.lua` over the C host in `src/entry.c`; (4) the *build
and delivery machinery* — a Windows-only `Makefile`, a cross-platform luamake
`make.lua` (including the emcc/WASM link flags), `clibs/*/make.lua` module
descriptors, the `script/` code generators, the composite GitHub action, and the
Hugo site under `web/` that publishes the live examples.

Early ranks buy repository identity and a complete map of the directories that
hold each substance; the middle ranks buy the semantics a game author or an
engine hacker needs without opening files (module registry, settings keys,
callback names, service entry points); the late ranks are precise location
rosters into the large C sources and the build/web appendix, so that "where is
X" is one grep away rather than a directory crawl.
"""


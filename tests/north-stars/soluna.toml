fixture = "soluna"
revision_pin = "be822052"
summary = """
Soluna is a 2D game framework written in Lua, built on top of sokol (graphics)
and ltask (an actor/multithreaded framework). It runs on Windows / Linux /
macOS / WebAssembly. A game is a Lua entry script that returns a callback
table (frame/mouse/key/resize/…); `bin/soluna.exe` boots a Lua state, registers
~30 embedded C modules under `soluna.*` and `ltask.*`, brings up render /
loader / settings / log / gamepad ltask services, and dispatches sokol-app
events into Lua.

The most load-bearing inputs for an agent:

-   `docs/*.lua` — LuaCATS @meta API reference. Tiny, signature-first.
-   `src/luamods.c` — master registry of every embedded Lua module.
-   `src/lualib/*.lua` — userspace Lua framework (`require 'soluna'`, layout,
    font/text/icon, package + zipfile loader).
-   `src/service/*.lua` — ltask services (render frame loop, asset loader,
    settings, app boot in `start.lua`).
-   `src/*.c` — Lua/C bindings, with `entry.c` holding sokol_main +
    `soluna.app`, `render.c` wrapping sokol_gfx, `spritemgr.c` doing atlas
    packing + the SOLUNA_BATCH metatable used in every frame callback.
-   `test/*.lua` + `*.game` — runnable examples.

The ranking is location-heavy: directory listings + per-file function-signature
locations are seeded early so follow-up greps land precisely. Full bodies are
reserved for the densest small files: the LuaCATS API reference under `docs/`,
`src/lualib/soluna.lua`'s tricky gamedir() body, `src/data/settingdefault.dl`,
the minimal-entry examples in `test/`.
"""


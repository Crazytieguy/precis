[[batches]]
id = "6.1"
descriptor = "The full `soluna.app` C surface in src/entry.c"
justification = """
`luaopen_soluna_app` registers thirteen entries, of which `docs/app.lua`
documents only three. The undocumented ten are exactly the engine-internal
primitives the boot path depends on and that an agent reading `main.lua` or
`start.lua` will otherwise be unable to resolve: `mqueue`, `unpackmessage`,
`sendmessage`, `unpackevent`, `set_window_title`, `set_icon`, `close_window`,
`version`, `init_desc`, plus `platform` which is patched in as a literal
string after `luaL_newlib`. This is also the entry point into `src/entry.c`
itself — the 918-line sokol host holding `sokol_main` and the
init/frame/cleanup/event callbacks.
"""

justification = """
Four steps per frame: reset the batch, call the game's `frame` callback, send
`submit_batch` to the render service with the batch pointer, then a blocking
`ltask.call(render, "frame", count)`. Wrapped in `xpcall` so a Lua error
permanently disables the frame callback. This is the hot path for any
performance or rendering-order question, and the send/call asymmetry is the
detail that explains frame pacing.
"""

fixture = "sps"
revision_pin = "5a10e7f4"
summary = """
`sps` is a Rust reimplementation of Homebrew for macOS (ARM): it installs and
removes *formulae* (bottled CLI packages, optionally built from source) and
*casks* (macOS app bundles and their artifacts), talking to the
formulae.brew.sh JSON API and GHCR's OCI registry. It is a four-crate Cargo
workspace: `sps` (clap CLI binary + the async planning/download half of the
install pipeline + the terminal status renderer), `sps-common` (Config path
layout, SpsError, Cache, KegRegistry, Formula/Cask models, dependency
resolver, and the shared pipeline job/event vocabulary), `sps-core` (the
synchronous execution half: bottle install/link/Mach-O relocation, cask
staging and 23 artifact kinds, source builds for 7 build systems, uninstall,
upgrade, installed/outdated checks), and `sps-net` (HTTP downloads, OCI blob
fetch, checksum validation).

The ranking front-loads (1) what the project is and where its substance
lives — root listing, workspace membership, every source directory including
the 24-file cask-artifact leaf, and each library's re-export surface;
(2) the architecture spine an agent must hold to change anything: the clap
`Command` enum, the shared `PipelineEvent`/`PlannedJob` vocabulary, and the
planner -> downloader -> worker-pool -> broadcast-events -> status-display
flow; (3) the user-facing flag surface, one clap struct per subcommand;
(4) the `sps-common` domain model (Config's 26 path helpers, the 26 SpsError
variants, Formula and Cask fields, dependency tags, resolver types, the
installed-artifact kinds and the keg/cache lookups); then (5) sps-core's
execution entry points for bottles, casks, checks and macOS-only helpers,
(6) sps-net's endpoints and download API, (7) source builds, and (8) the
remaining directories plus the contributor command set. Rosters are
name-only wherever the class matters more than the bodies, so the agent
never has to guess whether an unlisted sibling exists.
"""


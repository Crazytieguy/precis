fixture = "sps"
revision_pin = "5a10e7f4"
summary = """
sps is a Rust port of the Homebrew package manager for macOS, structured as a
4-crate Cargo workspace: `sps-common` (shared types — Config, Cache, Cask /
Formula models, dependency resolver, KegRegistry, pipeline event/job types),
`sps-net` (Homebrew Formulae API client + HTTP downloads + OCI/GHCR bottle
fetcher), `sps-core` (the heavy lifting — bottle install/link, build-from-source
with multiple build systems, cask install/uninstall/zap with macOS artifact
handlers, upgrade flows, dependency-aware pipeline worker), and `sps` (the
binary — clap CLI with `install` / `uninstall` / `reinstall` / `upgrade` /
`list` / `info` / `search` / `update` / `init` subcommands and an async
pipeline runner that fans out downloads + worker-pool installs while a status
TUI consumes broadcast events).

The query distribution to serve includes: "where is X feature implemented",
"what does the install pipeline look like", "how does the dependency resolver
decide bottle vs source", "how is a Cask zap stanza handled", "what fields
does Formula / Cask have", "what error variants exist", "where does the bottle
checksum get verified", "how do CLI args flow into the runner", and many
debugging / extension tasks across the four crates. Breadth across modules and
precise pointers into the large pipeline / install / build files are the main
wins; common types (Config paths, Formula / Cask shape, SpsError variants) are
worth full bodies because they're referenced everywhere.
"""


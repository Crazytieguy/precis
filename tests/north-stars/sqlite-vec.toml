fixture = "sqlite-vec"
revision_pin = "563a3e60"
summary = """
sqlite-vec is a single-file, dependency-free C SQLite extension for vector search. Effectively the whole implementation is sqlite-vec.c (9886 lines), partitioned by #pragma region into: SQL scalar functions (vector constructors, distance, quantization, arithmetic), the vec_each and vec_npy_each table functions, the vec0 virtual table, and the vec_static_blobs pair. vec0 is the substance: it stores vectors in chunked shadow tables with validity bitmaps, and supports metadata, auxiliary and partition-key columns, with a private single-character idxStr protocol carrying constraints from xBestIndex to xFilter across three query plans (fullscan, point, KNN). Everything else is scaffolding around that one file: a Makefile producing loadable/static/CLI/WASM artifacts, sqlite-dist.toml packaging to nine ecosystems, reference.yaml compiling into a VitePress docs site, per-language bindings and examples, and a four-language test suite.

The ranking front-loads identity and a navigational map of sqlite-vec.c, then the vec0 virtual table's contracts -- module table, shadow schemas, query plans, idxStr and operator alphabets, limits, struct shapes -- before its implementation rosters, then the SQL function surface and the other table functions, then build, packaging and CI, then tests, examples, bindings and docs. Symbol rosters are name-only truncations over stated complete line ranges, so that 'where is X' is one read away and no partially-shown class invites the wrong inference.
"""


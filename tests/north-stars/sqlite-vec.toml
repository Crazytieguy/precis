fixture = "sqlite-vec"
revision_pin = "563a3e60"
summary = """
`sqlite-vec` is a SQLite extension for vector search, distributed as
a single C amalgamation: `sqlite-vec.c` (~9.9k lines) plus a generated
`sqlite-vec.h`. It registers a family of scalar functions
(`vec_f32`, `vec_int8`, `vec_bit`, `vec_length`, `vec_type`, `vec_add`,
`vec_sub`, `vec_slice`, `vec_normalize`, `vec_to_json`,
`vec_distance_l2/l1/cosine/hamming`, `vec_quantize_binary/int8`,
`vec_version`, `vec_debug`), two table-valued functions (`vec_each`,
`vec_npy_each`) and the headline virtual table module `vec0`. `vec0`
backs vector indexes via several SQLite shadow tables (`_chunks`,
`_rowids`, `_vector_chunksNN`, `_metadatachunksNN`,
`_metadatatextNN`, `_auxiliary`) and supports float32 / int8 / bit
vector element types plus four kinds of user-declared columns:
vector, primary key, partition key, auxiliary (`+`-prefixed), and
metadata. KNN queries use `WHERE vec_col MATCH :q` combined with
either `k = ?` or `LIMIT ?` (LIMIT requires SQLite ≥ 3.41). There are
three named entry points: `sqlite3_vec_init` (default), the
filesystem-using `sqlite3_vec_numpy_init`, and
`sqlite3_vec_static_blobs_init` (for in-memory NumPy-backed indexes
via `vec_static_blobs` / `vec_static_blob_entries`).

The repository ships much more than the core C extension. There are
language bindings (Python, Rust, Go ncruces patch — the Node, Ruby,
Datasette, sqlite-utils ports live in separate repos but are
referenced) and a *large* example fan-out under `examples/`: one
`simple-<lang>` demo per supported binding (C, Rust, Python, Node,
Bun, Deno, Go-cgo, Go-ncruces, Ruby, SQLite shell, WASM browser) all
implementing the same canonical 5-vector KNN demo, plus the
nbc-headlines Jupyter tutorial, an OpenAI Python recipe, and the
`sqlite3-cli` / `wasm` entry-init shims. The pytest suite under
`tests/` is the most exhaustive correctness check: a single 2.5k-line
`test-loadable.py` covers nearly every scalar function plus the vec0
lifecycle (`test_vec0_*`), with focused companion files for metadata,
auxiliary, partition keys and KNN distance constraints, snapshot
files in `tests/__snapshots__/`, a tiny rust+C unit harness, and a
fuzz / minimum / afbd corner. The VitePress site under `site/`
provides public docs (getting-started, using/<language>, features/,
guides/, api-reference, compiling, versioning) consumed at
https://alexgarcia.xyz/sqlite-vec.

The ranking is shaped around the dominant query distribution this
fixture attracts: explaining what `sqlite-vec` is and how vec0
works, looking up the signature/semantics of a specific SQL function
or `vec0` column kind, debugging a KNN query plan (idxStr / xBestIndex
/ xFilter), wiring `sqlite-vec` into a particular language's SQLite
driver, modifying the constructor / parsers / shadow-table SQL, and
extending the test or build matrix. The single C file is so large
that *locations* (the `static int <name>(` pivot lines for the ~150
top-level functions and the line where each `#pragma region` opens)
do most of the work for "where is X" queries, with select bodies
(`sqlite3_vec_init`'s registration tables, `struct vec0_vtab`,
`vec0BestIndex`'s query-plan switch, `vec0Filter` and `vec0Update`
dispatches, the column-kind parsers) inlined when they encode
behavior the agent could not infer from the name alone.
"""


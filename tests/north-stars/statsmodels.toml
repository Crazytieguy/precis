fixture = "statsmodels"
revision_pin = "3c102982"
summary = """
statsmodels is a large, mature Python package for statistical modeling,
hypothesis testing, and data exploration: linear regression, GLM/GEE,
discrete/count models, time-series (AR/ARIMA/SARIMAX, state-space,
exponential smoothing, VAR/VECM), survival, multivariate (PCA/Factor/
MANOVA), nonparametric KDE, robust models, GAMs, mediation, MICE
imputation, plus a deep `stats` toolbox of diagnostic tests and
multiple testing. The repo is a Python package built with meson-python
and Cython; the user-facing surface centers on three flat namespaces
— `statsmodels.api as sm` (cross-sectional models), `statsmodels.tsa.api
as tsa` (time series), `statsmodels.formula.api as smf` (R-style
formulas) — each re-exporting model classes that share a common
`Model -> LikelihoodModel -> ...Model` / `Results -> ResultsWrapper`
shape rooted in `statsmodels/base/model.py`. Almost every subpackage
follows the same skeleton: a small `api.py` re-export, one or two big
`*_model.py` modules with class docstrings carrying parameters / math
/ examples, and a `tests/` directory comparing against R/Stata/SAS.

Query distribution the ranking serves:
- "how do I fit/predict/summarize model X with statsmodels" (very
  common): satisfied via api re-exports + canonical examples + the
  fit/predict signatures of the model classes most users hit (OLS,
  GLM, Logit, ARIMA, RLM).
- "where is the implementation of <statistical test / model>": the
  walker needs to point precisely to one of dozens of files across
  regression/, genmod/, discrete/, tsa/, stats/, multivariate/, ...
  — breadth of locations matters more than depth of any one file.
- "what's the inheritance / wrapper pattern" / "how do I add a new
  model": served by base/model.py class anchors + base/wrapper.py +
  the regression `RegressionModel -> GLS/WLS/OLS/GLSAR` chain.
- Build / packaging / lint / CI questions: meson.build, pyproject,
  lint.sh, requirements*.txt.
- Time series in particular is a heavy subtree; both stattools and
  the state-space stack get their own pointers.
- The `sandbox/`, `examples/`, `archive/` subtrees exist but contain
  experimental or stale code — agents need to know they're there but
  rarely need their contents preloaded.
"""


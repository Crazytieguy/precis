fixture = "statsmodels"
revision_pin = "3c102982"
summary = """
statsmodels is a large Python statistics package: estimation and inference
for statistical models (regression, GLM/GEE, discrete choice, robust,
mixed effects, survival, multivariate, nonparametric) plus a wide library
of statistical tests, time-series analysis including a full state-space
framework, plotting, datasets and I/O. The substance is the `statsmodels/`
package: ~25 domain subpackages, most carrying an `api.py` re-export
module and a colocated `tests/` directory, all built on one pattern —
`Model` -> `Results` -> `ResultsWrapper` defined in `statsmodels/base/`.

The ranking front-loads (a) what the project is and how a caller uses it,
(b) the filesystem map at root and package level, (c) the public name ->
defining-module mapping in `statsmodels/api.py`, `formula/api.py`,
`tsa/api.py` and the subpackage `api.py` files, because for this repo
"where does symbol X live" is the dominant follow-up question, and (d) the
base Model/Results class and method rosters that every estimator in the
tree inherits. Flagship implementations (OLS/GLS/WLS, GLM + families,
discrete models, tsa/statespace) come next at class-roster granularity,
then the domain directory maps (tsa, statespace, stats, tools, graphics,
iolib), then the docs tree and the build/test/lint configuration, and last
the peripheral trees (examples/, tools/, .github/). Method and class
rosters are rendered name-only — truncated at the opening paren where that
saves tokens — so that each roster is complete for its class rather than a
sample of it; ellipses mark elided tails wherever a batch stops inside a
list or class body.
"""


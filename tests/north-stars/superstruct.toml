fixture = "superstruct"
revision_pin = "e414c8af"
summary = """
Superstruct is a TypeScript runtime data-validation library: you compose
small `Struct<T, S>` validators (`object`, `array`, `string`, `union`,
`refine`, `coerce`, `defaulted`, …) and run them with `assert` / `is` /
`validate` / `create` / `mask`. Everything is one file's worth of core
plumbing (`src/struct.ts`, ~270 lines) plus a flat menu of factory
functions in `src/structs/{types,refinements,coercions,utilities}.ts`,
re-exported through `src/index.ts`. Tests are a generic harness over
hundreds of `test/validation/<kind>/<name>.ts` fixture modules, plus
`test/api/*.test.ts` for behavior of the top-level helpers and
`test/typings/*.ts` for compile-time type-level tests via `Describe` /
`Infer`. Docs live in `docs/{guides,reference}/` and get the rendered
site treatment via `.gitbook.yaml`.

The ranking serves the full distribution of agent tasks: explaining
what a struct is, picking the right factory ("is there a built-in for
emails / nullable optionals / records?"), wiring coercion vs. validation
correctly (`create` vs. `assert`), authoring custom types with
`define`, debugging StructError shape (`path` / `branch` / `failures()`
generator), adding a new factory in the right file, threading the
`Context` through `entries`/`coercer`/`validator`/`refiner`, and
extending the test fixture harness. Catastrophic-omission risk is
high here because the public surface is a flat *menu* of small
factories — listing only some is worse than listing none.
"""


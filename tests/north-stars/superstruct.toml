fixture = "superstruct"
revision_pin = "e414c8af"
summary = """
Superstruct: a small (~1800 LoC across 8 src files) TypeScript library for \
runtime data validation. Its whole public surface is composable "struct" \
factories (src/structs/types.ts), coercions (structs/coercions.ts), \
refinements (structs/refinements.ts) and utilities (structs/utilities.ts) \
that build `Struct` objects (src/struct.ts), which `assert`/`create`/`is`/ \
`mask`/`validate` then run against unknown input, throwing/returning a \
`StructError` (src/error.ts) on failure. Query distribution: (a) "how do I \
validate/coerce/refine/compose shape X" — answered by the type-factory \
catalog + docs/reference + docs/guides + examples/, all of which show the \
same ~25 factory names from different angles; (b) "why did validation fail \
this way" / "what does the error look like" — src/error.ts + \
docs/reference/errors.md + the `run()` traversal in src/utils.ts; (c) "add \
a new struct kind" or "fix a validation bug" — needs struct.ts's Struct \
class contract, utils.ts's run()/toFailures(), and the matching \
test/validation/<kind>/*.ts fixture format; (d) build/test/lint/publish \
questions — package.json scripts, tsconfig, rollup, CI, jsr.json (this \
package ships to both npm and JSR); (e) "is this a breaking change" / \
migration — Changelog.md's 2.0.0 entry. The library has no runtime \
dependencies and a tiny, flat module layout, so breadth (knowing every \
factory/refinement/coercion/utility exists and where) usually beats depth \
for a first tool call; depth pays off specifically in struct.ts/utils.ts \
(the shared machinery every factory routes through) and in the \
test/validation fixture format (needed verbatim to add a test).
"""


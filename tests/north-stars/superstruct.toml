fixture = "superstruct"
revision_pin = "e414c8af"
summary = """
superstruct is a ~1500-line TypeScript library for validating unknown data at
runtime with composable, inference-friendly schemas. Everything is a `Struct`
object (src/struct.ts) carrying a type name, a schema, and four pluggable
hooks - coercer, validator, refiner, entries. The recursive engine `run()` in
src/utils.ts walks a value against a struct and yields failures; the five
public helpers assert/create/is/mask/validate are thin wrappers over it. The
API an application sees is ~45 factory functions across four files under
src/structs/: types.ts (25 type structs), utilities.ts (composition helpers),
refinements.ts (constraints), coercions.ts (input transforms), all re-exported
from the six-line barrel src/index.ts.

The ranking front-loads identity, the complete file map and complete symbol
rosters for every source module (tiers 1-2), then attaches one-line semantics
to each rostered factory (tier 3), then the validation engine and the
construction/error lifecycle (tier 4), then everything outside src/ - the docs
tree, the GitBook guide map, and the data-driven vitest fixture system under
test/ (tier 5) - then the deeper factory implementations whose behaviour is
surprising (tier 6), and finally build tooling and release history (tier 7).
It is tuned for a query mix dominated by "which struct/helper do I use and what does it do", "why did
this value fail validation", "how do I add a custom type or a test case", and
"how do I build and check this repo".
"""


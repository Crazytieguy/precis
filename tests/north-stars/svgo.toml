fixture = "svgo"
revision_pin = "581fe687"
summary = """
SVGO is a Node.js library + CLI that optimizes SVG files by parsing
them into an xast-like AST, running an ordered list of visitor-based
plugins over it, and stringifying the result. The public entry point
is `optimize(input, config)` exported from `lib/svgo.js` (browser) and
re-exported with Node.js-platform defaults + `loadConfig` from
`lib/svgo-node.js`. The pipeline is parse → invokePlugins → stringify,
optionally repeated when `multipass: true`. Plugins are 50+ small
modules under `plugins/*.js`, each exporting `name`, `description`,
and `fn: Plugin<P>`. `preset-default` (also under `plugins/`) defines
the canonical ordered subset enabled by default. The ranking front-
loads orientation (README, exports, plugin catalogue), then the
plugin engine + visitor + preset list, then the parser/stringifier/
style/xast support modules, then per-plugin signatures and bodies in
roughly the order they're invoked by the preset. Common queries:
"what plugin does X / what's its option name", "how do plugins
register / where's the visitor loop", "how is the SVG parsed /
stringified", "what's the CLI flag for Y", "what's the public API
when embedding SVGO".
"""


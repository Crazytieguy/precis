fixture = "svgo"
revision_pin = "581fe687"
summary = """
SVGO is a Node.js library and command-line application that optimizes SVG files
by running them through a configurable pipeline of built-in plugins. The shape
of the repository follows the shape of that pipeline: `lib/` holds the engine (a
sax-based parser producing an xast tree, a visitor-based plugin runner, and a
stringifier, wrapped by `optimize()` in `lib/svgo.js`, with a Node-specific
entry in `lib/svgo-node.js` and a commander CLI in `lib/svgo/coa.js`), while
`plugins/` is one large flat directory in which each module exports `name`,
`description` and `fn`. `plugins/preset-default.js` fixes the default 34-plugin
order and `lib/builtin.js` is the registry. `lib/types.ts` carries the entire
typed surface -- Config, the Xast node family, Visitor/Plugin, StringifyOptions
and the per-plugin params maps -- for JS sources type-checked with `checkJs`.

The ranking goes: identity and directory closure first; then the `optimize()`
entry point and the config shape a user actually writes; then the plugin
system's mechanics (default pipeline order, registry, plugin module contract,
engine, traversal); then a one-line description for every described plugin,
which is the cheapest large block of semantic understanding in the repository;
then the typed public surface; then the CLI flag table; then engine internals as
name-and-line rosters so deep questions (path command arities, colour-name maps,
the css-select adapter) stay one hop away; and finally build/test tasks,
documentation listings and tooling config. Query distribution served: "how do I
configure X", "which plugin does Y", "where does the AST get mutated", "how do I
write a plugin", "what does flag Z do", "how do I run the tests", "why did v4
break my config".
"""


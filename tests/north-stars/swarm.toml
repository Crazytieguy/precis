fixture = "swarm"
revision_pin = "0c82d7d8"
summary = """
OpenAI's `swarm` — a small, deliberately educational Python library for
multi-agent orchestration on top of the Chat Completions API, now
superseded by the OpenAI Agents SDK. The whole library is ~420 lines in
one package (`swarm/`): a stateless `Swarm.run()` loop, three pydantic
types (`Agent`, `Response`, `Result`), a function->JSON-Schema
converter, and a REPL helper. Everything else in the tree is
supporting material: a 357-line README that is the real documentation,
a large `examples/` tree (nine directories, seven of them real demo
apps — one of which, `customer_service_streaming`, is an entirely
separate legacy mini-framework that reuses the name `Swarm`), a small
pytest suite with a hand-rolled OpenAI mock, setuptools packaging, and
several directories of recorded session JSON logs.

The ranking front-loads (a) what the project is and that it is
deprecated, (b) the filesystem shape, (c) the public API surface of
`swarm/` at signature/field granularity, (d) the README's semantic
documentation of the run loop, agents, functions, handoffs and
streaming, (e) the examples inventory and the canonical example
programs, then (f) the library's implementation bodies, (g) tests and
packaging, and finally (h) the legacy streaming example plus the
remaining asset directories. The bulk corpora — the root `logs/`, the
per-example `logs/` and the hundreds of `data/article_*.json` files —
are deliberately never enumerated. Queries this serves: "how do handoffs work", "what
arguments does run take", "where do I add a tool", "how is a Python
function turned into a tool schema", "how do I run the tests", "what
example should I copy", "is this maintained".
"""


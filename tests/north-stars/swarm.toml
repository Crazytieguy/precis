fixture = "swarm"
revision_pin = "0c82d7d8"
summary = """
Swarm is OpenAI's educational, lightweight Python multi-agent
orchestration framework. The whole library lives in `swarm/`
(core.py, types.py, util.py, repl/repl.py) and exposes two
primitives — `Agent` (instructions + functions) and **handoffs**
(returning an `Agent` from a function transfers control). `Swarm.run()`
runs a stateless loop: get a Chat-Completions completion, execute tool
calls, swap the active agent if a function returned an `Agent`, repeat
until no tool calls or `max_turns`. The README is the user-facing spec
and is long and prescriptive.

The corpus is dominated by `examples/` — six tiny demos for the public
API plus three full multi-agent apps (`airline`, `support_bot`,
`personal_shopper`) and one outlier (`customer_service_streaming`)
that re-implements a parallel Swarm-like engine on top of the
OpenAI Assistants/Chat APIs (not the library — its own thing). Two
sibling dirs `customer_service/` and `customer_service_lite/` are
*logs-only* (no code). Many directories hold dozens of OpenAI help-
center article JSONs and historical session logs; those are bulk noise
the agent rarely needs to read.

The ranking serves the full task distribution: explaining the
framework, adding a new example, debugging the run loop, writing
agents/handoffs/context_variables, modifying eval scripts, or working
inside the streaming sub-project. Early batches anchor the
README + public API + `Swarm.run` loop so most "how does X work"
queries land with zero follow-up. Mid-rank batches expose the function
inventories of every example so "where is X defined" needs at most
one read. Late batches add bodies and the streaming sub-project's
internals on demand.
"""


fixture = "thiserror"
revision_pin = "9ac165c4"
summary = """
`thiserror` 2.0.18 (dtolnay) — a Cargo workspace of two crates that
together implement `#[derive(Error)]` for the standard library's
`std::error::Error` trait. The root crate (`src/`) is a thin `no_std`
runtime shim: it re-exports the derive macro and provides the sealed
helper traits (`AsDynError`, `AsDisplay`, `ThiserrorProvide`, `Var`)
that generated code calls through a version-stamped `__private18`
module built by `build.rs`. All the real work is in `impl/`
(`thiserror-impl`), a proc-macro crate whose pipeline is
`ast.rs` (parse syn input into Struct/Enum/Variant/Field) →
`attr.rs` (parse `#[error]`/`#[source]`/`#[from]`/`#[backtrace]`) →
`fmt.rs` (expand the `{field}` display shorthand) → `valid.rs`
(reject bad attribute combinations with tuned diagnostics) →
`expand.rs` (emit the Error/Display/From impls), with `fallback.rs`
emitting a stub impl when validation fails.

The ranking front-loads what the crate *is* and how users spell it:
the README lede and canonical example, the two source trees, the
derive entry point and its accepted attributes, then the attribute
semantics (`#[from]`, `#[source]`, `#[backtrace]`,
`error(transparent)`, `error(fmt = ...)`, format-shorthand rules) that
dominate "how do I express X" questions. After that comes the
proc-macro implementation surface — type rosters, function rosters and
the shape of the generated impls — sized so that "where is X
implemented" lands in one grep. The runtime shim, build-script cfg
probing, the integration/trybuild test corpus and packaging/CI
metadata rank last, since they answer narrower questions.
"""


fixture = "thiserror"
revision_pin = "9ac165c4"
summary = """
thiserror is a proc-macro crate (two-crate workspace: `thiserror` re-exports \
`thiserror-impl`'s `#[derive(Error)]`) that generates `std::error::Error` \
(source/provide) and `Display` impls from `#[error(...)]`, `#[from]`, \
`#[source]`, and `#[backtrace]` field/container attributes, plus \
`#[error(transparent)]` passthrough. The query distribution this NS serves: \
(a) "how do I use attribute X" (README/lib.rs doc-comment semantics), \
(b) "why won't my derive compile" (impl/src/valid.rs's exact error strings, \
tests/ui/*.rs+*.stderr compile-fail catalog), (c) "how does the macro expand \
X" (impl/src/{ast,attr,fmt,expand}.rs — parse attrs -> validate -> codegen), \
(d) build/CI/config operational questions (build.rs nightly-feature probing, \
ci.yml job matrix), and (e) "what usage patterns are already tested" \
(tests/test_*.rs). Runtime-support traits in src/{aserror,display,provide,var}.rs \
back every generated impl and are referenced pervasively from expand.rs via \
`::thiserror::#private::*`.
"""


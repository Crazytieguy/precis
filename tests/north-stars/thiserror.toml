fixture = "thiserror"
revision_pin = "9ac165c4"
summary = """
thiserror is a derive-macro library that generates std::error::Error
impls from #[derive(Error)] on user types, plus Display from
#[error("…")] and From from #[from]. The crate is split in two: a
tiny no_std runtime shim (`src/`) of doc-hidden helper traits
(AsDynError, AsDisplay, ThiserrorProvide, Var) re-exported through a
`__private<patch>` module, and a proc-macro implementation
(`impl/src/`) that parses input with syn (ast.rs / attr.rs),
validates attribute combinations (valid.rs), and expands to
Display/Error/From impls (expand.rs) — with format-string shorthand
expansion in fmt.rs, where-clause bound inference in generics.rs, and
a custom scan_expr.rs for expression scanning when syn's `full`
feature isn't enabled.

The query distribution to serve is the full spread of dev tasks:
how to use the macro (most queries land in README + lib.rs doc lede +
the attribute set), how the macro is implemented (expand.rs / ast.rs
/ attr.rs), what's allowed (valid.rs + tests/ui error messages), how
Display formatting works (fmt.rs + test_display.rs), how From +
Backtrace interact (test_from + test_source + expand
from_initializer), and the no_std story (build.rs + Cargo.toml
feature flag + private.rs cfg gates).

Cost discipline: at a ~10K cumulative cap, full-body inclusion is
reserved for very-high-value short content (lede, README example,
ast / attr type defs, expand.rs entry, valid.rs, the runtime shim,
and one representative integration test). Larger files are exposed
via locator batches (fn-name truncated spans) so any body is
reachable in one hop.
"""


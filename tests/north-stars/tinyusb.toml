justification = "`tinyusb_sources_get()` / `tinyusb_target_add()` name the exact compiled translation units (deliberately excluding DCD/HCD drivers, which the board layer adds) and the include directories, including the lib/networking hack for the net class. This is the first thing to edit when adding a new .c file to the stack."

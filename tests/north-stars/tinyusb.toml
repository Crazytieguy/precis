descriptor = "Maintenance tooling and documentation sources"
justification = "tools/ holds the scripts referenced across the workflow: get_deps.py, build.py + build_utils.py, make_release.py, metrics.py + metrics_compare_base.py, gen_presets.py, gen_doc.py, iar_gen.py, file2carray.py, mksunxi.py, pcapng_to_corpus.py, plus codespell/ word lists and usb_drivers/. docs/ is a Sphinx site whose reference/ subdirectory holds the deeper design material (architecture, concurrency, usb_concepts, boards, dependencies, glossary) and info/ the changelog."

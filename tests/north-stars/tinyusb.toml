] }

[[batches]]
id = "7.3"
descriptor = "Test inventory: unit, fuzz and hardware-in-the-loop"
justification = "Three distinct test flavours with different entry points: test/unit-test (Ceedling project.yml + test/ sources for fifo, common funcs, usbd and msc_device), test/fuzz (per-class libFuzzer harnesses plus their own make.mk/rules.mk), test/hil (hil_test.py driven by hfp.json / tinyusb.json board configs). Knowing which of the three can even exercise a change is a routine early decision."
content = { kind = "fs", groups = [
  { parent = "test", entries = "all" },
  { parent = "test/unit-test", entries = "all" },
  { parent = "test/unit-test/test", entries = "all" },
  { parent = "test/fuzz", entries = "all" },
  { parent = "test/hil", entries = "all" },
] }

[[batches]]
id = "7.4"
descriptor = "hw/ split: board-support packages vs vendor MCU SDKs"
justification = "hw/ has exactly two children and they are easy to confuse: bsp/ is in-repo board support (one directory per MCU family — those names are the FAMILY argument of the build tooling — plus shared board_api.h, board.c, family_support.cmake/.mk, family_rules.mk, BoardPresets.json), while mcu/ is vendor SDKs fetched on demand by tools/get_deps.py and mostly absent from a fresh checkout. Two entries for eight tokens; the 80-plus family names underneath are a cheap ls away and are already sign-posted by the harness docs."
content = { kind = "fs", groups = [
  { parent = "hw", entries = "all" },
] }


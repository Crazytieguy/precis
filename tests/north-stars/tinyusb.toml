fixture = "tinyusb"
revision_pin = "7f146c9f"
summary = """
TinyUSB is an open-source cross-platform USB Host/Device stack for
embedded MCUs. It is written in C99, has no dynamic allocation, and
defers all USB ISR work to task context for thread safety. It
supports 50+ MCU families through MCU-specific DCD/HCD drivers under
`src/portable/`, an OS abstraction layer in `src/osal/`, and a
multi-class architecture under `src/class/` (CDC, HID, MSC, Audio,
MIDI, Video, MTP, DFU, Net (ECM/NCM/RNDIS), Printer, BTH, USBTMC,
Vendor, plus host-only `serial/` drivers for FTDI/CP210x/CH34x/
PL2303). The aggregator header `src/tusb.h` selects which class +
role headers are compiled based on `CFG_TUD_*` / `CFG_TUH_*` macros
from the user's `tusb_config.h`.

The repository is large (~150 KLOC, ~13 device classes + 5 host
classes, ~22 vendor directories under `src/portable/`, ~30+ example
apps, dozens of supported boards in `hw/bsp/`). It is also a
documentation-rich crate: `docs/reference/architecture.rst` covers
the layered design, `docs/integration.rst` shows a minimal init flow,
`docs/porting.rst` is the porting recipe, and the top-level README is
the entry point for board/MCU support tables.

Plausible agent queries span the full distribution:

* "How do I use the CDC device API?" — needs the `tud_cdc_*` API
  surface in `src/class/cdc/cdc_device.h` plus the example main.c.
* "Add support for a new class driver." — needs the `usbd_class_driver_t`
  vtable in `src/device/usbd_pvt.h` + the static driver array in
  `src/device/usbd.c` + `usbd_app_driver_get_cb` extension hook.
* "Port to a new MCU." — needs `src/portable/template/`, the porting
  doc, the DCD/HCD interfaces in `src/device/dcd.h` + `src/host/hcd.h`,
  and `src/tusb_option.h` MCU enum.
* "What does `tusb_init` actually do?" — needs `src/tusb.c` body +
  `tud_rhport_init` / `tuh_rhport_init` in their `.c` files.
* "Where is USB descriptor type X defined?" — needs `src/common/tusb_types.h`
  enums + descriptor struct catalog.
* "Configure CDC FIFO sizes." — needs `CFG_TUD_CDC_*` defaults in
  `cdc_device.h` and the example `tusb_config.h`.
* "Why is my device not enumerating?" — needs `tud_task` event loop
  in `usbd.c`, `dcd_event_t` definition in `dcd.h`, the deferred-ISR
  architecture explanation.

The ranking prioritises (1) breadth — locations of every public API
symbol (`tud_*`/`tuh_*`/`hcd_*`/`dcd_*`), every class subdir, every
portable vendor dir, every example; (2) the high-signal snippets
that anchor concepts (descriptor structs, class-driver vtable,
init/task control flow, OSAL contract).
"""


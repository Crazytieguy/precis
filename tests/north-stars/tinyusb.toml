] }

[[batches]]
id = "7.2"
descriptor = "Example inventory: examples/ and its device, host and dual application sets"
justification = "The examples are the de-facto documentation and the HIL test corpus. Complete listings of examples/, examples/device/ (34 entries: cdc_msc, hid_composite, audio and video variants, dfu, mtp, net_lwip_webserver, webusb_serial, the *_freertos twins, …), examples/host/ and examples/dual/ (examples/typec/ appears in the examples/ listing itself). Picking the right starting point for a new feature is otherwise several ls calls."

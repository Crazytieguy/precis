fixture = "tinyusb"
revision_pin = "7f146c9f"
summary = """
TinyUSB is a cross-platform USB Host/Device stack for embedded
MCUs. The repo is organized around a portable core
(`src/device/usbd.c`, `src/host/usbh.c`) plus per-class drivers
under `src/class/<class>/` (CDC, HID, MSC, Audio, MIDI, DFU, Net,
Video, BTH, MTP, Printer, USBTMC, Vendor), per-MCU controller
drivers under `src/portable/<vendor>/<usbip>/`, an RTOS abstraction
under `src/osal/`, and ~80 board ports under `hw/bsp/<family>/`.
Public APIs are namespaced `tud_*` (device), `tuh_*` (host), `tu_*`
(util), with private `usbd_*`/`usbh_*`/`dcd_*`/`hcd_*` layers
beneath. Memory-safe (no `malloc`) and thread-safe via deferred ISR
— interrupts queue events, `tud_task()`/`tuh_task()` drain them in
task context and invoke application callbacks (`tud_mount_cb`,
`tud_cdc_rx_cb`, ...).

Plausible agent tasks span: explaining the architecture / naming /
event flow, adding or modifying a class driver, porting to a new
MCU, debugging enumeration / descriptor / transfer issues, tuning
`tusb_config.h`, integrating the stack into an external project,
adding tests, navigating the descriptor-template DSL.

Ranking prioritizes (1) layout + naming + entrypoints, (2) public
tud_/tuh_ API surface + descriptor DSL, (3) internal driver-table
+ DCD/HCD-event dispatch, (4) configuration/integration/porting,
(5) breadth across classes / portable drivers / BSPs / examples.
"""


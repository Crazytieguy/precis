fixture = "tinyusb"
revision_pin = "7f146c9f"
summary = """
TinyUSB is a C99 USB host + device stack for embedded MCUs, vendored as a
source library (no build artifact of its own): applications compile `src/`
into their firmware. The substance is `src/` — a core (`tusb.c`,
`device/usbd.c`, `host/usbh.c`), a class-driver layer (`src/class/<class>/`
with `*_device.c` / `*_host.c` pairs), a controller-driver layer
(`src/portable/<vendor>/<usbip>/` implementing `dcd.h` / `hcd.h`), an RTOS
shim (`src/osal/`) and shared primitives (`src/common/`). Everything is
compile-time configured through `CFG_TU*` macros resolved in
`src/tusb_option.h` against an application-supplied `tusb_config.h`.
Around `src/` sit board-support packages (`hw/bsp/`, 80+ families),
runnable examples (`examples/{device,host,dual}/`), three test flavours
(`test/{unit-test,fuzz,hil}/`), maintenance scripts (`tools/`) and Sphinx
docs (`docs/`).

The ranking assumes AGENTS.md/CLAUDE.md (already in the agent's context)
have covered build, flash, debug, test and release *workflows*, and so
spends nothing on those. It instead ranks: what the project is and how its
directories map to layers; the `tud_*` / `tuh_*` application API; the
`CFG_TU*` configuration surface; the `dcd_*` / `hcd_*` / `board_*` /
`osal_*` porting contracts and the class-driver vtables; then the
per-class driver inventory with the built-in driver tables and descriptor
templates, the shared type/FIFO primitives, and finally build glue plus
example, test and tooling inventories. Per-class application APIs
(`tud_cdc_*`, `tud_hid_*`, `tud_msc_*` …) are deliberately left one hop
away: 5.1 pins the exact header of every class. Rosters are preferred
over bodies wherever a name plus a line number is enough to make the next
tool call land exactly.
"""


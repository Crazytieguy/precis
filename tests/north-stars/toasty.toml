fixture = "toasty"
revision_pin = "0fb6be95"
summary = """
Toasty is an incubating Rust ORM (Cargo workspace, 13 crates under
`crates/`) that targets both SQL databases (SQLite, PostgreSQL, MySQL)
and NoSQL (DynamoDB) without hiding database capabilities. Users declare
models as Rust structs annotated with `#[derive(toasty::Model)]`;
`toasty-macros`/`toasty-codegen` expand those into typed query, create
and update builders; `toasty-core` holds the shared schema + statement
AST + `Driver` contract; the `toasty` crate's `engine/` compiles
statements through verify -> simplify -> lower (HIR) -> plan (MIR) ->
execute; `toasty-sql` serializes statements for the SQL drivers.

The ranking assumes `CLAUDE.md` is already in context (it supplies the
layer map, the "which crate for what" table, and build/test commands),
so it spends its budget on what that file does not give: the actual
public symbol names, module rosters, trait signatures, generated-method
shapes, and precise file/line locations. Order is: repository identity
and the crate map; the user-facing `toasty` API surface; runnable
example models; the `toasty-core` contracts every layer speaks; the
query-engine pipeline internals; codegen, SQL serialization and driver
implementations; then tests, tooling and build configuration.
"""


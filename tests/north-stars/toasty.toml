[[batches]]
id = "2.11"
descriptor = "The `Relation` trait and the three relation wrapper types"
justification = """
`relation.rs` re-exports `BelongsTo`, `HasMany`, `HasOne` (already seen
in `lib.rs`), adds a `pub mod option`, and defines the `Relation` trait whose eight associated types
(`Model`, `Expr`, `Query`, `Many`, `ManyField`, `One`, `OneField`,
`OptionOne`) are what generated relation structs must supply. Paired
with `HasMany`'s four-method surface (`load`, `get`, `is_unloaded`,
`unload`) — `BelongsTo` and `HasOne` expose the same four — which
reveals the lazy-loading contract: `get` panics when the association is

fixture = "toasty"
revision_pin = "0fb6be95"
summary = """
Toasty is an incubating Rust ORM (workspace name `toasty`) that targets both
SQL (SQLite/MySQL/PostgreSQL) and NoSQL (DynamoDB) databases through a single
`#[derive(Model)]` proc-macro front end. Users define models as Rust structs
annotated with `#[key]`/`#[unique]`/`#[has_many]`/`#[belongs_to]`, codegen
produces type-safe query/create/update builders, and a multi-phase engine
(simplify -> lower/HIR -> plan/MIR -> execute) compiles those builders into a
linear program of driver actions.

The repository is a Cargo workspace with a clear layered architecture:
`toasty` (user API + engine) on top of `toasty-core` (shared schema + AST +
driver trait), with `toasty-macros`/`toasty-codegen` generating model code,
`toasty-sql` serializing the AST to SQL, and `toasty-driver-*` per-database
backends. The most distinctive thing about toasty vs. other Rust ORMs is its
heterogeneous SQL/NoSQL targeting, the multi-IR engine that can decompose
queries when a NoSQL driver can't execute them natively, and a unified
`Capability`-driven planner.

Likely query distribution for an agent loaded into this repo:
  - "How do I define a model / use this from an app?" -> README, examples,
    `crates/toasty/src/lib.rs` re-exports, `Db` builder.
  - "Where does X happen in the pipeline?" -> ARCHITECTURE.md +
    docs/architecture/query-engine.md + the engine module layout.
  - "Add a new <feature/primitive/operator/driver>" -> CLAUDE.md +
    docs/CHANGE_GUIDE.md + per-crate CONTEXT.md.
  - Codegen / macro debugging -> toasty-macros + toasty-codegen layout.
  - SQL dialect questions / driver behavior -> toasty-sql + toasty-driver-*.
  - "Where are tests?" -> workspace `tests/` crate + driver integration suite.

Catastrophic-omission hedges this NS spends tokens on: the full set of
workspace member crates (12 of them), the four examples, the engine
phase-module list (simplify/ lower/ plan/ exec/ mir/ hir/ index/ eval/),
toasty-core's stmt + schema submodule lists, the driver crates, and the
public re-exports from `toasty/src/lib.rs`. Missing any of these would let
the agent infer "that crate / phase / example doesn't exist".
"""


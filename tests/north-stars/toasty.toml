fixture = "toasty"
revision_pin = "0fb6be95"
summary = """
Toasty is an async Rust ORM that targets both SQL (sqlite / postgres / mysql)
and NoSQL (dynamodb) databases, built as a multi-crate workspace. The user
writes Rust structs annotated `#[derive(toasty::Model)]`; a procedural macro
(in `toasty-codegen` via `toasty-macros`) expands them into typed query /
create / update builders and a `Register` schema. At runtime a multi-phase
engine compiles `Statement` ASTs through Simplify → Lower (HIR) → Plan (MIR)
→ Execution (Actions) and dispatches to one driver per database flavor;
toasty-sql converts statements to SQL for the SQL drivers.

Ranking priorities:
- Land the workspace map and the public API surface (`Db`, `Model`, relations,
  derive macro attributes) very early, so an agent can frame any question
  before diving deeper.
- Lift the doc-tree (`docs/ARCHITECTURE.md`, the per-crate `CONTEXT.md` files,
  the engine architecture write-up) high — those documents are written for
  exactly this audience.
- Make pipeline-stage locations (`engine/{simplify,lower,plan,exec,hir,mir}`)
  and the corresponding type vocabularies (`Statement`, `HirStatement`,
  `mir::Operation`, `exec::Action`) cheaply discoverable via dir listings,
  since most engine questions reduce to "which phase / which node?".
- Show every driver's existence in one batch (catastrophic omission: if you
  see sqlite + postgres but not mysql + dynamodb, you'll assume they're
  missing).
- Schedule the canonical user-shape (`hello-toasty` model + setup) early —
  zero-follow-up answer for "how do I use this?".

Conventions:
- `CLAUDE.md`, the per-crate `CONTEXT.md` files at top-of-crate, and
  `docs/CONTEXT.md` are host-auto-injected: their filenames appear in fs
  listings (so the agent knows they exist) but no batch pulls body lines
  from them.
- Engine-phase prose lives in `docs/architecture/query-engine.md`, which
  the agent can read on demand once 3.x has surfaced the file and the
  phase names. We don't pull more than the overview into the snapshot —
  too verbose for the snapshot budget, and the agent already has cheap
  pointers.
"""


fixture = "tock"
revision_pin = "b29815f2"
summary = """
`tock` is a single-binary Go CLI/TUI time tracker (module
`github.com/kriuchkov/tock`). It records activities as plaintext lines in a
Bartib-compatible log file, can instead read/write TimeWarrior `.data`
month files, stores per-activity notes+tags as sidecar files, renders an
interactive Bubble Tea calendar/stopwatch, and exports iCalendar `.ics`.

The code is laid out hexagonally: `internal/core` holds the domain
(`models.Activity`, the three `ports` interfaces, request/report DTOs,
sentinel errors); `internal/services/activity` is the single implementation
of `ports.ActivityResolver`; `internal/adapters/repositories/{file,
timewarrior,notes}` implement persistence; `internal/adapters/cli` holds all
fourteen Cobra commands plus the Bubble Tea models; `internal/config` loads
YAML + `TOCK_*` env through viper; `internal/timeutil` owns 12/24-hour
parsing and display.

The ranking front-loads (1) what the project is and where its packages live,
(2) the domain contracts every other layer is written against, (3) the
complete CLI command + flag surface — the most likely subject of a user
query — then (4) the service logic, (5) the storage/format details that
answer "how is data actually written", (6) configuration/theming knobs,
(7) TUI internals and keybindings, and finally (8) package metadata, build/release
wiring and the peripheral directory trees (the colocated `*_test.go` files are surfaced by
the package listings in tier 1 rather than by a content batch). Rosters are used heavily so that "does X
exist?" is answerable from the snapshot and "what does X do?" is one read
away at a named line.
"""


fixture = "tock"
revision_pin = "b29815f2"
summary = """
`tock` is a Go CLI time-tracking tool (Cobra command tree + a Bubble
Tea TUI) built with a small hexagonal/clean-architecture split:
`internal/core` (Activity model, DTOs, ActivityResolver/
ActivityRepository/NotesRepository ports, sentinel errors),
`internal/services/activity` (the one business-logic orchestrator),
two interchangeable storage backends under
`internal/adapters/repositories` (a Bartib-compatible flat-text file
backend and a TimeWarrior JSON-lines backend, plus a per-activity
notes/tags sidecar), and `internal/adapters/cli` (13 Cobra
subcommands - start/stop/add/remove/continue/current/last/report/
analyze/ical/watch/list/calendar/version - plus the interactive
bubbletea prompts, theme palette, and calendar/list TUI models).
Config loads via Viper from `~/.config/tock/tock.yaml` with a
documented env-var override layer (`TOCK_*`). The query distribution
this NS serves: "how do I add/modify a command's flags", "where does
X activity field flow from CLI to storage", "how do I add a third
storage backend", "what's the on-disk file format", "how is the
calendar TUI laid out", "how do I build/lint/test/release this", and
debugging a specific command's control flow. Depth is spent on the
domain core, the two storage backends, and the CRUD-shaped commands
that touch them; the TUI rendering internals (calendar layout math,
theme swatches, bar charts) get one representative excerpt each since
they're high-token/low-branching and one file read away.
"""


fixture = "tock"
revision_pin = "b29815f2"
summary = """
`tock` is a Go time-tracking CLI with a Bubble Tea TUI, built on a
ports-and-adapters layout. Activities are CRUD'd through an
`ActivityResolver` service that talks to swappable repositories
(`file` plaintext / Bartib-format and `timewarrior` JSON-lines), with
sidecar notes/tags stored under `~/.tock/notes/`. The CLI surface is
~16 cobra subcommands (`start`, `stop`, `add`, `continue`, `current`,
`watch`, `remove`, `list`, `calendar`, `report`, `analyze`, `ical`,
`last`, `version`, …) wired in `cli/root.go`. TUI bits live next to
the CLI: a calendar grid + sidebar + activity timeline (`calendar.go`,
`calendar_sidebar.go`), an interactive list/input (`interactive.go`),
a stopwatch (`watch.go`), themes (`theme.go`).

Plausible queries: how is a command implemented / where does a flag
live, how does the file format work, how does the time formatter
handle 12/24h and date prefixes, how are notes/tags persisted, how
does the calendar TUI render and react to keys, what's the data flow
from CLI to repo, how do I add a backend, what config keys exist,
what env vars override what. Ranking favors a wide structural map
(every CLI command's location + its flag set), the core
`ports`/DTO/model vocabulary, and the file-format parser spec —
these together let an agent jump to the exact file/line with ~one
follow-up.
"""


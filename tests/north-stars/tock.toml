# ---------------------------------------------------------------- tier 8
# Peripheral trees and the build/release machinery.

[[batches]]
id = "8.1"
descriptor = "Direct dependency set"
justification = "The `require` block of direct dependencies names the CLI framework (cobra/pflag), the config library (viper), the TUI stack (bubbletea/bubbles/lipgloss/termenv), the error wrapper (`go-faster/errors`, used pervasively instead of `fmt.Errorf`), `samber/lo`, testify and `yaml.v3`. Knowing these prevents an agent from proposing an idiom the repo does not use — in particular the pervasive `errors.Wrap` calls in the service and repository bodies are `go-faster/errors`, not the standard library. Ranked as appendix material because package metadata is worth less at every small budget than the domain contracts and command surface above it. The 33-line indirect block is elided with a marker at line 19."

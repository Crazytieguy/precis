fixture = "tomli"
revision_pin = "920e20b1"
summary = """
Tomli is a small (~1k LoC) pure-Python TOML parser. The public surface
is just three names — `loads`, `load`, `TOMLDecodeError` — re-exported
from `src/tomli/__init__.py`; the implementation is a single-pass
recursive-descent parser in `src/tomli/_parser.py` plus a few datetime
and number regexes in `src/tomli/_re.py`. Tomli is the upstream of the
3.11+ standard-library `tomllib` module and is mypyc-compiled into
binary wheels for speed.

The query distribution this NS serves: API/usage questions
(`how do I parse a string / file / handle errors / use Decimal floats`),
parser internals (`how does the table/inline-table/string parser
work`, `how does it track which namespaces are frozen`, `how are
dates/numbers matched`), error-message and exception-shape questions,
packaging / mypyc / tomllib-backport / CI / fuzzer / benchmark
questions, and TOML spec edge cases visible from the large
`tests/data/{valid,invalid}` corpus. Breadth over depth: many small
location batches early so the agent can pinpoint where to dig, then
selected bodies of the most-asked-about pieces (the parse loop,
`parse_value` dispatch, inline-table/array parsers, the
`TOMLDecodeError` constructor that turns a `pos` into line/column).
"""


fixture = "tomli"
revision_pin = "920e20b1"
summary = """
Tomli is a small, dependency-free pure-Python TOML parser distributed on
PyPI as a backport of the stdlib `tomllib` module. Essentially the entire
library is three files under `src/tomli/`: an 8-line `__init__.py` that
re-exports `loads`, `load` and `TOMLDecodeError`; `_parser.py` (782 lines),
a hand-written index-based recursive-descent parser holding every rule,
every character class and every error message; and `_re.py` (119 lines),
the compiled regexes and converters for numbers, dates and times.
`_types.py` is three type aliases. Everything else in the repo is scaffolding
around those files: a `unittest` suite driven by the BurntSushi/toml-test
data corpus under `tests/data/`, a dual build path (flit_core by default,
setuptools + mypyc when `TOMLI_USE_MYPYC=1`), a tox-driven task runner whose
env table lives in `pyproject.toml`, and `benchmark/`, `fuzzer/`, `profiler/`
and `scripts/` helper trees.

The ranking front-loads repository identity and the tiny public API (tier 1),
then the top-level architecture of `_parser.py` — a complete roster of its
module-level classes and functions, the `loads` statement loop, and the
`parse_value` type dispatch (tier 2). Tier 3 is the development surface: the
test suite's structure, how the TOML corpus is discovered, and how the package
is built and run (tox, flit, mypyc). Tier 4 descends into the parser's
internals: the `Flags`/`NestedDict` state model, the table/key rules, and
array and inline-table parsing. Tier 5 covers `TOMLDecodeError`'s coordinate
logic and the `_re.py` number/date-time layer. Tier 6 is appendix material:
the tox env roster, the CPython-sync doc, the changelog, CI jobs and lint
config.

Plausible queries span "what does this library expose", "how does it parse
X", "why is my document rejected with message Y", "where do I add a test for
a new TOML construct", "how is the mypyc wheel built", and "how do I keep
CPython's tomllib in sync". Locations for all of these are meant to be one
hop away.
"""



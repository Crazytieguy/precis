fixture = "ts-pattern"
revision_pin = "2ece6ba5"
summary = """
`ts-pattern` is a zero-dependency TypeScript library providing exhaustive
pattern matching: `match(value).with(pattern, handler)....exhaustive()`, a
type-guard builder `isMatching(pattern)`, and a `P` namespace of pattern
constructors (wildcards `P.string`/`P.number`/`P._`, combinators
`P.union`/`P.intersection`/`P.not`/`P.optional`, collection patterns
`P.array`/`P.record`/`P.set`/`P.map`, selection via `P.select`, and chainable
refinements like `P.string.startsWith` / `P.number.between`).

The repository has an unusual value distribution: the *runtime* is small
(`src/match.ts`, `src/is-matching.ts`, `src/errors.ts`, `src/internals/`
total under 400 lines and the whole matching algorithm is one recursive
function, `matchPattern` in `src/internals/helpers.ts`), while nearly all
the engineering lives in two places — `src/patterns.ts` (1276 lines, the
entire `P` public surface, mostly JSDoc + Matcher-Protocol closures) and
`src/types/` (~2350 lines of type-level machinery: `Pattern.ts`,
`Match.ts`, `InvertPattern.ts`, `DistributeUnions.ts`,
`ExtractPreciseValue.ts`, `FindSelected.ts`). A 1771-line `README.md` is
the canonical user documentation, and `tests/` holds ~50 feature-named
`*.test.ts` files that double as a map of the supported behaviour.

The ranking therefore front-loads (a) what the package *is* and its
complete public export surface, (b) a navigable map of the README and the
directory tree, (c) the full `P` export roster and the `Match` builder's
method set — the two symbol sets that answer most "does X exist / what can
I call" questions with zero follow-ups — then the runtime implementation,
then the type-level layer, and finally the working surfaces: build and
test commands, packaging, the migration guides and roadmap, and the shared
test-fixture types. Line-precise rosters are preferred over
prose so that any deeper question is one grep or one read away.
"""


fixture = "ts-pattern"
revision_pin = "2ece6ba5"
summary = """
ts-pattern is a TypeScript library implementing exhaustive pattern matching
on arbitrary JS values, with smart type narrowing. Public surface: a `match`
builder (`.with` / `.when` / `.exhaustive` / `.otherwise` / `.run` /
`.returnType` / `.narrow`), an `isMatching` type-guard helper, and a `P`
namespace re-exporting wildcard patterns (`P.string`, `P.number`, `P._`, …)
plus combinators (`P.union`, `P.intersection`, `P.not`, `P.optional`,
`P.array`, `P.set`, `P.map`, `P.record`, `P.select`, `P.when`, `P.shape`,
`P.instanceOf`) and chainable predicates (`P.string.startsWith`,
`P.number.between`, `P.bigint.gt`, etc.). The runtime is small and lives in
`src/match.ts`, `src/is-matching.ts`, `src/patterns.ts`, plus
`src/internals/{helpers,symbols}.ts`. The hard work is type-level:
`src/types/` holds `Match`, `Pattern`, `InvertPattern`, `ExtractPreciseValue`,
`DistributeUnions`, `DeepExclude`, `FindSelected`, `IsMatching`, `BuildMany`,
plus a shared `helpers.ts`. Plausible queries: "how do I exhaustively match a
discriminated union?", "what does `P.select` do?", "how does TS narrowing
work after `.with`?", "where is `P.string.regex` implemented?", "how does
`.exhaustive` detect missing cases?", "add a chainable predicate", "what
breaking changes between v4 and v5?". Ranking front-loads the entry-point
shape (index re-exports, README orientation, runtime function signatures)
and breadth across `P.*` patterns, then surfaces type-level machinery and
docs.
"""


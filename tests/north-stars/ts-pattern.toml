descriptor = "P.union / P.not / P.when — full bodies"
justification = """
Three small bodies bundled. Union: collects selection keys from
every sub-pattern (so even non-matching branches contribute
`undefined` to the selections record), then uses
`.some(matchPattern…)`. Not: `!matchPattern(…)`. When: pure
predicate Boolean call. The three reveal that the runtime side of
these is one-line affairs; complexity lives in the type system.
"""

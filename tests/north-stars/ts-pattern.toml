[[batches]]
id = "3.8"
descriptor = "`MatchExpression.with()` — multi-pattern, guard and selection semantics"
predecessor = "3.6"
justification = """
The single densest piece of runtime behaviour in the library: short-circuit
once matched; the handler is always the last argument; a three-argument
call whose middle argument is a function is treated as a guard predicate,
otherwise extra arguments are additional alternative patterns; selections
are collected into a record, and if the anonymous select key is present the
handler receives that value directly rather than the record — else it
receives the whole input. Every one of these rules is observable and easy
to get wrong. A trailing ellipsis marks the nine remaining lines that build
and return the new `MatchExpression`.
"""

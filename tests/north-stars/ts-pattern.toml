fixture = "ts-pattern"
revision_pin = "2ece6ba5"
summary = """
ts-pattern is a TypeScript pattern-matching library: a chainable
`match(value).with(pattern, handler)…` builder plus an `isMatching`
type guard, with a `P` namespace of wildcards and combinators
(`P.string`, `P.union`, `P.not`, `P.select`, `P.array`, `P.when`,
`P.optional`, `P.instanceOf`, `P.record`, `P.map`, `P.set`, …) used
to describe expected shapes. The runtime under `src/` is small and
mostly delegates pattern testing to a single recursive
`matchPattern` helper; the bulk of the codebase is the type-level
machinery in `src/types/` (`Match`, `Pattern`, `InvertPattern`,
`ExtractPreciseValue`, `DistributeUnions`, `DeepExclude`,
`FindSelected`, `IsMatching`, `BuildMany`, `helpers`) that powers
type narrowing, selection inference, and the exhaustiveness check
behind `.exhaustive()`.

Likely query distribution: "how do I match X?"-style usage questions
(answered by the README + signatures), debugging type-inference
failures (answered by the relevant types/* file), adding a new
combinator (touches `patterns.ts` + `Pattern.ts` + `InvertPattern.ts`),
and tweaking exhaustiveness/narrowing semantics
(`Match.ts` + `DeepExclude` + `DistributeUnions`). The ranking
front-loads the public API surface and pattern catalog because most
queries land there; deep type-system internals come later.
"""


fixture = "typeguard"
revision_pin = "b05b7dab"
summary = """
Typeguard is a run-time type-checking library for Python: `check_type()` for
direct isinstance-like checks against `typing` annotations, plus two AST-based
instrumentation paths (`@typechecked` decorator, `install_import_hook()`) that
recompile functions to inject argument/return/yield/send/local-variable checks.
`_checkers.py` holds the per-annotation-shape dispatch table, `_transformer.py`
holds the AST rewriter, `_config.py`/`typeguard.config` hold global behavior
toggles. Sessions on this repo are expected to span: using the library
(check_type vs decorator vs import hook vs pytest plugin), extending it with
custom checkers, debugging a specific type's check behavior, and working on
the instrumentation/transformer internals themselves. The NS front-loads the
public surface and the type-support matrix (most sessions start by asking
"does/how does typeguard handle type X"), then layers in module-by-module
depth with roster batches ahead of full-body excerpts to avoid implying any
function or test class doesn't exist. Given the fixture's size (~9.4k lines
of src+tests) against a tight token budget, most big files get only a cheap
name roster plus a single highest-value excerpt rather than full-body
coverage everywhere; several lower-traffic docs/config files and a handful
of docstrings are left unexpanded (visible only via the tier-2 fs rosters,
or one grep away from a roster pointer) to keep that budget for the checker
dispatch core and the transformer.
"""


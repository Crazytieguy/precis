fixture = "typeguard"
revision_pin = "b05b7dab"
summary = """
Typeguard is a Python run-time type checker. It exposes two principal
modes: a one-shot ``check_type(value, T)`` function (independent of
global config), and code instrumentation via the ``@typechecked``
decorator + ``install_import_hook()``, both of which rewrite Python
ASTs through ``TypeguardTransformer`` to inject ``check_argument_types``
/ ``check_return_type`` / ``check_yield_type`` / ``check_send_type`` /
``check_variable_assignment`` calls. The bulk of the codebase is two
big files: ``_checkers.py`` (the registry of per-annotation ``check_*``
functions, ``check_type_internal``, plus the ``checker_lookup_functions``
plug-in mechanism) and ``_transformer.py`` (the AST transformer plus
``AnnotationTransformer`` that handles forward refs, PEP 604 unions,
generic builtins).

The ranking serves the full distribution of dev tasks against this
crate: orientation queries (what does this do, what's the public API),
architectural questions (how does instrumentation work, how does
``check_type`` differ from ``@typechecked``), debugging questions about
specific annotation kinds (NamedTuple, TypedDict, Protocol, generators,
forward refs), config / pytest-plugin questions, extension questions
(adding a custom checker via ``checker_lookup_functions`` or entry
point), and contributor-style questions about the test suite. Early
tiers establish layout + the public API surface; mid tiers map the two
big internal modules at function-name granularity; late tiers fill in
bodies and test-file maps.
"""


fixture = "typeguard"
revision_pin = "b05b7dab"
summary = """
Typeguard is a run-time type checker for Python: one installable package
(`src/typeguard/`, eleven underscore-prefixed modules re-exported through
a single `__init__.py`) plus a Sphinx doc set and a large pytest suite.

Its substance splits into two engines that meet at one seam. (1) A
*checking* engine — `_checkers.py` holds ~25 `check_*` functions and an
`origin_type_checkers` dispatch table mapping typing constructs to them,
entered via `check_type_internal()`; `_functions.py` wraps that in the
public `check_type()` plus the five helpers that instrumented code calls.
(2) An *instrumentation* engine — `_transformer.py` is an
`ast.NodeTransformer` that rewrites function bodies to inject those
helper calls, driven either by the `@typechecked` decorator
(`_decorators.py`, which recompiles a single function) or by an import
hook (`_importhook.py`, which rewrites whole modules on import, and is
also exposed as a pytest plugin in `_pytest_plugin.py`). Supporting
modules: `_config.py` (settings enums + dataclass + `global_config`),
`_memo.py`, `_exceptions.py`, `_suppression.py`, `_utils.py`.

The ranking front-loads what the project is, the module roster, and the
complete public export list; then the signatures and documented
semantics of the exported API; then documented behaviour and
limitations; then the checking engine; then the instrumentation path;
then the AST transformer's own structure; and finally packaging,
dependency groups, pytest configuration and the CI matrix. Rosters (every
`check_*` name, every transformer method, every pytest flag, every doc
heading) are ranked ahead of the bodies they index, so an agent asked
about an obscure corner learns which file and roughly which line to open
in one hop.
"""


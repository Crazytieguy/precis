fixture = "vaul"
revision_pin = "3e97aac6"
summary = """
`vaul` is a drawer component for React (npm package `vaul`, v1.1.2, MIT,
by Emil Kowalski) built as a thin behavioural layer on top of
`@radix-ui/react-dialog`. The shipped library is the 13 files under
`src/`: `index.tsx` (1148 lines) holds every exported component —
`Root`, `NestedRoot`, `Content`, `Overlay`, `Handle`, `Portal` plus
re-exported Radix `Trigger`/`Close`/`Title`/`Description`, bundled into
the `Drawer` namespace object — while the drag/scroll/keyboard/snap
mechanics live in sibling hook modules (`use-snap-points`,
`use-prevent-scroll`, `use-position-fixed`, `use-scale-background`,
`use-controllable-state`, `use-composed-refs`) with `helpers.ts`,
`browser.ts`, `constants.ts`, `context.ts`, `types.ts` underneath.
`src/style.css` is shipped alongside the JS and is a real part of the
contract: the component writes `data-vaul-*` attributes that the CSS
keys off. The repo is a two-package pnpm/turbo workspace; `test/` is a
Next.js app of one demo route per feature, driven by Playwright specs in
`test/tests/`. The README is a three-line "this repo is unmaintained"
notice, so nothing about the project's identity, API or behaviour is
documented anywhere except the source — which drives this ranking:
identity and the public component/prop surface first, then the internal
module map, then the drag/snap/scroll mechanics, the CSS contract, and
finally the demo app, e2e suite and build tooling.

The query distribution served: "how do I use this / what props exist"
(tiers 1-2), "where does behaviour X live" (tier 3's per-module symbol
rosters), "why does the drawer do Y when I drag/scroll/open the
keyboard" (tier 4), "what CSS/data attributes must I honour" (tier 5),
"how is this tested / how do I reproduce a bug" (tier 6), and build /
config questions (tier 7).
"""


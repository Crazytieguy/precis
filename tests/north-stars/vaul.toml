fixture = "vaul"
revision_pin = "3e97aac6"
summary = """
vaul is a small (~1500 LOC) React drawer/sheet component library by Emil
Kowalski, built on top of `@radix-ui/react-dialog`. Unmaintained per the
README. The public surface is a single namespace import `Drawer.{Root,
NestedRoot, Content, Overlay, Handle, Portal, Trigger, Close, Title,
Description}` exported from `src/index.tsx` together with the
`DialogProps` prop type. The library drives drawer animation with raw
pointer events + CSS transforms (no animation library): `Root` owns the
state machine, `Content` listens for pointer move/up, and the
`useSnapPoints` hook computes per-snap-point translate offsets.

Cross-cutting concerns each live in their own hook/module:
`use-snap-points` (multi-snap behavior, dismissal velocity), `use-prevent-
scroll` (mobile-Safari-specific scroll lock + keyboard handling lifted
from react-aria), `use-position-fixed` (Safari `position: fixed` body
trick to prevent address-bar bugs), `use-scale-background` (the iOS-style
scaled-back wrapper effect via `[data-vaul-drawer-wrapper]`),
`use-controllable-state` / `use-composed-refs` (lifted from Radix).
`helpers.ts` holds the style get/set/reset cache + the `dampenValue`
overdrag formula + `getTranslate` (parses computed transform matrix).
`constants.ts` holds animation durations and thresholds. All visual
animation lives in `src/style.css`, keyed off `[data-vaul-*]` data
attributes the components emit.

The `test/` workspace is a Next.js 13 app-router playground: each demo
page (`with-snap-points`, `non-dismissible`, `nested-drawers`,
`different-directions`, …) exercises one feature, and Playwright specs
under `test/tests/` smoke-test them on iPhone + Pixel device profiles.

Likely query distribution: how do I render a drawer with snap points /
in a particular direction / nested / non-dismissible / scaled-background
behind it; what props does Root/Content/Handle accept; where does the
drag-to-close threshold live; why is iOS Safari special-cased; what CSS
data-attributes can I style. Snapshot prioritizes the public component
surface + `DialogProps`, then internal mechanics (drag handlers, snap
math, mobile-Safari workarounds), then the demo+test catalog so that
debugging "the snap-points demo is broken" lands in one hop.
"""


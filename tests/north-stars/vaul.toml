fixture = "vaul"
revision_pin = "3e97aac6"
summary = """
vaul is a small single-package React component library (npm name `vaul`,
v1.1.2) implementing an accessible, gesture-driven drawer/bottom-sheet
built on top of @radix-ui/react-dialog. All library source lives flat in
src/ (~2.3k LoC across 11 files + 1 stylesheet); there is no internal
package split. A sibling `test/` directory is a separate pnpm workspace
package: a Next.js demo app (one route per feature under
test/src/app/*/page.tsx) exercised by Playwright specs in test/tests/.
The root README has been reduced to a single 'this repo is unmaintained'
notice, so it carries no usage docs — the DialogProps JSDoc in
src/index.tsx and the demo pages are the only usage documentation in the
repo. Plausible sessions: extending/debugging drawer interaction physics
(drag, snap points, velocity thresholds), the iOS Safari scroll/position
workarounds, adding a new prop or demo page, wiring up a new e2e test,
or general "how does X work" / "where is Y" questions about a UI-gesture
library with real DOM-imperative logic rather than typical CRUD/backend
shape.
"""


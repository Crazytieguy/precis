fixture = "vite"
revision_pin = "b3132dac"
summary = """
Vite is a frontend dev/build tool: an unbundled-during-dev ES-module server
with HMR for development, and a Rolldown-backed bundler for production. The
fixture is the full pnpm monorepo. Three published packages live under
`packages/`: `vite` (the core CLI + JS API + plugins + dev server, ~31k
lines across `src/node/`, plus `src/client/` browser-side HMR, a
`src/module-runner/` SSR runner library, and a `src/shared/` cross-target
slice), `create-vite` (the scaffolding CLI, single-file `src/index.ts`),
and `plugin-legacy` (the legacy-browser polyfill plugin, also single-file
`src/index.ts`). Documentation lives under `docs/` (VitePress site:
`guide/`, `config/`, `blog/`) and E2E tests live as ~80 mini-projects
under `playground/`.

The query distribution skews heavily toward `packages/vite` core: what
the `Plugin` interface looks like, what user-config fields exist
(`UserConfig`, `BuildEnvironmentOptions`, `ServerOptions`, HMR options),
how the CLI dispatches `dev` / `build` / `preview` / `optimize`, how the
dev server is constructed and how requests flow through middlewares +
plugin container + module graph, how HMR payloads + the module-runner
work. Ranking front-loads orientation (lede + monorepo layout + vite/src
layout + public-API map), then the major surface types (Plugin,
UserConfig, ViteDevServer, build/HMR payloads), then CLI dispatch +
dev-server assembly, then plugin pipeline + module graph + transform
pipeline, then the leaf plugin/optimizer/SSR modules, then sibling
packages, then docs and tests.
"""


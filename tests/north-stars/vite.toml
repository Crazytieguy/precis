fixture = "vite"
revision_pin = "b3132dac"
summary = """
Vite: the upstream `vitejs/vite` monorepo (pnpm workspaces) whose substance is
`packages/vite` — a Node build tool that is simultaneously an ESM dev server
with HMR and a Rolldown-backed production bundler, plus `create-vite` (scaffolder)
and `@vitejs/plugin-legacy`. The ranking front-loads (a) what the project is and
where its three packages live, (b) the public JavaScript API re-exported from
`packages/vite/src/node/index.ts` and the `vite` CLI's commands, (c) the user
configuration surface (`UserConfig`, environment/server/build options) and the
plugin hook vocabulary, since most plausible queries against this repo are
"how does option/hook X behave" or "where is feature Y implemented", (d) a
roster of the core `src/node` modules and its subsystem directories
(server/, plugins/, optimizer/, ssr/, module-runner/, client/, shared/) so that
any "where is X" question is one grep away, and finally (e) the contributor
workflow: pnpm scripts, the `playground/` e2e corpus, vitest configs, the
VitePress docs site and the sibling packages.
"""


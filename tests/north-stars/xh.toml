fixture = "xh"
revision_pin = "b928cf08"
summary = """
`xh` is a Rust CLI HTTP client — a reimplementation of HTTPie's design with a
focus on startup speed and a single static binary. The substance is a flat
`src/` of ~20 modules: `cli.rs` (a very large clap-derive `Cli` struct plus the
value types its options parse into), `request_items.rs` (HTTPie's
`key=value` / `key:=value` / `key==value` / `header:value` / `@file` item
grammar), `main.rs::run` (builds a `reqwest::blocking::Client`, assembles the
request, runs it through a middleware chain, prints), `printer.rs` +
`formatting/` (colored, syntax-highlighted, pretty-printed output), and
supporting modules for sessions, netrc, auth, redirects, downloads,
content decoding, curl translation and man/completion generation.

Ranking serves the full spread of session-opening queries. Earliest: what the
project is and where its code lives (root + `src/` listings, README lede).
Then the user-facing contract — the complete option surface from the README's
`--help` transcript, the request-item grammar, and the man-page template's
EXIT STATUS / ENVIRONMENT / FILES sections, since env vars, exit codes and
config/session paths are asked about constantly and appear nowhere else.
Then `main.rs::run`'s orchestration in ordered slices, then a per-module
public-symbol roster across every remaining file in `src/` (so "where is X
handled" is one grep away), then build/test/release/CI appendix material.
Locations are preferred over bodies throughout; bodies are spent only where
the behaviour is not inferable from the name.
"""


fixture = "xh"
revision_pin = "b928cf08"
summary = """
xh is a Rust-rewrite of HTTPie: a friendly+fast CLI HTTP client built on
reqwest/hyper. It strives for feature parity with HTTPie's CLI (request-item
mini-language, sessions, --download, --auth, --offline, --curl translation),
plus extras: HTTP/2 always, optional HTTP/3, optional message signatures,
--unix-socket, runtime-generated man pages and shell completions, an embedded
syntect-based highlighter with bundled syntaxes/themes, and a binary that flips
to https-default when invoked as `xhs`. ~10k LoC, mostly in src/cli.rs
(~2000 lines of clap declarations) and src/printer.rs (response decoding +
formatting). Query distribution: very heavy on "what does CLI flag X do" /
"where is feature Y implemented" / "what's the path from arg parsing to wire?",
plus debugging odd HTTPie-compat quirks, adding new flags, and touching the
output/decoding pipeline.
"""


fixture = "xlstm"
revision_pin = "032a6fb8"
summary = """
NX-AI's `xlstm` repository: a PyTorch implementation of the xLSTM
recurrent architecture (exponential gating + matrix memory), published
alongside two papers. It ships *two* distinct model stacks that share a
package but almost no code:

1. The NeurIPS-paper architecture under `xlstm/` proper —
   `xLSTMLMModel` / `xLSTMBlockStack` composed from dataclass configs
   (`xlstm/xlstm_block_stack.py`, `xlstm/xlstm_lm_model.py`,
   `xlstm/blocks/{mlstm,slstm}/`, `xlstm/components/`), where the sLSTM
   cell has a hand-written CUDA backend compiled at import time from
   `xlstm/blocks/slstm/src/`.
2. The optimized "xLSTM Large" / xLSTM 7B architecture in
   `xlstm/xlstm_large/`, a standalone implementation whose `model.py`
   depends on the external `mlstm_kernels` package instead of anything
   in (1).

Plus a synthetic-task training harness in `experiments/` (parity /
formal-language datasets driven by `parity_xlstm*.yaml`), a pytest
suite in `tests/` that is CUDA-gated by `tests/conftest.py`, demo
notebooks, and packaging that is duplicated across `pyproject.toml` and
`setup.cfg`.

The ranking front-loads (a) which of the two stacks a file belongs to,
(b) the config dataclasses, since nearly every task here is "what knob
controls X" or "how do I instantiate this", and (c) the constructor /
forward wiring of each model. Kernel C++/CUDA sources, environment
files and license are appendix material: their *existence* is ranked
via directory listings, their contents not at all.
"""


fixture = "xlstm"
revision_pin = "032a6fb8"
summary = """
The `xlstm` Python package implements the xLSTM architecture — an LSTM
successor with exponential gating and matrix memory — in two parallel
implementations sharing the top-level package:

1. The NeurIPS-paper code under `xlstm/` (composable
   `xLSTMBlockStack` + `xLSTMLMModel`, alternating mLSTM/sLSTM blocks,
   sLSTM with a CUDA backend under `xlstm/blocks/slstm/src/cuda/` and
   a vanilla PyTorch fallback under `xlstm/blocks/slstm/src/vanilla/`).
2. The "xLSTM Large 7B" rewrite under `xlstm/xlstm_large/` — a
   single-file `model.py` that delegates to the external
   `mlstm_kernels` package, with HuggingFace `from_pretrained`,
   token generation, RMSNorm, and a single→fused weight converter.

The query distribution this NS serves is dominated by:
- Orientation ("what does this repo do? where's the entry point?").
- Modeling/architecture questions: how are blocks wired, what config
  fields exist, where the mLSTM vs sLSTM math lives, how the CUDA
  extension is loaded, what kernels are available.
- Integration: how to instantiate, train, generate, load checkpoints,
  convert single↔fused weights.
- Debugging: shape conventions, gate init, dtype handling, autograd
  Function wiring, why a kernel is failing to compile.

Catastrophic-omission hedges that drive the ranking:
- Both implementations (legacy NeurIPS + xLSTM Large) must be visible
  early; omitting either misleads the agent badly.
- The CUDA source tree must be cataloged (locations) because it is
  large and load-bearing for the sLSTM "cuda" backend.
- mLSTM and sLSTM are *parallel* — config/cell/layer/block files
  exist for both; show the matched pair together.
- Public symbol surface in `xlstm/__init__.py` is tiny but defines
  what end-users import; include it verbatim early.
"""


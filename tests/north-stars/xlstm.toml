fixture = "xlstm"
revision_pin = "032a6fb8"
summary = """
xlstm (NX-AI) is the reference PyTorch implementation of the xLSTM architecture, distributed as two
parallel, independently-usable model families under one package. The NeurIPS-paper architecture
(xlstm/blocks/{mlstm,slstm}/, composed via xlstm/xlstm_block_stack.py + xlstm/xlstm_lm_model.py) is a
configurable stack of mLSTM (matrix-memory, parallelizable) and sLSTM (scalar-memory with exponential
gating, has a custom CUDA kernel under xlstm/blocks/slstm/src/cuda/ plus a pure-PyTorch "vanilla"
fallback under src/vanilla/) blocks, selected per-position via xLSTMBlockStackConfig.slstm_at. The
newer "xLSTM Large" 7B architecture (xlstm/xlstm_large/, a near-standalone single-file model.py) is
mLSTM-only, depends on the external mlstm_kernels package for its chunkwise/sequence/step backends,
and adds RMSNorm, soft-capped gates/logits, and a single-vs-fused weight_mode toggle for
inference-time weight fusion. The ranking serves the full spread of plausible sessions: understanding
which of the two architectures a query concerns and their exact config/forward contracts (semantic,
zero-follow-up-friendly - e.g. xLSTMBlockStackConfig's slstm_at wiring, sLSTMCellConfig's dtype/backend
knobs, xLSTMLargeConfig's kernel-name fields), locating one class/function inside ~3900 lines of
Python source plus ~4200 lines of CUDA/C++ kernel code and ~1500 lines of experiment/training code
(structural, one-hop-away pointers with exact line coordinates), and operational tasks - installing
(the mlstm_kernels dependency + conda environment_pt*.yaml variants named in the root listing, and the README's CUDA-arch-list / include-path build caveats),
running the pytest suite (all CUDA-gated; sLSTM-vanilla-vs-CUDA parity, chunkwise-vs-recurrent
equivalence, weight-mode conversion), and running the formal-language synthetic experiments
(experiments/main.py against the three parity_xlstm{01,10,11}.yaml configs). Breadth is prioritized
throughout: every source file's function/class roster is surfaced early as a truncated "locations"
batch before that file's implementation is expanded, filesystem listings are complete at every
directory depth the NS touches, and the CUDA/C++ half of the sLSTM backend - lower-priority for most
Python-side sessions but real, substantial code - gets its own directory-roster-plus-key-signature
treatment rather than silent omission. Hedging note: every roster/listing batch is complete for the
directory or symbol set it names (verified against `find`/`grep` output while authoring); the one
partial-by-design excerpt (9.6's full parity_xlstm11.yaml plus diff-only lines for the other two variants) says so in its
own justification rather than implying the other two training-config variants don't exist. Function/class
bodies are hand-picked short spans chosen for one specific fact (a gating equation, an init strategy,
a dispatch rule), not full-body dumps, except where a whole function/dataclass is small enough that a
full render costs about the same as a truncated one. No batch uses an ellipsis span: every excerpt was
checked against the source file and its end line moved to a natural boundary (a complete statement,
expression, or block close) rather than cutting off mid-statement, so no rendered span trails off
inside an unclosed control-flow header or expression.
"""


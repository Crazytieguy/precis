fixture = "xonsh"
revision_pin = "70212600"
summary = """
xonsh is an interactive Python-extending shell: a single language and
runtime where Python expressions and subprocess commands compose
freely. The repo is a large pure-Python package (xonsh/, ~150 files,
20k+ LoC, plus xontrib/, xompletions/, tests/, docs/). Its codebase
is organised cleanly into subsystems — parser, execer/session, procs,
completers, prompt, history, shells, environ, events, xontribs — and
the project ships an unusually detailed CLAUDE.md (485 lines) that
documents architecture, conventions, and load-bearing pitfalls.

Sessions in this fixture will span: orienting on the architecture
("how does input become an executed command?"), changing or extending
a subsystem (a new completer, a prompt field, a history backend, a
xontrib, an xoreutil), debugging concrete failures (signal handling
on Flatpak, fd leaks in pipelines, parser version-specific syntax,
prompt_toolkit integration), testing & CI questions, and policy
questions about how xonsh is *described* in docs.

Ranking strategy: lead with CLAUDE.md's architecture section
(unusually high information density) + the README's "this is what
xonsh looks like" feel, then top-level orientation (project layout,
entry-point dispatch, session shape). Then subsystem-by-subsystem
roll-out, leading each with a directory listing + top-level signatures
(catastrophic-omission mitigation) before any per-fn body. Larger
files (parsers/base.py at ~4100 lines, tools.py at ~3200, environ.py
at ~3500, built_ins.py at ~1300) are deep — show their top-level
signatures + carefully chosen bodies, never re-paste the full files.
Prefer breadth: every module deserves at least a `name + first-line`
pointer.
"""


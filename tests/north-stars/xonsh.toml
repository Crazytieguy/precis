fixture = "xonsh"
revision_pin = "70212600"
summary = """
xonsh is a Python-powered shell: a language that extends Python 3 with
native subprocess syntax, plus the whole runtime around it (parser,
process pipelines, completion, prompts, history, xontrib plugins, a
source formatter). The tree is one large Python package `xonsh/` with a
flat core of ~35 modules and a dozen subpackages, alongside `xontrib/`,
`xompletions/`, `tests/` and a Sphinx `docs/` tree.

The ranking front-loads (1) what the project is and where its code
lives, (2) the runtime spine an agent needs for almost any change --
entry-point CLI, the `XSH` session object, shell selection, `Execer`,
the documented event names, parser selection -- then (3) the complete
package/directory map, (4) the environment-variable and alias surfaces
that dominate user-facing questions, (5) the `xonsh format` subsystem,
(6) per-subsystem symbol rosters that turn "where is " into one grep,
and finally (7) test, tooling and packaging material. Rosters are
complete for the class they name: a name absent from a roster batch is
absent from that class.
"""


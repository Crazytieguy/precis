fixture = "xonsh"
revision_pin = "70212600"
summary = """
xonsh is a Python-superset shell: shell syntax (pipes, redirects, globs,
subprocess substitution) composes directly with Python expressions, parsed by
the version-specific grammar subclasses in xonsh/parsers/ and dispatched by
xonsh/execer.py's Execer. A session-wide singleton (xonsh.built_ins.XSH)
wires together the environment (xonsh/environ.py's Env/Xettings registry),
aliases (xonsh/aliases.py), command discovery (xonsh/commands_cache.py),
subprocess execution (xonsh/procs/), prompt rendering (xonsh/prompt/), tab
completion (xonsh/completers/), and history backends (xonsh/history/).
Repository CLAUDE.md already covers the
architecture narrative, key-module table, testing fixtures, and code-style
conventions in prose, so this ranking spends its budget on directory
breadth (so the agent never has to guess whether a file exists), exact
symbol locations/signatures/tables the prose only gestures at, and concrete
artifacts (pyproject.toml, CI workflow, config-file sample, default-value
tables) that ground config/build/debugging tasks more precisely than prose
can. It serves the full span of plausible sessions: explaining a
subsystem, adding/fixing a builtin alias or completer, debugging a hung
subprocess or prompt glitch, wiring a new env var or xontrib, and
running/extending the test suite.
"""


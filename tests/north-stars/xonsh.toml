winutils} hold platform-specific code. pyghooks.py is the Pygments
syntax-highlighting integration (entry-pointed from pyproject).
"""
[batches.content]
kind = "lines"
spans = [
    { path = "xonsh/platform.py", start = 122, end = 122, render = { kind = "full" } },
    { path = "xonsh/platform.py", start = 178, end = 178, render = { kind = "full" } },
    { path = "xonsh/platform.py", start = 206, end = 206, render = { kind = "full" } },
    { path = "xonsh/platform.py", start = 260, end = 260, render = { kind = "full" } },
    { path = "xonsh/platform.py", start = 533, end = 533, render = { kind = "full" } },
    { path = "xonsh/platform.py", start = 609, end = 609, render = { kind = "full" } },
    { path = "xonsh/platforms/macutils.py", start = 1, end = 1, render = { kind = "full" } },
    { path = "xonsh/platforms/winutils.py", start = 1, end = 1, render = { kind = "full" } },
    { path = "xonsh/pyghooks.py", start = 1, end = 4, render = { kind = "full" } },
    { path = "xonsh/pygments_cache.py", start = 1, end = 4, render = { kind = "full" } },
]

[[batches]]
id = "8.5"
descriptor = "formatter/ + pytest/ + xompletions/ — outlying subsystems"
justification = """
Outlying subsystems whose roles are non-obvious:
- formatter/ — the ``xonsh format`` subcommand (formatter/cli.py /
  core.py); main.py dispatches here on argv[0] == 'format'.
- webconfig/ — Sphinx-style config UI served from xonsh.
- virtualenv/ — entry-pointed ``XonshActivator`` for the
  virtualenv.activate plugin protocol.
- pytest/ — the pytest plugin (xession fixture etc., entry-pointed
  from pyproject as pytest11).
- xompletions/ — built-in completions for cd, pip, gh, git, python,
  sudo, rmdir, _xonsh.
"""
[batches.content]
kind = "fs"
groups = [
    { parent = "xonsh/formatter", entries = "all" },
    { parent = "xonsh/pytest", entries = "all" },
    { parent = "xompletions", entries = "all" },
]


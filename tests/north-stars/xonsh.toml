fixture = "xonsh"
revision_pin = "70212600"
summary = """
xonsh is a Python-superset shell: a single language and runtime where shell
syntax (subprocess captures `$()` / `$[]` / `![]` / `!(...)`, env access
`$VAR` and `@.env`, redirects, pipes, globs, the macro form `fn!(...)`) is
parsed natively by an extended Python grammar and executed by the same
interpreter. The codebase is one import root `xonsh/` plus sibling packages
`xontrib/` (built-in extensions) and `xompletions/` (per-command tab
completers), a thick `docs/` tree, and an extensive `tests/`.

Runtime flow: `xonsh.main:main` → premain (argparse + RC discovery) →
`start_services` (build `Execer`, install import hooks, load RC files,
autoload xontribs from entry points, construct `Shell`) → `main_xonsh`
(interactive `cmdloop`, single command `-c`, file script, or stdin script).
The `XSH` singleton in `xonsh.built_ins` carries the live session — `env`,
`execer`, `history`, `shell`, `ctx`, `commands_cache`, `aliases`, `completers`,
`imp` (inline import facade), `lastcmd`. Subprocess helpers
(`subproc_captured_stdout`/`_inject`/`_object`/`_hiddenobject`,
`subproc_uncaptured`, `subproc_check_boolop`) and macro plumbing
(`call_macro`, `enter_macro`, `convert_macro_arg`) live as methods on the
session because AST-rewritten user code calls them by attribute path.

Parsing is PLY-based and version-stratified: `xonsh.parser:Parser` is a
lazyobject that dispatches by `PYTHON_VERSION_INFO` to chained
`v36 → v38 → v39 → v310 → v313` subclasses of `BaseParser` (~3800 lines in
`xonsh/parsers/base.py`). The `Lexer` extends CPython tokenize for
`$()`/`@()`/`!()`/`$[]`/`![]`, IO redirects, and f-strings. `Execer.parse`
runs Phase 1 context-free with `$()`-wrap retries, Phase 2 context-aware AST
transform (`CtxAwareTransformer.ctxvisit` decides whether `ls -l` is a
binary-op or a subproc call), Phase 3 `wrap_subproc_raise_checks` to enforce
`$XONSH_SUBPROC_RAISE_ERROR` on outermost pipelines. An alternative
recursive-descent parser is selectable via `$XONSH_RD_PARSER`.

Major subsystems live in their own packages: `procs/` (`SubprocSpec`,
`CommandPipeline`, jobs, proxies), `shells/` (ptk, readline, dumb, base),
`completers/` (bash, click, commands, man, path, python, imports,
environment, …), `prompt/` (formatter, vcs, gitstatus, cwd, env, job),
`history/` (json, sqlite, dummy backends + diff), `parsers/` (with vendored
PLY in `ply/`), `xoreutils/` (cat, uname, uptime, umask, ulimit, which,
xcontext, …), `lib/` (stable helpers — lazy objects, inspectors, pretty,
openpy), `api/` (stable embedding API), `pytest/` (`xession` fixture +
plugin entry point), `platforms/` (Win/mac specifics), `webconfig/`
(in-process config web UI), `virtualenv/` (PEP 405 activator), `formatter/`
(the `xonsh format` subcommand).

Plugin discovery is entry-point driven, declared in `pyproject.toml`: the
pytest plugin (`pytest11 = { xonsh = "xonsh.pytest.plugin" }`), two pygments
lexers (`xonsh`, `xonshcon` → `xonsh.pyghooks`), the virtualenv activator,
plus user xontribs autoloaded from `xontrib.*` entries. Events
(`xonsh.events:events`) are the canonical extension surface — `on_chdir`,
`on_transform_command`, `on_pre/postcommand`, `on_command_not_found`,
`on_pre/post_prompt`, `on_envvar_new`/`change`, `on_post_init`, `on_exit`,
`on_ptk_create`, `on_pre/post_rc`, `on_xontribs_loaded`, `on_lscolors_change`.

`CLAUDE.md` (host-auto-injected) is the project bible: ground-truth on what
xonsh is (emphatically *not* "shell + Python glued together"), xsh idioms
(`@.env`, `@aliases.register`, `g\\`...\\``, `xpip`, `@lines`/`@json`), test
conventions (`*_llm.py` for LLM-authored tests, `tests/bin/templates/`
rendering, xonsh subprocess invocation via `[sys.executable, "-m", "xonsh"]`),
design hazards (bare-XSH safety in plugin code paths, TTY foreground
takeover, parser-table generation, version-specific parser subclasses).

Likely query distribution: feature work in the parser/lexer, execer, procs,
completers, prompt; debugging subprocess / job-control / TTY behavior;
authoring xontribs and aliases; understanding and adding events; writing
tests with the `xession` fixture; adding env vars under the right `Xettings`
subclass; following the docs/RST style; CI/release process; cross-platform
edge cases.
"""


fixture = "xxhash"
revision_pin = "ab37246c"
summary = """
cespare/xxhash is a small, focused Go library implementing the 64-bit
XXH64 hash algorithm. The public surface is tiny — `Sum64`, `Sum64String`,
and a `Digest` value (`hash.Hash64` impl) constructed via `New` /
`NewWithSeed` — but the file layout is dominated by a build-tag matrix
that swaps between hand-written amd64/arm64 assembly, a pure-Go
fallback, and unsafe vs. appengine-safe string helpers. Two side
modules sit alongside: `xxhsum/` (a tiny CLI mimicking the C xxhsum
tool) and `xxhashbench/` (cross-library benchmarks vs. murmur3, OneOfOne
xxhash, CRC-32, FNV).

The query distribution this ranking serves: 'how do I hash a string?'
(public API), 'why are there so many xxhash_*.go files?' (build-tag
selection / GOARCH dispatch), 'what does the assembly do?' (round /
mergeRound macros), 'is the marshaled state stable across versions?'
(magic/marshaledSize), 'why the unsafe string conversion?' (inlining
notes), and 'how do I run all the test variants?' (testall.sh, CI
matrix). Catastrophic-omission hedges focus on enumerating every public
function (across the four .go files that contribute to the surface) and
every Digest method, so the agent never has to guess whether something
exists.
"""


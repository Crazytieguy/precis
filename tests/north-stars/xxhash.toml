fixture = "xxhash"
revision_pin = "ab37246c"
summary = """
`cespare/xxhash/v2` is a single-package Go library implementing XXH64, the
64-bit variant of xxHash. The whole public surface is four things: the free
functions `Sum64`/`Sum64String`, and the streaming `Digest` type (a
`hash.Hash64` with `MarshalBinary`/`UnmarshalBinary`). What makes the
repository non-obvious is that three of those four symbols are defined more
than once, selected by build tags: `Sum64`/`writeBlocks` are Go-declared but
assembly-defined in `xxhash_asm.go` + `xxhash_amd64.s`/`xxhash_arm64.s` on
amd64/arm64, and pure-Go in `xxhash_other.go` otherwise (or under `purego`);
`Sum64String`/`(*Digest).WriteString` come from `xxhash_unsafe.go` normally
and `xxhash_safe.go` under `appengine`. `xxhash.go` holds everything that is
build-tag-independent: the primes, the `Digest` struct and its methods, and
the shared round helpers.

The ranking therefore front-loads (1) what the package is and the layout of
its root, (2) the complete public API surface *together with the build-tag
predicate that selects each definition*, since picking the wrong file is the
most likely mistake an agent makes here, (3) the pure-Go algorithm bodies,
(4) the test/benchmark/tooling perimeter — including the three satellite
programs (`xxhsum/` CLI, `dynamic/` plugin test, `xxhashbench/` separate
module) that are easy to mistake for part of the library, and (5) the two
assembly files' internal structure. Plausible queries span "how do I use
this", "why are there two Sum64s", "what does the purego tag do", "how is
the streaming state marshaled", "where are the test vectors", and "how do I
run the cross-arch tests".
"""

